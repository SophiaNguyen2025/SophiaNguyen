<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buổi 4 – Kỹ Năng Sinh Tồn & Tổng Kết Khóa Học</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #6C5CE7;
  --purple-light: #a29bfe;
  --purple-dark: #4834d4;
  --green: #00b894;
  --green-light: #55efc4;
  --red: #d63031;
  --red-light: #ff7675;
  --orange: #e17055;
  --orange-light: #fab1a0;
  --blue: #0984e3;
  --blue-light: #74b9ff;
  --yellow: #fdcb6e;
  --bg: #0d0d1a;
  --surface: #1c1c2e;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow: 0 4px 24px rgba(108,92,231,0.12);
  --shadow-lg: 0 8px 40px rgba(108,92,231,0.18);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image: radial-gradient(ellipse at 30% 0%, #7c3aed22 0%, transparent 60%);
}
h1, h2, h3, .game-title { font-family: 'Baloo 2', cursive; }

/* ── NAV ── */
.main-nav {
  background: var(--surface);
  box-shadow: var(--shadow);
  padding: 0 1.5rem;
  display: flex;
  align-items: center;
  gap: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  overflow-x: auto;
  border-bottom: 1px solid #ffffff10;
}

.brand {
  font-family: 'Baloo 2', cursive;
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--purple-light);
  white-space: nowrap;
  padding: 1rem 1.5rem 1rem 0;
  border-right: 2px solid #ffffff20;
  margin-right: 1rem;
}

.nav-tab {
  padding: 1rem 1.25rem;
  font-family: 'Baloo 2', cursive;
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: all .2s;
}
.nav-tab:hover { color: var(--purple-light); }
.nav-tab.active { color: var(--purple-light); border-bottom-color: var(--purple); }

/* ── SCREENS ── */
.screen { display: none; padding: 2rem 1.5rem; max-width: 860px; margin: 0 auto; }
.screen.active { display: block; }

.game-header {
  text-align: center;
  margin-bottom: 2rem;
}
.game-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 50px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: .75rem;
}
.game-title {
  font-size: 1.8rem;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: .4rem;
}
.game-subtitle {
  font-size: 0.95rem;
  color: var(--text-muted);
}

/* ══════════════════════════════
   GAME 4 – GAME SHOW
══════════════════════════════ */
.g4-scoreboard {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 1.25rem;
}
.g4-team {
  background: var(--surface);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
  text-align: center;
  border: 1px solid #ffffff10;
}
.g4-team-name {
  padding: 12px;
  font-family: 'Baloo 2', cursive;
  font-size: 1rem;
  font-weight: 700;
  color: #fff;
}
.team-red  .g4-team-name  { background: var(--red); }
.team-blue .g4-team-name  { background: var(--blue); }
.g4-pts {
  font-family: 'Baloo 2', cursive;
  font-size: 4rem;
  font-weight: 800;
  padding: 14px 0;
  color: var(--text);
}

.g4-q-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 1rem;
  justify-content: center;
}
.g4-dot {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid #475569;
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  transition: all .15s;
  color: var(--text-muted);
}
.g4-dot:hover { border-color: var(--purple); color: var(--purple-light); }
.g4-dot.active { background: var(--purple); border-color: var(--purple); color: #fff; }
.g4-dot.done-ok   { background: var(--green); border-color: var(--green); color: #fff; }
.g4-dot.done-fail { background: var(--red);   border-color: var(--red);   color: #fff; }

.g4-timer-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 1rem;
}
.g4-timer-num {
  font-family: 'Baloo 2', cursive;
  font-size: 3rem;
  font-weight: 800;
  min-width: 72px;
  text-align: center;
  transition: color .3s;
}
.g4-timer-num.warn { color: var(--orange); }
.g4-timer-num.danger { color: var(--red); animation: pulse .5s infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .5; } }
.g4-bar-track {
  flex: 1;
  height: 10px;
  background: #334155;
  border-radius: 5px;
  overflow: hidden;
}
.g4-bar-fill {
  height: 100%;
  background: var(--purple);
  border-radius: 5px;
  transition: width .95s linear, background .3s;
}
.g4-bar-fill.warn { background: var(--orange); }
.g4-bar-fill.danger { background: var(--red); }

.g4-question {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.6;
  min-height: 100px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  box-shadow: var(--shadow);
  margin-bottom: 1rem;
  border-top: 5px solid var(--purple);
}

.g4-answer {
  background: #1e293b;
  border: 2px dashed #475569;
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.6;
  min-height: 80px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .2s;
  margin-bottom: 1rem;
}
.g4-answer:hover { border-color: var(--purple); }
.g4-answer.revealed {
  background: #2d3a4e;
  border-color: var(--purple);
  color: var(--text);
  border-style: solid;
}

.g4-controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: .75rem;
}
.g4-ctrl {
  padding: 10px 6px;
  border-radius: 12px;
  border: 2px solid #475569;
  background: #1e293b;
  font-family: 'Nunito', sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
  color: var(--text);
}
.g4-ctrl:hover { transform: translateY(-2px); }
.g4-ctrl.start { background: var(--purple); color: #fff; border-color: var(--purple); box-shadow: 0 4px 14px rgba(108,92,231,0.35); }
.g4-ctrl.ok    { background: #064e3b; border-color: var(--green); color: #6ee7b7; }
.g4-ctrl.fail  { background: #7f1a1a; border-color: var(--red);   color: #fca5a5; }
.g4-ctrl.next  { background: #2d3a4e; border-color: var(--purple-light); color: var(--purple-light); }

/* Flash overlay */
.g4-flash {
  display: none;
  position: fixed; inset: 0;
  align-items: center; justify-content: center;
  flex-direction: column;
  z-index: 200;
  pointer-events: none;
}
.g4-flash.show { display: flex; animation: flashIn .3s ease; }
@keyframes flashIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
.g4-flash-inner {
  padding: 2rem 3rem;
  border-radius: var(--radius-lg);
  text-align: center;
  box-shadow: var(--shadow-lg);
}
.g4-flash.correct-flash .g4-flash-inner { background: #064e3b; border: 2px solid var(--green); }
.g4-flash.wrong-flash   .g4-flash-inner { background: #7f1a1a; border: 2px solid var(--red); }
.flash-icon { font-size: 4rem; }
.flash-txt  { font-family: 'Baloo 2', cursive; font-size: 1.6rem; font-weight: 800; margin-top: .5rem; }
.correct-flash .flash-txt { color: #6ee7b7; }
.wrong-flash   .flash-txt { color: #fca5a5; }

.logo { height: 50px; margin: 10px auto; display: block; }
</style>
</head>

<body>
<div class="main-nav">
  <div class="brand">🔐 LỚP HỌC AN TOÀN</div>
 </div>

<!-- ═══════ GAME 4 ═══════ -->
<div id="g4" class="screen active">
  <div class="game-header">
    <div class="game-badge" style="background:#2d3a4e;color:var(--purple-light)">Buổi 4 • Kỹ năng sinh tồn & Tổng kết</div>
    <h2 class="game-title">Vượt chướng ngại an toàn</h2>
    <img src="https://sophianguyen.com.vn/images/hinhremovenen.png" alt="Sophia Nguyễn" class="logo" onerror="this.style.display='none'">
    <p class="game-subtitle">10 câu hỏi tổng kết – đồng hồ đếm ngược – thi đua 2 đội</p>
  </div>
  <div class="g4-scoreboard">
    <div class="g4-team team-red">
      <div class="g4-team-name">🔴 Đội Đỏ</div>
      <div class="g4-pts" id="g4-red">0</div>
    </div>
    <div class="g4-team team-blue">
      <div class="g4-team-name">🔵 Đội Xanh</div>
      <div class="g4-pts" id="g4-blue">0</div>
    </div>
  </div>
  <div class="g4-q-dots" id="g4-dots"></div>
  <div class="g4-timer-row">
    <div class="g4-timer-num" id="g4-tnum">60</div>
    <div class="g4-bar-track"><div class="g4-bar-fill" id="g4-bar"></div></div>
  </div>
  <div class="g4-question" id="g4-q">Nhấn <strong>▶ Bắt đầu câu</strong> để chiếu câu hỏi lên màn hình</div>
  <div class="g4-answer" id="g4-ans" onclick="g4Reveal()">👆 Nhấn vào đây để lật đáp án</div>
  <div class="g4-controls">
    <button class="g4-ctrl start" onclick="g4Start()">▶ Bắt đầu câu</button>
    <button class="g4-ctrl ok"    onclick="g4Score('red',true)">✅ Đội Đỏ đúng</button>
    <button class="g4-ctrl ok"    onclick="g4Score('blue',true)">✅ Đội Xanh đúng</button>
    <button class="g4-ctrl fail"  onclick="g4Score('red',false)">❌ Đội Đỏ sai</button>
    <button class="g4-ctrl fail"  onclick="g4Score('blue',false)">❌ Đội Xanh sai</button>
    <button class="g4-ctrl next"  onclick="g4Next()">⏭ Câu tiếp theo</button>
  </div>
</div>

<!-- Flash overlay -->
<div class="g4-flash" id="g4-flash">
  <div class="g4-flash-inner">
    <div class="flash-icon" id="fl-icon"></div>
    <div class="flash-txt" id="fl-txt"></div>
  </div>
</div>

<script>
/* ── NAV ── */
function switchGame(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('g'+n).classList.add('active');
  document.querySelectorAll('.nav-tab')[n-1].classList.add('active');
}

/* ══ GAME 4 - CÂU HỎI THEO NỘI DUNG BUỔI 4 MỚI ══ */
const G4_QS = [
  {
    q: 'Bạn bị đứt tay chảy máu. Việc ĐẦU TIÊN cần làm là gì?',
    a: 'Rửa tay sạch (nếu có thể), sau đó dùng bông/gạc sạch ấn trực tiếp lên vết thương trong 5-10 phút (không nhấc lên xem). Báo người lớn.'
  },
  {
    q: 'Bạn bị bỏng nhẹ do chạm vào nồi nóng. Cách xử lý đúng là gì?',
    a: 'Ngâm/rửa dưới vòi nước lạnh 10-15 phút → báo người lớn → đến viện nếu bỏng to, bỏng sâu. KHÔNG bôi kem đánh răng, dầu, nước mắm, đá lạnh trực tiếp.'
  },
  {
    q: 'Bạn thấy một người bạn bị hóc dị vật, không thở được, hai tay ôm cổ. Bạn cần làm gì?',
    a: 'Gọi người lớn ngay. Nếu biết kỹ thuật Heimlich: đứng sau nạn nhân, nắm tay đặt trên rốn, ấn mạnh vào bụng theo hướng vào trong và lên trên cho đến khi dị vật bật ra.'
  },
  {
    q: 'Nạn nhân bất tỉnh và không thở. Các bước CPR (ép tim) đúng là gì?',
    a: '1. Kiểm tra an toàn. 2. Gọi to, vỗ vai, không phản ứng → gọi 115. 3. Ép tim: chồng tay giữa ngực, ép sâu 5-6 cm, tốc độ 100-120/phút. 4. Sau 30 ép, thổi 2 hơi ngạt. Lặp lại.'
  },
  {
    q: 'Khi phát hiện cháy ở tầng dưới chung cư, trước khi mở cửa phòng mình bạn cần làm gì?',
    a: 'Dùng MU BÀN TAY (không phải lòng bàn tay) kiểm tra cánh cửa và tay nắm. Nếu nóng → KHÔNG mở, tìm lối thoát khác. KHÔNG dùng thang máy.'
  },
  {
    q: 'Bạn ngửi thấy mùi gas (trứng thối) nồng trong bếp. Các bước xử lý theo thứ tự là gì?',
    a: '1. Khóa van tổng (nếu an toàn). 2. KHÔNG bật/tắt bất kỳ công tắc điện nào (kể cả điện thoại). 3. Mở hết cửa sổ. 4. Ra ngoài ngay. 5. Ra ngoài rồi mới gọi 114.'
  },
  {
    q: 'Bạn thấy bố bị điện giật do chạm vào dây điện trần. Bạn xử lý thế nào?',
    a: '1. Ngắt cầu dao điện (nguồn điện) ngay lập tức. 2. Nếu không ngắt được, dùng vật cách điện (gậy gỗ, chổi cán dài) tách bố ra. 3. Gọi 115. 4. Nếu không thở, bắt đầu CPR.'
  },
  {
    q: 'Phân biệt bí mật TỐT và bí mật XẤU bằng 1 điểm khác nhau chính?',
    a: 'Bí mật tốt: làm mình vui, có thời hạn (giấu quà sinh nhật). Bí mật xấu: làm mình sợ hãi, xấu hổ, khó ngủ. Quy tắc vàng: Nếu bí mật khiến con lo sợ → đó là bí mật xấu, phải kể với người lớn.'
  },
  {
    q: 'Đường dây nóng bảo vệ trẻ em là số mấy? Đặc điểm của số này là gì?',
    a: '1800 1567 – Miễn phí, bảo mật (không cần nói tên), hoạt động 24/7. Gọi khi cần giúp đỡ, không biết kể với ai hoặc không có người lớn tin cậy bên cạnh.'
  },
  {
    q: 'Kể tên 3 số điện thoại khẩn cấp và chức năng của từng số.',
    a: '113 – Công an (khi bị nguy hiểm từ người lạ, bị theo dõi, bị khống chế). 114 – Cháy nổ, cứu hỏa (khi có cháy hoặc rò rỉ gas). 115 – Cấp cứu y tế (khi bị thương nặng, bất tỉnh, khó thở).'
  }
];

let g4cur = 0, g4red = 0, g4blue = 0, g4timer = null, g4sec = 60, g4started = false, g4done = [];

function initG4(){
  g4cur = 0; g4red = 0; g4blue = 0; g4done = []; g4started = false;
  clearInterval(g4timer); g4timer = null;
  document.getElementById('g4-red').textContent = '0';
  document.getElementById('g4-blue').textContent = '0';
  document.getElementById('g4-q').innerHTML = 'Nhấn <strong>▶ Bắt đầu câu</strong> để chiếu câu hỏi lên màn hình';
  document.getElementById('g4-ans').textContent = '👆 Nhấn vào đây để lật đáp án';
  document.getElementById('g4-ans').classList.remove('revealed');
  g4ResetTimer();
  g4RenderDots();
}

function g4RenderDots(){
  const c = document.getElementById('g4-dots'); c.innerHTML = '';
  G4_QS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'g4-dot' + (i === g4cur ? ' active' : '') + (g4done[i] === 'ok' ? ' done-ok' : g4done[i] === 'fail' ? ' done-fail' : '');
    d.textContent = i + 1;
    d.onclick = () => { clearInterval(g4timer); g4timer = null; g4cur = i; g4started = false; g4ResetTimer(); g4ShowQ(); g4RenderDots(); };
    c.appendChild(d);
  });
}

function g4ShowQ(){
  const q = G4_QS[g4cur];
  document.getElementById('g4-q').textContent = q.q;
  document.getElementById('g4-ans').textContent = '👆 Nhấn vào đây để lật đáp án';
  document.getElementById('g4-ans').classList.remove('revealed');
  document.getElementById('g4-flash').className = 'g4-flash';
}

function g4Start(){
  if(g4timer) return;
  if(!g4started) g4ShowQ();
  g4sec = 60; g4started = true;
  const bar = document.getElementById('g4-bar');
  bar.style.transition = 'none'; bar.style.width = '100%'; bar.className = 'g4-bar-fill';
  document.getElementById('g4-tnum').className = 'g4-timer-num';
  setTimeout(() => { bar.style.transition = 'width .95s linear'; }, 30);
  g4timer = setInterval(() => {
    g4sec--;
    const tn = document.getElementById('g4-tnum');
    const br = document.getElementById('g4-bar');
    tn.textContent = g4sec;
    br.style.width = Math.max(0, (g4sec / 60) * 100) + '%';
    if(g4sec <= 15){ tn.className = 'g4-timer-num warn'; br.className = 'g4-bar-fill warn'; }
    if(g4sec <= 5) { tn.className = 'g4-timer-num danger'; br.className = 'g4-bar-fill danger'; }
    if(g4sec <= 0) { clearInterval(g4timer); g4timer = null; g4Reveal(); }
  }, 1000);
}

function g4ResetTimer(){
  clearInterval(g4timer); g4timer = null;
  g4sec = 60;
  document.getElementById('g4-tnum').textContent = '60';
  document.getElementById('g4-tnum').className = 'g4-timer-num';
  document.getElementById('g4-bar').style.transition = 'none';
  document.getElementById('g4-bar').style.width = '100%';
  document.getElementById('g4-bar').className = 'g4-bar-fill';
}

function g4Reveal(){
  clearInterval(g4timer); g4timer = null;
  const el = document.getElementById('g4-ans');
  el.textContent = G4_QS[g4cur].a;
  el.classList.add('revealed');
}

function g4Score(team, correct){
  clearInterval(g4timer); g4timer = null;
  g4Reveal();
  if(correct){
    if(team === 'red'){ g4red++; document.getElementById('g4-red').textContent = g4red; }
    else { g4blue++; document.getElementById('g4-blue').textContent = g4blue; }
    g4done[g4cur] = 'ok';
    g4Flash(true, team === 'red' ? 'Đội Đỏ' : 'Đội Xanh');
  } else {
    g4done[g4cur] = 'fail';
    g4Flash(false, team === 'red' ? 'Đội Đỏ' : 'Đội Xanh');
  }
  g4RenderDots();
}

function g4Flash(ok, team){
  const fl = document.getElementById('g4-flash');
  document.getElementById('fl-icon').textContent = ok ? '✅' : '❌';
  document.getElementById('fl-txt').textContent = ok ? team + ' đúng! +1 điểm' : team + ' chưa đúng!';
  fl.className = 'g4-flash show ' + (ok ? 'correct-flash' : 'wrong-flash');
  setTimeout(() => { fl.className = 'g4-flash'; }, 1800);
}

function g4Next(){
  clearInterval(g4timer); g4timer = null;
  g4cur = (g4cur + 1) % G4_QS.length;
  g4started = false;
  g4ResetTimer();
  document.getElementById('g4-q').innerHTML = 'Nhấn <strong>▶ Bắt đầu câu</strong> để chiếu câu hỏi lên màn hình';
  document.getElementById('g4-ans').textContent = '👆 Nhấn vào đây để lật đáp án';
  document.getElementById('g4-ans').classList.remove('revealed');
  document.getElementById('g4-flash').className = 'g4-flash';
  g4RenderDots();
}
