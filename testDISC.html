<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trắc nghiệm DISC </title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #FFCCFF, #FFCCFF);
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo img {
      width: 120px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    .question {
      margin: 20px 0;
      padding: 15px;
      border-left: 5px solid #3366CC;
      border-radius: 10px;
    }
    .question:nth-child(even) {
      background:#009900;
    }
    .question:nth-child(odd) {
      background: #CCCC99;
    }
    .question p {
      margin: 0 0 10px;
      font-weight: bold;
    }
    .question label {
      display: block;
      font-weight: normal;
      margin-bottom: 8px;
    }
    input[type="text"],
    input[type="email"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 30px;
      padding: 12px 24px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #45a049;
    }
    .result {
      display: none;
      background: #ede7f6;
      margin-top: 30px;
      padding: 20px;
      border-radius: 12px;
      color: #4a148c;
      font-weight: bold;
    }
  </style>
</head>

      <label>Tuổi:</label>
      <input type="number" name="age" id="age" required>
      <label>Số điện thoại:</label>
      <input type="text" name="phone" id="phone" required>
      <button type="submit">Gửi thông tin → nhấn Go Back → & tiếp tục</button>
    </form>
<form id="quizForm" style="display:none;"></form>
    <!-- Nút tính kết quả -->
    <button id="submitBtn" type="button" onclick="calculateResult()">Tính kết quả</button>

document.getElementById("userForm").addEventListener("submit", function(e) {
  e.preventDefault();

  // Ẩn form thông tin
  document.getElementById("userForm").style.display = "none";

  // Hiện form câu hỏi
  document.getElementById("quizForm").style.display = "block";

  // Hiện nút tính kết quả
  document.getElementById("submitBtn").style.display = "block";
});

    window.onload = function() {
      const form = document.getElementById("quizForm");

      questions.forEach((q, i) => {
        const div = document.createElement("div");
        div.className = "question";
        div.innerHTML = `<strong>Câu ${i + 1}:</strong> ${q.text}`;
        const answersDiv = document.createElement("div");
        answersDiv.className = "answers";

        q.options.forEach((opt, j) => {
          const id = `q${i}_${j}`;
          answersDiv.innerHTML += `
            <label>
              <input type="radio" name="q${i}" value="${opt.type}" id="${id}">
              ${opt.text}
            </label>
          `;
        });

        div.appendChild(answersDiv);
        form.appendChild(div);
      });
    };

    function submitQuiz() {
      const form = document.getElementById("quizForm");
      const inputs = form.querySelectorAll("input[type=radio]:checked");

      const totalQuestions = questions.length;
      if (inputs.length < totalQuestions) {
        alert("Bạn cần trả lời tất cả 20 câu hỏi!");
        return;
      }

      const scores = { D: 0, I: 0, S: 0, C: 0 };
      inputs.forEach(input => scores[input.value]++);

      const maxType = Object.keys(scores).reduce((a, b) =>
        scores[a] > scores[b] ? a : b
      );

      const descriptions = {
        D: `<strong>🔴 Dominance (Thống trị)</strong><br>
            Bạn là người quyết đoán, định hướng kết quả, thích thử thách và kiểm soát. 
            Bạn phù hợp với vai trò lãnh đạo, quản lý dự án, kinh doanh, hoặc các công việc đòi hỏi sự chủ động và cạnh tranh.`,
        I: `<strong>🟠 Influence (Ảnh hưởng)</strong><br>
            Bạn là người hòa đồng, truyền cảm hứng, giỏi giao tiếp và kết nối. 
            Bạn phù hợp với các nghề như marketing, truyền thông, giáo dục, nhân sự hoặc các công việc cần sự tương tác xã hội cao.`,
        S: `<strong>🟢 Steadiness (Ổn định)</strong><br>
            Bạn là người kiên nhẫn, ổn định, hỗ trợ người khác và tránh xung đột. 
            Bạn phù hợp với các nghề như chăm sóc khách hàng, hỗ trợ kỹ thuật, hành chính, hoặc các công việc cần sự kiên trì và đáng tin cậy.`,
        C: `<strong>🔵 Compliance (Tuân thủ)</strong><br>
            Bạn là người chính xác, phân tích tốt, tuân thủ quy trình và tiêu chuẩn. 
            Bạn phù hợp với các nghề như kế toán, kiểm toán, nghiên cứu, lập trình, hoặc các công việc yêu cầu sự tỉ mỉ và logic.`
      };
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `
        <h2>Kết quả của bạn: Nhóm ${maxType}</h2>
        ${descriptions[maxType]}
        <br><br>
        <strong>Điểm chi tiết:</strong><br>
        D: ${scores.D} | I: ${scores.I} | S: ${scores.S} | C: ${scores.C}
      `;
    }
