<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài Test Tâm Lý: Cảnh Vật & Cảm Xúc</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    img {
      display: block;
      margin: 20px auto;
      max-width: 100%;
      border-radius: 8px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 20px;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      resize: vertical;
    }
    button {
      display: block;
      margin: 30px auto 0;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #result {
      margin-top: 30px;
      padding: 20px;
      background-color: #e7f3e7;
      border-left: 5px solid #4CAF50;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bài Test Tâm Lý: Cảnh Vật & Cảm Xúc</h1>
    <p>Hãy quan sát kỹ hình ảnh dưới đây và trả lời các câu hỏi theo cảm nhận của bạn.</p>
    
    <img src="233515.jpg" alt="Cảnh vật thiên nhiên yên tĩnh">
    
    <form id="testForm">
      <label for="q1">1. Bạn cảm thấy thế nào khi nhìn vào cảnh này?</label>
      <textarea id="q1" name="q1"></textarea>

      <label for="q2">2. Nếu bạn đang đứng trong khung cảnh này, bạn sẽ làm gì?</label>
      <textarea id="q2" name="q2"></textarea>

      <label for="q3">3. Bạn nghĩ con đường trong hình dẫn đến đâu?</label>
      <textarea id="q3" name="q3"></textarea>

      <label for="q4">4. Bạn có muốn ở lại nơi này lâu không? Vì sao?</label>
      <textarea id="q4" name="q4"></textarea>

      <button type="button" onclick="analyze()">Phân tích kết quả</button>
    </form>

    <div id="result" style="display:none;"></div>
  </div>

  <script>
    function analyze() {
      const answers = [
        document.getElementById("q1").value.toLowerCase(),
        document.getElementById("q2").value.toLowerCase(),
        document.getElementById("q3").value.toLowerCase(),
        document.getElementById("q4").value.toLowerCase()
      ];

      let traits = [];

      if (answers.some(a => a.includes("bình yên") || a.includes("thư giãn") || a.includes("thoải mái"))) {
        traits.push("🌿 Bạn có xu hướng hướng nội, yêu sự ổn định và không gian riêng.");
      }
      if (answers.some(a => a.includes("khám phá") || a.includes("tò mò") || a.includes("đi tiếp"))) {
        traits.push("🚶 Bạn có tính cách năng động, thích khám phá và trải nghiệm.");
      }
      if (answers.some(a => a.includes("cô đơn") || a.includes("lo lắng") || a.includes("sợ"))) {
        traits.push("🌧️ Bạn có thể đang trải qua trạng thái tâm lý nhạy cảm hoặc cần sự kết nối.");
      }
      if (answers.some(a => a.includes("bí ẩn") || a.includes("tưởng tượng") || a.includes("mơ mộng"))) {
        traits.push("🎨 Bạn có trí tưởng tượng phong phú và xu hướng sáng tạo.");
      }

      const resultBox = document.getElementById("result");
      resultBox.style.display = "block";
      resultBox.innerHTML = traits.length > 0
        ? `<h3>Kết quả phân tích:</h3><ul>${traits.map(t => `<li>${t}</li>`).join("")}</ul>`
        : "Không phát hiện xu hướng rõ ràng. Có thể bạn là người rất độc đáo! ✨";
    }
  </script>
</body>
</html>
