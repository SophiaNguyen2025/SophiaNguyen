<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đố Vui Nhanh — Lớp 6</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF6B35;
  --yellow: #FFD166;
  --green: #06D6A0;
  --blue: #118AB2;
  --pink: #EF476F;
  --purple: #7B2FBE;
  --dark: #1A1A2E;
  --dark2: #16213E;
  --card: rgba(255,255,255,0.07);
  --card-border: rgba(255,255,255,0.12);
  --radius: 20px;
  --radius-sm: 12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;background:var(--dark);color:#fff;min-height:100vh;overflow-x:hidden;position:relative}

/* BG */
.bg-anim{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.18;animation:blobMove 12s ease-in-out infinite alternate}
.blob1{width:500px;height:500px;background:var(--purple);top:-150px;left:-100px;animation-delay:0s}
.blob2{width:400px;height:400px;background:var(--blue);bottom:-100px;right:-80px;animation-delay:-4s}
.blob3{width:350px;height:350px;background:var(--pink);top:40%;left:40%;animation-delay:-8s}
@keyframes blobMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,30px) scale(1.1)}}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d,2s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:0.2}100%{opacity:0.9}}

/* SCREENS */
.screen{position:relative;z-index:1;display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* SETUP */
#setup-screen{align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.logo-icon{font-size:64px;display:block;animation:bounce 1.8s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.logo-title{font-family:'Fredoka One',cursive;font-size:clamp(34px,7vw,56px);background:linear-gradient(135deg,var(--yellow),var(--orange),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;margin:10px 0 6px}
.logo-sub{font-size:15px;color:rgba(255,255,255,0.6);font-weight:600;margin-bottom:28px}
.setup-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:500px;margin-bottom:18px}
.setup-title{font-family:'Fredoka One',cursive;font-size:18px;color:var(--yellow);margin-bottom:18px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.mode-btn{padding:16px 10px;border-radius:var(--radius-sm);border:2px solid var(--card-border);background:var(--card);color:rgba(255,255,255,0.6);font-family:'Quicksand',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;text-align:center;line-height:1.4}
.mode-icon{font-size:26px;display:block;margin-bottom:5px}
.mode-btn:hover{border-color:var(--yellow);color:var(--yellow)}
.mode-btn.selected{border-color:var(--yellow);color:#fff;background:rgba(255,209,102,0.15)}
.team-setup{display:none}
.team-setup.show{display:block}
.team-label{font-size:13px;color:rgba(255,255,255,0.6);font-weight:700;margin-bottom:8px}
.team-inputs{display:flex;flex-direction:column;gap:9px}
.team-input-row{display:flex;align-items:center;gap:10px}
.team-color-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.team-input{flex:1;background:rgba(255,255,255,0.08);border:1px solid var(--card-border);border-radius:10px;padding:9px 13px;color:#fff;font-family:'Quicksand',sans-serif;font-size:14px;font-weight:600;outline:none}
.team-input:focus{border-color:var(--yellow)}
.team-input::placeholder{color:rgba(255,255,255,0.3)}
.divider-line{color:rgba(255,255,255,0.25);font-size:12px;font-weight:700;text-align:center;margin:14px 0;letter-spacing:2px}
.num-q-row{display:flex;align-items:center;gap:12px;justify-content:center}
.num-q-label{font-size:14px;color:rgba(255,255,255,0.6);font-weight:600}
.num-q-select{background:rgba(255,255,255,0.08);border:1px solid var(--card-border);border-radius:10px;padding:8px 13px;color:#fff;font-family:'Quicksand',sans-serif;font-size:14px;font-weight:700;outline:none;cursor:pointer}
.num-q-select option{background:var(--dark2)}
.btn-start{width:100%;max-width:500px;padding:17px;border-radius:var(--radius);background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;font-family:'Fredoka One',cursive;font-size:22px;border:none;cursor:pointer;letter-spacing:0.5px;box-shadow:0 8px 32px rgba(255,107,53,0.4);transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,107,53,0.5)}

/* GAME */
#game-screen{padding:0}
.progress-full{height:4px;background:rgba(255,255,255,0.1)}
.progress-fill-bar{height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow),var(--green));transition:width 0.4s ease}
.game-top{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);border-bottom:1px solid var(--card-border);flex-wrap:wrap;gap:10px}
.q-counter{font-family:'Fredoka One',cursive;font-size:15px;color:rgba(255,255,255,0.6)}
.q-counter span{color:var(--yellow);font-size:20px}
.timer-container{position:relative;width:56px;height:56px}
.timer-ring-svg{transform:rotate(-90deg)}
.timer-ring-bg{fill:none;stroke:rgba(255,255,255,0.1);stroke-width:5}
.timer-ring-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke 0.3s}
.timer-num{font-family:'Fredoka One',cursive;font-size:20px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.scores-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.score-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--card-border);border-radius:50px;padding:5px 13px;font-size:13px;font-weight:700}
.score-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.question-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px 16px;text-align:center}
.q-category{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.55);background:var(--card);border:1px solid var(--card-border);border-radius:50px;padding:4px 16px;display:inline-block;margin-bottom:14px}
.q-text{font-family:'Fredoka One',cursive;font-size:clamp(20px,4vw,34px);line-height:1.35;max-width:720px;margin-bottom:32px;color:#fff;animation:qFadeIn 0.4s ease}
@keyframes qFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:720px}
.option-btn{padding:16px 18px;border-radius:var(--radius-sm);border:2px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);color:#fff;font-family:'Quicksand',sans-serif;font-size:clamp(13px,2.2vw,16px);font-weight:700;cursor:pointer;transition:all 0.18s;text-align:left;display:flex;align-items:center;gap:11px;line-height:1.4}
.option-btn:hover:not(:disabled){border-color:var(--yellow);background:rgba(255,209,102,0.12);transform:translateY(-2px)}
.option-letter{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:15px;background:rgba(255,255,255,0.12)}
.option-btn.correct{border-color:var(--green) !important;background:rgba(6,214,160,0.18) !important}
.option-btn.wrong{border-color:var(--pink) !important;background:rgba(239,71,111,0.18) !important}
.option-btn:disabled{cursor:default}
.option-btn.correct .option-letter{background:var(--green);color:#fff}
.option-btn.wrong .option-letter{background:var(--pink);color:#fff}
.score-award{margin-top:14px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 18px;width:100%;max-width:720px;display:none;animation:qFadeIn 0.3s ease}
.score-award.show{display:block}
.score-award-title{font-size:13px;color:rgba(255,255,255,0.6);font-weight:700;margin-bottom:10px}
.team-award-btns{display:flex;gap:9px;flex-wrap:wrap}
.team-award-btn{flex:1;min-width:90px;padding:9px 12px;border-radius:var(--radius-sm);border:2px solid var(--card-border);background:var(--card);color:#fff;font-family:'Quicksand',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:7px}
.team-award-btn:hover{transform:scale(1.03)}
.team-award-btn.awarded{opacity:0.45;cursor:default;pointer-events:none}
.game-bottom{padding:14px 20px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-reveal{padding:12px 28px;border-radius:var(--radius-sm);font-family:'Fredoka One',cursive;font-size:17px;border:none;cursor:pointer;transition:all 0.2s;letter-spacing:0.3px;background:var(--yellow);color:var(--dark);box-shadow:0 4px 20px rgba(255,209,102,0.35)}
.btn-reveal:hover{transform:translateY(-2px)}
.btn-next{padding:12px 28px;border-radius:var(--radius-sm);font-family:'Fredoka One',cursive;font-size:17px;border:none;cursor:pointer;transition:all 0.2s;background:linear-gradient(135deg,var(--green),var(--blue));color:#fff;box-shadow:0 4px 20px rgba(6,214,160,0.35);display:none}
.btn-next:hover{transform:translateY(-2px)}
.btn-skip{background:transparent;border:1px solid var(--card-border);color:rgba(255,255,255,0.55);font-family:'Quicksand',sans-serif;font-size:13px;font-weight:700;padding:10px 18px;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.15s}
.btn-skip:hover{border-color:rgba(255,255,255,0.3);color:#fff}
.feedback-overlay{position:fixed;inset:0;z-index:100;display:none;pointer-events:none;align-items:center;justify-content:center}
.feedback-overlay.show{display:flex}
.feedback-text{font-family:'Fredoka One',cursive;font-size:72px;animation:feedbackPop 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards}
@keyframes feedbackPop{0%{opacity:0;transform:scale(0.3)}60%{opacity:1;transform:scale(1.1)}80%{transform:scale(0.95)}100%{opacity:0;transform:scale(1)}}

/* RESULT */
#result-screen{align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.result-title{font-family:'Fredoka One',cursive;font-size:clamp(30px,6vw,50px);background:linear-gradient(135deg,var(--yellow),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:14px 0 6px}
.result-sub{color:rgba(255,255,255,0.55);font-size:14px;font-weight:600;margin-bottom:32px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-bottom:32px}
.podium-slot{display:flex;flex-direction:column;align-items:center;min-width:88px}
.podium-name{font-family:'Fredoka One',cursive;font-size:14px;margin-bottom:5px;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium-pts{font-family:'Fredoka One',cursive;font-size:20px;margin-bottom:4px}
.podium-pts-label{font-size:11px;color:rgba(255,255,255,0.5);font-weight:700;margin-bottom:4px}
.podium-bar{width:76px;border-radius:12px 12px 4px 4px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px}
.podium-rank{font-family:'Fredoka One',cursive;font-size:20px}
.p1 .podium-bar{min-height:120px;background:linear-gradient(180deg,#FFD700,#FFA500)}
.p2 .podium-bar{min-height:88px;background:linear-gradient(180deg,#C8C8C8,#9E9E9E)}
.p3 .podium-bar{min-height:64px;background:linear-gradient(180deg,#CD7F32,#A0522D)}
.all-scores{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:18px 22px;width:100%;max-width:480px;margin-bottom:26px;text-align:left}
.all-score-row{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.all-score-row:last-child{border-bottom:none}
.asr-rank{font-family:'Fredoka One',cursive;font-size:17px;color:rgba(255,255,255,0.5);min-width:26px}
.asr-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.asr-name{flex:1;font-weight:700;font-size:14px}
.asr-bar-wrap{width:70px;height:5px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden}
.asr-bar{height:100%;border-radius:3px}
.asr-score{font-family:'Fredoka One',cursive;font-size:19px}
.btn-play-again{padding:15px 44px;border-radius:var(--radius);background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-family:'Fredoka One',cursive;font-size:21px;border:none;cursor:pointer;letter-spacing:0.5px;box-shadow:0 8px 32px rgba(123,47,190,0.4);transition:all 0.2s}
.btn-play-again:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(123,47,190,0.5)}

@media(max-width:520px){
  .options-grid{grid-template-columns:1fr}
  .game-top{padding:11px 14px}
  .question-area{padding:20px 14px}
  .podium{gap:6px}
  .podium-slot{min-width:70px}
  .podium-bar{width:62px}
}
</style>
</head>
<body>

<div class="bg-anim">
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>
</div>
<div class="stars" id="starsContainer"></div>

<div class="feedback-overlay" id="feedbackOverlay">
  <div class="feedback-text" id="feedbackText"></div>
</div>

<!-- SETUP -->
<div class="screen active" id="setup-screen">
  <span class="logo-icon">🧠</span>
  <div class="logo-title">Đố Vui Nhanh!</div>
  <div class="logo-sub">Lớp 6 · 30 câu hỏi vui · Thi đua sôi nổi</div>

  <div class="setup-card">
    <div class="setup-title">⚡ Chọn chế độ chơi</div>
    <div class="mode-grid">
      <button class="mode-btn selected" onclick="selectMode('individual')" id="mode-individual">
        <span class="mode-icon">🙋</span>
        Cá nhân<br><small style="font-weight:500;color:rgba(255,255,255,0.45)">Ai giơ tay trước</small>
      </button>
      <button class="mode-btn" onclick="selectMode('team')" id="mode-team">
        <span class="mode-icon">🏆</span>
        Đội nhóm<br><small style="font-weight:500;color:rgba(255,255,255,0.45)">Thi đua theo đội</small>
      </button>
    </div>

    <div class="team-setup" id="teamSetup">
      <div class="team-label">Tên các đội (có thể đổi):</div>
      <div class="team-inputs">
        <div class="team-input-row">
          <div class="team-color-dot" style="background:#FF6B35"></div>
          <input class="team-input" id="t1" value="Đội Cam" placeholder="Đội 1">
        </div>
        <div class="team-input-row">
          <div class="team-color-dot" style="background:#06D6A0"></div>
          <input class="team-input" id="t2" value="Đội Xanh" placeholder="Đội 2">
        </div>
        <div class="team-input-row">
          <div class="team-color-dot" style="background:#EF476F"></div>
          <input class="team-input" id="t3" value="Đội Hồng" placeholder="Đội 3">
        </div>
        <div class="team-input-row">
          <div class="team-color-dot" style="background:#FFD166"></div>
          <input class="team-input" id="t4" value="" placeholder="Đội 4 (tuỳ chọn)">
        </div>
      </div>
      <div class="divider-line">— — —</div>
    </div>

    <div class="num-q-row">
      <span class="num-q-label">Số câu hỏi:</span>
      <select class="num-q-select" id="numQ">
        <option value="10">10 câu</option>
        <option value="15">15 câu</option>
        <option value="20" selected>20 câu</option>
        <option value="30">30 câu (tất cả)</option>
      </select>
    </div>
  </div>

  <button class="btn-start" onclick="startGame()">🚀 Bắt đầu ngay!</button>
</div>

<!-- GAME -->
<div class="screen" id="game-screen">
  <div class="progress-full">
    <div class="progress-fill-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="game-top">
    <div class="q-counter">Câu <span id="qNum">1</span> / <span id="qTotal">20</span></div>
    <div class="timer-container">
      <svg class="timer-ring-svg" width="56" height="56" viewBox="0 0 56 56">
        <circle class="timer-ring-bg" cx="28" cy="28" r="24"/>
        <circle class="timer-ring-fill" id="timerRing" cx="28" cy="28" r="24"
          stroke-dasharray="150.8" stroke-dashoffset="0" stroke="#06D6A0"/>
      </svg>
      <div class="timer-num" id="timerNum">20</div>
    </div>
    <div class="scores-bar" id="scoresBar"></div>
  </div>

  <div class="question-area">
    <div class="q-category" id="qCategory">Khoa học</div>
    <div class="q-text" id="qText">Đang tải câu hỏi...</div>
    <div class="options-grid" id="optionsGrid"></div>
    <div class="score-award" id="scoreAward">
      <div class="score-award-title">🎯 Đội nào trả lời đúng? Bấm để cộng điểm:</div>
      <div class="team-award-btns" id="teamAwardBtns"></div>
    </div>
  </div>

  <div class="game-bottom">
    <button class="btn-skip" onclick="skipQuestion()">Bỏ qua ⏩</button>
    <button class="btn-reveal" id="btnReveal" onclick="revealAnswer()">💡 Xem đáp án</button>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Câu tiếp theo ▶</button>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="result-screen">
  <div style="font-size:60px;animation:bounce 1.6s ease-in-out infinite">🏆</div>
  <div class="result-title">Kết quả cuối cùng!</div>
  <div class="result-sub" id="resultSub">Trò chơi kết thúc — cảm ơn cả lớp!</div>
  <div class="podium" id="podium"></div>
  <div class="all-scores" id="allScores"></div>
  <button class="btn-play-again" onclick="backToSetup()">🔄 Chơi lại</button>
</div>

<script>
const QUESTIONS = [
  {cat:"🔬 Khoa học",q:"Mặt Trăng quay xung quanh Trái Đất hết bao nhiêu ngày?",opts:["27 ngày","30 ngày","365 ngày","7 ngày"],ans:0},
  {cat:"🌍 Địa lý",q:"Dãy núi Himalaya nằm ở châu lục nào?",opts:["Châu Phi","Châu Âu","Châu Á","Châu Mỹ"],ans:2},
  {cat:"📚 Văn học",q:"'Dế Mèn phiêu lưu ký' là tác phẩm của ai?",opts:["Nguyễn Du","Tô Hoài","Nam Quốc","Hồ Xuân Hương"],ans:1},
  {cat:"🔢 Toán học",q:"Số nguyên tố lớn nhất nhỏ hơn 20 là số nào?",opts:["17","18","19","16"],ans:2},
  {cat:"🐾 Động vật",q:"Con vật nào có thể thay đổi màu sắc cơ thể?",opts:["Mực","Bạch tuộc","Tắc kè hoa","Cả 3 loài"],ans:3},
  {cat:"🌍 Địa lý",q:"Sông dài nhất thế giới là sông nào?",opts:["Sông Amazon","Sông Mississippi","Sông Nile","Sông Dương Tử"],ans:2},
  {cat:"🔢 Toán học",q:"1 tá = bao nhiêu cái?",opts:["10","12","14","16"],ans:1},
  {cat:"🌏 Việt Nam",q:"Vịnh Hạ Long thuộc tỉnh nào của Việt Nam?",opts:["Hải Phòng","Quảng Ninh","Thanh Hóa","Nghệ An"],ans:1},
  {cat:"🔬 Khoa học",q:"Khí gì chiếm nhiều nhất trong không khí chúng ta thở?",opts:["Oxy","Nitơ","CO2","Hydro"],ans:1},
  {cat:"🏛️ Lịch sử",q:"Ai là người đầu tiên đặt chân lên Mặt Trăng?",opts:["Yuri Gagarin","Buzz Aldrin","Neil Armstrong","John Glenn"],ans:2},
  {cat:"📐 Toán học",q:"Tổng các góc trong một tam giác bằng bao nhiêu độ?",opts:["90°","180°","270°","360°"],ans:1},
  {cat:"🔬 Khoa học",q:"Cầu vồng có bao nhiêu màu?",opts:["5","6","7","8"],ans:2},
  {cat:"🌍 Địa lý",q:"Quốc gia nào có diện tích lớn nhất thế giới?",opts:["Trung Quốc","Canada","Mỹ","Nga"],ans:3},
  {cat:"📚 Văn học",q:"Câu chuyện 'Thánh Gióng' thuộc thể loại nào?",opts:["Thần thoại","Truyền thuyết","Cổ tích","Ngụ ngôn"],ans:1},
  {cat:"🐾 Động vật",q:"Loài chim nào không biết bay?",opts:["Vẹt","Đà điểu","Bồ câu","Cúc cu"],ans:1},
  {cat:"🎨 Nghệ thuật",q:"Ba màu cơ bản trong hội hoạ là gì?",opts:["Đỏ, Xanh lá, Vàng","Đỏ, Xanh lam, Vàng","Đỏ, Trắng, Đen","Cam, Xanh, Tím"],ans:1},
  {cat:"🔬 Khoa học",q:"Con người trưởng thành có bao nhiêu chiếc xương?",opts:["206","300","100","250"],ans:0},
  {cat:"🌿 Thực vật",q:"Phần nào của cây thực hiện quang hợp là chính?",opts:["Rễ","Thân","Lá","Hoa"],ans:2},
  {cat:"🌏 Việt Nam",q:"Thủ đô của Việt Nam là thành phố nào?",opts:["TP. Hồ Chí Minh","Đà Nẵng","Hà Nội","Huế"],ans:2},
  {cat:"🏛️ Lịch sử",q:"Ai đọc bản Tuyên ngôn Độc lập của Việt Nam năm 1945?",opts:["Võ Nguyên Giáp","Phạm Văn Đồng","Hồ Chí Minh","Trường Chinh"],ans:2},
  {cat:"🌍 Địa lý",q:"Núi cao nhất thế giới là núi nào?",opts:["K2","Everest","Kilimanjaro","Mont Blanc"],ans:1},
  {cat:"🔢 Toán học",q:"Số nào chia hết cho cả 2, 3 và 5?",opts:["25","36","30","42"],ans:2},
  {cat:"🔬 Khoa học",q:"Ánh sáng đi nhanh hơn hay âm thanh đi nhanh hơn?",opts:["Âm thanh","Ánh sáng","Bằng nhau","Tuỳ điều kiện"],ans:1},
  {cat:"🔢 Toán học",q:"2³ bằng bao nhiêu?",opts:["6","8","9","16"],ans:1},
  {cat:"🌏 Việt Nam",q:"Tết Nguyên Đán thường rơi vào tháng mấy dương lịch?",opts:["Tháng 1 hoặc 2","Tháng 3","Tháng 12","Tháng 11"],ans:0},
  {cat:"🏛️ Lịch sử",q:"Vạn Lý Trường Thành nằm ở quốc gia nào?",opts:["Nhật Bản","Hàn Quốc","Trung Quốc","Mông Cổ"],ans:2},
  {cat:"🐾 Động vật",q:"Loài động vật nào có thời gian mang thai dài nhất?",opts:["Hươu cao cổ","Voi","Tê giác","Cá voi"],ans:1},
  {cat:"🌿 Thực vật",q:"Cây nào được mệnh danh là 'vàng xanh' của Việt Nam?",opts:["Cây đa","Cây lúa","Cây tre","Cây dừa"],ans:2},
  {cat:"🔬 Khoa học",q:"Hành tinh nào lớn nhất trong Hệ Mặt Trời?",opts:["Sao Thổ","Sao Mộc","Sao Thiên Vương","Sao Hải Vương"],ans:1},
  {cat:"🌍 Địa lý",q:"Châu lục nào có diện tích lớn nhất thế giới?",opts:["Châu Phi","Châu Mỹ","Châu Á","Châu Âu"],ans:2},
];

const TEAM_COLORS = ['#FF6B35','#06D6A0','#EF476F','#FFD166'];
const LETTERS = ['A','B','C','D'];
const TIMER_C = 2 * Math.PI * 24;

let mode = 'individual', teams = [], scores = [], qList = [], qIdx = 0;
let timerInterval = null, timeLeft = 20, revealed = false;

function selectMode(m) {
  mode = m;
  document.getElementById('mode-individual').classList.toggle('selected', m === 'individual');
  document.getElementById('mode-team').classList.toggle('selected', m === 'team');
  document.getElementById('teamSetup').classList.toggle('show', m === 'team');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startGame() {
  const numQ = parseInt(document.getElementById('numQ').value);
  qList = shuffle([...QUESTIONS]).slice(0, numQ);
  qIdx = 0;
  if (mode === 'team') {
    const names = ['t1','t2','t3','t4'].map(id => document.getElementById(id).value.trim());
    teams = names.filter(n => n.length > 0);
    if (teams.length < 2) teams = ['Đội Cam','Đội Xanh'];
  } else {
    teams = ['Người chơi'];
  }
  scores = new Array(teams.length).fill(0);
  showScreen('game-screen');
  document.getElementById('qTotal').textContent = qList.length;
  renderScoresBar();
  showQuestion();
}

function renderScoresBar() {
  const bar = document.getElementById('scoresBar');
  if (mode === 'individual') { bar.innerHTML = ''; return; }
  bar.innerHTML = teams.map((t,i) => `
    <div class="score-chip">
      <div class="score-dot" style="background:${TEAM_COLORS[i]}"></div>
      <span id="sc${i}">${t}: <b>${scores[i]}</b></span>
    </div>`).join('');
}

function updateScoresBar() {
  teams.forEach((t,i) => {
    const el = document.getElementById('sc'+i);
    if (el) el.innerHTML = `${t}: <b>${scores[i]}</b>`;
  });
}

function showQuestion() {
  revealed = false;
  const q = qList[qIdx];
  document.getElementById('qNum').textContent = qIdx + 1;
  document.getElementById('progressBar').style.width = ((qIdx / qList.length) * 100) + '%';
  document.getElementById('qCategory').textContent = q.cat;

  const qEl = document.getElementById('qText');
  qEl.style.animation = 'none';
  void qEl.offsetWidth;
  qEl.style.animation = 'qFadeIn 0.4s ease';
  qEl.textContent = q.q;

  document.getElementById('optionsGrid').innerHTML = q.opts.map((opt,i) => `
    <button class="option-btn" onclick="selectOption(${i})" id="opt${i}">
      <span class="option-letter">${LETTERS[i]}</span>${opt}
    </button>`).join('');

  document.getElementById('scoreAward').classList.remove('show');
  document.getElementById('btnReveal').style.display = 'inline-flex';
  document.getElementById('btnNext').style.display = 'none';
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 20;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) { clearInterval(timerInterval); revealAnswer(); }
  }, 1000);
}

function updateTimerUI() {
  document.getElementById('timerNum').textContent = timeLeft;
  const pct = timeLeft / 20;
  const offset = TIMER_C * (1 - pct);
  const ring = document.getElementById('timerRing');
  ring.style.strokeDashoffset = offset;
  ring.style.stroke = timeLeft > 10 ? '#06D6A0' : timeLeft > 5 ? '#FFD166' : '#EF476F';
}

function selectOption(idx) {
  if (revealed) return;
  revealAnswer(idx);
}

function revealAnswer(chosen) {
  if (revealed) return;
  revealed = true;
  clearInterval(timerInterval);
  const q = qList[qIdx];
  document.querySelectorAll('.option-btn').forEach((btn,i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === chosen && i !== q.ans) btn.classList.add('wrong');
  });
  if (chosen !== undefined) {
    if (chosen === q.ans) {
      showFeedback('✅');
      if (mode === 'individual') { scores[0]++; updateScoresBar(); }
    } else {
      showFeedback('❌');
    }
  }
  document.getElementById('btnReveal').style.display = 'none';
  document.getElementById('btnNext').style.display = 'inline-flex';
  if (mode === 'team') {
    document.getElementById('teamAwardBtns').innerHTML = teams.map((t,i) => `
      <button class="team-award-btn" id="aw${i}" onclick="awardTeam(${i})" style="border-color:${TEAM_COLORS[i]}55">
        <span style="width:9px;height:9px;border-radius:50%;background:${TEAM_COLORS[i]};display:inline-block;flex-shrink:0"></span>
        ${t} +1
      </button>`).join('');
    document.getElementById('scoreAward').classList.add('show');
  }
}

function awardTeam(idx) {
  document.querySelectorAll('.team-award-btn').forEach(b => b.classList.add('awarded'));
  const btn = document.getElementById('aw'+idx);
  btn.style.opacity = '1';
  btn.style.background = TEAM_COLORS[idx] + '33';
  scores[idx]++;
  updateScoresBar();
  showFeedback('🎯');
}

function showFeedback(emoji) {
  const ov = document.getElementById('feedbackOverlay');
  document.getElementById('feedbackText').textContent = emoji;
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 700);
}

function nextQuestion() {
  qIdx++;
  if (qIdx >= qList.length) { showResults(); return; }
  showQuestion();
}

function skipQuestion() {
  clearInterval(timerInterval);
  if (!revealed) revealAnswer();
}

function showResults() {
  showScreen('result-screen');
  document.getElementById('progressBar').style.width = '100%';
  let players;
  if (mode === 'team') {
    players = teams.map((t,i) => ({name:t, score:scores[i], color:TEAM_COLORS[i]}));
  } else {
    players = [{name:'Cả lớp', score:scores[0], color:TEAM_COLORS[0]}];
  }
  players.sort((a,b) => b.score - a.score);
  const maxScore = Math.max(...players.map(p=>p.score), 1);
  document.getElementById('resultSub').textContent = `Đã chơi ${qList.length} câu · Chúc mừng cả lớp! 🎊`;

  const podiumOrder = [1,0,2].map(i => players[i]).filter(Boolean);
  const pClasses = ['p2','p1','p3'];
  const pRanks = ['🥈','🥇','🥉'];
  document.getElementById('podium').innerHTML = podiumOrder.map((p,i) => p ? `
    <div class="podium-slot ${pClasses[i]}">
      <div class="podium-name">${p.name}</div>
      <div class="podium-pts" style="color:${p.color}">${p.score}</div>
      <div class="podium-pts-label">điểm</div>
      <div class="podium-bar"><div class="podium-rank">${pRanks[i]}</div></div>
    </div>` : '').join('');

  const rankEmoji = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
  document.getElementById('allScores').innerHTML =
    `<div style="font-family:'Fredoka One',cursive;font-size:15px;color:var(--yellow);margin-bottom:12px">📊 Bảng điểm đầy đủ</div>` +
    players.map((p,i) => `
      <div class="all-score-row">
        <div class="asr-rank">${rankEmoji[i]||'•'}</div>
        <div class="asr-dot" style="background:${p.color}"></div>
        <div class="asr-name">${p.name}</div>
        <div class="asr-bar-wrap"><div class="asr-bar" style="width:${Math.round(p.score/maxScore*100)}%;background:${p.color}"></div></div>
        <div class="asr-score" style="color:${p.color}">${p.score}</div>
      </div>`).join('');
}

function backToSetup() { showScreen('setup-screen'); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

(function makeStars() {
  const c = document.getElementById('starsContainer');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*2+1;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*2+1).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s`;
    c.appendChild(s);
  }
})();
</script>
</body>
