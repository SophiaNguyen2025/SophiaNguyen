<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢語學習 · Gia Sư Tiếng Trung HSK v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #111827;
  --ink2: #1f2937;
  --ink3: #374151;
  --paper: #f9f5ee;
  --paper2: #f0e9d8;
  --gold: #d4a843;
  --gold2: #f0c96e;
  --vermillion: #c0392b;
  --jade: #27ae60;
  --mist: #9ca3af;
  --mist2: #6b7280;
  --sidebar-w: 280px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--ink); color:var(--paper); height:100vh; overflow:hidden; }

/* ===== LAYOUT ===== */
.app { display:flex; height:100vh; }

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-w);
  background: var(--ink2);
  border-right: 1px solid rgba(212,168,67,0.15);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.sidebar-header {
  padding: 18px 16px 14px;
  border-bottom: 1px solid rgba(212,168,67,0.12);
  flex-shrink: 0;
}
.brand { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.brand-icon {
  width:36px; height:36px;
  background: linear-gradient(135deg, var(--vermillion), var(--gold));
  border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Ma Shan Zheng',serif; font-size:18px; color:white;
  flex-shrink:0;
  box-shadow: 0 3px 10px rgba(192,57,43,0.35);
}
.brand-text h1 { font-size:14px; font-weight:700; color:var(--paper); }
.brand-text p { font-size:10px; color:var(--gold); font-weight:600; letter-spacing:0.8px; text-transform:uppercase; }

/* Level tabs */
.level-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.ltab {
  padding: 4px 10px;
  border: 1px solid rgba(212,168,67,0.25);
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  color: var(--mist);
  cursor: pointer;
  background: transparent;
  transition: all 0.2s;
  font-family: 'DM Sans', sans-serif;
}
.ltab:hover { color: var(--gold); border-color: var(--gold); }
.ltab.active { background: var(--vermillion); border-color: var(--vermillion); color: white; }

/* Sidebar progress */
.sidebar-progress {
  padding: 10px 16px;
  border-bottom: 1px solid rgba(212,168,67,0.08);
  flex-shrink: 0;
}
.progress-label { font-size:10px; color:var(--mist); font-weight:600; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px; display:flex; justify-content:space-between; }
.progress-bar { height:4px; background:rgba(255,255,255,0.08); border-radius:2px; }
.progress-fill { height:100%; background:linear-gradient(90deg, var(--vermillion), var(--gold)); border-radius:2px; transition:width 0.5s ease; }

/* Lesson list */
.lesson-list { flex:1; overflow-y:auto; padding:8px; scrollbar-width:thin; scrollbar-color:rgba(212,168,67,0.15) transparent; }
.lesson-list::-webkit-scrollbar { width:3px; }
.lesson-list::-webkit-scrollbar-thumb { background:rgba(212,168,67,0.15); border-radius:2px; }

.lesson-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 2px;
  position: relative;
}
.lesson-item:hover { background: rgba(212,168,67,0.07); }
.lesson-item.active { background: rgba(192,57,43,0.15); }
.lesson-item.completed .lesson-num { background: var(--jade); color: white; }
.lesson-item.active .lesson-num { background: var(--vermillion); color: white; }

.lesson-emoji { font-size:16px; flex-shrink:0; width:20px; text-align:center; }
.lesson-info { flex:1; min-width:0; }
.lesson-title { font-size:12px; font-weight:600; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lesson-item.completed .lesson-title { color: var(--mist); }
.lesson-goal { font-size:10px; color:var(--mist2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lesson-num {
  width:18px; height:18px;
  background: rgba(255,255,255,0.08);
  border-radius:50%;
  font-size:9px;
  font-weight:700;
  color:var(--mist);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.lesson-check { font-size:10px; }

/* ===== MAIN AREA ===== */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }

/* Top bar */
.topbar {
  padding: 12px 20px;
  border-bottom: 1px solid rgba(212,168,67,0.12);
  background: rgba(17,24,39,0.97);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.lesson-context { flex:1; }
.lesson-context h2 { font-size:14px; font-weight:700; color:var(--paper); }
.lesson-context p { font-size:11px; color:var(--mist2); margin-top:1px; }
.topbar-actions { display:flex; gap:8px; align-items:center; }

/* Mode pills */
.mode-pills {
  display: flex;
  gap: 6px;
  padding: 10px 20px;
  background: rgba(17,24,39,0.6);
  border-bottom: 1px solid rgba(212,168,67,0.07);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.mode-pills::-webkit-scrollbar { display:none; }
.mpill {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.07);
  background: transparent;
  color: var(--mist);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.mpill:hover { background:rgba(255,255,255,0.06); color:var(--paper); }
.mpill.active { background:rgba(212,168,67,0.12); border-color:rgba(212,168,67,0.35); color:var(--gold); }

/* Chat */
.chat-area {
  flex:1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scrollbar-width: thin;
  scrollbar-color: rgba(212,168,67,0.12) transparent;
}
.chat-area::-webkit-scrollbar { width:4px; }
.chat-area::-webkit-scrollbar-thumb { background:rgba(212,168,67,0.15); border-radius:2px; }

/* Lesson card (welcome state) */
.lesson-card {
  background: linear-gradient(135deg, rgba(31,41,55,0.95), rgba(26,26,46,0.9));
  border: 1px solid rgba(212,168,67,0.2);
  border-radius: 18px;
  padding: 24px;
  animation: fadeUp 0.4s ease;
}
.lc-header { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.lc-emoji { font-size:40px; }
.lc-meta h3 { font-size:18px; font-weight:700; color:var(--paper); }
.lc-meta p { font-size:12px; color:var(--gold); margin-top:3px; }
.lc-goal {
  background: rgba(212,168,67,0.08);
  border: 1px solid rgba(212,168,67,0.15);
  border-radius: 10px;
  padding: 10px 14px;
  font-size:12px;
  color: var(--paper);
  margin-bottom: 16px;
  display:flex; align-items:center; gap:8px;
}
.lc-goal span { color:var(--gold); font-size:14px; }
.lc-topics { margin-bottom:18px; }
.lc-topics h4 { font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--mist); font-weight:700; margin-bottom:8px; }
.topic-tags { display:flex; flex-wrap:wrap; gap:6px; }
.topic-tag {
  padding:4px 10px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:6px;
  font-size:12px;
  color:var(--paper);
  font-family:'Noto Serif SC',serif;
}
.lc-actions { display:flex; gap:8px; flex-wrap:wrap; }
.lc-btn {
  padding:9px 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  transition:all 0.2s;
  border:none;
}
.lc-btn.primary { background:var(--vermillion); color:white; }
.lc-btn.primary:hover { background:#d44235; }
.lc-btn.secondary { background:rgba(212,168,67,0.1); border:1px solid rgba(212,168,67,0.3); color:var(--gold); }
.lc-btn.secondary:hover { background:rgba(212,168,67,0.18); }

/* Messages */
.message { display:flex; gap:10px; animation:fadeUp 0.3s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.message.user { flex-direction:row-reverse; }
.av { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.av.bot { background:linear-gradient(135deg,var(--vermillion),var(--gold)); font-family:'Ma Shan Zheng',serif; color:white; font-size:16px; }
.av.user { background:rgba(255,255,255,0.1); font-size:13px; font-weight:700; color:var(--paper); }
.bubble { max-width:78%; padding:11px 15px; border-radius:14px; font-size:13.5px; line-height:1.7; }
.message.bot .bubble {
  background:var(--ink2);
  border:1px solid rgba(212,168,67,0.12);
  color:var(--paper);
  border-radius:4px 14px 14px 14px;
}
.message.user .bubble {
  background:var(--vermillion);
  color:white;
  border-radius:14px 4px 14px 14px;
}
/* Vocab card inside bubble */
.bubble .vc { background:rgba(212,168,67,0.07); border:1px solid rgba(212,168,67,0.15); border-left:3px solid var(--gold); border-radius:8px; padding:10px 12px; margin:8px 0; }
.bubble .vc .zh { font-family:'Noto Serif SC',serif; font-size:20px; color:var(--gold); display:block; margin-bottom:2px; }
.bubble .vc .py { font-size:12px; color:var(--jade); font-style:italic; display:block; margin-bottom:3px; }
.bubble .vc .vi { font-size:12px; color:var(--mist); }
/* Inline Chinese */
.bubble .hz { font-family:'Noto Serif SC',serif; color:var(--gold); font-size:1.1em; }
/* Next step suggestion */
.next-step {
  margin-top:12px;
  padding:10px 12px;
  background:rgba(39,174,96,0.08);
  border:1px solid rgba(39,174,96,0.2);
  border-radius:10px;
  font-size:12px;
  color:var(--jade);
}
.next-step strong { display:block; margin-bottom:6px; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; }
.next-btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.next-btn {
  padding:5px 12px;
  background:rgba(39,174,96,0.12);
  border:1px solid rgba(39,174,96,0.25);
  border-radius:20px;
  font-size:11px;
  font-weight:600;
  color:var(--jade);
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
}
.next-btn:hover { background:rgba(39,174,96,0.2); }

/* Typing */
.typing { display:flex; gap:10px; align-items:center; }
.typing-dots { display:flex; gap:5px; padding:12px 16px; background:var(--ink2); border-radius:4px 14px 14px 14px; border:1px solid rgba(212,168,67,0.12); }
.dot { width:7px; height:7px; background:var(--gold); border-radius:50%; animation:bounce 1.2s infinite; }
.dot:nth-child(2){animation-delay:.15s} .dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}

/* TTS playing indicator */
.tts-bar {
  display:none;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  background:rgba(39,174,96,0.1);
  border:1px solid rgba(39,174,96,0.2);
  border-radius:8px;
  font-size:11px;
  color:var(--jade);
  margin-bottom:4px;
}
.tts-bar.active { display:flex; }
.tts-waves { display:flex; gap:3px; align-items:center; }
.tts-wave { width:3px; background:var(--jade); border-radius:2px; animation:wave 0.8s ease-in-out infinite; }
.tts-wave:nth-child(1){height:8px;animation-delay:0s}
.tts-wave:nth-child(2){height:14px;animation-delay:.1s}
.tts-wave:nth-child(3){height:10px;animation-delay:.2s}
.tts-wave:nth-child(4){height:16px;animation-delay:.15s}
.tts-wave:nth-child(5){height:8px;animation-delay:.25s}
@keyframes wave{0%,100%{transform:scaleY(0.5)}50%{transform:scaleY(1)}}

/* Input area */
.input-area {
  padding:14px 20px;
  border-top:1px solid rgba(212,168,67,0.1);
  background:rgba(17,24,39,0.98);
  flex-shrink:0;
}
.tts-bar { margin-bottom:8px; }
.input-row { display:flex; gap:8px; align-items:flex-end; }
.input-box {
  flex:1;
  background:var(--ink2);
  border:1.5px solid rgba(212,168,67,0.2);
  border-radius:14px;
  padding:11px 15px;
  color:var(--paper);
  font-size:13.5px;
  font-family:'DM Sans',sans-serif;
  resize:none;
  outline:none;
  min-height:44px;
  max-height:110px;
  line-height:1.5;
  transition:border-color 0.2s;
}
.input-box::placeholder{color:var(--mist2)}
.input-box:focus{border-color:rgba(212,168,67,0.45)}

.icon-btn {
  width:44px; height:44px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-size:17px;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s;
  flex-shrink:0;
}
.mic-btn { background:var(--ink2); border:1.5px solid rgba(212,168,67,0.25); color:var(--gold); }
.mic-btn:hover { background:rgba(212,168,67,0.12); }
.mic-btn.listening { background:#1a4a2e; border-color:var(--jade); color:var(--jade); animation:pulse 1s infinite; }
.mic-btn.speaking { background:#1a3a4a; border-color:#3b9ddd; color:#3b9ddd; }
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.send-btn { background:var(--vermillion); color:white; }
.send-btn:hover { background:#d44235; }
.send-btn:disabled { background:rgba(192,57,43,0.3); cursor:not-allowed; }

.input-hints { margin-top:8px; display:flex; justify-content:space-between; align-items:center; font-size:10.5px; color:var(--mist2); }
.hint-left { display:flex; gap:14px; align-items:center; }
.toggle-row { display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none; }
.toggle-row input { display:none; }
.tr-track { width:28px; height:15px; background:rgba(255,255,255,0.08); border-radius:8px; position:relative; transition:.2s; }
.tr-track::after { content:''; position:absolute; top:2px; left:2px; width:11px; height:11px; background:var(--mist2); border-radius:50%; transition:.2s; }
.toggle-row input:checked + .tr-track { background:rgba(39,174,96,0.3); }
.toggle-row input:checked + .tr-track::after { left:15px; background:var(--jade); }

/* Voice conversation mode */
.voice-convo-overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(10,15,25,0.92);
  z-index:100;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:20px;
  backdrop-filter:blur(8px);
}
.voice-convo-overlay.active { display:flex; }
.voice-orb {
  width:120px; height:120px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(192,57,43,0.8), rgba(212,168,67,0.4));
  display:flex; align-items:center; justify-content:center;
  font-size:44px;
  box-shadow: 0 0 0 0 rgba(192,57,43,0.4);
  animation: orbPulse 2s ease-in-out infinite;
  cursor:pointer;
}
.voice-orb.listening { animation: orbListen 0.8s ease-in-out infinite; box-shadow:0 0 0 0 rgba(39,174,96,0.5); background:radial-gradient(circle,rgba(39,174,96,0.8),rgba(39,174,96,0.2)); }
.voice-orb.speaking { animation: orbSpeak 1.2s ease-in-out infinite; background:radial-gradient(circle,rgba(59,157,221,0.8),rgba(59,157,221,0.2)); }
@keyframes orbPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0.4)}50%{box-shadow:0 0 0 20px rgba(192,57,43,0)}}
@keyframes orbListen{0%,100%{box-shadow:0 0 0 0 rgba(39,174,96,0.5)}50%{box-shadow:0 0 0 25px rgba(39,174,96,0)}}
@keyframes orbSpeak{0%,100%{box-shadow:0 0 0 0 rgba(59,157,221,0.5)}50%{box-shadow:0 0 0 30px rgba(59,157,221,0)}}
.voice-status { font-size:16px; font-weight:600; color:var(--paper); }
.voice-transcript { font-size:13px; color:var(--mist); max-width:360px; text-align:center; min-height:20px; }
.voice-close { padding:10px 28px; background:transparent; border:1.5px solid rgba(255,255,255,0.2); border-radius:30px; color:var(--mist); font-size:13px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; }
.voice-close:hover { border-color:var(--vermillion); color:var(--vermillion); }

  /* Topbar buttons */
.tb-btn {
  padding:6px 12px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  transition:all 0.2s;
  border:none;
  display:flex;
  align-items:center;
  gap:5px;
}
.tb-btn.voice-mode { background:rgba(212,168,67,0.1); border:1px solid rgba(212,168,67,0.25); color:var(--gold); }
.tb-btn.voice-mode:hover { background:rgba(212,168,67,0.2); }
.tb-btn.reset { background:transparent; border:1px solid rgba(255,255,255,0.1); color:var(--mist); }
.tb-btn.reset:hover { border-color:var(--vermillion); color:var(--vermillion); }
.level-badge { padding:5px 10px; background:rgba(192,57,43,0.15); border:1px solid rgba(192,57,43,0.3); border-radius:8px; font-size:10px; font-weight:700; color:var(--vermillion); letter-spacing:0.5px; }

/* Sidebar toggle for mobile */
.sidebar-toggle { display:none; }
@media(max-width:768px){
  .sidebar { position:fixed; left:0; top:0; height:100vh; z-index:50; transform:translateX(-100%); transition:transform 0.3s ease; }
  .sidebar.open { transform:translateX(0); }
  .sidebar-toggle { display:flex; width:36px; height:36px; background:rgba(212,168,67,0.1); border:1px solid rgba(212,168,67,0.25); border-radius:8px; color:var(--gold); font-size:16px; cursor:pointer; align-items:center; justify-content:center; }
  .bubble { max-width:90%; }
}
</style>
</head>
<body>

<!-- Voice conversation overlay -->
<div class="voice-convo-overlay" id="voiceOverlay">
  <div class="voice-orb" id="voiceOrb" onclick="toggleVoiceListening()">🎤</div>
  <div class="voice-status" id="voiceStatus">Chạm để bắt đầu nói</div>
  <div class="voice-transcript" id="voiceTranscript"></div>
  <button class="voice-close" onclick="closeVoiceMode()">✕ Thoát hội thoại voice</button>
</div>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">學</div>
        <div class="brand-text">
          <h1>Gia Sư Tiếng Trung</h1>
          <p>Sophia Nguyễn · HSK 1–6</p>
        </div>
      </div>
      <div class="level-tabs" id="levelTabs">
        <button class="ltab active" onclick="setLevel(1,this)">HSK 1</button>
        <button class="ltab" onclick="setLevel(2,this)">HSK 2</button>
        <button class="ltab" onclick="setLevel(3,this)">HSK 3</button>
        <button class="ltab" onclick="setLevel(4,this)">HSK 4</button>
        <button class="ltab" onclick="setLevel(5,this)">HSK 5</button>
        <button class="ltab" onclick="setLevel(6,this)">HSK 6</button>
      </div>
    </div>
    <div class="sidebar-progress">
      <div class="progress-label">
        <span id="progressLabel">Tiến độ HSK 1</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="lesson-list" id="lessonList"></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- Top bar -->
    <div class="topbar">
      <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div class="lesson-context">
        <h2 id="topbarTitle">👋 Bài 1 · Chào hỏi</h2>
        <p id="topbarGoal">Biết 10 câu chào hỏi cơ bản nhất · HSK 1</p>
      </div>
      <div class="topbar-actions">
        <span class="level-badge" id="levelBadge">HSK 1</span>
        <button class="tb-btn voice-mode" onclick="openVoiceMode()">🎤 Hội thoại Voice</button>
        <button class="tb-btn reset" onclick="resetLesson()">↺</button>
      </div>
    </div>

    <!-- Mode pills -->
    <div class="mode-pills">
      <button class="mpill active" onclick="setMode('lesson',this)">📚 Bài học</button>

function init() {

function renderLessonList() {
  const list = document.getElementById('lessonList');
  const lessons = CURRICULUM[currentLevel].lessons;
  list.innerHTML = lessons.map((l, i) => {
    const key = `${currentLevel}-${i}`;
    const done = progress[key];
    const active = i === currentLessonIdx;
    return `
      <div class="lesson-item ${done?'completed':''} ${active?'active':''}" onclick="loadLesson(${i})" id="li-${i}">
        <span class="lesson-emoji">${l.emoji}</span>
        <div class="lesson-info">
          <div class="lesson-title">${l.title}</div>
          <div class="lesson-goal">${l.goal}</div>
        </div>
        <div class="lesson-num">${done ? '<span class="lesson-check">✓</span>' : i+1}</div>
      </div>`;
  }).join('');
}

function loadLesson(idx) {
  currentLessonIdx = idx;
  conversationHistory = [];
  const lesson = CURRICULUM[currentLevel].lessons[idx];
  document.getElementById('topbarTitle').textContent = `${lesson.emoji} Bài ${idx+1} · ${lesson.title}`;
  document.getElementById('topbarGoal').textContent = `${lesson.goal} · ${CURRICULUM[currentLevel].name}`;
  document.getElementById('levelBadge').textContent = CURRICULUM[currentLevel].name;
  renderLessonList();
  showLessonCard(lesson, idx);
}

function showLessonCard(lesson, idx) {
  const chatArea = document.getElementById('chatArea');
  chatArea.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'lesson-card';
  card.innerHTML = `
    <div class="lc-header">
      <div class="lc-emoji">${lesson.emoji}</div>
      <div class="lc-meta">
        <h3>Bài ${idx+1}: ${lesson.title}</h3>
        <p>${CURRICULUM[currentLevel].name} · ${CURRICULUM[currentLevel].desc}</p>
      </div>
    </div>
    <div class="lc-goal"><span>🎯</span> Mục tiêu: ${lesson.goal}</div>
    <div class="lc-topics">
      <h4>Nội dung bài học</h4>
      <div class="topic-tags">${lesson.topics.map(t=>`<span class="topic-tag">${t}</span>`).join('')}</div>
    </div>
    <div class="lc-actions">
      <button class="lc-btn primary" onclick="startLesson()">▶ Bắt đầu bài học</button>
      <button class="lc-btn secondary" onclick="doQuiz()">✅ Quiz ngay</button>
      <button class="lc-btn secondary" onclick="doConvo()">🗣️ Luyện hội thoại</button>
      ${idx > 0 ? `<button class="lc-btn secondary" onclick="loadLesson(${idx-1})">← Bài trước</button>` : ''}

    </div>`;
  chatArea.appendChild(card);
}

function startLesson() {
  const lesson = CURRICULUM[currentLevel].lessons[currentLessonIdx];

1. **Giới thiệu** - bài này học gì, tại sao quan trọng (2-3 câu)
2. **Từ vựng chính** - dạy ${Math.min(lesson.topics.length+2, 8)} từ/câu quan trọng nhất với chữ Hán + pinyin + nghĩa tiếng Việt + ví dụ câu
3. **Mẫu câu** - 2-3 cấu trúc câu hay dùng nhất trong chủ đề này
4. **Hội thoại mẫu** - 1 đoạn hội thoại ngắn 4-6 lượt thoại thực tế
5. **Gợi ý luyện tập** - chỉ tôi cách luyện tiếp (đặt câu, hỏi đáp, v.v.)

  clearChatKeepCard();
  sendAutoMessage(prompt);
}

function doQuiz() {
  const lesson = CURRICULUM[currentLevel].lessons[currentLessonIdx];
  const prompt = `Hãy tạo bài kiểm tra bài "${lesson.title}" (${CURRICULUM[currentLevel].name}) gồm:
- 5 câu trắc nghiệm A/B/C/D (có đáp án bên dưới ô ẩn)
- 3 câu điền từ vào chỗ trống
- 2 câu dịch tiếng Việt → tiếng Trung

Mỗi câu đều rõ ràng, phù hợp trình độ ${CURRICULUM[currentLevel].name}. Sau quiz, chờ tôi trả lời từng câu nhé!`;
  clearChatKeepCard();
  sendAutoMessage(prompt);
  markLessonDone();
}

function doConvo() {
  const lesson = CURRICULUM[currentLevel].lessons[currentLessonIdx];

1. Đưa ra 1 tình huống thực tế (ví dụ: gặp người mới, đi mua hàng...)
2. Bắt đầu hội thoại bằng cách nói 1 câu tiếng Trung (kèm pinyin + nghĩa)
3. Chờ tôi trả lời
4. Sau mỗi lượt tôi nói, hãy: nhận xét ngắn → đáp lại bằng tiếng Trung → gợi ý câu tiếp theo cho tôi

Mức độ phù hợp với ${CURRICULUM[currentLevel].name}.`;
  clearChatKeepCard();
  sendAutoMessage(prompt);
}

function clearChatKeepCard() {
  document.getElementById('chatArea').innerHTML = '';
}

function setLevel(lvl, btn) {
  currentLevel = lvl;
  currentLessonIdx = 0;
  conversationHistory = [];
  document.querySelectorAll('.ltab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLessonList();
  loadLesson(0);
  updateProgress();
}

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mpill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const lesson = CURRICULUM[currentLevel].lessons[currentLessonIdx];
  if (mode === 'lesson') { loadLesson(currentLessonIdx); return; }
  if (mode === 'quiz') { doQuiz(); return; }
  if (mode === 'convo') { doConvo(); return; }
  if (mode === 'pronunciation') {
    clearChatKeepCard();
    addBotMessage(`🎵 **Chế độ luyện phát âm**\n\nEm sẽ hỗ trợ chị luyện phát âm chuẩn tiếng Trung!\n\nCách dùng:\n• Gõ hoặc **bấm 🎤** để nói một từ/câu tiếng Trung\n• Em sẽ phân tích phát âm và hướng dẫn cải thiện\n\nChị muốn luyện từ nào? Ví dụ gõ: **你好** hoặc nói trực tiếp vào mic nhé!`);
    return;
  }
  if (mode === 'vocab') {
    clearChatKeepCard();
    sendAutoMessage(`Dạy tôi từ vựng chủ đề "${lesson.title}" theo ${CURRICULUM[currentLevel].name}. Liệt kê 10 từ quan trọng nhất với chữ Hán + pinyin + nghĩa tiếng Việt + 1 ví dụ câu đơn giản cho mỗi từ.`);
    return;
  }
  if (mode === 'grammar') {
    clearChatKeepCard();
    sendAutoMessage(`Giải thích ngữ pháp quan trọng nhất trong bài "${lesson.title}" cho người học ${CURRICULUM[currentLevel].name}. Dùng tiếng Việt, cho công thức rõ ràng và nhiều ví dụ.`);
    return;
  }
  if (mode === 'free') {
    clearChatKeepCard();
    addBotMessage(`💬 **Chế độ hỏi tự do**\n\nChị cứ hỏi bất cứ điều gì về tiếng Trung! Em sẵn sàng giải đáp theo trình độ **${CURRICULUM[currentLevel].name}** nhé 😊`);
  }
}

function markLessonDone() {
  const key = `${currentLevel}-${currentLessonIdx}`;
  progress[key] = true;
  localStorage.setItem('hsk_progress', JSON.stringify(progress));
  updateProgress();
  renderLessonList();
}

function updateProgress() {
  const lessons = CURRICULUM[currentLevel].lessons;
  const done = lessons.filter((_,i) => progress[`${currentLevel}-${i}`]).length;
  const pct = Math.round(done/lessons.length*100);
  document.getElementById('progressLabel').textContent = `Tiến độ ${CURRICULUM[currentLevel].name}`;
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = pct + '%';
}

  const lvl = CURRICULUM[currentLevel];

function showTypingIndicator() {

}
function removeTypingIndicator() { const t = document.getElementById('typingDots'); if(t)t.remove(); }

function formatMessage(text) {
  text = text.replace(/<strong>(.*?)<\/strong>/gi, '**$1**');
  text = text.replace(/<em>(.*?)<\/em>/gi, '*$1*');
  text = text.replace(/<[^>]+>/g, '');
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.*?)\*/g, '<em style="color:var(--jade);font-style:normal">$1</em>');
  const lines = text.split('\n');
  const out = [];
  for (let line of lines) {
    if (/[\u4e00-\u9fff]/.test(line) && line.includes(' - ')) {
      const parts = line.split(' - ');
      if (parts.length >= 2) {
        const zh = parts[0].replace(/^[\s•\-\d\.]+/, '').trim();
        if (/[\u4e00-\u9fff]/.test(zh)) {
          const py = parts.length >= 3 ? parts[1] : '';
          const vi = parts.length >= 3 ? parts.slice(2).join(' - ') : parts[1];
          if (showPinyin && py) {
            out.push(`<div class="vc"><span class="zh">${zh}</span><span class="py">${py}</span><span class="vi">${vi}</span></div>`);
          } else {
            out.push(`<div class="vc"><span class="zh">${zh}</span><span class="vi">${vi}</span></div>`);
          }
          continue;
        }
      }
    }
    line = line.replace(/([\u4e00-\u9fff]+)/g, '<span class="hz">$1</span>');
    out.push(line || '<br>');
  }
  return out.join('<br>');
}

function getPlainText(text) {
  const chinese = text.match(/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]+/g);
  if (chinese && chinese.join('').length > 5) {
    return chinese.slice(0, 6).join('，');
  }
  return text.replace(/\*\*/g,'').replace(/\*/g,'').replace(/<[^>]+>/g,'').substring(0,200);
}

// ===== API CALL - DÙNG GROQ =====
async function sendAutoMessage(prompt) {
  conversationHistory.push({role:'user', content:prompt});
  showTypingIndicator();
  isTyping = true;
  document.getElementById('sendBtn').disabled = true;
  try {
    const messages = [
      { role: 'system', content: getSystemPrompt() },
      ...conversationHistory.map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }))
    ];
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: messages,
        temperature: 0.7,
        max_tokens: 1200
      })
    });
    const data = await res.json();
    removeTypingIndicator();
    if (data.error) {
      addBotMessage(`⚠️ Lỗi Groq API: ${data.error.message}. Kiểm tra lại key nhé!`);
    } else if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      conversationHistory.push({role:'assistant', content:reply});
      addBotMessage(reply);
      addNextStepSuggestions();
    }
  } catch(e) {
    removeTypingIndicator();
    addBotMessage('⚠️ Lỗi kết nối. Chị thử lại nhé!');
  }
  isTyping = false;
  document.getElementById('sendBtn').disabled = false;
}

function addNextStepSuggestions() {
  const lesson = CURRICULUM[currentLevel].lessons[currentLessonIdx];
  const nextLesson = CURRICULUM[currentLevel].lessons[currentLessonIdx + 1];
  const chatArea = document.getElementById('chatArea');
  const ns = document.createElement('div');
  ns.className = 'next-step';
  ns.innerHTML = `<strong>🚀 Bước tiếp theo</strong>
    <div class="next-btns">
      <button class="next-btn" onclick="sendAutoMessage('Cho tôi thêm ví dụ câu và bài tập luyện tập về ${lesson.title}')">➕ Thêm bài tập</button>
      <button class="next-btn" onclick="doQuiz()">✅ Làm quiz bài này</button>
      <button class="next-btn" onclick="doConvo()">🗣️ Luyện hội thoại</button>
      ${nextLesson ? `<button class="next-btn" onclick="loadLesson(${currentLessonIdx+1});markLessonDone()">→ Bài ${currentLessonIdx+2}: ${nextLesson.title}</button>` : '<button class="next-btn" onclick="loadLesson(0)">🏆 Hoàn thành! Ôn tập</button>'}
    </div>`;

}

function speakText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => v.lang.startsWith('zh'));
  if (zhVoice) utter.voice = zhVoice;
  utter.lang = 'zh-CN';
  utter.rate = 0.85;
  const bar = document.getElementById('ttsBar');
  bar.classList.add('active');
  utter.onend = () => {
    bar.classList.remove('active');
    if (autoMicEnabled && document.getElementById('autoMicToggle').checked && !voiceModeActive) {
      setTimeout(startSTT, 500);
    }
    if (voiceModeActive) {
      document.getElementById('voiceOrb').className = 'voice-orb';
      document.getElementById('voiceStatus').textContent = 'Chạm để nói tiếp';
      setTimeout(() => { if(voiceModeActive) toggleVoiceListening(); }, 600);
    }
  };
  window.speechSynthesis.speak(utter);
}

function stopTTS() {
  window.speechSynthesis.cancel();
  document.getElementById('ttsBar').classList.remove('active');
}

function startSTT() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addBotMessage('⚠️ Trình duyệt chị chưa hỗ trợ nhận giọng nói. Hãy dùng Chrome hoặc Edge nhé!');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  const micBtn = document.getElementById('micBtn');
  micBtn.classList.add('listening');
  micBtn.textContent = '⏺';
  recognition.onresult = (e) => {
    const spoken = e.results[0][0].transcript;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤';
    document.getElementById('userInput').value = spoken;
    sendMessage();
  };
  recognition.onerror = () => { micBtn.classList.remove('listening'); micBtn.textContent = '🎤'; };
  recognition.onend = () => { micBtn.classList.remove('listening'); micBtn.textContent = '🎤'; };
  recognition.start();
}

function openVoiceMode() {
  voiceModeActive = true;
  document.getElementById('voiceOverlay').classList.add('active');
  document.getElementById('voiceStatus').textContent = 'Chạm vào vòng tròn để bắt đầu';
  addBotMessage('🎤 **Hội thoại Voice đã bật!**\n\nEm sẽ nghe chị nói → trả lời → đọc to câu trả lời → chờ chị nói tiếp. Nhấn vào vòng tròn để bắt đầu!');
}

function closeVoiceMode() {
  voiceModeActive = false;
  voiceListening = false;
  if (recognition) { try { recognition.stop(); } catch(e){} }
  window.speechSynthesis.cancel();
  document.getElementById('voiceOverlay').classList.remove('active');
  document.getElementById('ttsBar').classList.remove('active');
}

function toggleVoiceListening() {
  if (voiceListening) return;
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    document.getElementById('voiceStatus').textContent = '⚠️ Trình duyệt không hỗ trợ';
    return;
  }
  voiceListening = true;
  const orb = document.getElementById('voiceOrb');
  const status = document.getElementById('voiceStatus');
  const transcript = document.getElementById('voiceTranscript');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.interimResults = true;
  orb.className = 'voice-orb listening';
  orb.textContent = '⏺';
  status.textContent = 'Đang nghe... Nói đi chị!';
  transcript.textContent = '';
  recognition.onresult = (e) => {
    const interim = Array.from(e.results).map(r=>r[0].transcript).join('');
    transcript.textContent = interim;
    if (e.results[e.results.length-1].isFinal) {
      const final = e.results[e.results.length-1][0].transcript;
      transcript.textContent = final;
      voiceListening = false;
      orb.className = 'voice-orb speaking';
      orb.textContent = '🔊';
      status.textContent = 'Đang xử lý...';
      sendVoiceMessage(final);
    }
  };
  recognition.onerror = (e) => {
    voiceListening = false;
    orb.className = 'voice-orb';
    orb.textContent = '🎤';
    status.textContent = 'Lỗi: ' + e.error + '. Thử lại!';
  };
  recognition.onend = () => {
    if (voiceListening) {
      voiceListening = false;
      orb.className = 'voice-orb';
      orb.textContent = '🎤';
    }
  };
  recognition.start();
}

function speakVoiceReply(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const chineseParts = text.match(/[\u4e00-\u9fff][^\n]*/g);
  const toSpeak = chineseParts ? chineseParts.slice(0,3).join('。') : text.replace(/\*\*/g,'').substring(0,150);
  const utter = new SpeechSynthesisUtterance(toSpeak);
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v=>v.lang.startsWith('zh'));
  if (zhVoice) utter.voice = zhVoice;
  utter.lang = 'zh-CN';
  utter.rate = 0.8;
  const orb = document.getElementById('voiceOrb');
  const status = document.getElementById('voiceStatus');
  utter.onend = () => {
    if (voiceModeActive) {
      orb.className = 'voice-orb';
      orb.textContent = '🎤';
      status.textContent = 'Chạm để nói tiếp';
      setTimeout(() => { if(voiceModeActive) toggleVoiceListening(); }, 800);
    }
  };
  window.speechSynthesis.speak(utter);
}

if (window.speechSynthesis) {

  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.querySelector('.sidebar-toggle');
  if (sidebar && sidebar.classList.contains('open')) {
    // Nếu bấm vào toggle thì không đóng (để toggle xử lý)
    if (toggleBtn && toggleBtn.contains(event.target)) return;

    if (sidebar.contains(event.target)) return;

  }
});
