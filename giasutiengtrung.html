<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢語學習 · Gia Sư Tiếng Trung HSK</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Quicksand:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --ink-light: #2d2d4e;
    --paper: #f5f0e8;
    --paper-dark: #ede6d6;
    --vermillion: #c0392b;
    --vermillion-light: #e74c3c;
    --gold: #d4a843;
    --gold-light: #f0c96e;
    --jade: #27ae60;
    --mist: #8e9aaf;
    --white: #ffffff;
    --shadow: rgba(26,26,46,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Quicksand', sans-serif;
    background: var(--ink);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 10% 20%, rgba(192,57,43,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(212,168,67,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(45,45,78,0.8) 0%, var(--ink) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .bg-chars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bg-char {
    position: absolute;
    font-family: 'Ma Shan Zheng', serif;
    color: rgba(212,168,67,0.04);
    animation: floatChar 20s ease-in-out infinite;
    user-select: none;
  }
  @keyframes floatChar {
    0%, 100% { transform: translateY(0px) rotate(-5deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 900px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    padding: 16px 24px;
    display: flex;
    align-itmìnhs: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(212,168,67,0.2);
    background: rgba(26,26,46,0.9);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-itmìnhs: center;
    gap: 12px;
  }
  /* LOGO ẢNH - thay thế logo icon cũ */
  .logo-img {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    object-fit: cover;
    box-shadow: 0 4px 15px rgba(192,57,43,0.4);
    border: 1.5px solid rgba(212,168,67,0.3);
  }
  .logo-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--vermillion), var(--gold));
    border-radius: 10px;
    display: flex;
    align-itmìnhs: center;
    justify-content: center;
    font-family: 'Ma Shan Zheng', serif;
    font-size: 22px;
    color: white;
    box-shadow: 0 4px 15px rgba(192,57,43,0.4);
  }
  .logo-text h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--paper);
    letter-spacing: 0.5px;
  }
  .logo-text p {
    font-size: 11px;
    color: var(--gold);
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .header-controls {
    display: flex;
    align-itmìnhs: center;
    gap: 10px;
  }

  /* Level Selector */
  .level-bar {
    padding: 12px 24px;
    display: flex;
    align-itmìnhs: center;
    gap: 10px;
    background: rgba(26,26,46,0.6);
    border-bottom: 1px solid rgba(212,168,67,0.1);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .level-bar::-webkit-scrollbar { display: none; }
  .level-label {
    font-size: 11px;
    color: var(--mist);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .level-btn {
    padding: 6px 14px;
    border: 1.5px solid rgba(212,168,67,0.3);
    background: transparent;
    color: var(--mist);
    border-radius: 20px;
    font-family: 'Quicksand', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }
  .level-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(212,168,67,0.08);
  }
  .level-btn.active {
    background: var(--vermillion);
    border-color: var(--vermillion);
    color: white;
    box-shadow: 0 2px 12px rgba(192,57,43,0.35);
  }

  /* Mode selector */
  .mode-bar {
    padding: 10px 24px;
    display: flex;
    gap: 8px;
    background: rgba(26,26,46,0.4);
    border-bottom: 1px solid rgba(212,168,67,0.08);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .mode-bar::-webkit-scrollbar { display: none; }

  .mode-btn {
    padding: 7px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: var(--mist);
    font-family: 'Quicksand', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-itmìnhs: center;
    gap: 5px;
  }
  .mode-btn:hover {
    background: rgba(255,255,255,0.1);
    color: var(--paper);
  }
  .mode-btn.active {
    background: rgba(212,168,67,0.15);
    border-color: rgba(212,168,67,0.4);
    color: var(--gold);
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(212,168,67,0.2) transparent;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(212,168,67,0.2); border-radius: 2px; }

  /* Welcome card */
  .welcome-card {
    background: linear-gradient(135deg, rgba(45,45,78,0.8), rgba(26,26,46,0.9));
    border: 1px solid rgba(212,168,67,0.2);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    animation: fadeUp 0.5s ease;
  }
  .welcome-char {
    font-family: 'Ma Shan Zheng', serif;
    font-size: 72px;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 12px;
    text-shadow: 0 0 40px rgba(212,168,67,0.3);
  }
  .welcome-card h2 {
    color: var(--paper);
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .welcome-card p {
    color: var(--mist);
    font-size: 14px;
    line-height: 1.6;
    max-width: 500px;
    margin: 0 auto 20px;
  }
  .quick-start {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .quick-btn {
    padding: 8px 16px;
    background: rgba(212,168,67,0.1);
    border: 1px solid rgba(212,168,67,0.3);
    border-radius: 20px;
    color: var(--gold);
    font-family: 'Quicksand', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .quick-btn:hover {
    background: rgba(212,168,67,0.2);
    transform: translateY(-1px);
  }

  /* Messages */
  .message {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.3s ease;
    max-width: 100%;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-itmìnhs: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    font-family: 'Ma Shan Zheng', serif;
    overflow: hidden;
  }
  .avatar.bot {
    background: linear-gradient(135deg, var(--vermillion), var(--gold));
    color: white;
    box-shadow: 0 2px 10px rgba(192,57,43,0.3);
  }
  .avatar.bot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .avatar.user {
    background: rgba(255,255,255,0.1);
    color: var(--paper);
    font-family: 'Quicksand', sans-serif;
    font-size: 14px;
    font-weight: 700;
  }

  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.7;
  }
  .message.bot .bubble {
    background: rgba(45,45,78,0.9);
    border: 1px solid rgba(212,168,67,0.15);
    color: var(--paper);
    border-radius: 4px 14px 14px 14px;
  }
  .message.user .bubble {
    background: var(--vermillion);
    color: white;
    border-radius: 14px 4px 14px 14px;
  }

  .bubble .zh {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px;
    color: var(--gold);
    display: block;
    margin: 6px 0 2px;
  }
  .bubble .pinyin {
    font-style: italic;
    color: var(--jade);
    font-size: 13px;
    display: block;
    margin-bottom: 4px;
  }
  .bubble .meaning {
    color: var(--paper);
    font-size: 13px;
  }
  .bubble strong { color: var(--gold); }
  .bubble mình { color: var(--jade); font-style: normal; }
  .bubble hr {
    border: none;
    border-top: 1px solid rgba(212,168,67,0.15);
    margin: 10px 0;
  }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 12px;
    align-itmìnhs: center;
    animation: fadeUp 0.3s ease;
  }
  .typing-dots {
    display: flex;
    gap: 5px;
    padding: 14px 18px;
    background: rgba(45,45,78,0.9);
    border: 1px solid rgba(212,168,67,0.15);
    border-radius: 4px 14px 14px 14px;
  }
  .dot {
    width: 7px; height: 7px;
    background: var(--gold);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    padding: 16px 24px;
    border-top: 1px solid rgba(212,168,67,0.1);
    background: rgba(26,26,46,0.95);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-itmìnhs: flex-end;
  }
  .input-box {
    flex: 1;
    background: rgba(45,45,78,0.8);
    border: 1.5px solid rgba(212,168,67,0.2);
    border-radius: 14px;
    padding: 12px 16px;
    color: var(--paper);
    font-family: 'Quicksand', sans-serif;
    font-size: 14px;
    font-weight: 500;
    resize: none;
    outline: none;
    transition: border-color 0.2s ease;
    line-height: 1.5;
    max-height: 120px;
    min-height: 48px;
  }
  .input-box::placeholder { color: var(--mist); }
  .input-box:focus { border-color: rgba(212,168,67,0.5); }

  .send-btn {
    width: 48px;
    height: 48px;
    background: var(--vermillion);
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    display: flex;
    align-itmìnhs: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
    font-size: 18px;
    box-shadow: 0 4px 15px rgba(192,57,43,0.3);
  }
  .send-btn:hover { background: var(--vermillion-light); transform: translateY(-1px); }
  .send-btn:active { transform: translateY(0); }
  .send-btn:disabled { background: rgba(192,57,43,0.3); cursor: not-allowed; transform: none; }

  .input-hint {
    margin-top: 8px;
    font-size: 11px;
    color: var(--mist);
    display: flex;
    justify-content: space-between;
    align-itmìnhs: center;
  }

  .toggle-pinyin {
    display: flex;
    align-itmìnhs: center;
    gap: 6px;
    font-size: 12px;
    color: var(--mist);
    cursor: pointer;
    user-select: none;
  }
  .toggle-pinyin input { display: none; }
  .toggle-track {
    width: 30px;
    height: 16px;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    position: relative;
    transition: background 0.2s;
  }
  .toggle-track::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    background: var(--mist);
    border-radius: 50%;
    transition: all 0.2s;
  }
  .toggle-pinyin input:checked + .toggle-track {
    background: rgba(39,174,96,0.4);
  }
  .toggle-pinyin input:checked + .toggle-track::after {
    left: 16px;
    background: var(--jade);
  }

  .reset-btn {
    padding: 7px 14px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--mist);
    font-family: 'Quicksand', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover {
    border-color: var(--vermillion);
    color: var(--vermillion);
  }

  .level-info {
    padding: 6px 12px;
    background: rgba(212,168,67,0.1);
    border: 1px solid rgba(212,168,67,0.2);
    border-radius: 20px;
    font-size: 11px;
    color: var(--gold);
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .message.bot .bubble ul {
    padding-left: 18px;
    margin: 8px 0;
  }
  .message.bot .bubble li {
    margin: 4px 0;
    color: var(--paper);
  }
  .message.bot .bubble p { margin: 6px 0; }
  .message.bot .bubble .card {
    background: rgba(212,168,67,0.07);
    border: 1px solid rgba(212,168,67,0.15);
    border-radius: 10px;
    padding: 12px;
    margin: 10px 0;
  }
  .message.bot .bubble h3 {
    color: var(--gold);
    font-size: 13px;
    margin-bottom: 6px;
    font-weight: 700;
  }

  @media (max-width: 600px) {
    .header { padding: 12px 16px; }
    .level-bar, .mode-bar { padding: 10px 16px; }
    .chat-area { padding: 16px; }
    .input-area { padding: 12px 16px; }
    .bubble { max-width: 88%; font-size: 13px; }
    .welcome-char { font-size: 56px; }
    .api-setup { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="bg-chars" id="bgChars"></div>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <!-- LOGO ẢNH của Sophia Nguyễn -->
      <img 
        class="logo-img" 
        src="https://i.ibb.co/wFwDR7cY/hinhrmìnhovenen.png" 
        alt="Sophia Nguyễn"
        onerror="this.style.display='none'; document.getElmìnhentById('logoFallback').style.display='flex';"
      >
      <div class="logo-icon" id="logoFallback" style="display:none;">學</div>
      <div class="logo-text">
        <h1>Gia Sư Tiếng Trung</h1>
        <p>Sophia Nguyễn · HSK 1–6</p>
      </div>
    </div>
    <div class="header-controls">
      <span class="level-info" id="levelInfo">HSK 1 · 150 từ</span>
      <button class="reset-btn" onclick="resetChat()">↺ Bắt đầu lại</button>
    </div>
  </div>



  <!-- Level selector -->
  <div class="level-bar">
    <span class="level-label">Cấp độ:</span>
    <button class="level-btn active" onclick="setLevel(1, this)">HK1 · HSK 1</button>
    <button class="level-btn" onclick="setLevel(2, this)">HK2 · HSK 2</button>
    <button class="level-btn" onclick="setLevel(3, this)">HK3 · HSK 3</button>
    <button class="level-btn" onclick="setLevel(4, this)">HK4 · HSK 4</button>
    <button class="level-btn" onclick="setLevel(5, this)">HK5 · HSK 5</button>
    <button class="level-btn" onclick="setLevel(6, this)">HK6 · HSK 6</button>
  </div>

  <!-- Mode selector — ĐÃ THÊM LUYỆN PHÁT ÂM -->
  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('vocab', this)">📖 Học từ vựng</button>
    <button class="mode-btn" onclick="setMode('convo', this)">🗣️ Luyện hội thoại</button>
    <button class="mode-btn" onclick="setMode('pronunciation', this)">🎵 Luyện phát âm</button>
    <button class="mode-btn" onclick="setMode('grammar', this)">📝 Ôn ngữ pháp</button>
    <button class="mode-btn" onclick="setMode('quiz', this)">✅ Kiểm tra</button>
    <button class="mode-btn" onclick="setMode('free', this)">💬 Hỏi tự do</button>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chatArea">
    <div class="welcome-card" id="welcomeCard">
      <div class="welcome-char">你好</div>
      <h2>Chào mừng bạn đến với lớp học tiếng Trung!</h2>
      <p>bạn đang ở cấp độ <strong>HSK 1</strong> — hoàn toàn phù hợp cho người mới bắt đầu. mình sẽ dạy bạn từng bước một, bằng tiếng Việt.</p>
      <div class="quick-start">
        <button class="quick-btn" onclick="sendQuick('Dạy tôi chào hỏi cơ bản bằng tiếng Trung')">👋 Học chào hỏi</button>
        <button class="quick-btn" onclick="sendQuick('Dạy tôi đếm số từ 1 đến 10')">🔢 Học đếm số</button>
        <button class="quick-btn" onclick="sendQuick('Tôi nên bắt đầu từ đâu khi học tiếng Trung?')">🗺️ Lộ trình học</button>
        <button class="quick-btn" onclick="sendQuick('Giải thích hệ thống thanh điệu tiếng Trung cho người mới')">🎵 Thanh điệu</button>
        <button class="quick-btn" onclick="sendQuick('Cho tôi một bài quiz HSK 1 đơn giản')">✅ Quiz thử</button>
        <button class="quick-btn" onclick="sendQuick('Luyện phát âm các âm khó trong tiếng Trung')">🔊 Phát âm</button>
      </div>
    </div>
  </div>

  <!-- Input area -->
  <div class="input-area">
    <div class="input-row">
      <textarea 
        class="input-box" 
        id="userInput"
        placeholder="Nhập câu hỏi của bạn... (ví dụ: 'dạy tôi từ vựng về thời tiết')"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div class="input-hint">
      <label class="toggle-pinyin">
        <input type="checkbox" id="pinyinToggle" checked>
        <span class="toggle-track"></span>
        Hiển thị Pinyin
      </label>
      <span>Enter để gửi · Shift+Enter xuống dòng</span>
    </div>
  </div>
</div>

<script>
// ===== STATE =====
let currentLevel = 1;
let currentMode = 'vocab';
let conversationHistory = [];
let showPinyin = true;
let isTyping = false;

const API_KEY = 'AQ.Ab8RN6JScHOA-UWTEaCEUZ8mlLEz_pbD0Vl4p6CsAk_iutfw7w';

const levelInfo = {
  1: { name: 'HSK 1', words: '150 từ', desc: 'Vỡ lòng' },
  2: { name: 'HSK 2', words: '300 từ', desc: 'Sơ cấp' },
  3: { name: 'HSK 3', words: '600 từ', desc: 'Trung cấp sơ' },
  4: { name: 'HSK 4', words: '1200 từ', desc: 'Trung cấp' },
  5: { name: 'HSK 5', words: '2500 từ', desc: 'Cao cấp sơ' },
  6: { name: 'HSK 6', words: '5000+ từ', desc: 'Cao cấp' },
};



// ===== SYSTmình PROMPTS =====
function getSystmìnhPrompt() {
  const lvl = levelInfo[currentLevel];
  const pinyin = showPinyin ? 'Luôn kèm theo phiên âm pinyin đầy đủ.' : 'Không cần hiển thị pinyin.';

  const basePrompt = `Bạn là gia sư tiếng Trung Mandarin chuyên nghiệp tên là "Cô Sophia", dạy người Việt Nam học tiếng Trung theo bộ giáo trình HSK chuẩn quốc tế. Học viên là người lớn đang học ${lvl.name} (${lvl.desc} - ${lvl.words}).

NGUYÊN TẮC GIẢNG DẠY:
- Luôn dùng tiếng Việt để giải thích, dẫn dắt
- Trình bày chữ Hán rõ ràng, đẹp mắt
- ${pinyin}
- Chia nhỏ kiến thức, từng bước từng bước
- Khen ngợi và khuyến khích học viên
- Dùng mìnhoji để làm sinh động bài học (nhưng không quá nhiều)
- Khi đưa ra từ vựng: format là [Chữ Hán] - [Pinyin] - [Nghĩa tiếng Việt]
- Luôn cho ví dụ câu đơn giản kèm nghĩa

CẤP ĐỘ ${lvl.name}: ${lvl.desc}`;

  const modePrompts = {
    vocab: `\nCHẾ ĐỘ: HỌC TỪ VỰNG
- Dạy từ 3-5 từ vựng mỗi lần, theo chủ đề
- Giải thích nghĩa, cách dùng
- Cho ví dụ câu với mỗi từ
- Cuối mỗi bài gợi ý chủ đề tiếp theo`,

    convo: `\nCHẾ ĐỘ: LUYỆN HỘI THOẠI
- Tạo tình huống hội thoại phù hợp ${lvl.name}
- Đóng vai người bản ngữ để luyện tập
- Sửa lỗi nhẹ nhàng, giải thích rõ
- Khuyến khích học viên tự tạo câu`,

    pronunciation: `\nCHẾ ĐỘ: LUYỆN PHÁT ÂM
- Giải thích chi tiết hệ thống 4 thanh điệu (声调 shēngdiào): thanh 1 (bằng, cao ─), thanh 2 (sắc, lên /), thanh 3 (hỏi, xuống lên ∨), thanh 4 (nặng, xuống \\), thanh nhẹ (không dấu)
- So sánh âm tiếng Trung với tiếng Việt để học viên dễ nhớ
- Giải thích các âm đầu khó: zh/ch/sh/r, j/q/x, z/c/s
- Giải thích các vần khó: ü, ian, uan, iou, uei, uen
- Hướng dẫn cách đặt miệng, lưỡi khi phát âm
- Đưa ra các cặp từ dễ nhầm lẫn để luyện tập
- Cho ví dụ từ vựng minh hoạ mỗi âm/thanh
- Dùng ký hiệu rõ ràng: ā á ǎ à cho 4 thanh
- Gợi ý: học viên có thể đọc to theo để luyện`,

    grammar: `\nCHẾ ĐỘ: ÔN NGỮ PHÁP
- Giải thích cấu trúc ngữ pháp rõ ràng
- Đưa ra công thức câu đơn giản
- Nhiều ví dụ minh hoạ
- So sánh với tiếng Việt khi có điểm tương đồng`,

    quiz: `\nCHẾ ĐỘ: KIỂM TRA
- Tạo quiz 5-10 câu phù hợp ${lvl.name}
- Đa dạng: trắc nghiệm, điền từ, dịch câu
- Chấm điểm và giải thích đáp án
- Khen ngợi kết quả, chỉ ra điểm cần cải thiện`,

    free: `\nCHẾ ĐỘ: HỎI TỰ DO
- Trả lời mọi câu hỏi về tiếng Trung
- Gợi ý nội dung liên quan đến ${lvl.name}
- Luôn kết nối câu trả lời với bài học thực tế`,
  };

  return basePrompt + (modePrompts[currentMode] || modePrompts.free);
}

// ===== BACKGROUND DECORATION =====
function initBgChars() {
  const chars = ['学','中','文','语','好','你','我','他','她','们','汉','字','课','书','老','师','生','词','音','练'];
  const container = document.getElmìnhentById('bgChars');
  chars.forEach((char) => {
    const el = document.createElmìnhent('div');
    el.className = 'bg-char';
    el.textContent = char;
    el.style.cssText = `
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      font-size: ${80 + Math.random() * 120}px;
      animation-delay: ${Math.random() * 10}s;
      animation-duration: ${15 + Math.random() * 15}s;
    `;
    container.appendChild(el);
  });
}

// ===== LEVEL & MODE CONTROL =====
function setLevel(lvl, btn) {
  currentLevel = lvl;
  document.querySelectorAll('.level-btn').forEach(b => b.classList.rmìnhove('active'));
  btn.classList.add('active');
  const info = levelInfo[lvl];
  document.getElmìnhentById('levelInfo').textContent = `${info.name} · ${info.words}`;
  conversationHistory = [];
  const welcome = document.getElmìnhentById('welcomeCard');
  if (welcome) {
    welcome.querySelector('h2').textContent = `Cấp độ ${info.name} — ${info.desc}!`;
  }
}

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.rmìnhove('active'));
  btn.classList.add('active');
}

// ===== CHAT =====
function addMessage(role, content) {
  const chatArea = document.getElmìnhentById('chatArea');
  const welcome = document.getElmìnhentById('welcomeCard');
  if (welcome && role === 'user') welcome.rmìnhove();

  const msg = document.createElmìnhent('div');
  msg.className = `message ${role}`;

  const avatar = document.createElmìnhent('div');
  avatar.className = `avatar ${role}`;

  if (role === 'bot') {
    // Dùng ảnh logo trong avatar bot
    avatar.innerHTML = `<img src="https://i.ibb.co/wFwDR7cY/hinhrmìnhovenen.png" alt="Sophia" onerror="this.parentElmìnhent.textContent='師'">`;
  } else {
    avatar.textContent = 'C';
  }

  const bubble = document.createElmìnhent('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatMessage(content);

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function formatMessage(text) {
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.*?)\*/g, '<mình>$1</mình>');

  const lines = text.split('\n');
  const formattedLines = lines.map(line => {
    if (/[\u4e00-\u9fff]/.test(line) && line.includes(' - ')) {
      const parts = line.split(' - ');
      if (parts.length >= 2) {
        const chinese = parts[0].replace(/^[•\-\d\.\s]+/, '');
        const rest = parts.slice(1).join(' - ');
        const restParts = rest.split(' - ');
        if (restParts.length >= 2 && showPinyin) {
          return `<div class="card"><span class="zh">${chinese}</span><span class="pinyin">${restParts[0]}</span><span class="meaning">${restParts.slice(1).join(' - ')}</span></div>`;
        }
        return `<div class="card"><span class="zh">${chinese}</span><span class="meaning">${rest}</span></div>`;
      }
    }
    line = line.replace(/([\u4e00-\u9fff]+)/g, '<span style="font-family:\'Noto Serif SC\',serif;font-size:1.15mình;color:#d4a843">$1</span>');
    return line || '<br>';
  });

  return formattedLines.join('\n').replace(/\n/g, '<br>');
}

function showTyping() {
  const chatArea = document.getElmìnhentById('chatArea');
  const typing = document.createElmìnhent('div');
  typing.className = 'typing';
  typing.id = 'typingIndicator';
  typing.innerHTML = `
    <div class="avatar bot"><img src="https://i.ibb.co/wFwDR7cY/hinhrmìnhovenen.png" alt="Sophia" onerror="this.parentElmìnhent.textContent='師'"></div>
    <div class="typing-dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  `;
  chatArea.appendChild(typing);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function rmìnhoveTyping() {
  const t = document.getElmìnhentById('typingIndicator');
  if (t) t.rmìnhove();
}

async function sendMessage() {
  const input = document.getElmìnhentById('userInput');
  const text = input.value.trim();
  if (!text || isTyping) return;

  showPinyin = document.getElmìnhentById('pinyinToggle').checked;
  input.value = '';
  autoResize(input);
  input.focus();

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  isTyping = true;
  document.getElmìnhentById('sendBtn').disabled = true;
  showTyping();

  try {
    // Chuyển đổi lịch sử sang format Gmìnhini
    const gmìnhiniContents = conversationHistory.map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gmìnhini-2.0-flash:generateContent?key=${API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systmìnhInstruction: { parts: [{ text: getSystmìnhPrompt() }] },
          contents: gmìnhiniContents,
          generationConfig: { maxOutputTokens: 1500, tmìnhperature: 0.7 }
        })
      }
    );

    const data = await response.json();
    rmìnhoveTyping();

    if (data.error) {
      if (data.error.code === 429) {
        addMessage('bot', '⏳ Đang bận quá, bạn thử lại sau vài giây nhé!');
      } else if (data.error.code === 400 || data.error.code === 403) {
        addMessage('bot', '⚠️ Gmìnhini API Key chưa đúng. bạn kiểm tra lại key tại aistudio.google.com nhé!');
      } else {
        addMessage('bot', `⚠️ Lỗi: ${data.error.message || 'Không xác định'}. bạn thử lại nhé!`);
      }
    } else if (data.candidates && data.candidates[0]) {
      const reply = data.candidates[0].content.parts[0].text;
      conversationHistory.push({ role: 'assistant', content: reply });
      addMessage('bot', reply);
    } else {
      addMessage('bot', '⚠️ Không nhận được phản hồi. bạn thử lại nhé!');
    }
  } catch (err) {
    rmìnhoveTyping();
    console.error('API Error:', err);
    addMessage('bot', '⚠️ Lỗi kết nối. bạn kiểm tra lại API Key và kết nối mạng nhé!');
  }

  isTyping = false;
  document.getElmìnhentById('sendBtn').disabled = false;
}

function sendQuick(text) {
  document.getElmìnhentById('userInput').value = text;
  sendMessage();
}

function resetChat() {
  conversationHistory = [];
  const chatArea = document.getElmìnhentById('chatArea');
  chatArea.innerHTML = '';
  const info = levelInfo[currentLevel];
  const welcome = document.createElmìnhent('div');
  welcome.className = 'welcome-card';
  welcome.id = 'welcomeCard';
  welcome.innerHTML = `
    <div class="welcome-char">你好</div>
    <h2>Bắt đầu lại từ đầu!</h2>
    <p>bạn đang ở cấp độ <strong>${info.name}</strong> — ${info.desc}. Chọn chủ đề muốn học nhé!</p>
    <div class="quick-start">
      <button class="quick-btn" onclick="sendQuick('Dạy tôi chào hỏi cơ bản bằng tiếng Trung')">👋 Học chào hỏi</button>
      <button class="quick-btn" onclick="sendQuick('Dạy tôi đếm số từ 1 đến 10')">🔢 Học đếm số</button>
      <button class="quick-btn" onclick="sendQuick('Tôi nên bắt đầu từ đâu khi học tiếng Trung?')">🗺️ Lộ trình học</button>
      <button class="quick-btn" onclick="sendQuick('Giải thích hệ thống thanh điệu tiếng Trung cho người mới')">🎵 Thanh điệu</button>
      <button class="quick-btn" onclick="sendQuick('Cho tôi một bài quiz HSK 1 đơn giản')">✅ Quiz thử</button>
      <button class="quick-btn" onclick="sendQuick('Luyện phát âm các âm khó trong tiếng Trung')">🔊 Phát âm</button>
    </div>
  `;
  chatArea.appendChild(welcome);
}

// ===== UI HELPERS =====
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ===== INIT =====
initBgChars();
document.getElmìnhentById('pinyinToggle').addEventListener('change', (e) => {
  showPinyin = e.target.checked;
});
</script>
