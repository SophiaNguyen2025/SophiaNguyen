<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢語學習 · Gia Sư Tiếng Trung HSK</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Quicksand:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --vermillion: #c0392b;
    --gold: #d4a843;
    --jade: #27ae60;
    --mist: #8e9aaf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Quicksand', sans-serif;
    background: var(--ink);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 10% 20%, rgba(192,57,43,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(212,168,67,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(45,45,78,0.8) 0%, var(--ink) 100%);
    pointer-events: none;
    z-index: 0;
  }
  .bg-chars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-char {
    position: absolute;
    font-family: 'Ma Shan Zheng', serif;
    color: rgba(212,168,67,0.04);
    animation: floatChar 20s ease-in-out infinite;
    user-select: none;
  }
  @keyframes floatChar {
    0%, 100% { transform: translateY(0px) rotate(-5deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
  }
  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 900px;
    margin: 0 auto;
  }
  .header {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(212,168,67,0.2);
    background: rgba(26,26,46,0.9);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-img {
    width: 42px; height: 42px; border-radius: 10px;
    object-fit: cover; box-shadow: 0 4px 15px rgba(192,57,43,0.4);
    border: 1.5px solid rgba(212,168,67,0.3);
  }
  .logo-text h1 { font-size: 16px; font-weight: 700; color: var(--paper); }
  .logo-text p { font-size: 11px; color: var(--gold); font-weight: 500; text-transform: uppercase; }
  .header-controls { display: flex; align-items: center; gap: 10px; }
  .level-bar {
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(26,26,46,0.6);
    border-bottom: 1px solid rgba(212,168,67,0.1);
    flex-shrink: 0;
    overflow-x: auto;
  }
  .level-bar::-webkit-scrollbar { display: none; }
  .level-label { font-size: 11px; color: var(--mist); font-weight: 600; text-transform: uppercase; white-space: nowrap; }
  .level-btn {
    padding: 6px 14px;
    border: 1.5px solid rgba(212,168,67,0.3);
    background: transparent;
    color: var(--mist);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .level-btn:hover { border-color: var(--gold); color: var(--gold); }
  .level-btn.active { background: var(--vermillion); border-color: var(--vermillion); color: white; }
  .mode-bar {
    padding: 10px 24px;
    display: flex;
    gap: 8px;
    background: rgba(26,26,46,0.4);
    border-bottom: 1px solid rgba(212,168,67,0.08);
    flex-shrink: 0;
    overflow-x: auto;
  }
  .mode-btn {
    padding: 7px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: var(--mist);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .mode-btn:hover { background: rgba(255,255,255,0.1); color: var(--paper); }
  .mode-btn.active { background: rgba(212,168,67,0.15); border-color: rgba(212,168,67,0.4); color: var(--gold); }
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .welcome-card {
    background: linear-gradient(135deg, rgba(45,45,78,0.8), rgba(26,26,46,0.9));
    border: 1px solid rgba(212,168,67,0.2);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
  }
  .welcome-char { font-family: 'Ma Shan Zheng', serif; font-size: 72px; color: var(--gold); }
  .welcome-card h2 { color: var(--paper); font-size: 20px; margin-bottom: 8px; }
  .welcome-card p { color: var(--mist); font-size: 14px; margin-bottom: 20px; }
  .quick-start { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .quick-btn {
    padding: 8px 16px;
    background: rgba(212,168,67,0.1);
    border: 1px solid rgba(212,168,67,0.3);
    border-radius: 20px;
    color: var(--gold);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .quick-btn:hover { background: rgba(212,168,67,0.2); transform: translateY(-1px); }
  .message { display: flex; gap: 12px; max-width: 100%; }
  .message.user { flex-direction: row-reverse; }
  .avatar {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
    font-family: 'Ma Shan Zheng', serif;
    overflow: hidden;
  }
  .avatar.bot { background: linear-gradient(135deg, var(--vermillion), var(--gold)); color: white; }
  .avatar.bot img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.user { background: rgba(255,255,255,0.1); color: var(--paper); font-weight: 700; }
  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.7;
  }
  .message.bot .bubble { background: rgba(45,45,78,0.9); border: 1px solid rgba(212,168,67,0.15); color: var(--paper); border-radius: 4px 14px 14px 14px; }
  .message.user .bubble { background: var(--vermillion); color: white; border-radius: 14px 4px 14px 14px; }
  .bubble .zh { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--gold); display: block; margin: 6px 0 2px; }
  .bubble .pinyin { font-style: italic; color: var(--jade); font-size: 13px; display: block; margin-bottom: 4px; }
  .bubble .meaning { color: var(--paper); font-size: 13px; }
  .bubble strong { color: var(--gold); }
  .typing { display: flex; gap: 12px; align-items: center; }
  .typing-dots { display: flex; gap: 5px; padding: 14px 18px; background: rgba(45,45,78,0.9); border: 1px solid rgba(212,168,67,0.15); border-radius: 4px 14px 14px 14px; }
  .dot { width: 7px; height: 7px; background: var(--gold); border-radius: 50%; animation: bounce 1.2s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-6px); opacity: 1; } }
  .input-area {
    padding: 16px 24px;
    border-top: 1px solid rgba(212,168,67,0.1);
    background: rgba(26,26,46,0.95);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .input-box {
    flex: 1;
    background: rgba(45,45,78,0.8);
    border: 1.5px solid rgba(212,168,67,0.2);
    border-radius: 14px;
    padding: 12px 16px;
    color: var(--paper);
    font-family: 'Quicksand', sans-serif;
    font-size: 14px;
    font-weight: 500;
    resize: none;
    outline: none;
    max-height: 120px;
    min-height: 48px;
  }
  .input-box::placeholder { color: var(--mist); }
  .send-btn {
    width: 48px; height: 48px;
    background: var(--vermillion);
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .send-btn:hover { background: var(--vermillion-light); }
  .send-btn:disabled { background: rgba(192,57,43,0.3); cursor: not-allowed; }
  .input-hint { margin-top: 8px; font-size: 11px; color: var(--mist); display: flex; justify-content: space-between; align-items: center; }
  .toggle-pinyin { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
  .toggle-pinyin input { display: none; }
  .toggle-track { width: 30px; height: 16px; background: rgba(255,255,255,0.1); border-radius: 8px; position: relative; }
  .toggle-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: var(--mist); border-radius: 50%; transition: all 0.2s; }
  .toggle-pinyin input:checked + .toggle-track { background: rgba(39,174,96,0.4); }
  .toggle-pinyin input:checked + .toggle-track::after { left: 16px; background: var(--jade); }
  .reset-btn { padding: 7px 14px; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--mist); font-size: 12px; font-weight: 600; cursor: pointer; }
  .reset-btn:hover { border-color: var(--vermillion); color: var(--vermillion); }
  .level-info { padding: 6px 12px; background: rgba(212,168,67,0.1); border: 1px solid rgba(212,168,67,0.2); border-radius: 20px; font-size: 11px; color: var(--gold); font-weight: 600; }
  @media (max-width: 600px) {
    .header, .level-bar, .mode-bar, .chat-area, .input-area { padding-left: 16px; padding-right: 16px; }
    .bubble { max-width: 88%; font-size: 13px; }
    .welcome-char { font-size: 56px; }
  }
</style>
</head>
<body>

<div class="bg-chars" id="bgChars"></div>

<div class="app">
  <div class="header">
    <div class="logo">
      <img class="logo-img" src="https://i.ibb.co/wFwDR7cY/hinhremovenen.png" alt="Sophia Nguyễn" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
      <div class="logo-icon" id="logoFallback" style="display:none;">學</div>
      <div class="logo-text">
        <h1>Gia Sư Tiếng Trung</h1>
        <p>Sophia Nguyễn · HSK 1–6</p>
      </div>
    </div>
    <div class="header-controls">
      <span class="level-info" id="levelInfo">HSK 1 · 150 từ</span>
      <button class="reset-btn" onclick="resetChat()">↺ Bắt đầu lại</button>
    </div>
  </div>

  <div class="level-bar">
    <span class="level-label">Cấp độ:</span>
    <button class="level-btn active" onclick="setLevel(1, this)">HSK 1</button>
    <button class="level-btn" onclick="setLevel(2, this)">HSK 2</button>
    <button class="level-btn" onclick="setLevel(3, this)">HSK 3</button>
    <button class="level-btn" onclick="setLevel(4, this)">HSK 4</button>
    <button class="level-btn" onclick="setLevel(5, this)">HSK 5</button>
    <button class="level-btn" onclick="setLevel(6, this)">HSK 6</button>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('vocab', this)">📖 Học từ vựng</button>
    <button class="mode-btn" onclick="setMode('convo', this)">🗣️ Luyện hội thoại</button>
    <button class="mode-btn" onclick="setMode('pronunciation', this)">🎵 Luyện phát âm</button>
    <button class="mode-btn" onclick="setMode('grammar', this)">📝 Ôn ngữ pháp</button>
    <button class="mode-btn" onclick="setMode('quiz', this)">✅ Kiểm tra</button>
    <button class="mode-btn" onclick="setMode('free', this)">💬 Hỏi tự do</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome-card" id="welcomeCard">
      <div class="welcome-char">你好</div>
      <h2>Chào mừng bạn đến với lớp học tiếng Trung!</h2>
      <p>Bạn đang ở cấp độ <strong>HSK 1</strong> — hoàn toàn phù hợp cho người mới bắt đầu. Cô Sophia sẽ dạy bạn từng bước một, bằng tiếng Việt.</p>
      <div class="quick-start">
        <button class="quick-btn" onclick="sendQuick('Dạy tôi chào hỏi cơ bản bằng tiếng Trung')">👋 Học chào hỏi</button>
        <button class="quick-btn" onclick="sendQuick('Dạy tôi đếm số từ 1 đến 10')">🔢 Học đếm số</button>
        <button class="quick-btn" onclick="sendQuick('Tôi nên bắt đầu từ đâu khi học tiếng Trung?')">🗺️ Lộ trình học</button>
        <button class="quick-btn" onclick="sendQuick('Giải thích hệ thống thanh điệu tiếng Trung cho người mới')">🎵 Thanh điệu</button>
        <button class="quick-btn" onclick="sendQuick('Cho tôi một bài quiz HSK 1 đơn giản')">✅ Quiz thử</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea class="input-box" id="userInput" placeholder="Nhập câu hỏi của bạn... (ví dụ: 'dạy tôi từ vựng về thời tiết')" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div class="input-hint">
      <label class="toggle-pinyin">
        <input type="checkbox" id="pinyinToggle" checked>
        <span class="toggle-track"></span>
        Hiển thị Pinyin
      </label>
      <span>Enter để gửi · Shift+Enter xuống dòng</span>
    </div>
  </div>
</div>

<script>
// ==================== THAY API KEY CỦA CHỊ VÀO ĐÂY ====================
// Đăng ký tại https://console.groq.com - hoàn toàn miễn phí
const GROQ_API_KEY = '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';
// ====================================================================

let currentLevel = 1;
let currentMode = 'vocab';
let conversationHistory = [];
let showPinyin = true;
let isTyping = false;

const levelInfo = {
  1: { name: 'HSK 1', words: '150 từ', desc: 'Vỡ lòng' },
  2: { name: 'HSK 2', words: '300 từ', desc: 'Sơ cấp' },
  3: { name: 'HSK 3', words: '600 từ', desc: 'Trung cấp sơ' },
  4: { name: 'HSK 4', words: '1200 từ', desc: 'Trung cấp' },
  5: { name: 'HSK 5', words: '2500 từ', desc: 'Cao cấp sơ' },
  6: { name: 'HSK 6', words: '5000+ từ', desc: 'Cao cấp' },
};

function getSystemPrompt() {
  const lvl = levelInfo[currentLevel];
  const pinyin = showPinyin ? 'Luôn kèm theo phiên âm pinyin đầy đủ.' : 'Không cần hiển thị pinyin.';
  const basePrompt = `Bạn là gia sư tiếng Trung Mandarin chuyên nghiệp tên là "Cô Sophia", dạy người Việt Nam học tiếng Trung theo bộ giáo trình HSK chuẩn quốc tế. Học viên đang học ${lvl.name} (${lvl.desc} - ${lvl.words}).

NGUYÊN TẮC GIẢNG DẠY:
- Luôn dùng tiếng Việt để giải thích, dẫn dắt
- Trình bày chữ Hán rõ ràng, đẹp mắt
- ${pinyin}
- Chia nhỏ kiến thức, từng bước từng bước
- Khen ngợi và khuyến khích học viên
- Khi đưa ra từ vựng: format [Chữ Hán] - [Pinyin] - [Nghĩa tiếng Việt]
- Luôn cho ví dụ câu đơn giản kèm nghĩa

CẤP ĐỘ ${lvl.name}: ${lvl.desc}`;

  const modePrompts = {
    vocab: `\nCHẾ ĐỘ: HỌC TỪ VỰNG - Dạy 3-5 từ mới theo chủ đề, giải thích và ví dụ.`,
    convo: `\nCHẾ ĐỘ: LUYỆN HỘI THOẠI - Tạo hội thoại phù hợp ${lvl.name}, đóng vai người bản ngữ.`,
    pronunciation: `\nCHẾ ĐỘ: LUYỆN PHÁT ÂM - Giải thích thanh điệu, âm khó, dùng ký hiệu ā á ǎ à.`,
    grammar: `\nCHẾ ĐỘ: ÔN NGỮ PHÁP - Giải thích cấu trúc, công thức, ví dụ minh hoạ.`,
    quiz: `\nCHẾ ĐỘ: KIỂM TRA - Tạo 5-10 câu hỏi phù hợp ${lvl.name}, chấm điểm.`,
    free: `\nCHẾ ĐỘ: HỎI TỰ DO - Trả lời mọi câu hỏi về tiếng Trung.`,
  };
  return basePrompt + (modePrompts[currentMode] || modePrompts.free);
}

function initBgChars() {
  const chars = ['学','中','文','语','好','你','我','他','她','们','汉','字'];
  const container = document.getElementById('bgChars');
  if (!container) return;
  for (let char of chars) {
    const el = document.createElement('div');
    el.className = 'bg-char';
    el.textContent = char;
    el.style.cssText = `left: ${Math.random() * 100}%; top: ${Math.random() * 100}%; font-size: ${80 + Math.random() * 120}px; animation-delay: ${Math.random() * 10}s; animation-duration: ${15 + Math.random() * 15}s;`;
    container.appendChild(el);
  }
}

function setLevel(lvl, btn) {
  currentLevel = lvl;
  document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('levelInfo').textContent = `${levelInfo[lvl].name} · ${levelInfo[lvl].words}`;
  conversationHistory = [];
  const welcome = document.getElementById('welcomeCard');
  if (welcome) welcome.querySelector('h2').textContent = `Cấp độ ${levelInfo[lvl].name} — ${levelInfo[lvl].desc}!`;
}

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function addMessage(role, content) {
  const chatArea = document.getElementById('chatArea');
  const welcome = document.getElementById('welcomeCard');
  if (welcome && role === 'user') welcome.remove();
  const msg = document.createElement('div');
  msg.className = `message ${role}`;
  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  if (role === 'bot') {
    avatar.innerHTML = `<img src="https://i.ibb.co/wFwDR7cY/hinhremovenen.png" alt="Sophia" onerror="this.parentElement.textContent='師'">`;
  } else {
    avatar.textContent = 'C';
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatMessage(content);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function formatMessage(text) {
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
  const lines = text.split('\n');
  const formattedLines = lines.map(line => {
    if (/[\u4e00-\u9fff]/.test(line) && line.includes(' - ')) {
      const parts = line.split(' - ');
      if (parts.length >= 2) {
        const chinese = parts[0].replace(/^[•\-\d\.\s]+/, '');
        const rest = parts.slice(1).join(' - ');
        const restParts = rest.split(' - ');
        if (restParts.length >= 2 && showPinyin) {
          return `<div class="card"><span class="zh">${chinese}</span><span class="pinyin">${restParts[0]}</span><span class="meaning">${restParts.slice(1).join(' - ')}</span></div>`;
        }
        return `<div class="card"><span class="zh">${chinese}</span><span class="meaning">${rest}</span></div>`;
      }
    }
    line = line.replace(/([\u4e00-\u9fff]+)/g, '<span style="font-family:\'Noto Serif SC\',serif;font-size:1.15em;color:#d4a843">$1</span>');
    return line || '<br>';
  });
  return formattedLines.join('\n').replace(/\n/g, '<br>');
}

function showTyping() {
  const chatArea = document.getElementById('chatArea');
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.id = 'typingIndicator';
  typing.innerHTML = `<div class="avatar bot"><img src="https://i.ibb.co/wFwDR7cY/hinhremovenen.png" alt="Sophia" onerror="this.parentElement.textContent='師'"></div><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatArea.appendChild(typing);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isTyping) return;
  showPinyin = document.getElementById('pinyinToggle').checked;
  input.value = '';
  autoResize(input);
  input.focus();
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
  isTyping = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();
  try {
    const messages = [
      { role: 'system', content: getSystemPrompt() },
      ...conversationHistory.map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }))
    ];
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: messages,
        temperature: 0.7,
        max_tokens: 1500
      })
    });
    const data = await response.json();
    removeTyping();
    if (data.error) {
      console.error('Groq API Error:', data.error);
      if (data.error.message && data.error.message.includes('decommissioned')) {
        addMessage('bot', '⚠️ Model cũ đã bị ngừng, em đã cập nhật model mới. Chị thử lại nhé!');
      } else if (data.error.code === 'invalid_api_key' || data.error.message?.includes('API key')) {
        addMessage('bot', '⚠️ API Key Groq không hợp lệ. Chị cần đăng ký key mới tại https://console.groq.com nhé!');
      } else {
        addMessage('bot', `⚠️ Lỗi: ${data.error.message || 'Không xác định'}. Chị thử lại nhé!`);
      }
    } else if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      conversationHistory.push({ role: 'assistant', content: reply });
      addMessage('bot', reply);
    } else {
      addMessage('bot', '⚠️ Không nhận được phản hồi. Chị thử lại nhé!');
    }
  } catch (err) {
    removeTyping();
    console.error('Network Error:', err);
    addMessage('bot', '⚠️ Lỗi kết nối. Chị kiểm tra lại mạng nhé!');
  }
  isTyping = false;
  document.getElementById('sendBtn').disabled = false;
}

function sendQuick(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function resetChat() {
  conversationHistory = [];
  const chatArea = document.getElementById('chatArea');
  chatArea.innerHTML = '';
  const info = levelInfo[currentLevel];
  const welcome = document.createElement('div');
  welcome.className = 'welcome-card';
  welcome.id = 'welcomeCard';
  welcome.innerHTML = `
    <div class="welcome-char">你好</div>
    <h2>Bắt đầu lại từ đầu!</h2>
    <p>Bạn đang ở cấp độ <strong>${info.name}</strong> — ${info.desc}. Chọn chủ đề muốn học nhé!</p>
    <div class="quick-start">
      <button class="quick-btn" onclick="sendQuick('Dạy tôi chào hỏi cơ bản bằng tiếng Trung')">👋 Học chào hỏi</button>
      <button class="quick-btn" onclick="sendQuick('Dạy tôi đếm số từ 1 đến 10')">🔢 Học đếm số</button>
      <button class="quick-btn" onclick="sendQuick('Tôi nên bắt đầu từ đâu khi học tiếng Trung?')">🗺️ Lộ trình học</button>
      <button class="quick-btn" onclick="sendQuick('Giải thích hệ thống thanh điệu tiếng Trung cho người mới')">🎵 Thanh điệu</button>
      <button class="quick-btn" onclick="sendQuick('Cho tôi một bài quiz HSK 1 đơn giản')">✅ Quiz thử</button>
    </div>
  `;
  chatArea.appendChild(welcome);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

initBgChars();
document.getElementById('pinyinToggle').addEventListener('change', (e) => showPinyin = e.target.checked);
</script>
