<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉语学习 · Gia Sư Tiếng Trung · Full + Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Quicksand:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --vermillion: #c0392b;
    --vermillion-light: #e74c3c;
    --gold: #d4a843;
    --jade: #27ae60;
    --mist: #8e9aaf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Quicksand', sans-serif;
    background: var(--ink);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 10% 20%, rgba(192,57,43,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(212,168,67,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .bg-chars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-char {
    position: absolute;
    font-family: 'Ma Shan Zheng', serif;
    color: rgba(212,168,67,0.04);
    animation: floatChar 20s ease-in-out infinite;
    font-size: 80px;
  }
  @keyframes floatChar { 0%, 100% { transform: translateY(0px) rotate(-5deg); } 50% { transform: translateY(-20px) rotate(5deg); } }
  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 900px;
    margin: 0 auto;
  }
  .header {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(212,168,67,0.2);
    background: rgba(26,26,46,0.9);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-img {
    width: 42px; height: 42px; border-radius: 10px;
    object-fit: cover; box-shadow: 0 4px 15px rgba(192,57,43,0.4);
    border: 1.5px solid rgba(212,168,67,0.3);
  }
  .logo-text h1 { font-size: 16px; font-weight: 700; color: var(--paper); }
  .logo-text p { font-size: 11px; color: var(--gold); font-weight: 500; text-transform: uppercase; }
  .header-controls { display: flex; align-items: center; gap: 10px; }
  
  .level-bar {
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(26,26,46,0.6);
    border-bottom: 1px solid rgba(212,168,67,0.1);
    flex-shrink: 0;
    overflow-x: auto;
  }
  .level-bar::-webkit-scrollbar { display: none; }
  .level-label { font-size: 11px; color: var(--mist); font-weight: 600; text-transform: uppercase; white-space: nowrap; }
  .level-btn {
    padding: 6px 14px;
    border: 1.5px solid rgba(212,168,67,0.3);
    background: transparent;
    color: var(--mist);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .level-btn:hover { border-color: var(--gold); color: var(--gold); }
  .level-btn.active { background: var(--vermillion); border-color: var(--vermillion); color: white; }
  
  .mode-bar {
    padding: 10px 24px;
    display: flex;
    gap: 8px;
    background: rgba(26,26,46,0.4);
    border-bottom: 1px solid rgba(212,168,67,0.08);
    flex-shrink: 0;
    overflow-x: auto;
  }
  .mode-btn {
    padding: 7px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: var(--mist);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .mode-btn:hover { background: rgba(255,255,255,0.1); color: var(--paper); }
  .mode-btn.active { background: rgba(212,168,67,0.15); border-color: rgba(212,168,67,0.4); color: var(--gold); }
  
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .welcome-card {
    background: linear-gradient(135deg, rgba(45,45,78,0.8), rgba(26,26,46,0.9));
    border: 1px solid rgba(212,168,67,0.2);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
  }
  .welcome-char { font-family: 'Ma Shan Zheng', serif; font-size: 72px; color: var(--gold); }
  .welcome-card h2 { color: var(--paper); font-size: 20px; margin-bottom: 8px; }
  .welcome-card p { color: var(--mist); font-size: 14px; margin-bottom: 20px; }
  .quick-start { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .quick-btn {
    padding: 8px 16px;
    background: rgba(212,168,67,0.1);
    border: 1px solid rgba(212,168,67,0.3);
    border-radius: 20px;
    color: var(--gold);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  
  .message { display: flex; gap: 12px; max-width: 100%; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { flex-direction: row-reverse; }
  .avatar {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
    overflow: hidden;
  }
  .avatar.bot { background: linear-gradient(135deg, var(--vermillion), var(--gold)); color: white; }
  .avatar.bot img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.user { background: rgba(255,255,255,0.1); color: var(--paper); font-weight: 700; }
  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.7;
  }
  .message.bot .bubble { background: rgba(45,45,78,0.9); border: 1px solid rgba(212,168,67,0.15); color: var(--paper); border-radius: 4px 14px 14px 14px; }
  .message.user .bubble { background: var(--vermillion); color: white; border-radius: 14px 4px 14px 14px; }
  .vocab-card {
    margin: 8px 0;
    padding: 10px 14px;
    background: rgba(212,168,67,0.08);
    border-radius: 12px;
    border-left: 3px solid var(--gold);
  }
  .vocab-chinese { font-size: 18px; font-weight: 600; color: var(--gold); font-family: 'Noto Serif SC', serif; display: block; }
  .vocab-meaning { font-size: 13px; color: #a0aec0; display: block; margin-top: 4px; }
  
  .typing { display: flex; gap: 12px; align-items: center; }
  .typing-dots { display: flex; gap: 5px; padding: 14px 18px; background: rgba(45,45,78,0.9); border-radius: 4px 14px 14px 14px; }
  .dot { width: 7px; height: 7px; background: var(--gold); border-radius: 50%; animation: bounce 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-6px); opacity: 1; } }
  
  .input-area {
    padding: 16px 24px;
    border-top: 1px solid rgba(212,168,67,0.1);
    background: rgba(26,26,46,0.95);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .input-box {
    flex: 1;
    background: rgba(45,45,78,0.8);
    border: 1.5px solid rgba(212,168,67,0.2);
    border-radius: 14px;
    padding: 12px 16px;
    color: var(--paper);
    font-size: 14px;
    resize: none;
    outline: none;
    max-height: 120px;
    min-height: 48px;
  }
  .input-box:focus { border-color: rgba(212,168,67,0.5); }
  .voice-btn, .send-btn {
    width: 48px; height: 48px;
    background: var(--vermillion);
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.2s;
  }
  .voice-btn:hover, .send-btn:hover { background: var(--vermillion-light); transform: translateY(-1px); }
  .voice-btn.listening { background: #27ae60; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
  
  .input-hint { margin-top: 8px; font-size: 11px; color: var(--mist); display: flex; justify-content: space-between; }
  .toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggle input { display: none; }
  .toggle-track { width: 30px; height: 16px; background: rgba(255,255,255,0.1); border-radius: 8px; position: relative; }
  .toggle-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: var(--mist); border-radius: 50%; transition: 0.2s; }
  .toggle input:checked + .toggle-track { background: rgba(39,174,96,0.4); }
  .toggle input:checked + .toggle-track::after { left: 16px; background: var(--jade); }
  .reset-btn { padding: 7px 14px; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--mist); font-size: 12px; cursor: pointer; }
  .reset-btn:hover { border-color: var(--vermillion); color: var(--vermillion); }
  .level-info { padding: 6px 12px; background: rgba(212,168,67,0.1); border: 1px solid rgba(212,168,67,0.2); border-radius: 20px; font-size: 11px; color: var(--gold); font-weight: 600; }
  @media (max-width: 600px) { .bubble { max-width: 88%; } }
</style>
</head>
<body>

<div class="bg-chars" id="bgChars"></div>

<div class="app">
  <div class="header">
    <div class="logo">
      <img class="logo-img" src="https://i.ibb.co/wFwDR7cY/hinhremovenen.png" alt="Sophia">
      <div class="logo-text">
        <h1>Gia Sư Tiếng Trung</h1>
        <p>Sophia Nguyễn · HSK 1–6 · Voice</p>
      </div>
    </div>
    <div class="header-controls">
      <span class="level-info" id="levelInfo">HSK 1 · 150 từ</span>
      <button class="reset-btn" onclick="resetChat()">↺ Bắt đầu lại</button>
    </div>
  </div>

  <div class="level-bar">
    <span class="level-label">Cấp độ:</span>
    <button class="level-btn active" onclick="setLevel(1, this)">HSK 1</button>
    <button class="level-btn" onclick="setLevel(2, this)">HSK 2</button>
    <button class="level-btn" onclick="setLevel(3, this)">HSK 3</button>
    <button class="level-btn" onclick="setLevel(4, this)">HSK 4</button>
    <button class="level-btn" onclick="setLevel(5, this)">HSK 5</button>
    <button class="level-btn" onclick="setLevel(6, this)">HSK 6</button>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('vocab', this)">📖 Học từ vựng</button>
    <button class="mode-btn" onclick="setMode('convo', this)">🗣️ Luyện hội thoại</button>
    <button class="mode-btn" onclick="setMode('pronunciation', this)">🎵 Luyện phát âm (Voice)</button>
    <button class="mode-btn" onclick="setMode('grammar', this)">📝 Ôn ngữ pháp</button>
    <button class="mode-btn" onclick="setMode('quiz', this)">✅ Kiểm tra</button>
    <button class="mode-btn" onclick="setMode('free', this)">💬 Hỏi tự do</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome-card" id="welcomeCard">
      <div class="welcome-char">你好🎤</div>
      <h2>Chào mừng đến với lớp học tiếng Trung!</h2>
      <p>Bạn đang ở <strong>HSK 1</strong>. Bật chế độ Luyện phát âm, nhấn nút mic 🎤 và đọc to để được sửa lỗi phát âm nhé!</p>
      <div class="quick-start">
        <button class="quick-btn" onclick="sendQuick('Dạy tôi chào hỏi cơ bản')">👋 Chào hỏi</button>
        <button class="quick-btn" onclick="sendQuick('Dạy tôi đếm số 1-10')">🔢 Số đếm</button>
        <button class="quick-btn" onclick="sendQuick('Dạy tôi từ vựng về gia đình')">👪 Gia đình</button>
        <button class="quick-btn" onclick="sendQuick('Cho tôi quiz HSK 1')">✅ Quiz</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea class="input-box" id="userInput" placeholder="Nhập câu hỏi... hoặc nhấn 🎤 để nói" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="voice-btn" id="voiceBtn" onclick="startVoiceInput()" title="Nhấn để nói">🎤</button>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
    <div class="input-hint">
      <label class="toggle">
        <input type="checkbox" id="pinyinToggle" checked>
        <span class="toggle-track"></span>
        Hiển thị Pinyin
      </label>
      <span>🎤 Bấm mic → nói → tự gửi</span>
    </div>
  </div>
</div>

<script>
const GROQ_API_KEY = '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';

let currentLevel = 1;
let currentMode = 'vocab';
let conversationHistory = [];
let showPinyin = true;
let isTyping = false;

const levelInfo = {
  1: { name: 'HSK 1', words: '150 từ', desc: 'Vỡ lòng' },
  2: { name: 'HSK 2', words: '300 từ', desc: 'Sơ cấp' },
  3: { name: 'HSK 3', words: '600 từ', desc: 'Trung cấp sơ' },
  4: { name: 'HSK 4', words: '1200 từ', desc: 'Trung cấp' },
  5: { name: 'HSK 5', words: '2500 từ', desc: 'Cao cấp sơ' },
  6: { name: 'HSK 6', words: '5000+ từ', desc: 'Cao cấp' },
};

function getSystemPrompt() {
  const lvl = levelInfo[currentLevel];
  const pinyin = showPinyin ? 'Luôn kèm pinyin đầy đủ. Format: [chữ Hán] - [pinyin] - [nghĩa]' : 'Không cần pinyin.';
  const voiceInstruction = currentMode === 'pronunciation' ? 
    `\nQUAN TRỌNG: Đây là chế độ LUYỆN PHÁT ÂM. Sau khi người dùng nói (bạn sẽ thấy văn bản được chuyển từ giọng nói), hãy phân tích chi tiết: 1) Âm nào đúng/sai, 2) Cách phát âm đúng (vị trí lưỡi, miệng), 3) So sánh với âm trong tiếng Việt nếu có thể. Hãy khuyến khích và hướng dẫn cụ thể.` : '';
  
  return `Bạn là gia sư tiếng Trung "Cô Sophia", dạy người Việt. Trình độ: ${lvl.name} (${lvl.desc} - ${lvl.words}).

NGUYÊN TẮC:
- Dùng tiếng Việt để giải thích
- ${pinyin}
- Chia nhỏ kiến thức, khen ngợi học viên

CHẾ ĐỘ: ${currentMode}${voiceInstruction}`;
}

function initBgChars() {
  const chars = ['学','中','文','语','好','你','我','他','她','们'];
  const container = document.getElementById('bgChars');
  if (!container) return;
  chars.forEach((char) => {
    const el = document.createElement('div');
    el.className = 'bg-char';
    el.textContent = char;
    el.style.cssText = `left: ${Math.random() * 100}%; top: ${Math.random() * 100}%; font-size: ${60 + Math.random() * 100}px; animation-delay: ${Math.random() * 10}s; opacity: 0.15;`;
    container.appendChild(el);
  });
}

function setLevel(lvl, btn) {
  currentLevel = lvl;
  document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('levelInfo').textContent = `${levelInfo[lvl].name} · ${levelInfo[lvl].words}`;
  conversationHistory = [];
  const welcome = document.getElementById('welcomeCard');
  if (welcome) {
    const h2 = welcome.querySelector('h2');
    if (h2) h2.textContent = `Cấp độ ${levelInfo[lvl].name} — ${levelInfo[lvl].desc}!`;
  }
}

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (mode === 'pronunciation') {
    addMessage('bot', '🎤 Chế độ luyện phát âm đã bật! Nhấn nút mic 🎤, đọc to một từ hoặc câu tiếng Trung, tôi sẽ nhận xét và hướng dẫn bạn phát âm chuẩn hơn!');
  } else if (mode === 'vocab') {
    addMessage('bot', '📖 Chế độ học từ vựng. Hãy cho tôi biết chủ đề bạn muốn học (ví dụ: "thời tiết", "gia đình", "công việc")!');
  } else if (mode === 'convo') {
    addMessage('bot', '🗣️ Chế độ luyện hội thoại. Tôi sẽ tạo đoạn hội thoại mẫu để bạn thực hành!');
  } else if (mode === 'grammar') {
    addMessage('bot', '📝 Chế độ ôn ngữ pháp. Hỏi tôi về bất kỳ cấu trúc ngữ pháp nào (ví dụ: "câu 是...的", "động từ năng nguyện")!');
  } else if (mode === 'quiz') {
    addMessage('bot', '✅ Chế độ kiểm tra. Tôi sẽ tạo câu hỏi trắc nghiệm để kiểm tra kiến thức của bạn!');
  } else if (mode === 'free') {
    addMessage('bot', '💬 Chế độ hỏi tự do. Hỏi tôi bất cứ điều gì về tiếng Trung!');
  }
}

function addMessage(role, content) {
  const chatArea = document.getElementById('chatArea');
  const welcome = document.getElementById('welcomeCard');
  if (welcome && role === 'user') welcome.remove();
  const msg = document.createElement('div');
  msg.className = `message ${role}`;
  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  if (role === 'bot') {
    avatar.innerHTML = `<img src="https://i.ibb.co/wFwDR7cY/hinhremovenen.png" alt="Sophia">`;
  } else {
    avatar.textContent = 'C';
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatMessage(content);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function formatMessage(text) {
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  const lines = text.split('\n');
  const formattedLines = lines.map(line => {
    const parts = line.split(' - ');
    if (parts.length >= 2 && /[\u4e00-\u9fff]/.test(parts[0])) {
      const chinese = parts[0].trim();
      const rest = parts.slice(1).join(' - ');
      if (showPinyin && parts.length >= 3) {
        return `<div class="vocab-card"><span class="vocab-chinese">📖 ${chinese}</span><span class="vocab-meaning">${rest}</span></div>`;
      }
      return `<div class="vocab-card"><span class="vocab-chinese">📖 ${chinese}</span><span class="vocab-meaning">→ ${rest}</span></div>`;
    }
    return escapeHtml(line) || '<br>';
  });
  return formattedLines.join('<br>');
}

function escapeHtml(text) { 
  const div = document.createElement('div'); 
  div.textContent = text; 
  return div.innerHTML; 
}

function showTyping() {
  const chatArea = document.getElementById('chatArea');
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.id = 'typingIndicator';
  typing.innerHTML = `<div class="avatar bot"><img src="https://i.ibb.co/wFwDR7cY/hinhremovenen.png" alt="Sophia"></div><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatArea.appendChild(typing);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() { 
  const t = document.getElementById('typingIndicator'); 
  if (t) t.remove(); 
}

async function sendMessage(text = null) {
  const input = document.getElementById('userInput');
  const messageText = text !== null ? text : input.value.trim();
  if (!messageText || isTyping) return;
  showPinyin = document.getElementById('pinyinToggle').checked;
  if (text === null) input.value = '';
  autoResize(input);
  addMessage('user', messageText);
  conversationHistory.push({ role: 'user', content: messageText });
  isTyping = true;
  const sendBtn = document.getElementById('sendBtn');
  if (sendBtn) sendBtn.disabled = true;
  showTyping();
  try {
    const messages = [
      { role: 'system', content: getSystemPrompt() },
      ...conversationHistory.map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }))
    ];
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
      body: JSON.stringify({ model: 'llama-3.3-70b-versatile', messages, temperature: 0.7, max_tokens: 1500 })
    });
    const data = await response.json();
    removeTyping();
    if (data.error) throw new Error(data.error.message);
    if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      conversationHistory.push({ role: 'assistant', content: reply });
      addMessage('bot', reply);
    } else throw new Error('No response');
  } catch (err) {
    removeTyping();
    console.error(err);
    addMessage('bot', `⚠️ Lỗi: ${err.message}. Vui lòng thử lại!`);
  }
  isTyping = false;
  if (sendBtn) sendBtn.disabled = false;
}

function startVoiceInput() {
  const voiceBtn = document.getElementById('voiceBtn');
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addMessage('bot', '⚠️ Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Vui lòng dùng Chrome, Edge hoặc Safari.');
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  voiceBtn.classList.add('listening');
  voiceBtn.textContent = '⏺';
  recognition.start();
  recognition.onresult = (event) => {
    const spokenText = event.results[0][0].transcript;
    voiceBtn.classList.remove('listening');
    voiceBtn.textContent = '🎤';
    document.getElementById('userInput').value = spokenText;
    sendMessage(spokenText);
  };
  recognition.onerror = (event) => {
    voiceBtn.classList.remove('listening');
    voiceBtn.textContent = '🎤';
    addMessage('bot', `⚠️ Lỗi voice: ${event.error}. Thử lại nhé.`);
  };
  recognition.onend = () => {
    voiceBtn.classList.remove('listening');
    voiceBtn.textContent = '🎤';
  };
}

function sendQuick(text) { sendMessage(text); }

function resetChat() {
  conversationHistory = [];
  const chatArea = document.getElementById('chatArea');
  if (chatArea) chatArea.innerHTML = '';
  const welcome = document.createElement('div');
  welcome.className = 'welcome-card';
  welcome.id = 'welcomeCard';
  welcome.innerHTML = `<div class="welcome-char">你好🎤</div><h2>Bắt đầu lại!</h2><p>Bạn đang ở <strong>HSK 1</strong>. Chọn chế độ Luyện phát âm và nhấn mic 🎤 để luyện nói nhé!</p><div class="quick-start"><button class="quick-btn" onclick="sendQuick('Dạy tôi chào hỏi cơ bản')">👋 Chào hỏi</button><button class="quick-btn" onclick="sendQuick('Dạy tôi đếm số 1-10')">🔢 Số đếm</button><button class="quick-btn" onclick="sendQuick('Dạy tôi từ vựng về gia đình')">👪 Gia đình</button></div>`;
  if (chatArea) chatArea.appendChild(welcome);
}

function handleKey(e) { 
  if (e.key === 'Enter' && !e.shiftKey) { 
    e.preventDefault(); 
    sendMessage(); 
  } 
}

function autoResize(el) { 
  if (!el) return; 
  el.style.height = 'auto'; 
  el.style.height = Math.min(el.scrollHeight, 120) + 'px'; 
}

initBgChars();
document.getElementById('pinyinToggle').addEventListener('change', (e) => showPinyin = e.target.checked);
</script>
