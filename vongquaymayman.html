<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Vòng Quay May Mắn</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a4a5a, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      color: #ffffff;
      margin-top: 20px;
      text-shadow: 2px 2px #0a4a5a;
    }
    #wheelCanvas {
      margin-top: 20px;
      position: relative;
      border: 6px solid #0a4a5a;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(10, 74, 90, 0.5);
    }
    #arrow {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-10px); }
    }
    textarea {
      width: 80%;
      max-width: 500px;
      height: 80px;
      font-size: 16px;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #0a4a5a;
      margin-top: 20px;
    }
    .btn {
      margin: 10px 5px;
      padding: 12px 25px;
      font-size: 18px;
      background-color: #0a4a5a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #066076;
    }
    #result {
      font-size: 26px;
      font-weight: bold;
      color: #0a4a5a;
      background-color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      text-align: center;
      margin-top: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      animation: zoomIn 1s ease, pulseBlue 3s infinite;
    }
    @keyframes zoomIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pulseBlue {
      0% { background-color: #ffffff; }
      50% { background-color: #e6f0ff; }
      100% { background-color: #ffffff; }
    }
    #history {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
      max-width: 500px;
      text-align: left;
    }
    ul {
      padding-left: 20px;
    }
  </style>
</head>
<body>
  <h1>🎡 Vòng Quay May Mắn</h1>
  <div style="position: relative;">
    <canvas id="wheelCanvas" width="400" height="400"></canvas>
    <img id="arrow" src="https://cdn-icons-png.flaticon.com/512/32/32195.png" alt="Arrow">
  </div>

  <textarea id="nameList" placeholder="Nhập tên cách nhau bằng dấu phẩy..."></textarea><br>

  <button class="btn" id="startSpin">🎉 Quay!</button>
  <button class="btn" onclick="clearHistory()">🗑️ Xóa lịch sử</button>

  <div id="result"></div>
  <div id="history"><strong>Lịch sử quay:</strong><ul id="historyList"></ul></div>

  <!-- KHÔNG để muted nữa -->
  <audio id="spinSound" preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7b6e3f3b9f.mp3?filename=game-spin-coin-193276.mp3" type="audio/mpeg">
  </audio>

  <audio id="clapSound" preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3c9c4f6b9e.mp3?filename=applause-193276.mp3" type="audio/mpeg">
  </audio>

<script>
  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");

  let names = ["Lan", "Hùng", "Mai", "Tuấn"];
  let angle = 0;
  let spinning = false;
  let spinInterval;
  let history = [];

  const spinSound = document.getElementById("spinSound");
  const clapSound = document.getElementById("clapSound");

  /* KHỞI ĐỘNG ÂM THANH — CHUẨN */
  document.body.addEventListener("click", () => {
    spinSound.play().catch(()=>{});
    spinSound.pause();
    spinSound.currentTime = 0;

    clapSound.play().catch(()=>{});
    clapSound.pause();
    clapSound.currentTime = 0;
  }, { once: true });

  document.getElementById("startSpin").addEventListener("click", () => {
    if (names.length === 0) {
      document.getElementById("result").innerHTML = "🎊 Đã quay hết tất cả người!";
      return;
    }
    startSpin();
  });

  function drawWheel() {
    const radius = canvas.width / 2;
    const centerX = radius;
    const centerY = radius;
    const sliceAngle = 2 * Math.PI / names.length;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < names.length; i++) {
      const startAngle = angle + i * sliceAngle;
      const endAngle = startAngle + sliceAngle;

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.fillStyle = i % 2 === 0 ? "#0a4a5a" : "#66b2c2";
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(startAngle + sliceAngle / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff";
      ctx.font = "16px sans-serif";
      ctx.fillText(names[i], radius - 10, 5);
      ctx.restore();
    }
  }
// KHÔNG cập nhật lại danh sách ở đây nữa!
// Danh sách chỉ cập nhật một lần khi user nhập xong.

      document.getElementById("result").innerHTML = "";

    spinSound.pause();
    spinSound.currentTime = 0;
    spinSound.volume = 0.8;
    spinSound.play().catch(()=>{});

    let speed = 0.35;
    let deceleration = 0.002;

    spinInterval = setInterval(() => {
      angle += speed;
      drawWheel();
      speed -= deceleration;

      if (speed <= 0) {
        clearInterval(spinInterval);
        showResult();
      }
    }, 20);
  }

  /* FIX CHUẨN – KHÔNG LỆCH – KHÔNG LẶP */
  function showResult() {
    const sliceAngle = 2 * Math.PI / names.length;

    // Mũi tên nằm DƯỚI → + 90°
    let adjustedAngle = (angle + Math.PI / 2) % (2 * Math.PI);

    let index = Math.floor(adjustedAngle / sliceAngle);
    index = names.length - 1 - index;

    const chosenName = names[index];

    document.getElementById("result").innerHTML =
      `🎉 Người được chọn là: ${chosenName}`;

    clapSound.pause();
    clapSound.currentTime = 0;
    clapSound.volume = 1;
    clapSound.play().catch(()=>{});

    history.push(chosenName);
    updateHistory();

    names.splice(index, 1);
    drawWheel();
  }

  function updateHistory() {
    const historyList = document.getElementById("historyList");
    historyList.innerHTML = "";
    history.forEach((name, i) => {
      const li = document.createElement("li");
      li.textContent = `${i + 1}. ${name}`;
      historyList.appendChild(li);
    });
  }

  function clearHistory() {
    history = [];
    updateHistory();
    document.getElementById("result").innerHTML = "";

    const inputNames = document.getElementById("nameList").value
      .split(",")
      .map(n => n.trim())
      .filter(n => n !== "");

    names = inputNames.length > 1 ? inputNames : ["Lan", "Hùng", "Mai", "Tuấn"];
    drawWheel();
  }

  drawWheel();
</script>
</body>
</html>
