<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Vòng Quay May Mắn</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fceabb, #f8b500);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      color: #e67e22;
      margin-top: 20px;
    }

    #wheelCanvas {
      margin-top: 20px;
    }

    textarea {
      width: 80%;
      max-width: 500px;
      height: 80px;
      font-size: 16px;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #f39c12;
      margin-top: 20px;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 18px;
      background-color: #e67e22;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #d35400;
    }

    #result {
      margin-top: 30px;
      font-size: 32px;
      color: #c0392b;
      font-weight: bold;
      animation: zoomIn 1s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>🎡 Vòng Quay May Mắn</h1>
  <canvas id="wheelCanvas" width="400" height="400"></canvas>
  <textarea id="nameList" placeholder="Nhập tên cách nhau bằng dấu phẩy..."></textarea><br>
  <button onclick="startSpin()">Quay!</button>
  <div id="result"></div>

  <!-- Nhạc nền -->
  <audio id="spinSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7b6e3f3b9f.mp3?filename=game-spin-coin-193276.mp3"></audio>

  <script>
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    let names = ["Lan", "Hùng", "Mai", "Tuấn"];
    let angle = 0;
    let spinning = false;
    let spinInterval;

    function drawWheel() {
      const radius = canvas.width / 2;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const sliceAngle = 2 * Math.PI / names.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < names.length; i++) {
        const startAngle = angle + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.fillStyle = i % 2 === 0 ? "#f39c12" : "#e67e22";
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "16px sans-serif";
        ctx.fillText(names[i], radius - 10, 5);
        ctx.restore();
      }

      // Vẽ mũi tên
      ctx.fillStyle = "#c0392b";
      ctx.beginPath();
      ctx.moveTo(centerX, centerY - radius);
      ctx.lineTo(centerX - 10, centerY - radius + 20);
      ctx.lineTo(centerX + 10, centerY - radius + 20);
      ctx.closePath();
      ctx.fill();
    }

    function startSpin() {
      const input = document.getElementById("nameList").value;
      const inputNames = input.split(",").map(n => n.trim()).filter(n => n !== "");
      if (inputNames.length > 1) names = inputNames;

      document.getElementById("result").innerHTML = "";
      document.getElementById("spinSound").play();

      let speed = 0.3;
      let deceleration = 0.002;
      spinning = true;

      spinInterval = setInterval(() => {
        angle += speed;
        drawWheel();
        speed -= deceleration;
        if (speed <= 0) {
          clearInterval(spinInterval);
          spinning = false;
          showResult();
        }
      }, 20);
    }

    function showResult() {
      const sliceAngle = 2 * Math.PI / names.length;
      const index = Math.floor(((2 * Math.PI - angle % (2 * Math.PI)) % (2 * Math.PI)) / sliceAngle);
      const chosenName = names[index];
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `🎉 Người được chọn là: ${chosenName}`;
      resultDiv.style.animation = "zoomIn 1s ease";
    }

    drawWheel();
  </script>
</body>
</html>
