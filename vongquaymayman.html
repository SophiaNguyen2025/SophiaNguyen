<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Vòng Quay May Mắn</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ffe6ec, #ff3366);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      color: #ff3366;
      margin-top: 20px;
    }

    #wheelCanvas {
      margin-top: 20px;
      position: relative;
    }

    textarea {
      width: 80%;
      max-width: 500px;
      height: 80px;
      font-size: 16px;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #ff3366;
      margin-top: 20px;
    }

    .btn {
      margin: 10px 5px;
      padding: 12px 25px;
      font-size: 18px;
      background-color: #ff3366;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #e62e5c;
    }

    #result {
      margin-top: 30px;
      font-size: 32px;
      color: #c0392b;
      font-weight: bold;
      animation: zoomIn 1s ease;
    }

    #history {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
      max-width: 500px;
      text-align: left;
    }

    #arrow {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      animation: bounce 1s infinite;
    }

    @keyframes zoomIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-10px); }
    }
  </style>
</head>
<body>
  <h1>🎡 Vòng Quay May Mắn</h1>
  <div style="position: relative;">
    <canvas id="wheelCanvas" width="400" height="400"></canvas>
    <img id="arrow" src="https://cdn-icons-png.flaticon.com/512/32/32195.png" alt="Arrow">
  </div>
  <textarea id="nameList" placeholder="Nhập tên cách nhau bằng dấu phẩy..."></textarea><br>
  <button class="btn" onclick="startSpin()">Quay!</button>
  <button class="btn" onclick="clearHistory()">Xóa lịch sử</button>
  <div id="result"></div>
  <div id="history"><strong>Lịch sử quay:</strong><ul id="historyList"></ul></div>

  <!-- Nhạc nền -->
  <audio id="spinSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7b6e3f3b9f.mp3?filename=game-spin-coin-193276.mp3"></audio>
  <!-- Vỗ tay -->
  <audio id="clapSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3c9c4f6b9e.mp3?filename=applause-193276.mp3"></audio>

  <script>
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    let names = ["Lan", "Hùng", "Mai", "Tuấn"];
    let angle = 0;
    let spinning = false;
    let spinInterval;
    let history = [];

    function drawWheel() {
      const radius = canvas.width / 2;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const sliceAngle = 2 * Math.PI / names.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < names.length; i++) {
        const startAngle = angle + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.fillStyle = i % 2 === 0 ? "#ff99bb" : "#ff3366";
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "16px sans-serif";
        ctx.fillText(names[i], radius - 10, 5);
        ctx.restore();
      }
    }

    function startSpin() {
      const input = document.getElementById("nameList").value;
      const inputNames = input.split(",").map(n => n.trim()).filter(n => n !== "");
      if (inputNames.length > 1) names = inputNames;

      document.getElementById("result").innerHTML = "";
      document.getElementById("spinSound").play();

      let speed = 0.3;
      let deceleration = 0.002;
      spinning = true;

      spinInterval = setInterval(() => {
        angle += speed;
        drawWheel();
        speed -= deceleration;
        if (speed <= 0) {
          clearInterval(spinInterval);
          spinning = false;
          showResult();
        }
      }, 20);
    }

    function showResult() {
      const sliceAngle = 2 * Math.PI / names.length;
      const adjustedAngle = (angle + Math.PI) % (2 * Math.PI); // mũi tên ở 6 giờ
      const index = Math.floor(adjustedAngle / sliceAngle);
      const chosenName = names[index];
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `🎉 Người được chọn là: ${chosenName}`;
      resultDiv.style.animation = "zoomIn 1s ease";

      document.getElementById("clapSound").play();

      history.push(chosenName);
      updateHistory();
    }

    function updateHistory() {
      const historyList = document.getElementById("historyList");
      historyList.innerHTML = "";
      history.forEach((name, i) => {
        const li = document.createElement("li");
        li.textContent = `${i + 1}. ${name}`;
        historyList.appendChild(li);
      });
    }

    function clearHistory() {
      history = [];
      updateHistory();
    }

    drawWheel();
  </script>
</body>
</html>
