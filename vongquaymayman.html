<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Vòng Quay May Mắn - Sophia Nguyễn</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', 'Be Vietnam Pro', sans-serif;
      background: linear-gradient(135deg, #0a4a5a, #1a6b7a, #0d9488);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { 
      color: #ffffff; 
      margin-top: 0; 
      text-shadow: 3px 3px 0 #0a4a5a;
      font-size: 2.2rem;
      text-align: center;
    }
    .wheel-container {
      position: relative;
      margin: 20px auto;
    }
    #wheelCanvas { 
      display: block;
      margin: 0 auto;
      border: 8px solid #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0,0,0,0.3), 0 0 0 4px #fff3cd;
      background: #fff;
      transition: box-shadow 0.3s;
    }
    #arrow {
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      animation: bounce 1s infinite;
    }
    @keyframes bounce { 
      0%,100%{ transform: translateX(-50%) translateY(0);} 
      50%{ transform: translateX(-50%) translateY(-12px);} 
    }
    .input-area {
      width: 100%;
      max-width: 550px;
      margin: 20px auto;
    }
    textarea { 
      width: 100%; 
      height: 120px; 
      font-size: 16px; 
      padding: 12px; 
      border-radius: 16px; 
      border: 2px solid #ffd700;
      background: #fffef7;
      font-family: inherit;
      resize: vertical;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 15px 0;
    }
    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #ffd700, #ffb347);
      color: #0a4a5a;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    }
    .btn:active {
      transform: translateY(1px);
    }
    #result {
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(135deg, #fff, #fff9e6);
      color: #0a4a5a;
      padding: 15px 25px;
      border-radius: 60px;
      text-align: center;
      margin: 20px auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      border-left: 8px solid #ffd700;
      border-right: 8px solid #ffd700;
      max-width: 500px;
    }
    #history {
      background: rgba(255,255,255,0.9);
      border-radius: 24px;
      padding: 15px 20px;
      margin-top: 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    #history strong {
      color: #0a4a5a;
      font-size: 1.1rem;
    }
    #historyList {
      max-height: 180px;
      overflow-y: auto;
      padding-left: 20px;
      margin-top: 8px;
      color: #2c3e50;
    }
    #historyList li {
      margin: 6px 0;
      font-size: 15px;
    }
    @media (max-width: 550px) {
      #wheelCanvas { width: 300px; height: 300px; }
      #arrow { width: 40px; bottom: -38px; }
      .btn { padding: 8px 16px; font-size: 14px; }
      #result { font-size: 20px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <h1>🎡 Vòng Quay May Mắn</h1>

  <div class="wheel-container">
    <canvas id="wheelCanvas" width="450" height="450"></canvas>
    <img id="arrow" src="https://cdn-icons-png.flaticon.com/512/32/32195.png" alt="Arrow">
  </div>

  <div class="input-area">
    <textarea id="nameList" placeholder="Nhập danh sách tên, có thể cách nhau bằng dấu phẩy, xuống dòng hoặc khoảng trắng. Ví dụ:
Lan Hùng Mai Tuấn
hoặc Lan, Hùng, Mai, Tuấn
hoặc mỗi tên một dòng"></textarea>
  </div>

  <div class="controls">
    <button class="btn" id="updateNamesBtn">🔄 Cập nhật danh sách</button>
    <button class="btn" id="startSpin">🎉 QUAY NGAY!</button>
    <button class="btn" id="resetBtn">♻️ Reset mặc định</button>
    <button class="btn" id="clearHistoryBtn">🗑️ Xóa lịch sử</button>
  </div>

  <div id="result"></div>

  <div id="history">
    <strong>📜 Lịch sử người đã trúng:</strong>
    <ul id="historyList"></ul>
  </div>

  <!-- Audio: spin và clap -->
  <audio id="spinSound" preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7b6e3f3b9f.mp3?filename=game-spin-coin-193276.mp3" type="audio/mpeg">
  </audio>
  <audio id="clapSound" preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3c9c4f6b9e.mp3?filename=applause-193276.mp3" type="audio/mpeg">
  </audio>

<script>
  (function(){
    // ==================== CẤU HÌNH ====================
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");

    // Mảng màu sặc sỡ cho các ô
    const COLOR_PALETTE = [
      "#e74c3c", "#f1c40f", "#2ecc71", "#3498db", "#9b59b6", "#e67e22", 
      "#1abc9c", "#e84393", "#f39c12", "#16a085", "#c0392b", "#2980b9",
      "#8e44ad", "#d35400", "#27ae60", "#f1c40f", "#e91e63", "#00bcd4"
    ];

    let names = ["Lan", "Hùng", "Mai", "Tuấn"];
    let angle = 0;
    let spinning = false;
    let history = [];

    // DOM elements
    const spinSound = document.getElementById("spinSound");
    const clapSound = document.getElementById("clapSound");
    const nameListInput = document.getElementById("nameList");
    const resultDiv = document.getElementById("result");

    // Khởi tạo audio (để sẵn sàng phát)
    spinSound.load();
    clapSound.load();
    spinSound.volume = 0.8;
    clapSound.volume = 1.0;

    // Hàm xử lý nhập danh sách LINH HOẠT (dấu phẩy, xuống dòng, khoảng trắng)
    function parseNameList(raw) {
      if (!raw.trim()) return [];
      // Thay thế dấu phẩy, xuống dòng, tab bằng khoảng trắng
      let cleaned = raw.replace(/[,\n\r\t]+/g, " ");
      // Tách theo khoảng trắng và lọc bỏ rỗng
      let items = cleaned.split(" ").filter(item => item.trim().length > 0);
      // Loại bỏ trùng lặp (nếu muốn giữ trùng thì bỏ dòng này)
      // items = [...new Map(items.map(i => [i, i])).values()];
      return items;
    }

    // Cập nhật danh sách từ textarea
    function updateNames() {
      const rawText = nameListInput.value;
      const newNames = parseNameList(rawText);
      if (newNames.length === 0) {
        alert("Vui lòng nhập ít nhất 1 tên (có thể cách nhau bằng dấu phẩy, xuống dòng hoặc khoảng trắng).");
        return;
      }
      names = newNames;
      history = [];
      updateHistory();
      drawWheel();
      resultDiv.innerText = "";
      // Xóa nội dung textarea cho gọn (tùy chọn)
      // nameListInput.value = "";
    }

    // Reset về mặc định
    function resetDefault() {
      names = ["Lan", "Hùng", "Mai", "Tuấn"];
      history = [];
      nameListInput.value = "";
      updateHistory();
      drawWheel();
      resultDiv.innerText = "";
    }

    function clearHistory() {
      history = [];
      updateHistory();
      resultDiv.innerText = "";
    }

    // Vẽ vòng quay với màu sắc sặc sỡ
    function drawWheel() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = Math.min(cx, cy) - 8;

      ctx.clearRect(0, 0, w, h);

      if (!names || names.length === 0) {
        ctx.fillStyle = "#f0f0f0";
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#555";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Chưa có tên", cx, cy);
        return;
      }

      const sliceAngle = (2 * Math.PI) / names.length;

      for (let i = 0; i < names.length; i++) {
        const startAngle = angle + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        
        // Chọn màu từ bảng màu (lặp lại nếu nhiều hơn số màu)
        const colorIdx = i % COLOR_PALETTE.length;
        ctx.fillStyle = COLOR_PALETTE[colorIdx];
        ctx.fill();
        
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Vẽ chữ trắng nổi bật
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px 'Segoe UI', 'Be Vietnam Pro'";
        ctx.shadowBlur = 2;
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.fillText(names[i], radius - 12, 6);
        ctx.restore();
      }
      
      // Vẽ điểm trung tâm
      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
      ctx.fillStyle = "#ffd700";
      ctx.shadowBlur = 0;
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // Bắt đầu quay
    function startSpin() {
      if (spinning) return;
      if (!names || names.length === 0) {
        resultDiv.innerText = "🎊 Hết người để quay! Nhấn Reset hoặc thêm danh sách mới.";
        return;
      }

      spinning = true;
      resultDiv.innerText = "";

      // Phát tiếng quay
      spinSound.currentTime = 0;
      spinSound.play().catch(e => console.log("Audio play failed:", e));

      let speed = 0.45 + Math.random() * 0.4; // tốc độ đầu
      const deceleration = 0.0009 + Math.random() * 0.0012;

      function animate() {
        angle += speed;
        drawWheel();
        speed -= deceleration;
        
        if (speed > 0.008) {
          requestAnimationFrame(animate);
        } else {
          finalizeSpin();
        }
      }
      requestAnimationFrame(animate);
    }

    // Kết thúc quay, xác định người trúng
    function finalizeSpin() {
      const twoPi = 2 * Math.PI;
      angle = angle % twoPi;
      if (angle < 0) angle += twoPi;

      if (!names || names.length === 0) {
        spinning = false;
        return;
      }

      const sliceAngle = (2 * Math.PI) / names.length;
      let adjustedAngle = (angle + Math.PI / 2) % (2 * Math.PI);
      let index = Math.floor(adjustedAngle / sliceAngle);
      index = names.length - 1 - index;
      if (index < 0) index = 0;
      if (index >= names.length) index = names.length - 1;

      const chosenName = names[index];
      resultDiv.innerHTML = `🎉 <span style="color:#e74c3c;">✨ ${chosenName} ✨</span> 🎉`;
      
      // Tiếng vỗ tay
      clapSound.currentTime = 0;
      clapSound.play().catch(e => console.log("Clap error:", e));

      // Lưu lịch sử và xóa tên khỏi danh sách
      history.push(chosenName);
      updateHistory();
      names.splice(index, 1);
      
      drawWheel();
      spinning = false;
      
      // Nếu hết tên, thông báo
      if (names.length === 0) {
        setTimeout(() => {
          resultDiv.innerHTML = "🏆 CHÚC MỪNG! Bạn đã quay hết tất cả người tham gia! 🏆";
        }, 500);
      }
    }

    // Cập nhật danh sách lịch sử
    function updateHistory() {
      const historyList = document.getElementById("historyList");
      historyList.innerHTML = "";
      if (history.length === 0) {
        const emptyLi = document.createElement("li");
        emptyLi.textContent = "Chưa có lượt quay nào.";
        emptyLi.style.color = "#aaa";
        historyList.appendChild(emptyLi);
        return;
      }
      history.forEach((name, idx) => {
        const li = document.createElement("li");
        li.innerHTML = `<span style="color:#0a4a5a; font-weight:bold;">${idx+1}.</span> ${name}`;
        historyList.appendChild(li);
      });
    }

    // Gắn sự kiện
    document.getElementById("updateNamesBtn").addEventListener("click", updateNames);
    document.getElementById("startSpin").addEventListener("click", startSpin);
    document.getElementById("resetBtn").addEventListener("click", resetDefault);
    document.getElementById("clearHistoryBtn").addEventListener("click", clearHistory);

    // Hỗ trợ nhấn Enter trong textarea để cập nhật (Ctrl+Enter hoặc Cmd+Enter)
    nameListInput.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        updateNames();
      }
    });

    // Khởi tạo vẽ lần đầu
    drawWheel();
    updateHistory();
  })();
</script>
</body>
</html>
