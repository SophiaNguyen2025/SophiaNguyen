<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINGO An Toàn Mạng – Buổi 3</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #162032;
    --border: #334155;
    --accent-a: #f97316;
    --accent-b: #3b82f6;
    --gold: #fbbf24;
    --green: #22c55e;
    --red: #ef4444;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.10) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 80%, rgba(255,255,255,0.12) 0%, transparent 100%),
      radial-gradient(2px 2px at 10% 70%, rgba(255,255,255,0.08) 0%, transparent 100%),
      radial-gradient(2px 2px at 90% 60%, rgba(255,255,255,0.08) 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }
  .container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 16px; }

  /* HEADER */
  .header { text-align: center; padding: 16px 0 10px; }
  .header h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  /* SCOREBOARD */
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 12px 0; }
  .team-card {
    background: var(--card); border: 2px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; transition: all 0.3s;
  }
  .team-card.active { border-color: var(--team-color); box-shadow: 0 0 20px -4px var(--team-color); }
  .team-card.team-a { --team-color: var(--accent-a); }
  .team-card.team-b { --team-color: var(--accent-b); text-align: right; }
  .team-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--team-color); margin-bottom: 2px; }
  .team-name { font-family: 'Baloo 2', cursive; font-size: 1.1rem; font-weight: 800; color: var(--text); }
  .team-score { font-size: 2rem; font-weight: 800; font-family: 'Baloo 2', cursive; color: var(--team-color); line-height: 1; }
  .team-bingo-count { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .vs-badge { text-align: center; }
  .vs-badge .vs-text { font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 800; color: var(--gold); }
  .turn-indicator { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }

  /* QUESTION */
  .question-panel {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 20px; margin: 10px 0; min-height: 80px; display: flex; align-items: center; gap: 14px;
  }
  .q-number {
    background: var(--gold); color: #000; font-family: 'Baloo 2', cursive; font-weight: 800;
    font-size: 1.1rem; min-width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.3s;
  }
  .q-text { font-size: 1rem; font-weight: 700; line-height: 1.4; color: var(--text); flex: 1; }
  .q-text.placeholder { color: var(--muted); font-weight: 400; font-style: italic; }

  /* HINT BADGE – hiển thị đáp án đúng sau khi kết thúc câu */
  .q-hint {
    display: none;
    margin-top: 6px;
    font-size: 0.82rem;
    color: var(--green);
    font-weight: 600;
    font-style: normal;
    padding: 4px 10px;
    background: rgba(34,197,94,0.1);
    border-radius: 8px;
    border: 1px solid rgba(34,197,94,0.25);
  }
  .q-hint.show { display: inline-block; }

  /* TIMER */
  .timer-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .timer-bar-wrap { flex: 1; height: 10px; background: var(--card); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
  .timer-bar { height: 100%; border-radius: 99px; background: var(--green); transition: width 1s linear, background 0.3s; width: 100%; }
  .timer-bar.warn { background: var(--gold); }
  .timer-bar.danger { background: var(--red); }
  .timer-display { font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 800; min-width: 48px; text-align: right; color: var(--text); transition: color 0.3s; }
  .timer-display.warn { color: var(--gold); }
  .timer-display.danger { color: var(--red); }

  /* CONTROLS */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .btn {
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.85rem;
    padding: 9px 18px; border-radius: 10px; border: none; cursor: pointer;
    transition: all 0.15s; display: flex; align-items: center; gap: 6px; letter-spacing: 0.3px;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-primary { background: var(--accent-a); color: #fff; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-success { background: var(--green); color: #fff; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-blue { background: var(--accent-b); color: #fff; }
  .btn-gold { background: var(--gold); color: #000; }

  /* GRID */
  .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 4px; }
  .bingo-cell {
    background: #1e293b; border: 2px solid #334155; border-radius: 12px;
    padding: 10px 6px; text-align: center; font-weight: 700;
    font-size: clamp(0.6rem, 1.5vw, 0.78rem); cursor: pointer; transition: all 0.2s;
    color: var(--text); word-break: break-word; min-height: 76px;
    display: flex; align-items: center; justify-content: center; line-height: 1.3;
    user-select: none; position: relative;
  }
  .bingo-cell:hover:not(.locked-a):not(.locked-b):not(.wrong-guess) {
    border-color: var(--gold); background: #1e3a5f; transform: scale(1.03);
  }
  .bingo-cell.selected { border-color: var(--gold); background: rgba(251,191,36,0.15); box-shadow: 0 0 12px -4px var(--gold); transform: scale(1.04); }
  .bingo-cell.locked-a { background: rgba(249,115,22,0.18); border-color: var(--accent-a); color: #fed7aa; cursor: default; }
  .bingo-cell.locked-b { background: rgba(59,130,246,0.18); border-color: var(--accent-b); color: #bfdbfe; cursor: default; }
  .bingo-cell.locked-a::after,
  .bingo-cell.locked-b::after { content: attr(data-team); position: absolute; top: 3px; right: 5px; font-size: 0.55rem; font-weight: 800; letter-spacing: 1px; opacity: 0.8; }
  .bingo-cell.wrong-guess { background: #1a1a2e; border-color: #2a2a3e; color: #44445a; cursor: not-allowed; opacity: 0.55; }
  .bingo-cell.wrong-guess::before { content: '✗'; position: absolute; top: 3px; left: 6px; font-size: 0.65rem; color: var(--red); opacity: 0.7; }
  /* highlight correct answer after question ends */
  .bingo-cell.reveal-answer { border-color: var(--green); box-shadow: 0 0 14px -4px var(--green); background: rgba(34,197,94,0.1); }
  .bingo-cell.bingo-flash { animation: bingoFlash 0.6s ease 3; }
  @keyframes bingoFlash { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08);filter:brightness(1.4)} }

  /* TOAST */
  .toast {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--card); border: 2px solid var(--border); border-radius: 14px;
    padding: 12px 24px; font-weight: 700; font-size: 1rem; z-index: 100;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    text-align: center; max-width: 90vw; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.correct { border-color: var(--green); color: var(--green); }
  .toast.wrong { border-color: var(--red); color: var(--red); }
  .toast.timeout { border-color: var(--gold); color: var(--gold); }
  .toast.info { border-color: var(--accent-b); color: var(--accent-b); }

  /* WIN OVERLAY */
  .win-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200;
    align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px;
  }
  .win-overlay.show { display: flex; }
  .win-box { background: var(--card); border: 3px solid var(--gold); border-radius: 24px; padding: 40px 48px; max-width: 480px; animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
  .win-emoji { font-size: 4rem; margin-bottom: 12px; }
  .win-title { font-family: 'Baloo 2', cursive; font-size: 2rem; font-weight: 800; color: var(--gold); margin-bottom: 8px; }
  .win-subtitle { font-size: 1rem; color: var(--muted); margin-bottom: 24px; }

  /* STATUS */
  .status-bar {
    background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; font-size: 0.8rem; color: var(--muted); margin: 6px 0;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .status-dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.orange { background: var(--accent-a); box-shadow: 0 0 6px var(--accent-a); }

  /* SETUP MODAL */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
  .modal.show { display: flex; }
  .modal-box { background: var(--card); border: 2px solid var(--border); border-radius: 20px; padding: 28px 32px; max-width: 440px; width: 100%; animation: popIn 0.4s ease; }
  .modal-title { font-family: 'Baloo 2', cursive; font-size: 1.4rem; font-weight: 800; margin-bottom: 18px; color: var(--gold); }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .form-group input, .form-group select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-family: 'Nunito', sans-serif; font-size: 0.95rem; color: var(--text); outline: none; transition: border-color 0.2s; }
  .form-group input:focus, .form-group select:focus { border-color: var(--gold); }
  .form-group select option { background: var(--card); }
  .logo { height: 100px; margin-bottom: 10px; }
  
  @media (max-width: 600px) {
    .bingo-cell { min-height: 62px; font-size: 0.6rem; padding: 7px 3px; }
    .bingo-grid { gap: 5px; }
    .question-panel { padding: 10px 12px; gap: 10px; }
    .q-text { font-size: 0.9rem; }
    .scoreboard { gap: 6px; }
    .team-score { font-size: 1.5rem; }
    
          
</style>
</head>
<body>

<!-- SETUP MODAL -->
<div class="modal show" id="setupModal">
  <div class="modal-box">
        <div class="modal-title">🎮 Cài đặt trò chơi</div>
    <div class="form-group">
      <label>Tên Đội A 🔥</label>
      <input type="text" id="nameA" value="Đội Rồng Lửa" maxlength="20">
    </div>
    <div class="form-group">
      <label>Tên Đội B 💧</label>
      <input type="text" id="nameB" value="Đội Băng Tuyết" maxlength="20">
    </div>
    <div class="form-group">
      <label>Thời gian mỗi câu (giây)</label>
      <select id="timerSetting">
        <option value="15">15 giây</option>
        <option value="20" selected>20 giây</option>
        <option value="30">30 giây</option>
        <option value="45">45 giây</option>
        <option value="60">60 giây</option>
      </select>
    </div>
    <div class="form-group">
      <label>Điểm thưởng / câu đúng</label>
      <select id="scoreSetting">
        <option value="10" selected>+10 điểm</option>
        <option value="20">+20 điểm</option>
        <option value="50">+50 điểm</option>
      </select>
    </div>
    <div class="form-group">
      <label>Điểm trừ / hết giờ hoặc sai</label>
      <select id="penaltySetting">
        <option value="5">-5 điểm</option>
        <option value="10" selected>-10 điểm</option>
        <option value="0">Không trừ</option>
      </select>
    </div>
    <button class="btn btn-gold" style="width:100%;justify-content:center;font-size:1rem;padding:12px;" onclick="startGame()">
      🚀 Bắt đầu chơi!
    </button>
  </div>
</div>

<!-- WIN OVERLAY -->
<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <div class="win-emoji" id="winEmoji">🏆</div>
    <div class="win-title" id="winTitle">BINGO!</div>
    <div class="win-subtitle" id="winSubtitle">Chúc mừng!</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;">
      <button class="btn btn-gold" onclick="continueGame()">▶️ Tiếp tục chơi</button>
      <button class="btn btn-secondary" onclick="showSetup()">⚙️ Chơi lại từ đầu</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MAIN -->
<div class="container">
  <div class="header">
  <img src="https://sophianguyen.com.vn/images/hinhremovenen.png" alt="Sophia Nguyễn" class="logo">
    <h1>🎲 BINGO AN TOÀN MẠNG</h1>
    <p>Buổi 3 · Tiếp sức 2 đội · Đội nào BINGO trước thắng!</p>
  </div>

  <div class="scoreboard">
    <div class="team-card team-a" id="cardA">
      <div class="team-label">🔥 Đội A</div>
      <div class="team-name" id="displayNameA">—</div>
      <div class="team-score" id="scoreA">0</div>
      <div class="team-bingo-count" id="bingoA">Chưa có BINGO</div>
    </div>
    <div class="vs-badge">
      <div class="vs-text">VS</div>
      <div class="turn-indicator" id="turnIndicator">Chưa bắt đầu</div>
    </div>
    <div class="team-card team-b" id="cardB">
      <div class="team-label">💧 Đội B</div>
      <div class="team-name" id="displayNameB">—</div>
      <div class="team-score" id="scoreB">0</div>
      <div class="team-bingo-count" id="bingoB">Chưa có BINGO</div>
    </div>
  </div>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Chờ bắt đầu...</span>
  </div>

  <div class="question-panel">
    <div class="q-number" id="qNumber">?</div>
    <div style="flex:1;">
      <div class="q-text placeholder" id="qText">Bấm "Câu hỏi mới" để bắt đầu lượt chơi...</div>
      <div class="q-hint" id="qHint"></div>
    </div>
  </div>

  <div class="timer-row">
    <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
    <div class="timer-display" id="timerDisplay">—</div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnNewQ" onclick="newQuestion()">📢 Câu hỏi mới</button>
    <button class="btn btn-success" id="btnConfirm" onclick="confirmAnswer()" disabled>✅ Xác nhận đáp án</button>
    <button class="btn btn-secondary" onclick="shuffleBoard()">🔀 Xáo trộn bảng</button>
    <button class="btn btn-secondary" onclick="switchTurn()">🔄 Đổi lượt</button>
    <button class="btn btn-secondary" style="margin-left:auto;" onclick="showSetup()">⚙️</button>
  </div>

  <div class="bingo-grid" id="bingoGrid"></div>
  <div style="height:20px;"></div>
</div>

<script>

// 25 ô trên bảng BINGO
const ALL_QUESTIONS = [
  {
    q: "Tài khoản lạ nhắn: 'Tao là Quân, mất điện thoại rồi, chuyển gấp 2 triệu vào số này giúp tao.' Bước đầu tiên cần làm?",
    answers: [2]  // Gọi điện xác nhận trực tiếp
  },
  {
    q: "Một nhóm bạn liên tục chế ảnh xấu của bạn rồi đăng lên group lớp mỗi ngày, dù bạn đã xin dừng lại. Đây là gì?",
    answers: [6]  // Bắt nạt có chủ đích – lặp lại, mất cân bằng
  },
  {
    q: "Bị bắt nạt trên mạng — việc quan trọng đầu TIÊN cần làm TRƯỚC KHI làm bất cứ điều gì khác?",
    answers: [4]  // Chụp màn hình lưu bằng chứng ngay
  },
  {
    q: "Người lạ trên Instagram hứa tặng iPhone nếu bạn gửi ảnh phòng ngủ. Bạn làm gì NGAY LẬP TỨC?",
    answers: [0]  // Chặn & báo cáo tài khoản ngay, không trả lời
  },
  {
    q: "Đang đi bộ, bạn nhận ra một người đi xe máy bám theo mình qua 3 con phố. Bạn KHÔNG nên làm gì?",
    answers: [14] // Về thẳng nhà (nguy hiểm – lộ địa chỉ)
  },
  {
    q: "Trên đường về nhà, một người say rượu la hét và đi về phía bạn. Cách xử lý an toàn nhất?",
    answers: [9]  // Không đối đầu – tránh xa, vào nơi đông người
  },
  {
    q: "Bạn đặt xe ôm công nghệ. Tài xế đến đúng biển số nhưng bảo: 'Hủy chuyến trên app đi, anh chở rẻ hơn.' Bạn làm gì?",
    answers: [17] // Không lên xe – hủy chuyến đúng cách, gọi bố mẹ
  },
  {
    q: "Sau khi đã lưu bằng chứng bị bắt nạt mạng, bước tiếp theo quan trọng nhất là gì?",
    answers: [7]  // Kể với người lớn tin cậy / báo nhà trường
  },
  {
    q: "Bạn đăng story: 'Cả tuần này ở nhà một mình, thoải mái quá!' Rủi ro lớn nhất là gì?",
    answers: [11] // Tiết lộ cho kẻ xấu biết nhà vắng người
  },
  {
    q: "Một tài khoản mạng xã hội mới tạo, không có bạn chung, nhắn tin làm quen và hỏi bạn học trường nào, nhà ở đâu. Đây là dấu hiệu gì?",
    answers: [20] // Dấu hiệu thu thập thông tin cá nhân – tài khoản lạ đáng ngờ
  },
];

const ALL_CELLS = [
  "🚫 Chặn & báo cáo ngay, không trả lời",     // 0  – ĐÁP ÁN câu 4
  "😤 Trả lời lại để tự bảo vệ mình",           // 1  – mồi nhử (SAI khi bị bắt nạt mạng)
  "📲 Gọi điện xác nhận trực tiếp với bạn",     // 2  – ĐÁP ÁN câu 1
  "💸 Chuyển tiền trước, hỏi sau",              // 3  – mồi nhử câu 1 (SAI)
  "📸 Chụp màn hình lưu bằng chứng ngay",       // 4  – ĐÁP ÁN câu 3
  "↩️ Xóa hết để tránh bị nhìn thấy",           // 5  – mồi nhử câu 3 (SAI – xóa bằng chứng)
  "🔁 Bắt nạt = lặp lại + cố ý + mất cân bằng", // 6  – ĐÁP ÁN câu 2
  "🏫 Kể với người lớn / báo nhà trường",        // 7  – ĐÁP ÁN câu 8
  "😶 Im lặng chịu đựng cho qua",               // 8  – mồi nhử câu 8 (SAI)
  "🏪 Không đối đầu – vào nơi đông người",       // 9  – ĐÁP ÁN câu 6
  "😠 Quay lại cãi cho người đó tỉnh rượu",     // 10 – mồi nhử câu 6 (SAI)
  "🔓 Tiết lộ nhà vắng người cho kẻ xấu",       // 11 – ĐÁP ÁN câu 9
  "📵 Không đăng thông tin ở nhà một mình",     // 12 – mồi nhử câu 9 (đúng nhưng không phải rủi ro)
  "🤝 Lên xe vì biển số đúng là an toàn",       // 13 – mồi nhử câu 7 (SAI)
  "🏠 Về thẳng nhà thật nhanh",                 // 14 – ĐÁP ÁN câu 5 (hành động SAI cần tránh)
  "🏃 Vào nơi đông người, gọi bố mẹ",           // 15 – mồi nhử câu 5 (đúng nhưng không phải đáp án câu hỏi)
  "📞 Gọi 113 nếu bị đe dọa",                  // 16 – mồi nhử nhiều câu
  "🚗 Không lên xe – hủy đúng cách, gọi bố mẹ", // 17 – ĐÁP ÁN câu 7
  "✅ Lên xe vì tài xế nói giá rẻ hơn",         // 18 – mồi nhử câu 7 (SAI)
  "🔍 Kiểm tra biển số trước khi lên xe",       // 19 – mồi nhử câu 7 (đúng nhưng không đủ)
  "⚠️ Tài khoản lạ hỏi thông tin = đáng ngờ",  // 20 – ĐÁP ÁN câu 10
  "👍 Kết bạn vì người đó rất thân thiện",      // 21 – mồi nhử câu 10 (SAI)
  "🎁 Nhận quà rồi mới quyết định",             // 22 – mồi nhử nhiều câu (SAI)
  "📢 Đăng công khai để cảnh báo mọi người",    // 23 – mồi nhử (SAI – tự xử lý không đúng cách)
  "🔒 Không chia sẻ thông tin cá nhân với người lạ", // 24 – mồi nhử câu 10
];

// ================================================================
// STATE
// ================================================================
let config = { timerSec: 20, scorePerQ: 10, penalty: 10 };
let teams = { A: { name: 'Đội A', score: 0, bingo: 0 }, B: { name: 'Đội B', score: 0, bingo: 0 } };
let currentTeam = 'A';
let boardOrder = [...Array(25).keys()]; // boardOrder[pos] = cellId
let lockedCells = new Array(25).fill(null); // null | 'A' | 'B'
let wrongCellsByTeam = Array.from({length: 25}, () => new Set()); // per position, which teams guessed wrong
let selectedCell = null; // board position (0-24)
let questionQueue = [];
let currentQ = null;
let questionIndex = 0;
let timerInterval = null;
let timerLeft = 0;
let gameStarted = false;
let questionActive = false;
let contestedQuestion = false; // true khi đội 1 sai, đội 2 đang thử cùng câu

// ================================================================
// SETUP
// ================================================================
function startGame() {
  teams.A.name = document.getElementById('nameA').value.trim() || 'Đội A';
  teams.B.name = document.getElementById('nameB').value.trim() || 'Đội B';
  config.timerSec = +document.getElementById('timerSetting').value;
  config.scorePerQ = +document.getElementById('scoreSetting').value;
  config.penalty = +document.getElementById('penaltySetting').value;

  teams.A.score = 0; teams.A.bingo = 0;
  teams.B.score = 0; teams.B.bingo = 0;
  currentTeam = 'A';
  lockedCells = new Array(25).fill(null);
  wrongCellsByTeam = Array.from({length: 25}, () => new Set());
  selectedCell = null;
  questionActive = false;
  contestedQuestion = false;
  questionQueue = shuffle([...ALL_QUESTIONS]);
  questionIndex = 0;
  boardOrder = shuffle([...Array(25).keys()]);
  gameStarted = true;

  document.getElementById('setupModal').classList.remove('show');
  document.getElementById('qHint').classList.remove('show');
  stopTimer();
  renderAll();
  updateStatus('green', `🎮 Game bắt đầu! Lượt đầu: ${teams[currentTeam].name}`);
  setQText('Bấm "Câu hỏi mới" để bắt đầu!', true);
}

function showSetup() {
  stopTimer();
  document.getElementById('setupModal').classList.add('show');
}

// ================================================================
// HELPER: kiểm tra câu hỏi có còn ô đáp án trống không
// ================================================================
function questionHasAvailableAnswer(q) {
  for (const cellId of q.answers) {
    const pos = boardOrder.indexOf(cellId);
    if (pos !== -1 && lockedCells[pos] === null) return true;
  }
  return false;
}

// Tìm câu hỏi tiếp theo hợp lệ (còn ít nhất 1 ô đáp án chưa bị locked)
function getNextValidQuestion() {
  let tries = 0;
  const total = questionQueue.length;
  while (tries < total) {
    if (questionIndex >= questionQueue.length) {
      questionQueue = shuffle([...ALL_QUESTIONS]);
      questionIndex = 0;
    }
    const q = questionQueue[questionIndex];
    if (questionHasAvailableAnswer(q)) return q; // found
    // skip this question – all its answers are locked
    questionIndex++;
    tries++;
  }
  return null; // tất cả câu hỏi đều không còn ô trống – game gần xong
}

// ================================================================
// CORE GAME
// ================================================================
function newQuestion() {
  if (!gameStarted) return;
  if (questionActive) {
    showToast('⚠️ Hãy xác nhận đáp án câu hiện tại trước!', 'wrong'); return;
  }

  const q = getNextValidQuestion();
  if (!q) {
    showToast('🎊 Hết câu hỏi! Bảng đã đầy, game kết thúc!', 'info');
    updateStatus('green', 'Game kết thúc! Tổng kết điểm.');
    return;
  }
  questionIndex++; // advance after we've confirmed it's valid
  currentQ = q;

  selectedCell = null;
  questionActive = true;
  contestedQuestion = false;
  wrongCellsByTeam = Array.from({length: 25}, () => new Set()); // reset per question
  revealPos = []; // reset reveal

  document.getElementById('qHint').classList.remove('show');
  renderAll();
  document.getElementById('btnConfirm').disabled = false;
  startTimer();
  setQText(currentQ.q, false);
  document.getElementById('qNumber').textContent = questionIndex;
  updateStatus('orange', `🟠 ${teams[currentTeam].name} đang trả lời...`);
}

// Lấy vị trí tất cả đáp án đúng trên board hiện tại
function getAnswerPositions(q) {
  return q.answers.map(cellId => boardOrder.indexOf(cellId)).filter(pos => pos !== -1);
}

let revealPos = []; // positions to highlight as correct answer after question ends

function endQuestion(reason) {
  // "reason": 'correct'|'both-wrong'|'timeout-both'
  questionActive = false;
  contestedQuestion = false;
  document.getElementById('btnConfirm').disabled = true;
  stopTimer();
  selectedCell = null;

  // Reveal correct answer positions on board
  revealPos = getAnswerPositions(currentQ);
  const hintEl = document.getElementById('qHint');
  hintEl.textContent = currentQ.hint;
  hintEl.classList.add('show');

  renderAll();
  updateStatus('green', `Câu kết thúc. Bấm "Câu hỏi mới" để tiếp tục!`);
}

function confirmAnswer() {
  if (!questionActive) return;
  stopTimer();

  if (selectedCell === null) {
    // Không chọn ô nào – coi như bỏ lượt
    teams[currentTeam].score = Math.max(0, teams[currentTeam].score - config.penalty);
    showToast(`⏰ Chưa chọn ô! ${teams[currentTeam].name} bị trừ ${config.penalty} điểm.`, 'timeout');
    renderScoreboard();

    if (contestedQuestion) {
      endQuestion('both-wrong');
    } else {
      // Chuyển cho đội kia
      handOffToOtherTeam();
    }
    return;
  }

  const cellId = boardOrder[selectedCell];
  const isCorrect = currentQ.answers.includes(cellId);

  if (isCorrect) {
    lockedCells[selectedCell] = currentTeam;
    teams[currentTeam].score += config.scorePerQ;
    showToast(`✅ ĐÚNG RỒI! +${config.scorePerQ} điểm cho ${teams[currentTeam].name}!`, 'correct');
    checkBingo();
    endQuestion('correct');
  } else {
    // Sai
    wrongCellsByTeam[selectedCell].add(currentTeam);
    teams[currentTeam].score = Math.max(0, teams[currentTeam].score - config.penalty);
    selectedCell = null;

    if (contestedQuestion) {
      showToast(`❌ Cả hai đội đều sai! Không ai được điểm.`, 'wrong');
      endQuestion('both-wrong');
    } else {
      showToast(`❌ SAI! Câu hỏi chuyển sang ${teams[currentTeam === 'A' ? 'B' : 'A'].name}!`, 'wrong');
      handOffToOtherTeam();
    }
  }
}

function handOffToOtherTeam() {
  const otherTeam = currentTeam === 'A' ? 'B' : 'A';
  contestedQuestion = true;
  currentTeam = otherTeam;
  questionActive = true;
  selectedCell = null;
  document.getElementById('btnConfirm').disabled = false;
  document.getElementById('qHint').classList.remove('show');
  startTimer();
  updateStatus('orange', `🔁 ${teams[currentTeam].name} được thử câu này!`);
  renderAll();
}

function switchTurn() {
  if (questionActive) {
    showToast('⚠️ Không thể đổi lượt khi đang có câu hỏi!', 'wrong'); return;
  }
  currentTeam = currentTeam === 'A' ? 'B' : 'A';
  renderTurnIndicator();
  renderScoreboard();
  setStatus(`Lượt của ${teams[currentTeam].name} — bấm "Câu hỏi mới"!`);
}

// ================================================================
// TIMER
// ================================================================
function startTimer() {
  timerLeft = config.timerSec;
  renderTimer();
  timerInterval = setInterval(() => {
    timerLeft--;
    renderTimer();
    if (timerLeft <= 0) { stopTimer(); timeoutHandler(); }
  }, 1000);
}

function stopTimer() { clearInterval(timerInterval); timerInterval = null; }

function timeoutHandler() {
  if (!questionActive) return;
  teams[currentTeam].score = Math.max(0, teams[currentTeam].score - config.penalty);
  selectedCell = null;

  if (contestedQuestion) {
    showToast(`⏰ Hết giờ! Cả hai đội đều không trả lời được.`, 'timeout');
    endQuestion('timeout-both');
  } else {
    showToast(`⏰ Hết giờ! Câu hỏi chuyển sang ${teams[currentTeam === 'A' ? 'B' : 'A'].name}!`, 'timeout');
    handOffToOtherTeam();
  }
}

function renderTimer() {
  const bar = document.getElementById('timerBar');
  const display = document.getElementById('timerDisplay');
  if (timerLeft <= 0 || !questionActive) {
    bar.style.width = '0%';
    display.textContent = '0s';
    return;
  }
  const pct = (timerLeft / config.timerSec) * 100;
  bar.style.width = pct + '%';
  display.textContent = timerLeft + 's';
  const cls = timerLeft <= 5 ? 'danger' : timerLeft <= 10 ? 'warn' : '';
  bar.className = 'timer-bar' + (cls ? ' ' + cls : '');
  display.className = 'timer-display' + (cls ? ' ' + cls : '');
}

// ================================================================
// BINGO CHECK
// ================================================================
function checkBingo() {
  const lines = [];
  for (let r = 0; r < 5; r++) lines.push([0,1,2,3,4].map(c => r*5+c));
  for (let c = 0; c < 5; c++) lines.push([0,1,2,3,4].map(r => r*5+c));
  lines.push([0,6,12,18,24]);
  lines.push([4,8,12,16,20]);

  for (const line of lines) {
    if (line.every(i => lockedCells[i] === currentTeam)) {
      teams[currentTeam].bingo++;
      highlightBingoLine(line);
      setTimeout(() => showWin(), 700);
      return;
    }
  }
}

function highlightBingoLine(line) {
  renderGrid(); // re-render first
  const cells = document.querySelectorAll('.bingo-cell');
  line.forEach(i => cells[i] && cells[i].classList.add('bingo-flash'));
}

function showWin() {
  const t = teams[currentTeam];
  document.getElementById('winEmoji').textContent = currentTeam === 'A' ? '🔥' : '💧';
  document.getElementById('winTitle').textContent = `BINGO! ${t.name} thắng!`;
  document.getElementById('winSubtitle').textContent = `Điểm: ${t.score} · BINGO lần ${t.bingo} 🎉`;
  document.getElementById('winOverlay').classList.add('show');
}

function continueGame() {
  document.getElementById('winOverlay').classList.remove('show');
  // Sau BINGO, đổi lượt cho đội kia
  currentTeam = currentTeam === 'A' ? 'B' : 'A';
  renderAll();
  setStatus(`Tiếp tục! Lượt của ${teams[currentTeam].name}.`);
}

// ================================================================
// SHUFFLE BOARD
// ================================================================
function shuffleBoard() {
  if (questionActive) {
    showToast('⚠️ Không thể xáo trộn khi đang có câu hỏi!', 'wrong'); return;
  }
  const newOrder = shuffle([...Array(25).keys()]);
  const newLocked = new Array(25).fill(null);
  const newWrong = Array.from({length: 25}, () => new Set());
  for (let newPos = 0; newPos < 25; newPos++) {
    const cellId = newOrder[newPos];
    const oldPos = boardOrder.indexOf(cellId);
    if (oldPos !== -1) {
      newLocked[newPos] = lockedCells[oldPos];
      newWrong[newPos] = wrongCellsByTeam[oldPos];
    }
  }
  boardOrder = newOrder;
  lockedCells = newLocked;
  wrongCellsByTeam = newWrong;
  selectedCell = null;
  revealPos = [];
  renderGrid();
  showToast('🔀 Bảng đã được xáo trộn!', 'timeout');
}

// ================================================================
// RENDER
// ================================================================
function renderAll() {
  renderScoreboard();
  renderGrid();
  renderTurnIndicator();
  if (!questionActive) renderTimer();
}

function renderScoreboard() {
  document.getElementById('displayNameA').textContent = teams.A.name;
  document.getElementById('displayNameB').textContent = teams.B.name;
  document.getElementById('scoreA').textContent = teams.A.score;
  document.getElementById('scoreB').textContent = teams.B.score;
  document.getElementById('bingoA').textContent = teams.A.bingo > 0 ? `🎉 BINGO x${teams.A.bingo}` : 'Chưa có BINGO';
  document.getElementById('bingoB').textContent = teams.B.bingo > 0 ? `🎉 BINGO x${teams.B.bingo}` : 'Chưa có BINGO';
  document.getElementById('cardA').classList.toggle('active', currentTeam === 'A');
  document.getElementById('cardB').classList.toggle('active', currentTeam === 'B');
  document.getElementById('qNumber').style.background = currentTeam === 'A' ? 'var(--accent-a)' : 'var(--accent-b)';
}

function renderTurnIndicator() {
  const el = document.getElementById('turnIndicator');
  if (!gameStarted) { el.textContent = 'Chưa bắt đầu'; return; }
  const prefix = contestedQuestion && questionActive ? '🔁 ' : '';
  el.textContent = `${prefix}Lượt: ${teams[currentTeam].name}`;
}

function renderGrid() {
  const grid = document.getElementById('bingoGrid');
  grid.innerHTML = '';
  for (let pos = 0; pos < 25; pos++) {
    const cellId = boardOrder[pos];
    const div = document.createElement('div');
    div.className = 'bingo-cell';
    div.textContent = ALL_CELLS[cellId];

    if (lockedCells[pos] === 'A') {
      div.classList.add('locked-a');
      div.dataset.team = teams.A.name.slice(0, 6);
    } else if (lockedCells[pos] === 'B') {
      div.classList.add('locked-b');
      div.dataset.team = teams.B.name.slice(0, 6);
    } else if (!questionActive && revealPos.includes(pos)) {
      // Sau khi câu kết thúc – highlight đáp án đúng
      div.classList.add('reveal-answer');
      div.addEventListener('click', () => {}); // non-interactive
    } else if (wrongCellsByTeam[pos] && wrongCellsByTeam[pos].has(currentTeam)) {
      div.classList.add('wrong-guess');
    } else if (pos === selectedCell) {
      div.classList.add('selected');
      div.addEventListener('click', () => onCellClick(pos));
    } else {
      div.addEventListener('click', () => onCellClick(pos));
    }
    grid.appendChild(div);
  }
}

function onCellClick(pos) {
  if (!questionActive || lockedCells[pos] !== null) return;
  if (wrongCellsByTeam[pos] && wrongCellsByTeam[pos].has(currentTeam)) return;
  selectedCell = pos === selectedCell ? null : pos;
  renderGrid();
}

// ================================================================
// UI HELPERS
// ================================================================
function setStatus(msg) { document.getElementById('statusText').textContent = msg; }
function updateStatus(color, msg) { document.getElementById('statusDot').className = 'status-dot ' + color; setStatus(msg); }
function setQText(msg, isPlaceholder) {
  const el = document.getElementById('qText');
  el.textContent = msg;
  el.className = 'q-text' + (isPlaceholder ? ' placeholder' : '');
}
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ================================================================
// UTILS
// ================================================================
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Initial render
revealPos = [];
renderGrid();
</script>
