<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINGO An Toàn Mạng – Buổi 3</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #162032;
    --border: #334155;
    --accent-a: #f97316;
    --accent-b: #3b82f6;
    --gold: #fbbf24;
    --green: #22c55e;
    --red: #ef4444;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --cell-bg: #1e293b;
    --cell-border: #334155;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background stars */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 80%, rgba(255,255,255,0.12) 0%, transparent 100%),
      radial-gradient(2px 2px at 10% 70%, rgba(255,255,255,0.08) 0%, transparent 100%),
      radial-gradient(2px 2px at 90% 60%, rgba(255,255,255,0.08) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
  }

  /* HEADER */
  .header {
    text-align: center;
    padding: 16px 0 10px;
  }
  .header h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent-a), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .header p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  /* SCOREBOARD */
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: center;
    margin: 12px 0;
  }
  .team-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    transition: all 0.3s;
  }
  .team-card.active {
    border-color: var(--team-color);
    box-shadow: 0 0 20px -4px var(--team-color);
  }
  .team-card.team-a { --team-color: var(--accent-a); }
  .team-card.team-b { --team-color: var(--accent-b); }
  .team-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--team-color);
    margin-bottom: 2px;
  }
  .team-name {
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text);
  }
  .team-score {
    font-size: 2rem;
    font-weight: 800;
    font-family: 'Baloo 2', cursive;
    color: var(--team-color);
    line-height: 1;
  }
  .team-bingo-count {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .team-card.team-b { text-align: right; }

  .vs-badge {
    text-align: center;
  }
  .vs-badge .vs-text {
    font-family: 'Baloo 2', cursive;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--gold);
  }
  .turn-indicator {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 4px;
  }

  /* QUESTION PANEL */
  .question-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 20px;
    margin: 10px 0;
    min-height: 80px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .q-number {
    background: var(--active-team-color, var(--gold));
    color: #000;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: 1.1rem;
    min-width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .q-text {
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.4;
    color: var(--text);
    flex: 1;
  }
  .q-text.placeholder {
    color: var(--muted);
    font-weight: 400;
    font-style: italic;
  }

  /* TIMER */
  .timer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0;
  }
  .timer-bar-wrap {
    flex: 1;
    height: 10px;
    background: var(--card);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .timer-bar {
    height: 100%;
    border-radius: 99px;
    background: var(--green);
    transition: width 1s linear, background 0.3s;
    width: 100%;
  }
  .timer-bar.warn { background: var(--gold); }
  .timer-bar.danger { background: var(--red); }
  .timer-display {
    font-family: 'Baloo 2', cursive;
    font-size: 1.5rem;
    font-weight: 800;
    min-width: 48px;
    text-align: right;
    color: var(--text);
    transition: color 0.3s;
  }
  .timer-display.warn { color: var(--gold); }
  .timer-display.danger { color: var(--red); }

  /* CONTROLS */
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0;
  }
  .btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    padding: 9px 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.3px;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-primary { background: var(--accent-a); color: #fff; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-success { background: var(--green); color: #fff; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-blue { background: var(--accent-b); color: #fff; }
  .btn-gold { background: var(--gold); color: #000; }

  /* GRID */
  .grid-wrapper {
    position: relative;
  }
  .bingo-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 4px;
  }
  .bingo-cell {
    background: var(--cell-bg);
    border: 2px solid var(--cell-border);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    font-weight: 700;
    font-size: clamp(0.6rem, 1.5vw, 0.78rem);
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
    word-break: break-word;
    min-height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.3;
    user-select: none;
    position: relative;
  }
  .bingo-cell:hover:not(.locked-a):not(.locked-b) {
    border-color: var(--gold);
    background: #1e3a5f;
    transform: scale(1.03);
  }
  .bingo-cell.selected {
    border-color: var(--gold);
    background: rgba(251,191,36,0.15);
    box-shadow: 0 0 12px -4px var(--gold);
    transform: scale(1.04);
  }
  .bingo-cell.locked-a {
    background: rgba(249,115,22,0.18);
    border-color: var(--accent-a);
    color: #fed7aa;
    cursor: default;
  }
  .bingo-cell.locked-b {
    background: rgba(59,130,246,0.18);
    border-color: var(--accent-b);
    color: #bfdbfe;
    cursor: default;
  }
  .bingo-cell.locked-a::after,
  .bingo-cell.locked-b::after {
    content: attr(data-team);
    position: absolute;
    top: 3px;
    right: 5px;
    font-size: 0.55rem;
    font-weight: 800;
    letter-spacing: 1px;
    opacity: 0.8;
  }
  .bingo-cell.wrong-guess {
    background: #1a1a2e;
    border-color: #2a2a3e;
    color: #44445a;
    cursor: not-allowed;
    opacity: 0.55;
  }
  .bingo-cell.wrong-guess::before {
    content: '✗';
    position: absolute;
    top: 3px;
    left: 6px;
    font-size: 0.65rem;
    color: var(--red);
    opacity: 0.7;
  }
  /* BINGO line flash */
  .bingo-cell.bingo-flash {
    animation: bingoFlash 0.6s ease 3;
  }
  @keyframes bingoFlash {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); filter: brightness(1.4); }
  }

  /* FEEDBACK TOAST */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 12px 24px;
    font-weight: 700;
    font-size: 1rem;
    z-index: 100;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    text-align: center;
    max-width: 90vw;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.correct { border-color: var(--green); color: var(--green); }
  .toast.wrong { border-color: var(--red); color: var(--red); }
  .toast.timeout { border-color: var(--gold); color: var(--gold); }

  /* WIN SCREEN */
  .win-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
  }
  .win-overlay.show { display: flex; }
  .win-box {
    background: var(--card);
    border: 3px solid var(--gold);
    border-radius: 24px;
    padding: 40px 48px;
    max-width: 480px;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .win-emoji { font-size: 4rem; margin-bottom: 12px; }
  .win-title {
    font-family: 'Baloo 2', cursive;
    font-size: 2rem;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .win-subtitle {
    font-size: 1rem;
    color: var(--muted);
    margin-bottom: 24px;
  }

  /* STATUS BAR */
  .status-bar {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.8rem;
    color: var(--muted);
    margin: 6px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status-dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.orange { background: var(--accent-a); box-shadow: 0 0 6px var(--accent-a); }

  /* SETUP MODAL */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 28px 32px;
    max-width: 440px;
    width: 100%;
    animation: popIn 0.4s ease;
  }
  .modal-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 18px;
    color: var(--gold);
  }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--gold);
  }
  .form-group select option { background: var(--card); }

  @media (max-width: 600px) {
    .bingo-cell { min-height: 62px; font-size: 0.6rem; padding: 7px 3px; }
    .bingo-grid { gap: 5px; }
    .question-panel { padding: 10px 12px; gap: 10px; }
    .q-text { font-size: 0.9rem; }
    .scoreboard { gap: 6px; }
    .team-score { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<!-- SETUP MODAL -->
<div class="modal show" id="setupModal">
  <div class="modal-box">
    <div class="modal-title">🎮 Cài đặt trò chơi</div>
    <div class="form-group">
      <label>Tên Đội A 🔥</label>
      <input type="text" id="nameA" value="Đội Rồng Lửa" maxlength="20">
    </div>
    <div class="form-group">
      <label>Tên Đội B 💧</label>
      <input type="text" id="nameB" value="Đội Băng Tuyết" maxlength="20">
    </div>
    <div class="form-group">
      <label>Thời gian mỗi câu (giây)</label>
      <select id="timerSetting">
        <option value="15">15 giây</option>
        <option value="20" selected>20 giây</option>
        <option value="30">30 giây</option>
        <option value="45">45 giây</option>
        <option value="60">60 giây</option>
      </select>
    </div>
    <div class="form-group">
      <label>Điểm thưởng / câu đúng</label>
      <select id="scoreSetting">
        <option value="10" selected>+10 điểm</option>
        <option value="20">+20 điểm</option>
        <option value="50">+50 điểm</option>
      </select>
    </div>
    <div class="form-group">
      <label>Điểm trừ / hết giờ</label>
      <select id="penaltySetting">
        <option value="5">-5 điểm</option>
        <option value="10" selected>-10 điểm</option>
        <option value="0">Không trừ</option>
      </select>
    </div>
    <button class="btn btn-gold" style="width:100%; justify-content:center; font-size:1rem; padding:12px;" onclick="startGame()">
      🚀 Bắt đầu chơi!
    </button>
  </div>
</div>

<!-- WIN OVERLAY -->
<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <div class="win-emoji" id="winEmoji">🏆</div>
    <div class="win-title" id="winTitle">BINGO!</div>
    <div class="win-subtitle" id="winSubtitle">Chúc mừng!</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;">
      <button class="btn btn-gold" onclick="continueGame()">▶️ Tiếp tục chơi</button>
      <button class="btn btn-secondary" onclick="showSetup()">⚙️ Chơi lại từ đầu</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MAIN -->
<div class="container">
  <div class="header">
    <h1>🎲 BINGO AN TOÀN MẠNG</h1>
    <p>Buổi 3 · Tiếp sức 2 đội · Đội nào BINGO trước thắng!</p>
  </div>

  <!-- SCOREBOARD -->
  <div class="scoreboard">
    <div class="team-card team-a" id="cardA">
      <div class="team-label">🔥 Đội A</div>
      <div class="team-name" id="displayNameA">—</div>
      <div class="team-score" id="scoreA">0</div>
      <div class="team-bingo-count" id="bingoA">Chưa có BINGO</div>
    </div>
    <div class="vs-badge">
      <div class="vs-text">VS</div>
      <div class="turn-indicator" id="turnIndicator">Chưa bắt đầu</div>
    </div>
    <div class="team-card team-b" id="cardB">
      <div class="team-label">💧 Đội B</div>
      <div class="team-name" id="displayNameB">—</div>
      <div class="team-score" id="scoreB">0</div>
      <div class="team-bingo-count" id="bingoB">Chưa có BINGO</div>
    </div>
  </div>

  <!-- STATUS -->
  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Chờ bắt đầu...</span>
  </div>

  <!-- QUESTION -->
  <div class="question-panel">
    <div class="q-number" id="qNumber">?</div>
    <div class="q-text placeholder" id="qText">Bấm "Câu hỏi mới" để bắt đầu lượt chơi...</div>
  </div>

  <!-- TIMER -->
  <div class="timer-row">
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timerBar"></div>
    </div>
    <div class="timer-display" id="timerDisplay">—</div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="btn btn-primary" id="btnNewQ" onclick="newQuestion()">📢 Câu hỏi mới</button>
    <button class="btn btn-success" id="btnConfirm" onclick="confirmAnswer()" disabled>✅ Xác nhận đáp án</button>
    <button class="btn btn-secondary" onclick="shuffleBoard()">🔀 Xáo trộn bảng</button>
    <button class="btn btn-secondary" onclick="switchTurn()">🔄 Đổi lượt</button>
    <button class="btn btn-secondary" style="margin-left:auto;" onclick="showSetup()">⚙️</button>
  </div>

  <!-- BOARD -->
  <div class="grid-wrapper">
    <div class="bingo-grid" id="bingoGrid"></div>
  </div>

  <div style="height:20px;"></div>
</div>

<script>
// ========================
// DATA
// ========================
const ALL_QUESTIONS = [
  { q: "Bạn nhận được tin nhắn từ người lạ: 'Gửi ảnh riêng tư đi, tặng quà giá trị'. Bạn phải làm gì?", answers: [0, 14, 21] },
  { q: "Một tài khoản lạ nhắn: 'Tao là bạn mày, mất điện thoại, chuyển gấp 2 triệu vào số này'. Xử lý đúng?", answers: [2, 1] },
  { q: "Bạn bị nhóm bạn chế ảnh xấu, ghép ảnh nhạy cảm gửi vào group lớp. Hành động đầu tiên cần làm?", answers: [3, 15, 19] },
  { q: "Đang đi bộ về nhà, một người say rượu la hét chạy về phía bạn. Cách xử lý an toàn nhất?", answers: [4, 5, 18] },
  { q: "Bạn thân đòi mượn điện thoại xem tin nhắn với lý do 'thân thiết không nên giấu'. Cách từ chối đúng?", answers: [7, 8, 22] },
  { q: "Trên mạng có người hứa tặng điện thoại nếu bạn gửi ảnh trong phòng ngủ. Bạn sẽ làm gì?", answers: [0, 14, 21] },
  { q: "Phát hiện một người lớn quen biết đang grooming bạn (tặng quà, bảo giữ bí mật). Bạn làm gì?", answers: [12, 6, 11] },
  { q: "Khi bị người lạ đi xe máy bám theo nhiều phố, bạn nên làm điều gì?", answers: [5, 20, 13] },
  { q: "Bị bắt nạt qua mạng — việc quan trọng đầu tiên cần làm để có bằng chứng là gì?", answers: [3, 15, 1] },
  { q: "Người yêu nói: 'Nếu yêu thật thì phải cho xem ảnh riêng tư'. Phản ứng đúng của bạn?", answers: [17, 8, 16] },
];

const ALL_CELLS = [
  "📵 Không gửi ảnh riêng tư",        // 0
  "🚫 Chặn + báo cáo tài khoản lạ",   // 1
  "💀 Không chuyển tiền khi chưa xác nhận", // 2
  "🧾 Chụp màn hình bằng chứng",       // 3
  "🍺 Tránh xa người say rượu",         // 4
  "🏃 Vào nơi đông người khi bị theo dõi", // 5
  "👂 Kể với người lớn tin cậy",        // 6
  "🔒 Mật khẩu là riêng tư",           // 7
  "📢 Nói KHÔNG rõ ràng",              // 8
  "📞 Gọi 113 khi nguy hiểm",          // 9
  "🔞 Không hẹn gặp riêng người lạ mạng", // 10
  "📵 Không đăng story 'ở nhà một mình'", // 11
  "⚠️ Nhận biết grooming – kể ngay",   // 12
  "🚪 Không mở cửa cho người lạ",       // 13
  "📸 Không gửi ảnh dù được hứa quà",   // 14
  "🧠 Lưu bằng chứng trước khi xóa",   // 15
  "👥 Bắt nạt = lặp lại + mất cân bằng", // 16
  "🗣️ Từ chối: 'Yêu không phải làm mọi thứ'", // 17
  "🔥 Không đối đầu người say, tránh xa", // 18
  "🛑 Chặn & báo cáo ngay lập tức",    // 19
  "📞 Gọi bố mẹ nếu bị theo dõi",      // 20
  "🎭 Ảnh đã gửi mất kiểm soát vĩnh viễn", // 21
  "📲 Không chia sẻ mật khẩu",         // 22
  "🚨 Báo công an nếu bị khống chế",   // 23
  "📞 Gọi 1800 1567 khi cần giúp",     // 24
];

// ========================
// STATE
// ========================
let config = { timerSec: 20, scorePerQ: 10, penalty: 10 };
let teams = {
  A: { name: 'Đội A', score: 0, bingo: 0 },
  B: { name: 'Đội B', score: 0, bingo: 0 },
};
let currentTeam = 'A';
let boardOrder = [...Array(25).keys()]; // indices into ALL_CELLS
let lockedCells = new Array(25).fill(null); // null | 'A' | 'B'
// wrongCells[pos] = Set of teams that already guessed this pos wrong for current question
let wrongCells = Array.from({length: 25}, () => new Set());
let selectedCell = null;
let questionQueue = [];
let currentQ = null;
let questionIndex = 0;
let timerInterval = null;
let timerLeft = 0;
let gameStarted = false;
let questionActive = false;
// true when question is handed to other team after a wrong answer (same question, other team tries)
let contestedQuestion = false;

// ========================
// SETUP
// ========================
function startGame() {
  teams.A.name = document.getElementById('nameA').value.trim() || 'Đội A';
  teams.B.name = document.getElementById('nameB').value.trim() || 'Đội B';
  config.timerSec = +document.getElementById('timerSetting').value;
  config.scorePerQ = +document.getElementById('scoreSetting').value;
  config.penalty = +document.getElementById('penaltySetting').value;

  teams.A.score = 0; teams.A.bingo = 0;
  teams.B.score = 0; teams.B.bingo = 0;
  currentTeam = 'A';
  lockedCells = new Array(25).fill(null);
  wrongCells = Array.from({length: 25}, () => new Set());
  selectedCell = null;
  questionActive = false;
  contestedQuestion = false;
  questionQueue = shuffle([...ALL_QUESTIONS]);
  questionIndex = 0;
  boardOrder = shuffle([...Array(25).keys()]);
  gameStarted = true;

  document.getElementById('setupModal').classList.remove('show');
  stopTimer();
  renderAll();
  updateStatus('green', `🎮 Game bắt đầu! Lượt đầu: ${teams[currentTeam].name}`);
  setStatus('Bấm "Câu hỏi mới" để bắt đầu!');
}

function showSetup() {
  stopTimer();
  document.getElementById('setupModal').classList.add('show');
}

// ========================
// CORE GAME
// ========================
function newQuestion() {
  if (!gameStarted) return;
  if (questionActive) {
    showToast('⚠️ Hãy xác nhận đáp án câu hiện tại trước!', 'wrong'); return;
  }
  if (questionIndex >= questionQueue.length) {
    questionQueue = shuffle([...ALL_QUESTIONS]);
    questionIndex = 0;
    showToast('🔁 Câu hỏi đã được xáo trộn lại!', 'timeout');
  }
  currentQ = questionQueue[questionIndex++];
  selectedCell = null;
  questionActive = true;
  contestedQuestion = false;
  // Reset wrongCells for new question
  wrongCells = Array.from({length: 25}, () => new Set());
  renderAll();
  document.getElementById('btnConfirm').disabled = false;
  startTimer();

  const qEl = document.getElementById('qText');
  qEl.classList.remove('placeholder');
  qEl.textContent = currentQ.q;
  document.getElementById('qNumber').textContent = questionIndex;
  updateStatus('orange', `🟠 ${teams[currentTeam].name} đang trả lời...`);
}

function confirmAnswer() {
  if (!questionActive) return;
  stopTimer();
  questionActive = false;
  document.getElementById('btnConfirm').disabled = true;

  if (selectedCell === null) {
    showToast(`⏰ Hết giờ / Chưa chọn ô! ${teams[currentTeam].name} bị trừ điểm.`, 'timeout');
    teams[currentTeam].score = Math.max(0, teams[currentTeam].score - config.penalty);
    // If contested (other team already tried), question is dead — move on
    if (contestedQuestion) {
      contestedQuestion = false;
      updateStatus('green', `Câu hỏi kết thúc. Bấm "Câu hỏi mới"!`);
    } else {
      // Hand off to other team — they get to try same question
      const otherTeam = currentTeam === 'A' ? 'B' : 'A';
      contestedQuestion = true;
      currentTeam = otherTeam;
      selectedCell = null;
      questionActive = true;
      document.getElementById('btnConfirm').disabled = false;
      startTimer();
      updateStatus('orange', `🔁 ${teams[currentTeam].name} được thử câu này!`);
      renderAll();
    }
    renderAll();
    return;
  }

  const correctAnswerIndices = currentQ.answers;
  const actualCellId = boardOrder[selectedCell];
  const isCorrect = correctAnswerIndices.includes(actualCellId);

  if (isCorrect) {
    lockedCells[selectedCell] = currentTeam;
    teams[currentTeam].score += config.scorePerQ;
    contestedQuestion = false;
    showToast(`✅ ĐÚNG RỒI! +${config.scorePerQ} điểm cho ${teams[currentTeam].name}!`, 'correct');
    checkBingo();
    selectedCell = null;
    renderAll();
  } else {
    // Mark this cell as wrong for current team so they can't pick it again
    wrongCells[selectedCell].add(currentTeam);
    teams[currentTeam].score = Math.max(0, teams[currentTeam].score - config.penalty);

    if (contestedQuestion) {
      // Both teams have now tried — question is done, no point awarded
      contestedQuestion = false;
      showToast(`❌ SAI! Cả hai đội đều sai câu này. Câu mới!`, 'wrong');
      selectedCell = null;
      renderAll();
      updateStatus('green', `Câu hỏi kết thúc. Bấm "Câu hỏi mới"!`);
    } else {
      // First wrong — hand off to other team with same question
      const otherTeam = currentTeam === 'A' ? 'B' : 'A';
      contestedQuestion = true;
      currentTeam = otherTeam;
      selectedCell = null;
      questionActive = true;
      document.getElementById('btnConfirm').disabled = false;
      showToast(`❌ SAI! Câu hỏi chuyển sang ${teams[currentTeam].name}!`, 'wrong');
      startTimer();
      updateStatus('orange', `🔁 ${teams[currentTeam].name} được thử câu này!`);
      renderAll();
    }
  }
}

function switchTurn() {
  currentTeam = currentTeam === 'A' ? 'B' : 'A';
  setStatus(`Lượt của ${teams[currentTeam].name} — bấm "Câu hỏi mới"!`);
}

// ========================
// TIMER
// ========================
function startTimer() {
  timerLeft = config.timerSec;
  renderTimer();
  timerInterval = setInterval(() => {
    timerLeft--;
    renderTimer();
    if (timerLeft <= 0) {
      stopTimer();
      timeoutHandler();
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function timeoutHandler() {
  if (!questionActive) return;
  questionActive = false;
  document.getElementById('btnConfirm').disabled = true;
  teams[currentTeam].score = Math.max(0, teams[currentTeam].score - config.penalty);
  selectedCell = null;

  if (contestedQuestion) {
    // Both teams failed — done
    contestedQuestion = false;
    showToast(`⏰ Hết giờ! Cả hai đội đều không trả lời được!`, 'timeout');
    updateStatus('green', `Câu hỏi kết thúc. Bấm "Câu hỏi mới"!`);
    renderAll();
  } else {
    // Hand off to other team
    const otherTeam = currentTeam === 'A' ? 'B' : 'A';
    contestedQuestion = true;
    currentTeam = otherTeam;
    questionActive = true;
    document.getElementById('btnConfirm').disabled = false;
    showToast(`⏰ Hết giờ! Câu hỏi chuyển sang ${teams[currentTeam].name}!`, 'timeout');
    startTimer();
    updateStatus('orange', `🔁 ${teams[currentTeam].name} được thử câu này!`);
    renderAll();
  }
}

function renderTimer() {
  const bar = document.getElementById('timerBar');
  const display = document.getElementById('timerDisplay');
  const pct = (timerLeft / config.timerSec) * 100;
  bar.style.width = pct + '%';
  display.textContent = timerLeft + 's';
  const cls = timerLeft <= 5 ? 'danger' : timerLeft <= 10 ? 'warn' : '';
  bar.className = 'timer-bar' + (cls ? ' ' + cls : '');
  display.className = 'timer-display' + (cls ? ' ' + cls : '');
}

// ========================
// BINGO CHECK
// ========================
function checkBingo() {
  const size = 5;
  const lines = [];
  // rows
  for (let r = 0; r < 5; r++) lines.push([...Array(5)].map((_, c) => r*5+c));
  // cols
  for (let c = 0; c < 5; c++) lines.push([...Array(5)].map((_, r) => r*5+c));
  // diagonals
  lines.push([0,6,12,18,24]);
  lines.push([4,8,12,16,20]);

  for (const line of lines) {
    if (line.every(i => lockedCells[i] === currentTeam)) {
      // BINGO!
      teams[currentTeam].bingo++;
      highlightBingoLine(line);
      setTimeout(() => showWin(line), 600);
      return;
    }
  }
}

function highlightBingoLine(line) {
  const cells = document.querySelectorAll('.bingo-cell');
  line.forEach(i => cells[i] && cells[i].classList.add('bingo-flash'));
}

function showWin(line) {
  const t = teams[currentTeam];
  document.getElementById('winEmoji').textContent = currentTeam === 'A' ? '🔥' : '💧';
  document.getElementById('winTitle').textContent = `BINGO! ${t.name} thắng!`;
  document.getElementById('winSubtitle').textContent = `Điểm: ${t.score} | BINGO lần ${t.bingo} 🎉\nCả lớp vỗ tay nào!`;
  document.getElementById('winOverlay').classList.add('show');
  stopTimer();
  questionActive = false;
}

function continueGame() {
  document.getElementById('winOverlay').classList.remove('show');
  switchTurn();
  setStatus(`Tiếp tục! Lượt của ${teams[currentTeam].name}.`);
  renderAll();
}

// ========================
// SHUFFLE BOARD
// ========================
function shuffleBoard() {
  if (questionActive) {
    showToast('⚠️ Không thể xáo trộn khi đang có câu hỏi!', 'wrong'); return;
  }
  // Re-map locked cells
  const newOrder = shuffle([...Array(25).keys()]);
  const newLocked = new Array(25).fill(null);
  for (let newPos = 0; newPos < 25; newPos++) {
    const cellId = newOrder[newPos];
    const oldPos = boardOrder.indexOf(cellId);
    if (oldPos !== -1) newLocked[newPos] = lockedCells[oldPos];
  }
  boardOrder = newOrder;
  lockedCells = newLocked;
  selectedCell = null;
  renderGrid();
  showToast('🔀 Bảng đã được xáo trộn!', 'timeout');
}

// ========================
// RENDER
// ========================
function renderAll() {
  renderScoreboard();
  renderGrid();
  renderTurnIndicator();
  renderTimer();
}

function renderScoreboard() {
  document.getElementById('displayNameA').textContent = teams.A.name;
  document.getElementById('displayNameB').textContent = teams.B.name;
  document.getElementById('scoreA').textContent = teams.A.score;
  document.getElementById('scoreB').textContent = teams.B.score;
  document.getElementById('bingoA').textContent = teams.A.bingo > 0 ? `🎉 BINGO x${teams.A.bingo}` : 'Chưa có BINGO';
  document.getElementById('bingoB').textContent = teams.B.bingo > 0 ? `🎉 BINGO x${teams.B.bingo}` : 'Chưa có BINGO';

  document.getElementById('cardA').classList.toggle('active', currentTeam === 'A');
  document.getElementById('cardB').classList.toggle('active', currentTeam === 'B');

  // Q number color + contested badge
  document.getElementById('qNumber').style.background =
    currentTeam === 'A' ? 'var(--accent-a)' : 'var(--accent-b)';
  const qEl = document.getElementById('qText');
  if (contestedQuestion && questionActive) {
    qEl.style.borderLeft = `3px solid ${currentTeam === 'A' ? 'var(--accent-a)' : 'var(--accent-b)'}`;
    qEl.style.paddingLeft = '10px';
  } else {
    qEl.style.borderLeft = '';
    qEl.style.paddingLeft = '';
  }
}

function renderTurnIndicator() {
  const el = document.getElementById('turnIndicator');
  if (!gameStarted) { el.textContent = 'Chưa bắt đầu'; return; }
  el.textContent = `Lượt: ${teams[currentTeam].name}`;
}

function renderGrid() {
  const grid = document.getElementById('bingoGrid');
  grid.innerHTML = '';
  for (let pos = 0; pos < 25; pos++) {
    const cellId = boardOrder[pos];
    const div = document.createElement('div');
    div.className = 'bingo-cell';
    div.textContent = ALL_CELLS[cellId];

    if (lockedCells[pos] === 'A') {
      div.classList.add('locked-a');
      div.dataset.team = teams.A.name.slice(0,6);
    } else if (lockedCells[pos] === 'B') {
      div.classList.add('locked-b');
      div.dataset.team = teams.B.name.slice(0,6);
    } else if (wrongCells[pos] && wrongCells[pos].has(currentTeam)) {
      // This team already guessed this cell wrong — grey out, unclickable
      div.classList.add('wrong-guess');
      div.title = 'Đã chọn sai ô này';
    } else if (pos === selectedCell) {
      div.classList.add('selected');
      div.addEventListener('click', () => onCellClick(pos));
    } else {
      div.addEventListener('click', () => onCellClick(pos));
    }
    grid.appendChild(div);
  }
}

function onCellClick(pos) {
  if (!questionActive || lockedCells[pos] !== null) return;
  if (wrongCells[pos] && wrongCells[pos].has(currentTeam)) return; // already guessed wrong
  selectedCell = pos === selectedCell ? null : pos;
  renderGrid();
}

// ========================
// UI HELPERS
// ========================
function setStatus(msg) {
  document.getElementById('statusText').textContent = msg;
}
function updateStatus(color, msg) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + color;
  setStatus(msg);
}
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ========================
// UTILS
// ========================
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Initial render (before setup)
renderGrid();
</script>
