<!DOCTYPE html>
<html lang="vi">

<style>
:root {
  --ink: #0a1a2f;
  --ink2: #0f2a3f;
  --ink3: #1a3a4f;
  --paper: #f0f4f8;
  --paper2: #e2e8f0;
  --gold: #e6b800;
  --gold2: #ffd700;
  --navy: #1e3a5f;
  --navy-light: #2c5282;
  --jade: #2c7a4d;
  --mist: #8ba0b0;
  --mist2: #6b7f8f;
  --sidebar-w: 280px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--ink); color:var(--paper); height:100vh; overflow:hidden; }

  .app { display:flex; height:100vh; }

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  background: var(--ink2);
  border-right: 1px solid rgba(230,184,0,0.12);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 18px 16px 14px;
  border-bottom: 1px solid rgba(230,184,0,0.1);
  flex-shrink: 0;
}
.brand { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.brand-icon {
  width:36px; height:36px;
  background: linear-gradient(135deg, var(--navy), var(--gold));
  border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; color:white;
  flex-shrink:0;
}
.brand-text h1 { font-size:14px; font-weight:700; color:var(--paper); }
.brand-text p { font-size:10px; color:var(--gold); font-weight:600; letter-spacing:0.8px; text-transform:uppercase; }

.level-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.ltab {
  padding: 4px 10px;
  border: 1px solid rgba(230,184,0,0.25);
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  color: var(--mist);
  cursor: pointer;
  background: transparent;
  transition: all 0.2s;
}
.ltab:hover { color: var(--gold); border-color: var(--gold); }
.ltab.active { background: var(--navy); border-color: var(--gold); color: var(--gold); }

.sidebar-progress {
  padding: 10px 16px;
  border-bottom: 1px solid rgba(230,184,0,0.08);
  flex-shrink: 0;
}
.progress-label { font-size:10px; color:var(--mist); font-weight:600; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px; display:flex; justify-content:space-between; }
.progress-bar { height:4px; background:rgba(255,255,255,0.08); border-radius:2px; }
.progress-fill { height:100%; background:linear-gradient(90deg, var(--navy), var(--gold)); border-radius:2px; transition:width 0.5s ease; }

.lesson-list { flex:1; overflow-y:auto; padding:8px; scrollbar-width:thin; }
.lesson-list::-webkit-scrollbar { width:3px; }
.lesson-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 2px;
}
.lesson-item:hover { background: rgba(230,184,0,0.07); }
.lesson-item.active { background: rgba(30,58,95,0.5); }
.lesson-item.completed .lesson-num { background: var(--jade); color: white; }
.lesson-item.active .lesson-num { background: var(--navy-light); color: var(--gold); }
.lesson-emoji { font-size:16px; flex-shrink:0; width:20px; text-align:center; }
.lesson-info { flex:1; min-width:0; }
.lesson-title { font-size:12px; font-weight:600; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lesson-item.completed .lesson-title { color: var(--mist); }
.lesson-goal { font-size:10px; color:var(--mist2); margin-top:1px; }
.lesson-num {
  width:18px; height:18px;
  background: rgba(255,255,255,0.08);
  border-radius:50%;
  font-size:9px;
  font-weight:700;
  color:var(--mist);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}

/* MAIN */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }

.topbar {
  padding: 12px 20px;
  border-bottom: 1px solid rgba(230,184,0,0.12);
  background: rgba(10,26,47,0.97);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.lesson-context { flex:1; }
.lesson-context h2 { font-size:14px; font-weight:700; color:var(--paper); }
.lesson-context p { font-size:11px; color:var(--mist2); margin-top:1px; }
.topbar-actions { display:flex; gap:8px; align-items:center; }
.level-badge { padding:5px 10px; background:rgba(30,58,95,0.5); border:1px solid rgba(230,184,0,0.3); border-radius:8px; font-size:10px; font-weight:700; color:var(--gold); }
.tb-btn {
  padding:6px 12px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  background: rgba(230,184,0,0.1);
  border:1px solid rgba(230,184,0,0.25);
  color:var(--gold);
}
.tb-btn.reset { background:transparent; border:1px solid rgba(255,255,255,0.1); color:var(--mist); }
.tb-btn.reset:hover { border-color:var(--gold); color:var(--gold); }

.mode-pills {
  display: flex;
  gap: 6px;
  padding: 10px 20px;
  background: rgba(10,26,47,0.6);
  border-bottom: 1px solid rgba(230,184,0,0.07);
  flex-shrink: 0;
  overflow-x: auto;
}
.mode-pills::-webkit-scrollbar { display:none; }
.mpill {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.07);
  background: transparent;
  color: var(--mist);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.mpill:hover { background:rgba(255,255,255,0.06); color:var(--paper); }
.mpill.active { background:rgba(230,184,0,0.12); border-color:rgba(230,184,0,0.35); color:var(--gold); }

.chat-area {
  flex:1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scrollbar-width: thin;
}

.lesson-card {
  background: linear-gradient(135deg, rgba(31,58,95,0.95), rgba(15,42,63,0.9));
  border: 1px solid rgba(230,184,0,0.2);
  border-radius: 18px;
  padding: 24px;
  animation: fadeUp 0.4s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.lc-header { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.lc-emoji { font-size:40px; }
.lc-meta h3 { font-size:18px; font-weight:700; color:var(--paper); }
.lc-meta p { font-size:12px; color:var(--gold); margin-top:3px; }
.lc-goal {
  background: rgba(230,184,0,0.08);
  border: 1px solid rgba(230,184,0,0.15);
  border-radius: 10px;
  padding: 10px 14px;
  font-size:12px;
  color: var(--paper);
  margin-bottom: 16px;
}
.lc-goal span { color:var(--gold); font-size:14px; }
.lc-topics { margin-bottom:18px; }
.lc-topics h4 { font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--mist); font-weight:700; margin-bottom:8px; }
.topic-tags { display:flex; flex-wrap:wrap; gap:6px; }
.topic-tag {
  padding:4px 10px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:6px;
  font-size:11px;
  color:var(--paper);
}
.lc-actions { display:flex; gap:8px; flex-wrap:wrap; }
.lc-btn {
  padding:9px 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  border:none;
}
.lc-btn.primary { background:var(--navy); border:1px solid var(--gold); color:var(--gold); }
.lc-btn.primary:hover { background:var(--navy-light); }
.lc-btn.secondary { background:rgba(230,184,0,0.1); border:1px solid rgba(230,184,0,0.3); color:var(--gold); }

.message { display:flex; gap:10px; animation:fadeUp 0.3s ease; }
.message.user { flex-direction:row-reverse; }
.av { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; font-weight:600; }
.av.bot { background:linear-gradient(135deg,var(--navy),var(--gold)); color:white; }
.av.user { background:rgba(255,255,255,0.1); color:var(--paper); }
.bubble { max-width:78%; padding:11px 15px; border-radius:14px; font-size:13.5px; line-height:1.7; }
.message.bot .bubble { background:var(--ink2); border:1px solid rgba(230,184,0,0.12); color:var(--paper); border-radius:4px 14px 14px 14px; }
.message.user .bubble { background:var(--navy); color:white; border-radius:14px 4px 14px 14px; }
.bubble .vc { background:rgba(230,184,0,0.07); border-left:3px solid var(--gold); border-radius:8px; padding:10px 12px; margin:8px 0; }
.bubble .en { font-size:16px; font-weight:700; color:var(--gold); display:block; margin-bottom:3px; }
.bubble .vi { font-size:12px; color:var(--mist); }

.tts-bar {
  display:none;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  background:rgba(44,82,130,0.2);
  border:1px solid rgba(230,184,0,0.2);
  border-radius:8px;
  font-size:11px;
  color:var(--gold);
  margin-bottom:8px;
}
.tts-bar.active { display:flex; }
.tts-waves { display:flex; gap:3px; align-items:center; }
.tts-wave { width:3px; background:var(--gold); border-radius:2px; animation:wave 0.8s infinite; }
.tts-wave:nth-child(1){height:8px}
.tts-wave:nth-child(2){height:14px;animation-delay:.1s}
.tts-wave:nth-child(3){height:10px;animation-delay:.2s}
@keyframes wave{0%,100%{transform:scaleY(0.5)}50%{transform:scaleY(1)}}

.input-area {
  padding:14px 20px;
  border-top:1px solid rgba(230,184,0,0.1);
  background:rgba(10,26,47,0.98);
  flex-shrink:0;
}
.input-row { display:flex; gap:8px; align-items:flex-end; }
.input-box {
  flex:1;
  background:var(--ink2);
  border:1.5px solid rgba(230,184,0,0.2);
  border-radius:14px;
  padding:11px 15px;
  color:var(--paper);
  font-size:13.5px;
  font-family:'Inter',sans-serif;
  resize:none;
  outline:none;
  min-height:44px;
  max-height:110px;
}
.icon-btn {
  width:44px; height:44px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-size:17px;
  display:flex; align-items:center; justify-content:center;
}
.mic-btn { background:var(--ink2); border:1.5px solid rgba(230,184,0,0.25); color:var(--gold); }
.mic-btn.listening { background:#2c7a4d; color:white; animation:pulse 1s infinite; }
.send-btn { background:var(--navy); border:1px solid var(--gold); color:var(--gold); }
.send-btn:hover { background:var(--navy-light); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

.input-hints { margin-top:8px; display:flex; justify-content:space-between; align-items:center; font-size:10.5px; color:var(--mist2); }
.hint-left { display:flex; gap:14px; align-items:center; }
.toggle-row { display:flex; align-items:center; gap:5px; cursor:pointer; }
.toggle-row input { display:none; }
.tr-track { width:28px; height:15px; background:rgba(255,255,255,0.08); border-radius:8px; position:relative; }
.tr-track::after { content:''; position:absolute; top:2px; left:2px; width:11px; height:11px; background:var(--mist2); border-radius:50%; transition:.2s; }
.toggle-row input:checked + .tr-track { background:rgba(44,82,130,0.5); }
.toggle-row input:checked + .tr-track::after { left:15px; background:var(--gold); }

.next-step { margin-top:12px; padding:10px 12px; background:rgba(44,82,130,0.2); border-radius:10px; font-size:12px; }
.next-btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.next-btn {
  padding:5px 12px;
  background:rgba(230,184,0,0.15);
  border:1px solid rgba(230,184,0,0.25);
  border-radius:20px;
  font-size:11px;
  font-weight:600;
  color:var(--gold);
  cursor:pointer;
}
.voice-overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(10,20,35,0.95);
  z-index:100;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:20px;
  backdrop-filter:blur(8px);
}
.voice-overlay.active { display:flex; }
.voice-orb {
  width:120px; height:120px;
  border-radius:50%;
  background: radial-gradient(circle, var(--navy-light), var(--gold));
  display:flex; align-items:center; justify-content:center;
  font-size:44px;
  cursor:pointer;
  animation:orbPulse 2s infinite;
}
.voice-orb.listening { animation:orbListen 0.8s infinite; background:radial-gradient(circle, #2c7a4d, #2c7a4d80); }
@keyframes orbPulse{0%,100%{box-shadow:0 0 0 0 rgba(30,58,95,0.4)}50%{box-shadow:0 0 0 20px rgba(30,58,95,0)}}
@keyframes orbListen{0%,100%{box-shadow:0 0 0 0 rgba(44,82,130,0.5)}50%{box-shadow:0 0 0 25px rgba(44,82,130,0)}}
.voice-status { font-size:16px; font-weight:600; color:var(--paper); }
.voice-close { padding:10px 28px; background:transparent; border:1.5px solid rgba(255,255,255,0.2); border-radius:30px; color:var(--mist); cursor:pointer; }

@media(max-width:768px){
  .sidebar { position:fixed; left:0; top:0; height:100vh; z-index:50; transform:translateX(-100%); transition:transform 0.3s; }
  .sidebar.open { transform:translateX(0); }
  .sidebar-toggle { display:flex; width:36px; height:36px; background:rgba(230,184,0,0.1); border-radius:8px; color:var(--gold); align-items:center; justify-content:center; cursor:pointer; }
  .bubble { max-width:90%; }
}
  /* ===== CLICK-TO-SPEAK ===== */
.speakable {
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.15s;
  display: inline;
}
.speakable:hover {
  background: rgba(230,184,0,0.18);
}
.speakable.speaking {
  background: rgba(230,184,0,0.28);
  outline: 1.5px solid var(--gold);
}
.speak-hint {
  font-size: 10px;
  color: var(--mist2);
  margin: 4px 0 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}
</style>
</head>

        <button class="icon-btn mic-btn" id="micBtn" onclick="startSTT()">🎤</button>

      </div>
      <div class="input-hints">

        </div>
        <span>Enter to send · Shift+Enter new line</span>
      </div>
    </div>
  </div>
</div>

let currentLevel = 1, currentLessonIdx = 0, currentMode = 'lesson';
let conversationHistory = [], isTyping = false, ttsEnabled = true, autoMicEnabled = false;
let recognition = null, voiceModeActive = false, voiceListening = false;
let progress = JSON.parse(localStorage.getItem('english_progress') || '{}');

function init() { renderLessonList(); loadLesson(0); updateProgress(); }
function renderLessonList() {
  const lessons = CURRICULUM[currentLevel].lessons;
  document.getElementById('lessonList').innerHTML = lessons.map((l,i)=>{
    const key = `${currentLevel}-${i}`;
    return `<div class="lesson-item ${progress[key]?'completed':''} ${i===currentLessonIdx?'active':''}" onclick="loadLesson(${i})">
      <span class="lesson-emoji">${l.emoji}</span><div class="lesson-info"><div class="lesson-title">${l.title}</div><div class="lesson-goal">${l.goal}</div></div>

}
function loadLesson(idx) {
  currentLessonIdx = idx; conversationHistory = [];
  const l = CURRICULUM[currentLevel].lessons[idx];
  document.getElementById('topbarTitle').innerHTML = `${l.emoji} Lesson ${idx+1} · ${l.title}`;
  document.getElementById('topbarGoal').innerHTML = `${l.goal} · ${CURRICULUM[currentLevel].name}`;
  document.getElementById('levelBadge').innerHTML = CURRICULUM[currentLevel].name;
  renderLessonList();
  document.getElementById('chatArea').innerHTML = `<div class="lesson-card">
    <div class="lc-header"><div class="lc-emoji">${l.emoji}</div><div class="lc-meta"><h3>Lesson ${idx+1}: ${l.title}</h3><p>${CURRICULUM[currentLevel].name} · ${CURRICULUM[currentLevel].desc}</p></div></div>
    <div class="lc-goal"><span>🎯</span> Goal: ${l.goal}</div>
    <div class="lc-topics"><h4>Topics</h4><div class="topic-tags">${l.topics.map(t=>`<span class="topic-tag">${t}</span>`).join('')}</div></div>

}
function startLesson() { clearAndSend(`Teach me "${CURRICULUM[currentLevel].lessons[currentLessonIdx].title}" for ${CURRICULUM[currentLevel].name} level. Include: 1) Introduction, 2) Key vocabulary (8-10 words with examples), 3) Key sentences, 4) Sample dialogue, 5) Practice suggestions.`); }
function doQuiz() { clearAndSend(`Create a quiz for "${CURRICULUM[currentLevel].lessons[currentLessonIdx].title}" (${CURRICULUM[currentLevel].name}): 5 multiple choice, 3 fill-in-blank, 2 translation tasks.`); markDone(); }
function doConvo() { clearAndSend(`Role-play conversation about "${CURRICULUM[currentLevel].lessons[currentLessonIdx].title}". Start with a situation, then speak one English sentence and wait for my response.`); }
function clearAndSend(prompt) { document.getElementById('chatArea').innerHTML = ''; sendAutoMessage(prompt); }
function setLevel(lvl,btn) {
  currentLevel = lvl; currentLessonIdx = 0; conversationHistory = [];

}
function setMode(mode,btn) {
  currentMode = mode;
  document.querySelectorAll('.mpill').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  if(mode==='lesson'){ loadLesson(currentLessonIdx); return; }
  if(mode==='quiz'){ doQuiz(); return; }
  if(mode==='convo'){ doConvo(); return; }
  clearAndSend(mode==='vocab'?`Teach me vocabulary for "${CURRICULUM[currentLevel].lessons[currentLessonIdx].title}" (10 words + examples).`:
               mode==='grammar'?`Explain key grammar for "${CURRICULUM[currentLevel].lessons[currentLessonIdx].title}" with formulas and examples.`:
               mode==='pronunciation'?`I want to practice pronunciation. Teach me the sounds in English and correct my speaking.`:

function markDone() { progress[`${currentLevel}-${currentLessonIdx}`]=true; localStorage.setItem('english_progress',JSON.stringify(progress)); updateProgress(); renderLessonList(); }
function updateProgress() {
  const lessons = CURRICULUM[currentLevel].lessons;
  const done = lessons.filter((_,i)=>progress[`${currentLevel}-${i}`]).length;
  const pct = Math.round(done/lessons.length*100);
  document.getElementById('progressLabel').innerHTML = `Progress ${CURRICULUM[currentLevel].name}`;
  document.getElementById('progressPct').innerHTML = `${pct}%`;
  document.getElementById('progressFill').style.width = pct+'%';
}
function getSystemPrompt() {
  const lvl = CURRICULUM[currentLevel];
  const lesson = lvl.lessons[currentLessonIdx];
  return `You are "Ms. Emily", an experienced English tutor teaching Vietnamese students according to CEFR. Student level: ${lvl.name} (${lvl.desc} - ${lvl.totalWords} words). Current lesson: "${lesson.title}" (Goal: ${lesson.goal}).

PRINCIPLES:

- Present English sentences clearly, format: "English sentence - Vietnamese meaning"
- For vocabulary: show example sentence after each word

MODE: ${currentMode.toUpperCase()}
${currentMode==='pronunciation'?'This is PRONUNCIATION mode. After user speaks, analyze sounds (th/r/l/vowels), compare with Vietnamese sounds, give specific improvement tips.':''}

Always end long responses with 2-3 specific next-step suggestions.`;

function addBotMessage(msg) {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div'); div.className='message bot';
  div.innerHTML = `<div class="av bot">🇬🇧</div><div class="bubble">${formatMessage(msg)}</div>`;

}
function addUserMessage(msg) {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div'); div.className='message user';
  div.innerHTML = `<div class="av user">👤</div><div class="bubble">${escapeHtml(msg)}</div>`;
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
}
function formatMessage(t) {
  t = t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  const lines = t.split('\n');
  return lines.map(l=>{
    if(l.includes(' - ') && !l.includes('```')){
      const parts = l.split(' - ');
      if(parts.length>=2) return `<div class="vc"><span class="en">📖 ${parts[0].trim()}</span><span class="vi">→ ${parts.slice(1).join(' - ')}</span></div>`;
    }
    return l || '<br>';
  }).join('<br>');
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function showTyping(){ const c=document.getElementById('chatArea'); const t=document.createElement('div'); t.className='typing'; t.id='typingDots'; t.innerHTML=`<div class="av bot">🇬🇧</div><div class="bubble" style="background:var(--ink2);padding:12px;"><div class="typing-dots" style="display:flex;gap:5px;"><div class="dot" style="width:7px;height:7px;background:var(--gold);border-radius:50%;animation:bounce 1.2s infinite;"></div><div class="dot" style="animation-delay:.15s"></div><div class="dot" style="animation-delay:.3s"></div></div></div>`; c.appendChild(t); c.scrollTop=c.scrollHeight; }
function removeTyping(){ const t=document.getElementById('typingDots'); if(t)t.remove(); }

  async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isTyping) return;
  input.value = '';
  input.style.height = 'auto';
  await sendAutoMessage(text);
}
async function sendAutoMessage(prompt) {
  if (isTyping) return;
  conversationHistory.push({role:'user', content:prompt});
  addUserMessage(prompt);
  showTyping();
  isTyping = true;
  document.getElementById('sendBtn').disabled = true;
  
  try {
    const messages = [
      { role: 'system', content: getSystemPrompt() },
      ...conversationHistory.map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }))
    ];
    
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer 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`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: messages,
        max_tokens: 1200,
        temperature: 0.7
      })
    });
    
    const data = await response.json();
    removeTyping();
    
    if (data.error) {
      addBotMessage(`⚠️ Lỗi API: ${data.error.message}`);
    } else if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      conversationHistory.push({role:'assistant', content:reply});
      addBotMessage(reply);
      addNextSteps();
    } else {
      addBotMessage('⚠️ Không nhận được phản hồi. Thử lại nhé!');
    }
  } catch (error) {
    removeTyping();
    addBotMessage('⚠️ Lỗi kết nối. Kiểm tra API Key hoặc mạng!');
    console.error(error);
  }
  
  isTyping = false;
  document.getElementById('sendBtn').disabled = false;
}
  
function addNextSteps() {
  const chat=document.getElementById('chatArea');
  const ns=document.createElement('div'); ns.className='next-step';
  ns.innerHTML=`<strong>🚀 Next steps</strong><div class="next-btns">
    <button class="next-btn" onclick="sendAutoMessage('Give me more exercises for this topic')">➕ More exercises</button>
    <button class="next-btn" onclick="doQuiz()">✅ Quiz</button>
    <button class="next-btn" onclick="doConvo()">🗣️ Practice conversation</button>
  </div>`;
  chat.appendChild(ns); chat.scrollTop=chat.scrollHeight;
}
function speakText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();

  const lines = text.replace(/<[^>]+>/g, '').split('\n');
  const englishLines = lines.filter(line => {
    const trimmed = line.trim();
    if (!trimmed) return false;
    const ascii = (trimmed.match(/[a-zA-Z0-9\s.,!?'"]/g) || []).length;
    return ascii / trimmed.length > 0.7;
  });
  let cleanText = englishLines.join('. ').substring(0, 200);
  if (!cleanText) return;

  const bar = document.getElementById('ttsBar');
  if (bar) bar.classList.add('active');

  const utter = new SpeechSynthesisUtterance(cleanText);
  utter.lang = 'en-US';
  utter.rate = 0.85;

  utter.onend = () => {
    if (bar) bar.classList.remove('active');
    if (autoMicEnabled && document.getElementById('autoMicToggle')?.checked && !voiceModeActive) {
      setTimeout(startSTT, 500);
    }
    if (voiceModeActive) {
      const orb = document.getElementById('voiceOrb');
      const status = document.getElementById('voiceStatus');
      if (orb) orb.className = 'voice-orb';
      if (status) status.textContent = 'Chạm để nói tiếp';
      setTimeout(() => { if(voiceModeActive) toggleVoiceListening(); }, 600);
    }
  };

  const setVoiceAndSpeak = () => {
    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.name === 'Google US English')
                 || voices.find(v => v.lang === 'en-US');
    if (enVoice) utter.voice = enVoice;
    window.speechSynthesis.speak(utter);
  };

  if (window.speechSynthesis.getVoices().length) {
    setVoiceAndSpeak();
  } else {
    window.speechSynthesis.onvoiceschanged = setVoiceAndSpeak;
  }
}
function speakVoiceReply(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  
  // Lấy phần tiếng Trung (ưu tiên) hoặc lọc sạch markdown
  let chineseParts = text.match(/[\u4e00-\u9fff][^\n]{0,100}/g);
  let cleanText = '';
  if (chineseParts && chineseParts.length > 0) {
    cleanText = chineseParts.slice(0, 2).join('。');
  } else {
    cleanText = text
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/\*(.*?)\*/g, '$1')
      .replace(/___(.*?)___/g, '$1')
      .replace(/[*_~`>#+-]/g, '')
      .substring(0, 150);
  }
  
  if (!cleanText) return;
  
  const utter = new SpeechSynthesisUtterance(cleanText);
  const voices = window.speechSynthesis.getVoices();
 const enVoice = voices.find(v => v.name === 'Google US English') 
             || voices.find(v => v.lang === 'en-US')
             || voices.find(v => v.lang.startsWith('en'));
if (enVoice) utter.voice = enVoice;
utter.lang = 'en-US';
  utter.rate = 0.8;
  
  const orb = document.getElementById('voiceOrb');
  const status = document.getElementById('voiceStatus');
  
  utter.onend = () => {
    if (voiceModeActive) {
      if (orb) orb.className = 'voice-orb';
      if (status) status.textContent = 'Chạm để nói tiếp';
      setTimeout(() => { if(voiceModeActive) toggleVoiceListening(); }, 800);
    }
  };
  window.speechSynthesis.speak(utter);
}
function stopTTS(){ window.speechSynthesis.cancel(); document.getElementById('ttsBar').classList.remove('active'); }
function startSTT(){
  if(!('webkitSpeechRecognition' in window)){ addBotMessage('⚠️ Browser does not support voice input. Use Chrome.'); return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; recognition=new SR(); recognition.lang='en-US';
  const b=document.getElementById('micBtn'); b.classList.add('listening'); b.textContent='⏺';
  recognition.onresult=e=>{ const t=e.results[0][0].transcript; b.classList.remove('listening'); b.textContent='🎤'; document.getElementById('userInput').value=t; sendMessage(); };
  recognition.onerror=()=>{ b.classList.remove('listening'); b.textContent='🎤'; };
  recognition.start();
}
function openVoiceMode(){ voiceModeActive=true; document.getElementById('voiceOverlay').classList.add('active'); addBotMessage('🎤 Voice conversation mode ON. Tap the orb to start speaking!'); }
function closeVoiceMode(){ voiceModeActive=false; if(recognition)recognition.stop(); window.speechSynthesis.cancel(); document.getElementById('voiceOverlay').classList.remove('active'); }
function toggleVoiceListening() {
  if (voiceListening) return;
  if (!('webkitSpeechRecognition' in window)) {
    addBotMessage('⚠️ Browser does not support voice input. Use Chrome.');
    return;
  }
  voiceListening = true;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'en-US';
  const orb = document.getElementById('voiceOrb');
  const status = document.getElementById('voiceStatus');
  orb.classList.add('listening');
  orb.textContent = '⏺';
  status.textContent = 'Listening... Speak now!';
  
  recognition.onresult = async (e) => {
    const spokenText = e.results[0][0].transcript;
    orb.classList.remove('listening');
    voiceListening = false;
    status.textContent = 'Processing...';
    addUserMessage(spokenText);
    conversationHistory.push({ role: 'user', content: spokenText });
    showTyping();
    
    try {
      const messages = [
        { role: 'system', content: getSystemPrompt() + '\n\nVOICE MODE: Respond briefly (max 80 words). Always include English sentences for pronunciation practice.' },
        ...conversationHistory.map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }))
      ];
      
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${GROQ_API_KEY}`
        },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: messages,
          max_tokens: 600,
          temperature: 0.7
        })
      });
      
      const data = await response.json();
      removeTyping();
      
      if (data.error) {
        addBotMessage(`⚠️ API Error: ${data.error.message}`);
      } else if (data.choices && data.choices[0]) {
        const reply = data.choices[0].message.content;
        conversationHistory.push({ role: 'assistant', content: reply });
        addBotMessage(reply);
        addNextSteps();
        speakText(reply.replace(/<[^>]+>/g, '').substring(0, 150));
        status.textContent = 'Tap to continue';
        orb.className = 'voice-orb';
        orb.textContent = '🎤';
      }
    } catch (error) {
      removeTyping();
      console.error(error);
      status.textContent = 'Error, try again';
      orb.className = 'voice-orb';
      orb.textContent = '🎤';
      voiceListening = false;
    }
  };
  
  recognition.onerror = () => {
    orb.classList.remove('listening');
    orb.textContent = '🎤';
    voiceListening = false;
    status.textContent = 'Error, tap to retry';
  };
  
  recognition.onend = () => {
    if (voiceListening) {
      orb.classList.remove('listening');
      orb.textContent = '🎤';
      voiceListening = false;
    }
  };
  
  recognition.start();
}

function speakWord(text, el) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  document.querySelectorAll('.speakable.speaking').forEach(e => e.classList.remove('speaking'));
  if (el) el.classList.add('speaking');
  const utter = new SpeechSynthesisUtterance(text.trim());
  utter.lang = 'en-US';
  utter.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v => v.name === 'Google US English') || voices.find(v => v.lang === 'en-US');
  if (v) utter.voice = v;
  utter.onend = () => { if (el) el.classList.remove('speaking'); };
  window.speechSynthesis.speak(utter);
}

// Wrap từ tiếng Anh trong .vc thành speakable
function makeVcSpeakable(bubble) {
  bubble.querySelectorAll('.vc').forEach(vc => {
    const enEl = vc.querySelector('.en');
    if (!enEl || enEl.dataset.speakable) return;
    enEl.dataset.speakable = '1';
    enEl.classList.add('speakable');
    enEl.title = '🔊 Click để nghe phát âm';
    enEl.addEventListener('click', () => speakWord(enEl.textContent.replace(/^📖\s*/, ''), enEl));
    // Thêm hint lần đầu
    if (!vc.querySelector('.speak-hint')) {
      const hint = document.createElement('div');
      hint.className = 'speak-hint';
      hint.innerHTML = '🔊 Click vào từ tiếng Anh để nghe';
      vc.appendChild(hint);
    }
  });
}

// Lắng nghe bubble mới được thêm vào chatArea
const _chatObserverEN = new MutationObserver(mutations => {
  mutations.forEach(m => {
    m.addedNodes.forEach(node => {
      if (node.nodeType !== 1) return;
      const bubbles = node.classList?.contains('bubble') ? [node] : node.querySelectorAll?.('.bubble') || [];
      bubbles.forEach(makeVcSpeakable);
    });
  });
});
_chatObserverEN.observe(document.getElementById('chatArea'), { childList: true, subtree: true });

// Bôi đen text bất kỳ → đọc to
document.getElementById('chatArea').addEventListener('mouseup', () => {
  const sel = window.getSelection();
  const text = sel?.toString().trim();
  if (!text || text.length < 1 || text.length > 80) return;
  // Chỉ đọc nếu là text tiếng Anh (chủ yếu latin)
  const latinRatio = (text.match(/[a-zA-Z\s]/g) || []).length / text.length;
  if (latinRatio < 0.5) return;
  speakWord(text, null);
});
