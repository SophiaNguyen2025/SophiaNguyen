<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>404 – Trang không tồn tại</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #fdfaf5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      font-size: 100px;
      margin: 0;
      color: #0a4a5a;
      animation: float 3s ease-in-out infinite;
    }
    h2 {
      font-size: 28px;
      margin: 10px 0;
      color: #c49b66;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
      color: #555;
    }
    .btn-home {
      background-color: #63a693;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    .btn-home:hover {
      background-color: #4d8274;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .emoji {
      font-size: 50px;
      margin-top: 10px;
      animation: shake 1.5s ease-in-out infinite;
    }
    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(5deg); }
      75% { transform: rotate(-5deg); }
    }
  </style>
</head>
<body>
     <img src="images/hinhremovenen.png" alt="Sophia Logo" />
  <div class="container">
    <h1>404</h1>
    <div class="emoji">🔍🤔</div>
    <h2>Ôi! Trang bạn tìm không tồn tại</h2>
    <p>Hình như bạn đã lạc vào một góc nhỏ của vũ trụ Sophia. Đừng lo, mình sẽ đưa bạn về nơi an toàn!</p>
    <a href="/" class="btn-home">🏠 Quay lại trang chủ</a>
  </div>
</body>
</html>
