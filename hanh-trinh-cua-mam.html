      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'sine'; o.frequency.value = f; g.gain.value = vol || .06;
      o.connect(g); g.connect(audio.destination);
      var t = audio.currentTime; g.gain.setValueAtTime(vol || .06, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.start(t); o.stop(t + d);
    } catch (e) {}
  }
  function jingle() { [523, 659, 784, 1047].forEach(function (f, i) { later(function () { beep(f, .28, 'triangle', .07); }, i * 130); }); }
  $('snd').addEventListener('click', function () {
    soundOn = !soundOn; this.setAttribute('aria-pressed', soundOn); this.setAttribute('aria-label', soundOn ? 'Tắt âm thanh' : 'Bật âm thanh');
    $('sndOn').hidden = !soundOn; beep(660, .12);
  });

  /* ---- Cảnh: màu trời, mặt trời, lá ---- */
  function setScene(n) {
    var k = SKY[Math.min(n, SKY.length - 1)], st = stage.style;
    st.setProperty('--skyTop', k[0]); st.setProperty('--skyBot', k[1]); st.setProperty('--hillFar', k[2]);
    st.setProperty('--hillNear', k[3]); st.setProperty('--ground', k[4]);
    st.setProperty('--sunUp', k[5] + 'cqw'); st.setProperty('--stars', k[6]);
  }
  function drawLeaves(n) {
    var g = $('leaves'); g.innerHTML = '';
    LEAVES.forEach(function (l, idx) {
      var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', 'M0 0 C 8 -11 24 -10 30 0 C 24 10 8 11 0 0Z'); p.setAttribute('fill', idx % 2 ? '#6FD39A' : '#8FE3B0');
      p.setAttribute('class', 'leaf'); p.setAttribute('transform', 'translate(' + l[0] + ' ' + l[1] + ') rotate(' + l[2] + ') scale(' + (idx < n ? l[3] : 0) + ')');
      g.appendChild(p);
    });
    var top = 62 - (6 + n * 7.5);
    $('stem').setAttribute('d', 'M60 60 L60 ' + top);
  }
  function mood(kind) {
    var m = $('mouth');
    m.setAttribute('d', kind === 'o' ? 'M55 108 Q60 114 65 108 Q60 104 55 108Z' : kind === 'big' ? 'M49 104 Q60 120 71 104Z' : 'M52 106 Q60 113 68 106');
    m.setAttribute('fill', kind === 'o' || kind === 'big' ? '#14213D' : 'none');
  }
  function look(dx) { ['pl', 'pr'].forEach(function (id, j) { $(id).setAttribute('cx', (j ? 74 : 48) + dx); }); }
  function pips() {
    var box = $('pips'); box.innerHTML = '';
    for (var i = 0; i < STATIONS.length; i++) { var e = document.createElement('i'); if (i < S.i || (S.done && true)) { e.className = 'on'; } else if (i === S.i) { e.className = 'on'; } box.appendChild(e); }
  }
  function walk(ms, cb) {
    hero.classList.add('walk'); mood('big');
    var far = $('gFar'), near = $('gNear'), sh = (S.i % 2 ? 1 : -1);
    far.style.transform = 'translateX(' + (sh * 14) + 'px)'; near.style.transform = 'translateX(' + (sh * 26) + 'px)';
    for (var s = 0; s < 4; s++) { later(function () { beep(300 + Math.random() * 90, .07, 'square', .02); }, s * 260); }
    later(function () { hero.classList.remove('walk'); mood('smile'); cb(); }, reduce ? 50 : ms);
  }

  /* ---- Gõ chữ ---- */
  function typeInto(el, text, done) {
    var i = 0, speed = S.clip ? 26 : 20;
    el.textContent = '';
    if (reduce) { el.textContent = text; done(); return; }
    (function step() {
      el.textContent = text.slice(0, ++i);
      if (i % 3 === 0) { beep(700, .03, 'square', .012); }
      if (i < text.length) { S.typing = later(step, speed); } else { done(); }
    })();
  }

  /* ---- Màn hình ---- */
  function intro() {
    clearTimers(); S = { i: 0, score: { D: 0, K: 0, G: 0, Q: 0 }, last: null, clip: false, busy: false, timers: [], aim: null };
    stage.classList.remove('done'); setScene(0); drawLeaves(0); mood('smile'); look(0); pips();
    panel.innerHTML =
      '<div class="stack" style="margin-top:2cqw"><h1 class="title">Mầm sẽ nở thành loài hoa nào?</h1>' +
      '<p class="sub">Sáu trạm, sáu lựa chọn. Bạn chọn thay Mầm, bình minh sẽ lên theo từng bước.</p></div>' +
      '<div class="stack" style="margin-top:auto"><button class="btn main" id="go" type="button">Bắt đầu hành trình</button>' +
      '<button class="btn ghost" id="auto" type="button">Tự chạy để quay clip</button></div>';
    $('go').onclick = function () { start(false); };
    $('auto').onclick = function () { start(true); };
  }
  function start(clip) {
    S.clip = clip; S.aim = clip ? ['D', 'K', 'G', 'Q'][Math.floor(Math.random() * 4)] : null;
    beep(523, .12); track('game_start', { mode: clip ? 'auto' : 'play' });
    station(0);
  }
  function station(n) {
    S.i = n; S.busy = false; pips(); setScene(n); drawLeaves(n); mood('smile'); look(0);
    var st = STATIONS[n];
    var order = st.o.slice().sort(function () { return Math.random() - .5; });
    panel.innerHTML = '<div class="chip">Trạm ' + (n + 1) + '/' + STATIONS.length + '  ·  ' + st.name + '</div>' +
      '<p class="say" id="say"></p><div class="opts" id="opts"></div>';
    var opts = $('opts');
    order.forEach(function (o) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.textContent = o.t; b.dataset.k = o.k;
      b.onclick = function () { choose(b, o); }; opts.appendChild(b);
    });
    mood('o'); look(-2);
    typeInto($('say'), st.say, function () {
      mood('smile'); look(0); requestAnimationFrame(function () { opts.classList.add('show'); });
      if (S.clip) {
        later(function () {
          var pool = order.slice(), pick = pool.filter(function (o) { return o.k === S.aim; })[0];
          if (!pick || Math.random() < .25) { pick = pool[Math.floor(Math.random() * pool.length)]; }
          var btn = Array.prototype.filter.call(opts.children, function (b) { return b.textContent === pick.t; })[0];
          choose(btn, pick);
        }, 2300);
      }
    });
  }
  function choose(btn, o) {
    if (S.busy) { return; } S.busy = true;
    S.score[o.k]++; S.last = o.k;
    btn.classList.add('picked'); $('opts').classList.add('lock');
    hero.classList.remove('hop'); void hero.offsetWidth; hero.classList.add('hop'); mood('big'); look(3); beep(660, .1, 'triangle', .06);
    later(function () { hero.classList.remove('hop'); }, 650);
    later(function () {
      if (S.i + 1 < STATIONS.length) {
        S.i++; setScene(S.i); drawLeaves(S.i); pips();
        walk(1300, function () { station(S.i); });
      } else { finish(); }
    }, 900);
  }
  function winner() {
    var best = null, max = -1;
    ['D', 'K', 'G', 'Q'].forEach(function (k) { if (S.score[k] > max || (S.score[k] === max && k === S.last)) { max = S.score[k]; best = k; } });
    return best;
  }
  function buildFlower(t) {
    var h = $('head'), p = t.petals, NS = 'http://www.w3.org/2000/svg', html = '';
    for (var i = 0; i < p.n; i++) {
      html += '<ellipse cx="0" cy="' + (-p.d) + '" rx="' + p.rx + '" ry="' + p.ry + '" fill="' + (i % 2 ? p.c2 : p.c) + '" transform="rotate(' + (i * 360 / p.n) + ')"/>';
    }
    html += '<circle r="' + p.r + '" fill="' + p.core + '"/>';
    h.innerHTML = html;
  }
  function finish() {
    var k = winner(), t = TYPES[k];
    S.done = true; buildFlower(t); drawLeaves(6); setScene(6); pips();
    mood('big'); look(0); stage.classList.add('done'); jingle();
    track('game_complete', { result: k, mode: S.clip ? 'auto' : 'play' });
    later(function () {
      panel.innerHTML = '<div class="res stack">' +
        '<div class="tag">Mầm nở thành</div><h2>' + t.flower + '<br>' + '<span style="font-size:.62em;font-weight:700;color:var(--leaf)">' + t.who + '</span></h2>' +
        '<dl><div><dt>Điểm mạnh</dt><dd>' + t.s + '</dd></div><div><dt>Khi áp lực</dt><dd>' + t.p + '</dd></div><div><dt>Hợp với</dt><dd>' + t.f + '</dd></div></dl>' +
        '<p class="note">Trò chơi vui, không phải công cụ đánh giá. Muốn hiểu mình bằng bài test chuẩn hơn thì làm bài miễn phí dưới đây.</p></div>' +
        '<div class="stack" style="margin-top:auto"><a class="btn main" id="cta" href="' + SITE + '/testDISC' + UTM + '" target="_blank" rel="noopener">Làm bài test DISC miễn phí</a>' +
        '<button class="btn ghost" id="again" type="button">Chơi lại</button></div>';
      $('cta').onclick = function () { track('game_cta_click', { result: k }); };
      $('again').onclick = intro;
    }, reduce ? 50 : 1100);
  }

  /* Cho phép chạm vào chữ đang gõ để hiện nhanh hết câu */
  panel.addEventListener('click', function (e) {
    var say = $('say'); if (!say || e.target !== say || S.clip) { return; }
    clearTimers(); say.textContent = STATIONS[S.i].say; var o = $('opts'); if (o) { o.classList.add('show'); } mood('smile'); look(0);
  });

  intro();
})();
</script>
