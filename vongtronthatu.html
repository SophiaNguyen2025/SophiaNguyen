<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lớp Học An Toàn – Game Tương Tác (Dark Mode)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #a29bfe;
  --purple-light: #c3baff;
  --purple-dark: #6c5ce7;
  --green: #00b894;
  --green-light: #55efc4;
  --red: #ff7675;
  --red-light: #ff9f9e;
  --orange: #fab1a0;
  --orange-light: #ffe0b5;
  --blue: #74b9ff;
  --blue-light: #a8d8ff;
  --yellow: #fdcb6e;
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface-light: #1f2a48;
  --text: #f0f0f0;
  --text-muted: #b0b0b0;
  --border: #2d3a5e;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

h1, h2, h3, .game-title { font-family: 'Baloo 2', cursive; }

/* ── NAV ── */
.main-nav {
  background: var(--surface);
  box-shadow: var(--shadow);
  padding: 0 1.5rem;
  display: flex;
  align-items: center;
  gap: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
}

.brand {
  font-family: 'Baloo 2', cursive;
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--purple);
  white-space: nowrap;
  padding: 1rem 1.5rem 1rem 0;
  border-right: 2px solid var(--border);
  margin-right: 1rem;
}

.nav-tab {
  padding: 1rem 1.25rem;
  font-family: 'Baloo 2', cursive;
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: all .2s;
}
.nav-tab:hover { color: var(--purple); }
.nav-tab.active { color: var(--purple); border-bottom-color: var(--purple); }

/* ── SCREENS ── */
.screen { display: none; padding: 2rem 1.5rem; max-width: 860px; margin: 0 auto; }
.screen.active { display: block; }

.game-header {
  text-align: center;
  margin-bottom: 2rem;
}
.game-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 50px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: .75rem;
  background: var(--surface);
  color: var(--purple);
}
.game-title {
  font-size: 1.8rem;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: .4rem;
}
.game-subtitle {
  font-size: 0.95rem;
  color: var(--text-muted);
}

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 50px;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .18s;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0) scale(.97); }
.btn-purple { background: var(--purple-dark); color: #fff; box-shadow: 0 4px 14px rgba(108,92,231,0.35); }
.btn-purple:hover { background: var(--purple); }
.btn-green { background: var(--green); color: #fff; box-shadow: 0 4px 14px rgba(0,184,148,0.35); }
.btn-red { background: var(--red); color: #fff; box-shadow: 0 4px 14px rgba(214,48,49,0.3); }
.btn-blue { background: var(--blue); color: #fff; box-shadow: 0 4px 14px rgba(9,132,227,0.3); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 2px solid var(--border); }
.btn-ghost:hover { border-color: var(--purple); color: var(--purple); }

/* ══════════════════════════════
   GAME 1 – WORD CLOUD (DARK MODE)
══════════════════════════════ */
.g1-input-area {
  display: flex;
  gap: 10px;
  margin-bottom: 1.25rem;
}
.g1-input-area input {
  flex: 1;
  padding: 12px 18px;
  border: 2px solid var(--border);
  border-radius: 50px;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  outline: none;
  transition: border-color .2s;
  background: var(--surface);
  color: var(--text);
}
.g1-input-area input:focus { border-color: var(--purple); }
.g1-input-area input::placeholder { color: var(--text-muted); }

.word-cloud {
  background: var(--surface);
  border-radius: var(--radius-lg);
  min-height: 360px;
  padding: 2rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px;
  box-shadow: var(--shadow);
  position: relative;
}

.word-tag {
  border-radius: 50px;
  padding: 6px 20px;
  font-family: 'Baloo 2', cursive;
  font-weight: 700;
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  cursor: default;
  transition: transform .2s;
}
.word-tag:hover { transform: scale(1.08) rotate(-2deg); }
@keyframes popIn {
  from { transform: scale(0) rotate(-15deg); opacity: 0; }
  to   { transform: scale(1) rotate(0deg);  opacity: 1; }
}

.g1-stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 1rem;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.logo { 
  height: 60px; 
  margin-bottom: 10px;
  filter: brightness(1.1);
}
</style>

<div class="main-nav">
  <span class="brand">🛡️ LỚP HỌC AN TOÀN</span>
  <button class="nav-tab active" onclick="switchGame(1)">📝 Vòng tròn từ</button>
</div>

<!-- ═══════ GAME 1 ═══════ -->
<div id="g1" class="screen active">
  <div class="game-header">
    <div class="game-badge">Buổi 1 • Khởi động</div>
    <h2 class="game-title">Vòng tròn một từ</h2>
    <img src="https://sophianguyen.com.vn/images/hinhremovenen.png" alt="Sophia Nguyễn" class="logo">
    <p class="game-subtitle">Gõ từ học viên nói – từ sẽ hiện lên màn hình to dần theo số lần xuất hiện</p>
  </div>
  <div class="g1-input-area">
    <input id="g1-inp" placeholder="Nhập từ học viên nói rồi nhấn Enter..." onkeydown="if(event.key==='Enter')g1Add()">
    <button class="btn btn-purple" onclick="g1Add()">Thêm ✦</button>
    <button class="btn btn-ghost" onclick="g1Reset()">Xóa hết</button>
  </div>
  <div class="word-cloud" id="g1-cloud">
    <span style="color:var(--text-muted);font-size:.95rem">Từ của học viên sẽ xuất hiện ở đây...</span>
  </div>
  <div class="g1-stats">
    <span id="g1-total">0 từ đã thu thập</span>
    <span id="g1-unique">0 từ khác nhau</span>
  </div>
</div>

<script>
/* ── ÂM THANH (Web Audio) ── */
function playPopSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime;
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.3);
    osc.start();
    osc.stop(now + 0.2);
    setTimeout(() => ctx.close(), 400);
  } catch(e) { console.log("audio error"); }
}

/* ── NAV ── */
function switchGame(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('g'+n).classList.add('active');
  document.querySelectorAll('.nav-tab')[n-1].classList.add('active');
}

/* ══ GAME 1 ══ */
const PALETTES = [
  ['#f0eeff', '#a29bfe'], ['#d4fef4', '#55efc4'], ['#ffe8e8', '#ff7675'],
  ['#e3f2fd', '#74b9ff'], ['#fff3cd', '#fdcb6e'], ['#fce4ec', '#e84393'],
  ['#e8f5e9', '#00b894'], ['#fff8e1', '#fab1a0'], ['#e8eaf6', '#6c5ce7']
];
let g1words = {};

function g1Add() {
  const inp = document.getElementById('g1-inp');
  const w = inp.value.trim();
  if (!w) return;
  
  const wasNew = !g1words[w];
  g1words[w] = (g1words[w] || 0) + 1;
  
  // Phát âm thanh mỗi lần thêm từ mới
  playPopSound();
  
  g1Render();
  inp.value = '';
  inp.focus();
}

function g1Render() {
  const c = document.getElementById('g1-cloud');
  c.innerHTML = '';
  const entries = Object.entries(g1words).sort((a, b) => b[1] - a[1]);
  
  if (!entries.length) {
    c.innerHTML = '<span style="color:var(--text-muted);font-size:.95rem">Từ của học viên sẽ xuất hiện ở đây...</span>';
    return;
  }
  
  entries.forEach(([w, n], i) => {
    const sz = Math.min(14 + n * 7, 52);
    const pal = PALETTES[i % PALETTES.length];
    const el = document.createElement('div');
    el.className = 'word-tag';
    el.textContent = w + (n > 1 ? ' ×' + n : '');
    el.style.cssText = `font-size:${sz}px; background:${pal[0]}; color:${pal[1]};`;
    c.appendChild(el);
  });
  
  const total = Object.values(g1words).reduce((a, b) => a + b, 0);
  document.getElementById('g1-total').textContent = total + ' lượt nhập';
  document.getElementById('g1-unique').textContent = Object.keys(g1words).length + ' từ khác nhau';
}

function g1Reset() {
  g1words = {};
  g1Render();
}
</script>
</body>
</html>
