<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trắc nghiệm Tư Duy Suy Nghĩ </title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ffffff, #ffffff);
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo img {
      width: 120px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    .question {
      margin: 20px 0;
      padding: 15px;
      border-left: 5px solid #3366CC;
      border-radius: 10px;
    }
    .question:nth-child(even) {
      background:#CC9900;
    }
    .question:nth-child(odd) {
      background: #00CC99;
    }
    .question p {
      margin: 0 0 10px;
      font-weight: bold;
    }
    .question label {
      display: block;
      font-weight: normal;
      margin-bottom: 8px;
    }
    input[type="text"],
    input[type="email"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 30px;
      padding: 12px 24px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #45a049;
    }
    .result {
      display: none;
      background: #ede7f6;
      margin-top: 30px;
      padding: 20px;
      border-radius: 12px;
      color: #4a148c;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="images/hinhremovenen.png" alt="Logo Sophia">
    </div>
    <h1>Trắc nghiệm Tư Duy Suy Nghĩ </h1>
    <!-- Form cá nhân -->
   <form id="userForm" action="https://formspree.io/f/mgvzqrje" method="POST">
      <h2>Thông tin người làm test</h2>
      <label>Họ tên:</label>
      <input type="text" name="name" id="name" required>
      <label>Email:</label>
      <input type="email" name="email" id="email" required>
      <label>Tuổi:</label>
      <input type="number" name="age" id="age" required>
      <label>Số điện thoại:</label>
      <input type="text" name="phone" id="phone" required>
      <button type="submit">Gửi thông tin  & tiếp tục</button>
      </form>
 <!-- Phần câu hỏi trắc nghiệm -->
<form id="quizForm" style="display: none;">
  <h2>Phần câu hỏi trắc nghiệm</h2>
</form>

<button id="submitBtn" type="button" style="display: none;">Tính kết quả</button>

<div id="result" class="result"></div>
<canvas id="chart" width="400" height="400" style="margin-top:20px;"></canvas>
<div id="description" style="margin-top:20px; font-size:16px;"></div>


<script>
  const questions = [
  "Khi gặp một vấn đề phức tạp, bạn thường tiếp cận nó như thế nào?",
  "Trong nhóm, bạn thường thể hiện kiểu tư duy nào nổi bật nhất?",
  "Bạn cảm thấy hiệu quả nhất khi làm việc trong môi trường như thế nào?",
  "Khi bắt đầu một nhiệm vụ mới, bạn thường ưu tiên điều gì?",
  "Bạn cảm thấy hài lòng nhất khi hoàn thành công việc theo cách nào?",
  "Khi học điều mới, bạn thường chọn phương pháp nào?",
  "Khi có tình huống bất ngờ xảy ra, bạn phản ứng ra sao?",
  "Khi đưa ra quyết định, bạn thường dựa vào yếu tố nào?",
  "Bạn thích tiếp nhận thông tin theo cách nào nhất?",
  "Bạn thấy mình mạnh nhất ở khía cạnh nào trong công việc?",
  "Người khác thường nhận xét bạn là người có kiểu tư duy nào?",
  "Bạn cảm thấy tự tin nhất khi thực hiện hoạt động nào?",
  "Khi có mâu thuẫn xảy ra, bạn thường xử lý theo cách nào?",
  "Bạn thích làm việc với người có phong cách tư duy như thế nào?",
  "Bạn thường bị thu hút bởi điều gì trong công việc hoặc cuộc sống?",
  "Bạn đánh giá sự thành công của bản thân dựa trên điều gì?",
  "Bạn cho rằng yếu tố nào là quan trọng nhất trong công việc?",
  "Khi đặt ra mục tiêu, bạn thường tiếp cận theo hướng nào?",
  "Bạn cảm thấy hứng thú nhất khi được làm gì?",
  "Bạn thường học hỏi hiệu quả nhất từ nguồn nào?"
  ];

  const options = [
    "Phân tích logic và hệ thống",      // Hệ thống
    "Dựa vào cảm xúc và trực giác",     // Cảm xúc
    "Hành động nhanh để thử nghiệm",   // Hành động
    "Tạo ra cách tiếp cận mới"         // Sáng tạo
  ];

  const quizForm = document.getElementById("quizForm");

  questions.forEach((q, index) => {
    const div = document.createElement("div");
    div.className = "question";
    div.innerHTML = `<p>Câu ${index + 1}: ${q}</p>`;
    options.forEach((opt, i) => {
      div.innerHTML += `
        <label>
          <input type="radio" name="q${index}" value="${i}" required> ${opt}
        </label>
      `;
    });
    quizForm.appendChild(div);
  });

  // Sau khi gửi form thông tin, hiện phần câu hỏi
  document.getElementById("userForm").addEventListener("submit", function (e) {
    e.preventDefault();
    fetch(this.action, {
      method: "POST",
      body: new FormData(this),
      headers: { 'Accept': 'application/json' }
    })
    .then(response => {
      if (response.ok) {
        alert("🟢 Gửi thông tin thành công! Bây giờ bạn có thể làm bài test.");
        document.getElementById("userForm").style.display = "none";
        quizForm.style.display = "block";
        document.getElementById("submitBtn").style.display = "block";
      } else {
        alert("❌ Gửi thông tin thất bại. Vui lòng thử lại.");
      }
    })
    .catch(error => {
      alert("⚠️ Lỗi kết nối. Vui lòng thử lại sau.");
    });
  });
</script>

<script>
  const styles = ["Hệ thống 🧠", "Cảm xúc 💖", "Hành động ⚡", "Sáng tạo 🎨"];
  const descriptions = [
    "Bạn có tư duy hệ thống: logic, chiến lược, thích phân tích và lập kế hoạch. Bạn giỏi tổ chức, thích quy trình rõ ràng và ra quyết định dựa trên dữ liệu.",
    "Bạn có tư duy cảm xúc: trực giác mạnh, đồng cảm, dễ kết nối với người khác. Bạn thường cảm nhận sâu sắc và đưa ra quyết định dựa trên cảm xúc.",
    "Bạn có tư duy hành động: nhanh nhạy, thực tế, thích thử nghiệm và giải quyết vấn đề ngay. Bạn không ngại rủi ro và thường là người tiên phong.",
    "Bạn có tư duy sáng tạo: linh hoạt, giàu tưởng tượng, thích khám phá cái mới. Bạn thường nghĩ khác biệt và tạo ra những giải pháp độc đáo."
  ];

  document.getElementById("submitBtn").onclick = function() {
    const formData = new FormData(form);
    let counts = [0, 0, 0, 0];

    for (let i = 0; i < questions.length; i++) {
      const val = formData.get(`q${i}`);
      if (val !== null) counts[parseInt(val)]++;
    }

    const total = counts.reduce((a, b) => a + b, 0);
    const percentages = counts.map(c => Math.round((c / total) * 100));
    const max = Math.max(...counts);
    const dominantIndex = counts.indexOf(max);

    // Hiển thị kết quả
    document.getElementById("result").innerHTML =
      `<b>Kết quả:</b><br>` +
      styles.map((s, i) => `${s}: ${percentages[i]}%`).join("<br>");

    // Vẽ biểu đồ tròn
    const ctx = document.getElementById("chart").getContext("2d");
    const colors = ["#0077cc", "#e91e63", "#ff9800", "#4caf50"];
    let start = 0;

    ctx.clearRect(0, 0, 400, 400);
    percentages.forEach((p, i) => {
      const slice = (p / 100) * 2 * Math.PI;
      ctx.beginPath();
      ctx.moveTo(200, 200);
      ctx.arc(200, 200, 150, start, start + slice);
      ctx.fillStyle = colors[i];
      ctx.fill();
      start += slice;
    });

    // Hiển thị mô tả
    document.getElementById("description").innerHTML =
      `<b>Phân tích:</b><br>${descriptions[dominantIndex]}`;
  };
</script>
</body>
</html>
