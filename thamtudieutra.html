<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Buổi 2 – Thám Tử Phá Án | Bản lĩnh Gen Z</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0F1923;
  --surface: #192330;
  --surface2: #1F2D3D;
  --accent: #F5C842;
  --accent2: #E87C3E;
  --green: #3DDC97;
  --red: #FF5252;
  --blue: #4FA3E0;
  --text: #E8EDF2;
  --text-soft: #8BA0B4;
  --border: rgba(255,255,255,0.07);
  --shadow: 0 8px 40px rgba(0,0,0,0.4);
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: .4;
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 2rem;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
  background: rgba(15,25,35,0.95);
  backdrop-filter: blur(12px);
}
.header-left { display: flex; align-items: center; gap: 14px; }
.badge {
  background: var(--accent);
  color: #1A1200;
  font-family: 'Bangers', cursive;
  font-size: 0.8rem;
  letter-spacing: .08em;
  padding: 4px 12px;
  border-radius: 50px;
}
.header h1 {
  font-family: 'Bangers', cursive;
  font-size: 1.4rem;
  letter-spacing: .06em;
  color: var(--text);
}
.logo { height: 48px; }
.case-nav {
  max-width: 900px; margin: 1.5rem auto 0;
  padding: 0 1.5rem;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.case-tab {
  padding: 8px 16px;
  border-radius: 50px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text-soft);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.case-tab:hover { border-color: var(--accent); color: var(--accent); }
.case-tab.active { background: var(--accent); border-color: var(--accent); color: #1A1200; }
.case-tab.solved { border-color: var(--green); color: var(--green); }
.case-board { max-width: 900px; margin: 1.25rem auto; padding: 0 1.5rem 3rem; }
.case-panel { display: none; }
.case-panel.active { display: block; }
.case-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1rem;
  display: flex; align-items: flex-start; gap: 1rem;
}
.case-icon { font-size: 2.5rem; flex-shrink: 0; }
.case-meta { flex: 1; }
.case-num {
  font-size: 0.7rem; font-weight: 700;
  color: var(--accent); letter-spacing: .1em;
  text-transform: uppercase; margin-bottom: 4px;
}
.case-title {
  font-family: 'Bangers', cursive;
  font-size: 1.5rem; letter-spacing: .04em;
  color: var(--text); margin-bottom: 6px;
}
.case-situation {
  font-size: 0.88rem; line-height: 1.6;
  color: var(--text-soft);
}
.clues-title {
  font-size: 0.7rem; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-soft); margin-bottom: 0.75rem;
  display: flex; align-items: center; gap: 8px;
}
.clues-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.clues-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 1.25rem;
}
.clue-card {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  cursor: pointer;
  transition: all .2s;
}
.clue-card:hover { border-color: rgba(245,200,66,0.4); }
.clue-label {
  font-size: 0.68rem; font-weight: 700;
  color: var(--accent); letter-spacing: .08em;
  text-transform: uppercase; margin-bottom: 6px;
}
.clue-q {
  font-size: 0.82rem; font-weight: 600;
  color: var(--text); line-height: 1.4;
  margin-bottom: 8px;
}
.clue-answer {
  font-size: 0.82rem; line-height: 1.5;
  color: var(--green);
  background: rgba(61,220,151,0.07);
  border-radius: 8px;
  padding: 8px 10px;
  margin-top: 8px;
  display: none;
}
.clue-answer.show { display: block; }
.clue-btn {
  font-size: 0.72rem; font-weight: 700;
  color: var(--text-soft);
  background: none; border: none;
  cursor: pointer;
  padding: 0;
  font-family: 'DM Sans', sans-serif;
}
.clue-btn:hover { color: var(--accent); }
.verdict-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1rem;
}
.verdict-title {
  font-family: 'Bangers', cursive;
  font-size: 1.1rem; letter-spacing: .06em;
  color: var(--accent); margin-bottom: 1rem;
  display: flex; align-items: center; gap: 8px;
}
.verdict-opts {
  display: flex; flex-direction: column; gap: 8px;
  margin-bottom: 1rem;
}
.verdict-opt {
  padding: 12px 16px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: all .2s;
}
.verdict-opt:hover { border-color: rgba(245,200,66,0.5); background: rgba(245,200,66,0.04); }
.verdict-opt.correct { border-color: var(--green); background: rgba(61,220,151,0.08); color: var(--green); }
.verdict-opt.wrong { border-color: var(--red); background: rgba(255,82,82,0.08); color: var(--red); opacity: .7; }
.verdict-explain {
  background: rgba(61,220,151,0.06);
  border-left: 3px solid var(--green);
  border-radius: 0 10px 10px 0;
  padding: 12px 14px;
  font-size: 0.85rem; line-height: 1.6;
  color: var(--text-soft);
  display: none;
}
.verdict-explain.show { display: block; }
.solved-stamp {
  text-align: center; padding: 1rem;
  font-family: 'Bangers', cursive;
  font-size: 1.6rem; letter-spacing: .1em;
  color: var(--green);
  border: 3px solid var(--green);
  border-radius: var(--radius);
  opacity: 0;
  transition: opacity .4s;
}
.solved-stamp.show { opacity: 1; }
.progress-row {
  max-width: 900px; margin: 0 auto;
  padding: 0 1.5rem 1rem;
  display: flex; align-items: center; gap: 12px;
}
.progress-txt { font-size: 0.8rem; font-weight: 600; color: var(--text-soft); white-space: nowrap; }
.bar-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width .5s; }
@media (max-width: 600px) {
  .clues-grid { grid-template-columns: 1fr; }
  .case-nav { gap: 6px; }
  .header h1 { font-size: 1.1rem; }
  .logo { height: 40px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="badge">BUỔI 2</span>
    <h1>🔍 THÁM TỬ PHÁ ÁN</h1>
  </div>
  <img src="https://i.ibb.co/wFwDR7cY/hinhremovenen.png" alt="Sophia Nguyễn" class="logo">
</div>

<div class="progress-row">
  <span class="progress-txt" id="prog-txt">0 / 4 vụ án đã giải</span>
  <div class="bar-track"><div class="bar-fill" id="prog-bar" style="width:0%"></div></div>
</div>

<div class="case-nav" id="case-nav"></div>
<div class="case-board" id="case-board"></div>

<script>
const CASES = [
  { // Vụ 1: Ranh giới tình bạn & ép buộc tinh vi (Phân đoạn 1)
    icon: '👥',
    title: 'Bạn Thật Hay Bạn Ép?',
    situation: `<strong>Tình huống:</strong> Huy và Tuấn chơi thân với nhau từ nhỏ. Tuấn liên tục đòi mượn điện thoại của Huy để xem tin nhắn, và bảo: "Bạn thân thì không có gì giấu nhau". Khi Huy từ chối, Tuấn nói: "Mày không cho tao xem là mày không coi tao là bạn".`,
    clues: [
      { q: 'Tuấn đang thực hiện hành vi gì với Huy?', a: 'Ép buộc tinh vi, lợi dụng tình bạn để xóa nhòa ranh giới riêng tư. Bạn thật sự không bao giờ ép bạn chia sẻ mật khẩu hay tin nhắn.' },
      { q: 'Câu nói "không coi tao là bạn" thuộc dạng thao túng nào?', a: 'Lợi dụng cảm xúc + đổ tội. Người thao túng thường dùng câu này để tạo cảm giác tội lỗi, buộc nạn nhân phải làm theo.' },
      { q: 'Huy nên phản ứng thế nào với Tuấn?', a: 'Nói rõ ranh giới: "Tớ tôn trọng cậu, nhưng tớ cũng cần quyền riêng tư. Đừng ép tớ. Nếu cậu thật sự là bạn, cậu sẽ hiểu."' },
      { q: 'Nếu Tuấn vẫn tiếp tục ép sau khi Huy đã nói không, Huy nên làm gì?', a: 'Bảo vệ ranh giới: giữ khoảng cách với Tuấn, nói với người lớn tin cậy (bố mẹ, cô giáo). Không ai có quyền ép mình chia sẻ quyền riêng tư.' }
    ],
    verdict: {
      q: 'Huy nên làm gì khi Tuấn vẫn tiếp tục đòi xem điện thoại?',
      opts: [
        'A. Đưa điện thoại cho xem để khỏi mất bạn',
        'B. Nói: "Tớ tôn trọng cậu, nhưng tớ cũng cần quyền riêng tư. Đừng ép tớ nữa."',
        'C. Im lặng, lén đổi mật khẩu nhưng không nói gì',
        'D. Cũng đòi xem lại điện thoại của Tuấn để "cân bằng"'
      ],
      correct: 1,
      explain: '<strong>Đúng rồi!</strong> Nói rõ ranh giới, vừa tôn trọng bạn vừa bảo vệ quyền riêng tư của mình. Bạn thật sự sẽ không ép bạn.' }
  },
  { // Vụ 2: Grooming từ người quen của gia đình (Phân đoạn 2)
    icon: '🍬',
    title: 'Vụ Kẹo Ngọt & Bí Mật',
    situation: `<strong>Tình huống:</strong> Chú Hưng – bạn thân của bố – thường cho Lan kẹo, khen Lan "xinh nhất xóm", và nhắn tin hỏi "Đi học có vui không?" mỗi ngày. Tuần trước, chú nhờ Lan "đừng kể với bố mẹ việc mình nhắn tin vì sợ họ ghen tị". Lan thấy vui nhưng cũng hơi không thoải mái.`,
    clues: [
      { q: 'Chú Hưng đang ở giai đoạn nào của grooming?', a: 'Giai đoạn 1 & 2: Làm quen + tạo lòng tin. Dùng kẹo, lời khen, sự quan tâm đặc biệt để tạo mối quan hệ thân thiết trước khi leo thang.' },
      { q: 'Dấu hiệu nguy hiểm nhất trong câu chuyện là gì?', a: '"Đừng kể với bố mẹ" – đây là dấu hiệu đỏ lớn nhất. Người tốt không bao giờ bảo trẻ em giữ bí mật với bố mẹ.' },
      { q: 'Cảm giác "không thoải mái" của Lan có ý nghĩa gì?', a: 'Đó là tín hiệu cảnh báo từ cơ thể. Hãy tin vào cảm giác đó – nó giúp Lan nhận ra có điều gì đó không ổn, dù chưa chắc chắn.' },
      { q: 'Lan nên làm gì ngay bây giờ?', a: 'Kể với bố mẹ hoặc người lớn tin cậy – không cần chờ có chuyện gì xấu hơn mới kể. Bố mẹ sẽ biết cách bảo vệ Lan.' }
    ],
    verdict: {
      q: 'Lan nên phản ứng thế nào khi chú Hưng nhắn tin lần sau?',
      opts: [
        'A. Vẫn trả lời bình thường vì chú chỉ hỏi thăm thôi',
        'B. Không trả lời và kể với bố mẹ ngay hôm nay',
        'C. Nhờ bạn thân tư vấn xem có nguy hiểm không',
        'D. Chặn chú rồi không kể với ai để tránh phức tạp'
      ],
      correct: 1,
      explain: '<strong>Đúng rồi!</strong> Kể với bố mẹ ngay là hành động quan trọng nhất. Bố mẹ cần biết để bảo vệ Lan – đây không phải "mách lẻo" mà là bảo vệ bản thân.' }
  },
  { // Vụ 3: Xâm hại bởi người thân (Phân đoạn 2)
    icon: '🤐',
    title: 'Vụ Người Thân',
    situation: `<strong>Tình huống:</strong> Anh họ của Tú (18 tuổi, hay qua nhà chơi) thỉnh thoảng vỗ mông Tú và nói "Anh đùa thôi". Tú cảm thấy xấu hổ nhưng không dám nói vì sợ "làm to chuyện". Mẹ Tú thỉnh thoảng thấy và chỉ cười bỏ qua.`,
    clues: [
      { q: 'Hành động của anh họ có phải "đùa bình thường" không?', a: 'Không. Chạm vào vùng riêng tư (mông) mà không được đồng ý là vi phạm ranh giới cơ thể – dù là người thân. "Đùa thôi" không phải lý do hợp lệ.' },
      { q: 'Tại sao Tú không dám nói? Điều đó có lỗi không?', a: 'Hoàn toàn không có lỗi. Nạn nhân thường im lặng vì sợ không được tin, sợ làm phức tạp gia đình – đây là phản ứng bình thường.' },
      { q: 'Mẹ cười bỏ qua – điều đó có nghĩa hành vi đó ổn không?', a: 'Không. Mẹ có thể không nhận ra mức độ nghiêm trọng. Tú cần nói thẳng với mẹ: "Con không thích anh đó làm vậy, con cảm thấy xấu hổ."' },
      { q: 'Nếu mẹ vẫn không phản ứng, Tú nên làm gì?', a: 'Kể với người lớn tin cậy khác (cô giáo, bà ngoại, dì) hoặc gọi 1800 1567 – đường dây nóng bảo vệ trẻ em.' }
    ],
    verdict: {
      q: 'Khi anh họ làm vậy lần nữa, Tú nên phản ứng thế nào?',
      opts: [
        'A. Im lặng vì người thân nên nhịn',
        'B. Nói to: "Anh đừng làm vậy, em không thích!" rồi kể với mẹ ngay',
        'C. Tránh mặt anh, không cần kể với ai',
        'D. Nhờ bạn thân đến nhà để anh không dám làm'
      ],
      correct: 1,
      explain: '<strong>Đúng rồi!</strong> Nói to và rõ ràng ngay lúc đó + kể với người lớn là đúng nhất. Em không cần nhịn chỉ vì là người thân – ranh giới cơ thể áp dụng với tất cả mọi người.' }
  },
  { // Vụ 4: Lưu bằng chứng & tìm người lớn tin cậy (Phân đoạn 3)
    icon: '📱',
    title: 'Vụ Tin Nhắn Đen',
    situation: `<strong>Tình huống:</strong> Một người họ hàng xa thường xuyên nhắn tin cho Hà, hỏi những câu về cơ thể và gửi ảnh không phù hợp. Người đó dặn: "Đây là bí mật của hai chú cháu, con đừng kể với ai kẻo mang tiếng xấu cho cả nhà." Hà rất sợ, không biết phải làm sao.`,
    clues: [
      { q: 'Hà nên làm gì ĐẦU TIÊN với các tin nhắn đó?', a: 'Chụp màn hình lưu bằng chứng – không xóa. Đây là bằng chứng quan trọng để người lớn tin và có thể báo công an.' },
      { q: 'Hà nên kể với ai trước?', a: 'Kể với người lớn tin cậy: mẹ, cô giáo, bà ngoại, hoặc dì. Dùng 3 câu hỏi để kiểm tra xem người đó có thực sự giúp được không.' },
      { q: 'Người lớn thực sự giúp được có dấu hiệu gì?', a: '1. Lắng nghe, không phán xét. 2. Giữ bí mật (không kể lung tung). 3. Có hành động cụ thể để giúp (báo công an, nói chuyện với bố mẹ).' },
      { q: 'Hà có nên nghe lời dặn "đừng kể với ai" không?', a: 'Không. Bí mật xấu là bí mật khiến con sợ hãi, lo lắng – cần được kể lại ngay. Không có bí mật xấu nào đáng để con ôm một mình.' }
    ],
    verdict: {
      q: 'Hành động nào là ĐÚNG NHẤT với Hà lúc này?',
      opts: [
        'A. Xóa hết tin nhắn để không nhìn thấy nữa',
        'B. Chụp màn hình lưu bằng chứng, kể với mẹ hoặc gọi 1800 1567',
        'C. Nhắn lại bảo người đó "dừng lại" rồi thôi',
        'D. Nhờ bạn thân nhắn hộ vì sợ quá'
      ],
      correct: 1,
      explain: '<strong>Đúng rồi!</strong> Lưu bằng chứng + kể với người lớn tin cậy là đúng nhất. Nếu không biết kể với ai, có thể gọi 1800 1567 (đường dây nóng bảo vệ trẻ em, miễn phí, bảo mật).' }
  }
];

let solvedCases = new Array(CASES.length).fill(false);

function init() {
  const nav = document.getElementById('case-nav');
  const board = document.getElementById('case-board');
  nav.innerHTML = ''; board.innerHTML = '';

  CASES.forEach((c, ci) => {
    const tab = document.createElement('button');
    tab.className = 'case-tab' + (ci === 0 ? ' active' : '');
    tab.id = 'tab-' + ci;
    tab.textContent = c.icon + ' Vụ ' + (ci + 1);
    tab.onclick = () => switchCase(ci);
    nav.appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'case-panel' + (ci === 0 ? ' active' : '');
    panel.id = 'panel-' + ci;

    let cluesHtml = c.clues.map((cl, ki) => `
      <div class="clue-card" id="clue-${ci}-${ki}">
        <div class="clue-label">🔎 MANH MỐI ${ki+1}</div>
        <div class="clue-q">${cl.q}</div>
        <button class="clue-btn" id="clue-btn-${ci}-${ki}" onclick="revealClue(${ci},${ki})">▶ Suy luận xong → Xem đáp án</button>
        <div class="clue-answer" id="clue-ans-${ci}-${ki}">${cl.a.replace(/\n/g,'<br>')}</div>
      </div>`).join('');

    let optsHtml = c.verdict.opts.map((o, oi) =>
      `<button class="verdict-opt" id="vopt-${ci}-${oi}" onclick="pickVerdict(${ci},${oi})">${o}</button>`
    ).join('');

    panel.innerHTML = `
      <div class="case-header">
        <div class="case-icon">${c.icon}</div>
        <div class="case-meta">
          <div class="case-num">VỤ ÁN ${ci+1} / ${CASES.length}</div>
          <div class="case-title">${c.title}</div>
          <div class="case-situation">${c.situation}</div>
        </div>
      </div>
      <div class="clues-title">📋 KHÁM PHÁ MANH MỐI</div>
      <div class="clues-grid">${cluesHtml}</div>
      <div class="verdict-section">
        <div class="verdict-title">⚖️ PHÁN QUYẾT CUỐI</div>
        <div class="verdict-opts">${optsHtml}</div>
        <div class="verdict-explain" id="vexplain-${ci}">${c.verdict.explain}</div>
      </div>
      <div class="solved-stamp" id="stamp-${ci}">✅ VỤ ÁN ĐÃ GIẢI QUYẾT!</div>
    `;
    board.appendChild(panel);
  });
}

function switchCase(ci) {
  document.querySelectorAll('.case-tab').forEach((t,i) => t.classList.toggle('active', i === ci));
  document.querySelectorAll('.case-panel').forEach((p,i) => p.classList.toggle('active', i === ci));
}

function revealClue(ci, ki) {
  const ansDiv = document.getElementById('clue-ans-' + ci + '-' + ki);
  const btn = document.getElementById('clue-btn-' + ci + '-' + ki);
  ansDiv.classList.add('show');
  btn.style.display = 'none';
  document.getElementById('clue-' + ci + '-' + ki).classList.add('revealed');
}

function pickVerdict(ci, oi) {
  const c = CASES[ci];
  const opts = document.querySelectorAll(`[id^="vopt-${ci}-"]`);
  opts.forEach((o, i) => {
    o.disabled = true;
    if (i === c.verdict.correct) o.classList.add('correct');
    else if (i === oi && oi !== c.verdict.correct) o.classList.add('wrong');
  });
  document.getElementById('vexplain-' + ci).classList.add('show');
  if (!solvedCases[ci]) {
    solvedCases[ci] = true;
    document.getElementById('stamp-' + ci).classList.add('show');
    document.getElementById('tab-' + ci).classList.add('solved');
    updateProgress();
  }
}

function updateProgress() {
  const n = solvedCases.filter(Boolean).length;
  document.getElementById('prog-txt').textContent = n + ' / ' + CASES.length + ' vụ án đã giải';
  document.getElementById('prog-bar').style.width = (n / CASES.length * 100) + '%';
}

init();
</script>
</body>
</html>
