<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>⚖️ ĐỐ VUI APA — Mục 9: Đánh giá</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF6B35;
  --yellow: #FFD166;
  --green: #06D6A0;
  --blue: #118AB2;
  --pink: #EF476F;
  --purple: #7B2FBE;
  --dark: #1A1A2E;
  --dark2: #16213E;
  --card: rgba(255,255,255,0.07);
  --card-border: rgba(255,255,255,0.12);
  --radius: 20px;
  --radius-sm: 12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;background:var(--dark);color:#fff;min-height:100vh;overflow-x:hidden;position:relative}

.bg-anim{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.18;animation:blobMove 12s ease-in-out infinite alternate}
.blob1{width:500px;height:500px;background:var(--purple);top:-150px;left:-100px}
.blob2{width:400px;height:400px;background:var(--blue);bottom:-100px;right:-80px;animation-delay:-4s}
.blob3{width:350px;height:350px;background:var(--pink);top:40%;left:40%;animation-delay:-8s}
@keyframes blobMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,30px) scale(1.1)}}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d,2s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:0.2}100%{opacity:0.9}}

.screen{position:relative;z-index:1;display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

#setup-screen{align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.logo-icon{font-size:64px;display:block;animation:bounce 1.8s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.logo-title{font-family:'Quicksand',cursive;font-size:clamp(34px,7vw,56px);background:linear-gradient(135deg,var(--yellow),var(--orange),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;margin:10px 0 6px}
.logo-sub{font-size:15px;color:rgba(255,255,255,0.6);font-weight:600;margin-bottom:28px}
.setup-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:500px;margin-bottom:18px}
.setup-title{font-family:'Quicksand',cursive;font-size:18px;color:var(--yellow);margin-bottom:18px}
.num-q-row{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:20px}
.num-q-label{font-size:14px;color:rgba(255,255,255,0.6);font-weight:600}
.num-q-select{background:rgba(255,255,255,0.08);border:1px solid var(--card-border);border-radius:10px;padding:8px 13px;color:#fff;font-family:'Quicksand',sans-serif;font-size:14px;font-weight:700;outline:none;cursor:pointer}
.btn-start{width:100%;max-width:500px;padding:17px;border-radius:var(--radius);background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;font-family:'Quicksand',cursive;font-size:22px;border:none;cursor:pointer;letter-spacing:0.5px;box-shadow:0 8px 32px rgba(255,107,53,0.4);transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,107,53,0.5)}

#game-screen{padding:0}
.progress-full{height:4px;background:rgba(255,255,255,0.1)}
.progress-fill-bar{height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow),var(--green));transition:width 0.4s ease}
.game-top{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);border-bottom:1px solid var(--card-border);flex-wrap:wrap;gap:10px}
.q-counter{font-family:'Quicksand',cursive;font-size:15px;color:rgba(255,255,255,0.6)}
.q-counter span{color:var(--yellow);font-size:20px}
.timer-container{position:relative;width:56px;height:56px}
.timer-ring-svg{transform:rotate(-90deg)}
.timer-ring-bg{fill:none;stroke:rgba(255,255,255,0.1);stroke-width:5}
.timer-ring-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke 0.3s}
.timer-num{font-family:'Quicksand',cursive;font-size:20px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.score-board{background:var(--card);border:1px solid var(--card-border);border-radius:30px;padding:6px 16px}
.score-board span{font-family:'Quicksand',cursive;font-size:20px;color:var(--yellow)}
.question-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px 16px;text-align:center}
.q-category{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.55);background:var(--card);border:1px solid var(--card-border);border-radius:50px;padding:4px 16px;display:inline-block;margin-bottom:14px}
.q-text{font-family:'Quicksand',cursive;font-size:clamp(20px,4vw,34px);line-height:1.35;max-width:720px;margin-bottom:32px;color:#fff;animation:qFadeIn 0.4s ease}
@keyframes qFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:720px}
.option-btn{padding:16px 18px;border-radius:var(--radius-sm);border:2px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);color:#fff;font-family:'Quicksand',sans-serif;font-size:clamp(13px,2.2vw,16px);font-weight:700;cursor:pointer;transition:all 0.18s;text-align:left;display:flex;align-items:center;gap:11px;line-height:1.4}
.option-btn:hover:not(:disabled){border-color:var(--yellow);background:rgba(255,209,102,0.12);transform:translateY(-2px)}
.option-letter{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Quicksand',cursive;font-size:15px;background:rgba(255,255,255,0.12)}
.option-btn.correct{border-color:var(--green) !important;background:rgba(6,214,160,0.18) !important}
.option-btn.wrong{border-color:var(--pink) !important;background:rgba(239,71,111,0.18) !important}
.option-btn:disabled{cursor:default}
.option-btn.correct .option-letter{background:var(--green);color:#fff}
.option-btn.wrong .option-letter{background:var(--pink);color:#fff}
.game-bottom{padding:14px 20px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-reveal{padding:12px 28px;border-radius:var(--radius-sm);font-family:'Quicksand',cursive;font-size:17px;border:none;cursor:pointer;transition:all 0.2s;letter-spacing:0.3px;background:var(--yellow);color:var(--dark);box-shadow:0 4px 20px rgba(255,209,102,0.35)}
.btn-reveal:hover{transform:translateY(-2px)}
.btn-next{padding:12px 28px;border-radius:var(--radius-sm);font-family:'Quicksand',cursive;font-size:17px;border:none;cursor:pointer;transition:all 0.2s;background:linear-gradient(135deg,var(--green),var(--blue));color:#fff;box-shadow:0 4px 20px rgba(6,214,160,0.35);display:none}
.btn-next:hover{transform:translateY(-2px)}
.btn-skip{background:transparent;border:1px solid var(--card-border);color:rgba(255,255,255,0.55);font-family:'Quicksand',sans-serif;font-size:13px;font-weight:700;padding:10px 18px;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.15s}
.btn-skip:hover{border-color:rgba(255,255,255,0.3);color:#fff}
.feedback-overlay{position:fixed;inset:0;z-index:100;display:none;pointer-events:none;align-items:center;justify-content:center}
.feedback-overlay.show{display:flex}
.feedback-text{font-family:'Quicksand',cursive;font-size:72px;animation:feedbackPop 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards}
@keyframes feedbackPop{0%{opacity:0;transform:scale(0.3)}60%{opacity:1;transform:scale(1.1)}80%{transform:scale(0.95)}100%{opacity:0;transform:scale(1)}}

#result-screen{align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.result-title{font-family:'Quicksand',cursive;font-size:clamp(30px,6vw,50px);background:linear-gradient(135deg,var(--yellow),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:14px 0 6px}
.result-sub{color:rgba(255,255,255,0.55);font-size:14px;font-weight:600;margin-bottom:32px}
.final-score{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:28px 24px;margin-bottom:26px}
.final-score .score-number{font-family:'Quicksand',cursive;font-size:56px;color:var(--yellow)}
.btn-play-again{padding:15px 44px;border-radius:var(--radius);background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-family:'Quicksand',cursive;font-size:21px;border:none;cursor:pointer;letter-spacing:0.5px;box-shadow:0 8px 32px rgba(123,47,190,0.4);transition:all 0.2s}
.btn-play-again:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(123,47,190,0.5)}

@media(max-width:520px){
  .options-grid{grid-template-columns:1fr}
  .game-top{padding:11px 14px}
  .question-area{padding:20px 14px}
}
</style>
</head>
<body>

<div class="bg-anim">
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>
</div>
<div class="stars" id="starsContainer"></div>

<div class="feedback-overlay" id="feedbackOverlay">
  <div class="feedback-text" id="feedbackText"></div>
</div>

<!-- SETUP -->
<div class="screen active" id="setup-screen">
  <span class="logo-icon">⚖️</span>
  <div class="logo-title">ĐỐ VUI APA</div>
  <div class="logo-sub">Mục 9: Đánh giá (Assessment) · Thi đua sôi nổi</div>

  <div class="setup-card">
    <div class="setup-title">⚡ Cài đặt</div>
    <div class="num-q-row">
      <span class="num-q-label">Số câu hỏi:</span>
      <select class="num-q-select" id="numQ">
        <option value="10">10 câu</option>
        <option value="15">15 câu</option>
        <option value="20" selected>20 câu</option>
        <option value="28">28 câu (tất cả)</option>
      </select>
    </div>
  </div>

  <button class="btn-start" onclick="startGame()">🚀 Bắt đầu ngay!</button>
</div>

<!-- GAME -->
<div class="screen" id="game-screen">
  <div class="progress-full">
    <div class="progress-fill-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="game-top">
    <div class="q-counter">Câu <span id="qNum">1</span> / <span id="qTotal">20</span></div>
    <div class="timer-container">
      <svg class="timer-ring-svg" width="56" height="56" viewBox="0 0 56 56">
        <circle class="timer-ring-bg" cx="28" cy="28" r="24"/>
        <circle class="timer-ring-fill" id="timerRing" cx="28" cy="28" r="24" stroke-dasharray="150.8" stroke-dashoffset="0" stroke="#06D6A0"/>
      </svg>
      <div class="timer-num" id="timerNum">20</div>
    </div>
    <div class="score-board">🎯 Điểm: <span id="scoreValue">0</span></div>
  </div>

  <div class="question-area">
    <div class="q-category" id="qCategory">Điều 9.01</div>
    <div class="q-text" id="qText">Đang tải câu hỏi...</div>
    <div class="options-grid" id="optionsGrid"></div>
  </div>

  <div class="game-bottom">
    <button class="btn-skip" onclick="skipQuestion()">Bỏ qua ⏩</button>
    <button class="btn-reveal" id="btnReveal" onclick="revealAnswer()">💡 Xem đáp án</button>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Câu tiếp theo ▶</button>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="result-screen">
  <div style="font-size:60px;animation:bounce 1.6s ease-in-out infinite">🏆</div>
  <div class="result-title">Kết thúc!</div>
  <div class="result-sub" id="resultSub">Trò chơi kết thúc — Cảm ơn các học viên!</div>
  <div class="final-score">
    <div style="font-size:18px;color:rgba(255,255,255,0.6);margin-bottom:8px">Điểm của bạn</div>
    <div class="score-number" id="finalScore">0</div>
    <div style="font-size:14px;color:rgba(255,255,255,0.45);margin-top:8px" id="scoreDetail">/ 0 câu đúng</div>
  </div>
  <button class="btn-play-again" onclick="backToSetup()">🔄 Chơi lại</button>
</div>

<script>
// ⚖️ CÂU HỎI THEO MỤC 9 APA (dựa trên tài liệu phiên tòa)
const QUESTION_BANK = [
  {cat:"📜 9.01(a)", q:"Nhà tâm lý Ngọc kết luận chị Dương bị 'Rối loạn lưỡng cực có xu hướng loạn thần' chỉ dựa những bài viết đa cảm xúc trên Facebook của chị Dương, không dùng công cụ đánh giá lâm sàng. Vi phạm điều gì?", correct:"9.01(a) — Thiếu cơ sở đánh giá", wrong:["9.03 — Thiếu đồng thuận","9.06 — Diễn giải sai","9.11 — Lộ đề test"]},
  {cat:"📜 9.01(b)", q:"Ngọc đưa ra kết luận bệnh của chị Dương dù chưa từng gặp chị ấy. Vi phạm điều gì?", correct:"9.01(b) — Chưa thăm khám trực tiếp", wrong:["9.02(a) — Dùng sai test","9.08 — Dùng test lỗi thời","9.09 — Sai dịch vụ chấm điểm"]},
  {cat:"📜 9.01(c)", q:"Khi chỉ xem hồ sơ cũ mà không gặp trực tiếp, nhà tâm lý phải làm gì?", correct:"Giải thích rõ giới hạn và nguồn thông tin", wrong:["Không cần làm gì vì là hồ sơ cũ","Vẫn kết luận như thường","Gửi cho đồng nghiệp khác"]},
  {cat:"📜 9.02(a)", q:"Nhung dùng MMPI-3 (dành cho bệnh nhân tâm thần nặng) để đánh giá một học sinh 12 tuổi. Vi phạm điều gì?", correct:"9.02(a) — Dùng test sai mục đích", wrong:["9.05 — Xây dựng test sai","9.07 — Giao cho người không đủ trình độ","9.08 — Test lỗi thời"]},
  {cat:"📜 9.02(b)", q:"Test IQ chưa chuẩn hóa cho trẻ dân tộc thiểu số, nhà tâm lý phải làm gì?", correct:"Mô tả điểm mạnh và giới hạn của kết quả", wrong:["Không cần làm gì, cứ dùng","Bỏ qua kết quả đó","Ghi chú 'đã chuẩn hóa'"]},
  {cat:"📜 9.02(c)", q:"Với trẻ em dân tộc thiểu số chưa rành tiếng Việt, nhà tâm lý phải dùng?", correct:"Ngôn ngữ ưu tiên của trẻ, hoặc thông dịch viên", wrong:["Test tiếng Việt vẫn được","Test không cần ngôn ngữ","Dùng người nhà dịch hộ"]},
  {cat:"📜 9.03(a)", q:"Ngọc bỏ qua giải thích về bản chất, mục đích, phí đánh giá cho chị Dương. Vi phạm điều gì?", correct:"9.03(a) — Thiếu đồng thuận có hiểu biết", wrong:["9.04 — Không cung cấp dữ liệu","9.06 — Diễn giải sai","9.10 — Không giải thích kết quả"]},
  {cat:"📜 9.03(b)", q:"Với người có khả năng đồng thuận hạn chế, nhà tâm lý phải làm gì?", correct:"Thông báo bằng ngôn ngữ dễ hiểu", wrong:["Không cần giải thích","Bỏ qua vì họ không hiểu","Nhờ tòa giải thích"]},
  {cat:"📜 9.03(c)", q:"Khi dùng thông dịch viên, nhà tâm lý cần xin đồng thuận từ ai?", correct:"Từ thân chủ/bệnh nhân", wrong:["Từ thông dịch viên","Từ cơ quan quản lý","Không cần xin ai"]},
  {cat:"📜 9.04(a)", q:"Thuật ngữ 'Dữ liệu test' bao gồm những gì?", correct:"Điểm thô, câu trả lời, ghi chú của nhà tâm lý", wrong:["Chỉ có điểm chuẩn hóa","Sách hướng dẫn test","Bảng câu hỏi mẫu"]},
  {cat:"📜 9.04(b)", q:"Ngọc tự ý giao dữ liệu test của chị Dương cho anh Vũ (chồng) để tránh bị tố cáo. Vi phạm điều gì?", correct:"9.04(b) — Tiết lộ dữ liệu khi không có lệnh tòa", wrong:["9.01 — Thiếu cơ sở","9.07 — Giao cho người không đủ trình độ","9.11 — Lộ đề test"]},
  {cat:"📜 9.05", q:"Nhung dùng test tự chế 'Chọn màu sắc đoán tư duy' chưa qua chuẩn hóa. Vi phạm điều gì?", correct:"9.05 — Xây dựng test không đúng quy trình", wrong:["9.02 — Dùng test sai","9.08 — Test lỗi thời","9.09 — Dịch vụ chấm điểm sai"]},
  {cat:"📜 9.06", q:"Ngọc kết luận 'sa sút trí tuệ' dù chị Dương đang sốt 40 độ và vừa bị bạo hành. Vi phạm điều gì?", correct:"9.06 — Diễn giải bỏ qua yếu tố tình huống", wrong:["9.01 — Thiếu cơ sở","9.03 — Thiếu đồng thuận","9.08 — Dùng kết quả lỗi thời"]},
  {cat:"📜 9.07", q:"Nhung giao anh bảo vệ thực hiện và chấm test Rorschach cho trẻ em. Vi phạm điều gì?", correct:"9.07 — Giao test cho người không đủ trình độ", wrong:["9.02 — Dùng test sai","9.04 — Lộ dữ liệu","9.11 — Lộ đề test"]},
  {cat:"📜 9.08(a)", q:"Nhung dùng kết quả test IQ của em K'Brơi lúc 6 tuổi để xếp lớp lúc 12 tuổi. Vi phạm điều gì?", correct:"9.08(a) — Dùng dữ liệu cũ lỗi thời", wrong:["9.01 — Thiếu cơ sở","9.03 — Thiếu đồng thuận","9.06 — Diễn giải sai"]},
  {cat:"📜 9.08(b)", q:"Nhung dùng bộ test giấy xuất bản năm 1990 để tiết kiệm tiền. Vi phạm điều gì?", correct:"9.08(b) — Dùng test lỗi thời", wrong:["9.02 — Dùng test sai mục đích","9.05 — Xây dựng test sai","9.07 — Giao cho người không đủ trình độ"]},
  {cat:"📜 9.09(a)", q:"Khi cung cấp dịch vụ chấm điểm cho đồng nghiệp, nhà tâm lý cần mô tả điều gì?", correct:"Mục đích, quy chuẩn, độ tin cậy, hiệu lực", wrong:["Chỉ cần nói giá bao nhiêu","Không cần mô tả gì","Chỉ cần gửi kết quả"]},
  {cat:"📜 9.09(b)", q:"Nhung tải phần mềm chấm điểm lậu không rõ nguồn gốc. Vi phạm điều gì?", correct:"9.09(b) — Chọn dịch vụ không có bằng chứng hiệu lực", wrong:["9.02 — Dùng test sai","9.05 — Xây dựng test sai","9.11 — Lộ đề test"]},
  {cat:"📜 9.09(c)", q:"Nhung đổ lỗi cho phần mềm khi kết quả sai: 'Máy tính chấm sai chứ tôi không sai'. Vi phạm điều gì?", correct:"9.09(c) — Nhà tâm lý vẫn chịu trách nhiệm cuối cùng", wrong:["9.01 — Thiếu cơ sở","9.03 — Thiếu đồng thuận","9.10 — Không giải thích kết quả"]},
  {cat:"📜 9.10", q:"Nhung nhờ cô lễ tân đọc kết quả, và cô ta đọc kết quả chẩn đoán cho phụ huynh giữa sảnh đông người. Vi phạm điều gì?", correct:"9.10 — Việc giải thích kết quả phải do nhà tâm lý thực hiện", wrong:["9.04 — Lộ dữ liệu","9.07 — Giao cho người không đủ trình độ","9.11 — Lộ đề test"]},
  {cat:"📜 9.11", q:"Nhung đăng nguyên văn đề test MMPI mật lên Facebook để câu like. Vi phạm điều gì?", correct:"9.11 — Lộ 'Vật liệu test' (test materials)", wrong:["9.04 — Lộ dữ liệu test","9.02 — Dùng test sai","9.08 — Test lỗi thời"]},
  {cat:"⚖️ Tình huống tổng hợp", q:"Nhung vừa dùng sai test, vừa không xin đồng thuận, vừa diễn giải sai, vừa lộ đề. Hậu quả cao nhất là gì?", correct:"Tước giấy phép hành nghề vĩnh viễn", wrong:["Cảnh cáo bằng miệng","Phạt tiền 1 triệu","Đình chỉ 1 tháng"]},
  {cat:"📜 9.01 (ghi nhớ)", q:"Theo Điều 9.01, khi đưa ra kết luận về đặc điểm tâm lý của một người, nhà tâm lý bắt buộc phải làm gì?", correct:"Thăm khám trực tiếp người đó (trừ trường hợp đặc biệt)", wrong:["Chỉ cần đọc hồ sơ cũng đủ","Dựa vào lời kể của người nhà","Sử dụng phán đoán kinh nghiệm"]},
  {cat:"📜 9.03 (ghi nhớ)", q:"'Sự đồng thuận có hiểu biết' (informed consent) trước đánh giá là bắt buộc, trừ trường hợp nào?", correct:"Test theo yêu cầu pháp luật hoặc đánh giá năng lực quyết định", wrong:["Khi khách hàng vội","Khi nhà tâm lý bận","Khi test trẻ em"]},
  {cat:"📜 9.06 (ghi nhớ)", q:"Diễn giải kết quả test cần xem xét yếu tố gì?", correct:"Bối cảnh, ngôn ngữ, văn hóa, tình trạng sức khỏe", wrong:["Chỉ điểm số thô","Chỉ so sánh với người khác","Chỉ dựa vào phần mềm"]},
  {cat:"📜 9.11 (ghi nhớ)", q:"'Test materials' (vật liệu test) cần được bảo mật khác với 'test data' như thế nào?", correct:"Test materials là câu hỏi, sách hướng dẫn — phải giữ kín; test data là câu trả lời — có thể chia sẻ có điều kiện", wrong:["Giống nhau cả","Test data cũng phải giữ kín tuyệt đối","Không cần bảo mật"]},
 {cat:"📜 9.07 (ghi nhớ)", q:"Một nhà tâm lý muốn tiết kiệm chi phí đã tự viết phần mềm chấm điểm test nhưng chưa có bằng chứng về độ hiệu lực (validity). Vi phạm điều gì?", correct:"9.09(b) — Chọn dịch vụ chấm điểm không có bằng chứng hiệu lực", wrong:["9.02(a) — Dùng test sai mục đích","9.05 — Xây dựng test sai quy trình","9.11 — Lộ đề test"]},
 {cat:"📜 9.04(a)", q:"Khi thân chủ yêu cầu cung cấp dữ liệu test (điểm thô, câu trả lời), nhà tâm lý có thể từ chối trong trường hợp nào?", correct:"Để bảo vệ thân chủ khỏi nguy cơ tự hủy hoại hoặc tránh việc dữ liệu bị trình bày sai lệch", wrong:["Khi thân chủ chưa thanh toán phí dịch vụ","Khi cấp trên yêu cầu không được giao","Khi nhà tâm lý cho rằng thân chủ 'chưa đủ trình độ' để nhận dữ liệu"]},

const LETTERS = ['A','B','C','D'];
const TIMER_C = 2 * Math.PI * 24;

let currentQuestions = [], qIdx = 0, score = 0, totalQuestions = 0;
let timerInterval = null, timeLeft = 20, revealed = false;

// Xáo trộn đáp án cho một câu hỏi
function shuffleOptions(question) {
  const allAnswers = [question.correct, ...question.wrong];
  for (let i = allAnswers.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allAnswers[i], allAnswers[j]] = [allAnswers[j], allAnswers[i]];
  }
  const correctIndex = allAnswers.indexOf(question.correct);
  return { shuffledOptions: allAnswers, correctIndex };
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame() {
  const numQ = parseInt(document.getElementById('numQ').value);
  const shuffledBank = shuffleArray([...QUESTION_BANK]);
  currentQuestions = shuffledBank.slice(0, numQ).map(q => {
    const { shuffledOptions, correctIndex } = shuffleOptions(q);
    return {
      cat: q.cat,
      q: q.q,
      options: shuffledOptions,
      correctIdx: correctIndex
    };
  });
  qIdx = 0;
  score = 0;
  totalQuestions = currentQuestions.length;
  updateScoreDisplay();
  showScreen('game-screen');
  document.getElementById('qTotal').textContent = totalQuestions;
  showQuestion();
}

function updateScoreDisplay() {
  document.getElementById('scoreValue').textContent = score;
}

function showQuestion() {
  revealed = false;
  const q = currentQuestions[qIdx];
  document.getElementById('qNum').textContent = qIdx + 1;
  document.getElementById('progressBar').style.width = ((qIdx / totalQuestions) * 100) + '%';
  document.getElementById('qCategory').textContent = q.cat;
  const qEl = document.getElementById('qText');
  qEl.style.animation = 'none';
  void qEl.offsetWidth;
  qEl.style.animation = 'qFadeIn 0.4s ease';
  qEl.textContent = q.q;
  document.getElementById('optionsGrid').innerHTML = q.options.map((opt, i) => `
    <button class="option-btn" onclick="selectOption(${i})" id="opt${i}">
      <span class="option-letter">${LETTERS[i]}</span>${opt}
    </button>`).join('');
  document.getElementById('btnReveal').style.display = 'inline-flex';
  document.getElementById('btnNext').style.display = 'none';
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 20;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) { clearInterval(timerInterval); revealAnswer(); }
  }, 1000);
}

function updateTimerUI() {
  document.getElementById('timerNum').textContent = timeLeft;
  const pct = timeLeft / 20;
  const offset = TIMER_C * (1 - pct);
  const ring = document.getElementById('timerRing');
  ring.style.strokeDashoffset = offset;
  ring.style.stroke = timeLeft > 10 ? '#06D6A0' : timeLeft > 5 ? '#FFD166' : '#EF476F';
}

function selectOption(idx) {
  if (revealed) return;
  revealAnswer(idx);
}

function revealAnswer(chosen) {
  if (revealed) return;
  revealed = true;
  clearInterval(timerInterval);
  const q = currentQuestions[qIdx];
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correctIdx) btn.classList.add('correct');
    else if (i === chosen && i !== q.correctIdx) btn.classList.add('wrong');
  });
  if (chosen !== undefined && chosen === q.correctIdx) {
    showFeedback('✅');
    score++;
    updateScoreDisplay();
  } else if (chosen !== undefined) {
    showFeedback('❌');
  }
  document.getElementById('btnReveal').style.display = 'none';
  document.getElementById('btnNext').style.display = 'inline-flex';
}

function showFeedback(emoji) {
  const ov = document.getElementById('feedbackOverlay');
  document.getElementById('feedbackText').textContent = emoji;
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 700);
}

function nextQuestion() {
  qIdx++;
  if (qIdx >= totalQuestions) { showResults(); return; }
  showQuestion();
}

function skipQuestion() {
  clearInterval(timerInterval);
  if (!revealed) revealAnswer();
}

function showResults() {
  showScreen('result-screen');
  document.getElementById('finalScore').textContent = score;
  document.getElementById('scoreDetail').textContent = `/ ${totalQuestions} câu đúng`;
  const percent = Math.round((score / totalQuestions) * 100);
  let msg = '';
  if (percent === 100) msg = '🎉 Hoàn hảo! Bạn là chuyên gia thực thụ! 🎉';
  else if (percent >= 80) msg = '🌟 Tuyệt vời! Gần như hoàn hảo! 🌟';
  else if (percent >= 60) msg = '👍 Khá tốt! Cần xem lại một số điều nhé! 👍';
  else if (percent >= 40) msg = '📖 Cố gắng hơn nữa! Ôn lại Mục 9 nhé! 📖';
  else msg = '💪 Đừng nản! Học lại Mục 9 và thử lại nhé! 💪';
  document.getElementById('resultSub').textContent = msg;
}

function backToSetup() { showScreen('setup-screen'); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

(function makeStars() {
  const c = document.getElementById('starsContainer');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2 + 1;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random() * 100}%;left:${Math.random() * 100}%;--d:${(Math.random() * 2 + 1).toFixed(1)}s;animation-delay:${(Math.random() * 3).toFixed(1)}s`;
    c.appendChild(s);
  }
})();
</script>
