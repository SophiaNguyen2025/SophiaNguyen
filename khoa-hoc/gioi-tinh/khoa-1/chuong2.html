<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Chương 2: Vùng đồ bơi & Quy tắc chạm an toàn | Khóa 1 - Giáo dục giới tính | Sophia Nguyễn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #e8f0f5 0%, #d4e6f2 100%);
            font-family: 'Segoe UI', 'Be Vietnam Pro', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .header { background: white; border-radius: 32px; padding: 20px; margin-bottom: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .logo { height: 60px; margin-bottom: 10px; }
        .header h1 { color: #4a7b9d; font-size: 1.8rem; }
        
        .video-section { background: white; border-radius: 32px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 24px; overflow: hidden; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .exercise { background: white; border-radius: 32px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .exercise-title { font-size: 1.5rem; color: #4a7b9d; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 3px solid #4a7b9d; display: inline-block; }
        
        /* Flashcard */
        .flashcard-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 20px 0; }
        .flashcard { width: 260px; height: 200px; perspective: 1000px; cursor: pointer; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; border-radius: 24px; }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .flashcard-front { background: linear-gradient(135deg, #e0eff8, #bdd8ec); border: 2px solid #4a7b9d; }
        .flashcard-back { background: #4a7b9d; color: white; transform: rotateY(180deg); }
        .flashcard-emoji { font-size: 48px; margin-bottom: 12px; }
        .flashcard-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .flashcard-desc { font-size: 14px; line-height: 1.4; }
        
        /* Accordion Parent Guide */
        .accordion-item { border: 1px solid #cde1ed; border-radius: 20px; margin-bottom: 12px; overflow: hidden; }
        .accordion-header { background: #f2f8fd; padding: 15px 20px; cursor: pointer; font-weight: 600; color: #4a7b9d; display: flex; justify-content: space-between; align-items: center; }
        .accordion-header i { transition: transform 0.3s; }
        .accordion-item.active .accordion-header i { transform: rotate(180deg); }
        .accordion-content { display: none; padding: 20px; background: white; border-top: 1px solid #cde1ed; line-height: 1.6; }
        .accordion-item.active .accordion-content { display: block; }
        
        /* Quiz */
        .quiz-question { background: #f2f8fd; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .quiz-question-text { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #2c3e2f; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }
        .quiz-option { background: white; border: 2px solid #cde1ed; border-radius: 60px; padding: 12px 18px; cursor: pointer; transition: 0.2s; color: #333; display: flex; align-items: center; gap: 12px; }
        .quiz-option:hover { border-color: #4a7b9d; background: #eef5fc; }
        .quiz-option span:first-child { font-size: 28px; min-width: 45px; text-align: center; }
        .quiz-feedback { margin-top: 12px; padding: 10px; border-radius: 16px; font-size: 14px; }
        .quiz-feedback.correct { background: #e8f5e9; color: #2ecc71; border-left: 4px solid #2ecc71; }
        .quiz-feedback.wrong { background: #ffebee; color: #e74c3c; border-left: 4px solid #e74c3c; }
        
        .btn-next, .btn-back { background: #4a7b9d; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .btn-next:hover, .btn-back:hover { background: #3d6a8c; transform: translateY(-2px); }
        .complete-btn { background: #27ae60; color: white; border: none; padding: 14px; border-radius: 60px; font-weight: bold; width: 100%; margin: 20px 0; cursor: pointer; }
        .back-link { display: inline-block; margin-top: 20px; color: #4a7b9d; text-decoration: none; }
        
        .shake { animation: shake 0.3s ease-in-out 0s 2; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } 100% { transform: translateX(0); } }
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        
        @media (max-width: 768px) { .flashcard { width: 200px; height: 180px; } .flashcard-emoji { font-size: 36px; } .flashcard-title { font-size: 16px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://sophianguyen.com.vn/images/hinhremovenen.png" alt="Sophia Nguyễn" class="logo">
        <h1>🏊‍♀️ Chương 2: Vùng đồ bơi & Quy tắc chạm an toàn</h1>
    </div>

    <div class="video-section">
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/haOO0ikdOEI" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- BÀI TẬP 1: FLASHCARD -->
    <div class="exercise">
        <h2 class="exercise-title">📖 Bài tập 1: Flashcard - Học cùng bạn Sóc</h2>
        <p style="margin-bottom: 16px; color: #666;">📌 Click vào thẻ để lật xem mặt sau nhé!</p>
        <div class="flashcard-grid" id="flashcardGrid"></div>
    </div>

    <!-- BÀI TẬP 2: PARENT GUIDE (ACCORDION) -->
    <div class="exercise">
        <h2 class="exercise-title">📘 Bài tập 2: Cẩm nang dành cho ba mẹ</h2>
        <div id="parentGuideAccordion"></div>

    <!-- BÀI TẬP 3: TRẮC NGHIỆM CHO BÉ -->
    <div class="exercise">
        <h2 class="exercise-title">🎯 Bài tập 3: Bé hãy chọn đáp án đúng nhé!</h2>
        <div id="quizContainer"></div>
        <button class="complete-btn" id="completeBtn">✅ Đánh dấu đã hoàn thành bài này</button>
    </div>

    <a href="/khoa-hoc/gioi-tinh/khoa-1/" class="back-link">← Quay lại danh sách chương</a>
</div>
<canvas id="confetti-canvas"></canvas>

<script>
    // ==================== CONFETTI & ÂM THANH ====================
    let ctx = null, width = window.innerWidth, height = window.innerHeight, particles = [], animationId = null;
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; const canvas = document.getElementById('confetti-canvas'); if(canvas){ canvas.width = width; canvas.height = height; ctx = canvas.getContext('2d'); } }
    function createConfetti(duration = 1800) {
        if(!ctx) return;
        if(animationId) cancelAnimationFrame(animationId);
        particles = [];
        for(let i=0;i<140;i++) {
            particles.push({ x: Math.random() * width, y: Math.random() * height - height, size: Math.random() * 7 + 3, color: `hsl(${Math.random() * 360}, 80%, 60%)`, speedY: Math.random() * 5 + 3, speedX: (Math.random() - 0.5) * 2, rotation: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 6 });
        }
        drawConfetti();
        setTimeout(() => { if(animationId) cancelAnimationFrame(animationId); ctx?.clearRect(0,0,width,height); particles = []; }, duration);
    }
    function drawConfetti() {
        if(!ctx) return;
        ctx.clearRect(0, 0, width, height);
        let allFinished = true;
        for(let i=0;i<particles.length;i++) {
            const p = particles[i];
            if(p.y < height + 50) {
                allFinished = false;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
                ctx.restore();
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += p.rotSpeed;
            }
        }
        if(!allFinished) animationId = requestAnimationFrame(drawConfetti);
        else { if(animationId) cancelAnimationFrame(animationId); particles = []; ctx.clearRect(0,0,width,height); }
    }
    window.addEventListener('resize', () => { resizeCanvas(); if(particles.length) drawConfetti(); });
    
    function playClickSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.08;
            osc.type = 'sine';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.08);
            osc.stop(audioCtx.currentTime + 0.08);
        } catch(e) {}
    }
    
    function playSuccessSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const frequencies = [880, 1046.5, 1318.5];
            frequencies.forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = freq;
                    gain.gain.value = 0.2;
                    osc.type = 'sine';
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                    osc.stop(audioCtx.currentTime + 0.3);
                }, idx * 120);
            });
        } catch(e) {}
        createConfetti(800);
    }
    
    function playCompleteSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const gain = audioCtx.createGain();
            gain.connect(audioCtx.destination);
            gain.gain.value = 0.3;
            const bufferSize = 4096;
            const noise = audioCtx.createBufferSource();
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;
            noise.loop = true;
            noise.connect(gain);
            noise.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1.2);
            noise.stop(audioCtx.currentTime + 1.2);
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc.frequency.value = 1046.5;
                gain2.gain.value = 0.3;
                osc.type = 'sine';
                osc.start();
                gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                osc.stop(audioCtx.currentTime + 0.5);
            }, 1000);
        } catch(e) {}
        createConfetti(2500);
    }
    
    function playErrorSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 220;
            gain.gain.value = 0.25;
            osc.type = 'sawtooth';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
            osc.stop(audioCtx.currentTime + 0.4);
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 164.81;
                gain2.gain.value = 0.2;
                osc2.type = 'sawtooth';
                osc2.start();
                gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc2.stop(audioCtx.currentTime + 0.3);
            }, 150);
        } catch(e) {}
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 500);
    }

    // ========== FLASHCARDS ==========
    const flashcards = [
        { emoji: "🩱👙", title: "Vùng đồ bơi là gì?", desc: "Là vùng được che bởi áo tắm, quần lót. Đó là nơi riêng tư của con." },
        { emoji: "🧸🤲", title: "Chạm an toàn", desc: "Là cái chạm từ bố mẹ khi tắm, bác sĩ khi khám bệnh (có bố mẹ ở cạnh)." },
        { emoji: "❌👎", title: "Chạm không an toàn", desc: "Ai đó chạm vào vùng đồ bơi không có lý do chính đáng → con nói KHÔNG!" },
        { emoji: "🚦🟢🔴", title: "Quy tắc đèn giao thông", desc: "🟢 Xanh: Chạm an toàn. 🟡 Vàng: Chạm khiến con khó chịu. 🔴 Đỏ: Dừng lại, nói KHÔNG!" },
        { emoji: "🛡️🐿️", title: "Hiệp sĩ Sóc nói", desc: "Vùng đồ bơi là lớp giáp nhỏ của con. Không ai được xuyên thủng nó nếu con không cho phép!" },
        { emoji: "🗣️👨‍👩‍👧", title: "Ai là người tin cậy?", desc: "Bố, mẹ, ông, bà, cô giáo, bác sĩ – những người con tin tưởng để kể lại." },
        { emoji: "🧩🏆", title: "Thử thách Hiệp sĩ", desc: "Bố mẹ đưa ra tình huống, bé đoán chạm an toàn hay không an toàn." },
        { emoji: "🐿️💙🌟", title: "Sóc nhắn nhủ", desc: "Bảo vệ vùng đồ bơi là bảo vệ chính con. Con là hiệp sĩ của riêng mình!" }
    ];
    
    function renderFlashcards() {
        const grid = document.getElementById('flashcardGrid');
        grid.innerHTML = flashcards.map((card, idx) => `
            <div class="flashcard" data-idx="${idx}">
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <div class="flashcard-emoji">${card.emoji}</div>
                        <div class="flashcard-title">${card.title}</div>
                    </div>
                    <div class="flashcard-back">
                        <div class="flashcard-emoji">📖</div>
                        <div class="flashcard-desc">${card.desc}</div>
                    </div>
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.flashcard').forEach(card => {
            card.addEventListener('click', () => {
                playClickSound();
                card.classList.toggle('flipped');
            });
        });
    }
    
    // ========== PARENT GUIDE ACCORDION ==========
    const parentGuideData = [
        { title: "🎯 Mục tiêu của chương", content: "• Bé nhận biết được vùng đồ bơi (vùng riêng tư) trên cơ thể.<br>• Bé phân biệt được chạm an toàn và chạm không an toàn.<br>• Bé biết nói KHÔNG và kể lại cho người tin cậy." },
        { title: "💬 Câu hỏi thảo luận cùng con", content: "1. Vùng đồ bơi là những vùng nào? → Ngực, mông, bộ phận sinh dục.<br>2. Thế nào là chạm an toàn? → Bố mẹ tắm, bác sĩ khám bệnh (có bố mẹ).<br>3. Thế nào là chạm không an toàn? → Ai đó chạm vào vùng đồ bơi không có lý do chính đáng.<br>4. Nếu có người lạ chạm vào vùng đồ bơi, con sẽ làm gì? → Nói KHÔNG, bỏ chạy, kể với bố mẹ." },
        { title: "🎭 Kịch bản đóng vai (Role-play)", content: "Tình huống 1 – Chạm an toàn: Bố mẹ giả làm bác sĩ khám bệnh.<br>Tình huống 2 – Chạm không an toàn: Bố/mẹ giả làm người lạ muốn xem vùng đồ bơi.<br>👉 Con phải nói KHÔNG, chạy đến chỗ bố mẹ thật và kể lại." },
        { title: "✂️ Hoạt động tại nhà", content: "📌 Hoạt động 1: 'Tô màu vùng đồ bơi' – In hình bạn Sóc, bé tô màu và khoanh tròn vùng đồ bơi.<br>🎲 Hoạt động 2: 'Trò chơi đèn giao thông' – Bố mẹ nói tình huống, bé giơ thẻ 🟢🟡🔴." },
        { title: "📚 Bảng từ khóa (Glossary)", content: "• Vùng đồ bơi – Vùng được che bởi áo tắm, quần lót.<br>• Chạm an toàn – Cái chạm từ bố mẹ, bác sĩ khi cần thiết.<br>• Chạm không an toàn – Cái chạm khiến con sợ hãi, khó chịu.<br>• Người tin cậy – Bố, mẹ, ông, bà, cô giáo." },
        { title: "❤️ Lưu ý dành cho ba mẹ", content: "✔️ Dạy con bằng ngôn ngữ cơ thể: chỉ vào hình vẽ hoặc cơ thể thật.<br>✔️ Không dọa nạt: tránh nói 'sẽ có người bắt cóc'.<br>✔️ Lặp lại thường xuyên: mỗi tuần nhắc lại 1-2 lần qua trò chơi.<br>✔️ Khen thưởng: mỗi khi bé trả lời đúng, hãy ôm và khen con." }
    ];
    
    function renderParentGuide() {
        const container = document.getElementById('parentGuideAccordion');
        container.innerHTML = parentGuideData.map((item, idx) => `
            <div class="accordion-item" data-idx="${idx}">
                <div class="accordion-header">
                    <span>${item.title}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="accordion-content">${item.content}</div>
            </div>
        `).join('');
        
        document.querySelectorAll('.accordion-header').forEach(header => {
            header.addEventListener('click', () => {
                playClickSound();
                const item = header.parentElement;
                item.classList.toggle('active');
            });
        });
    }
    
    // ========== QUIZ (BÀI TẬP 3) ==========
    const quizQuestions = [
        { text: "🐿️ Vùng đồ bơi gồm những bộ phận nào?", options: ["Mắt, mũi, miệng", "Tay, chân, tai", "Ngực, mông, bộ phận sinh dục", "Tóc, lông mày"], correct: 2 },
        { text: "🐿️ Khi có người lạ muốn chạm vào vùng đồ bơi của con, con nên làm gì?", options: ["Im lặng vì sợ", "Nói KHÔNG, chạy đến chỗ bố mẹ và kể lại", "Cười và tiếp tục chơi", "Tự mình xử lý"], correct: 1 },
        { text: "🐿️ Ai được phép chạm vào vùng đồ bơi của con trong trường hợp cần thiết?", options: ["Bất kỳ người lớn nào", "Bạn bè cùng lớp", "Bố mẹ khi tắm/vệ sinh, bác sĩ khi khám (có bố mẹ)", "Cô giáo ở trường"], correct: 2 },
        { text: "🐿️ Theo quy tắc đèn giao thông, màu gì thể hiện 'chạm không an toàn'?", options: ["🟢 Xanh", "🟡 Vàng", "🔴 Đỏ", "Không có màu nào"], correct: 2 },
        { text: "🐿️ Câu nói nào sau đây đúng?", options: ["Vùng đồ bơi không quan trọng", "Con có quyền nói KHÔNG khi ai đó chạm không đúng", "Chỉ có người lớn mới có quyền quyết định", "Con không cần kể lại cho ai"], correct: 1 }
    ];
    
    let currentQuizIndex = 0;
    let quizAnswers = new Array(quizQuestions.length).fill(null);
    
    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        if (currentQuizIndex >= quizQuestions.length) {
            let correct = 0;
            for (let i = 0; i < quizQuestions.length; i++) if (quizAnswers[i] === quizQuestions[i].correct) correct++;
            let msg = correct === quizQuestions.length ? '🎉 XUẤT SẮC! Con đã hiểu bài rồi!' : `👍 Con đã trả lời đúng ${correct}/${quizQuestions.length} câu. Hãy xem lại những câu sai nhé!`;
            if (correct === quizQuestions.length) playCompleteSound();
            else playSuccessSound();
            container.innerHTML = `<div style="background: #f0f0f0; border-radius: 24px; padding: 30px; text-align: center;">
                <div style="font-size: 48px;">🏆</div>
                <div style="font-size: 24px; font-weight: bold; color: #4a7b9d;">${correct}/${quizQuestions.length}</div>
                <div style="margin: 15px 0;">${msg}</div>
                <button class="btn-next" id="resetQuizBtn">🔄 Làm lại bài tập</button>
            </div>`;
            document.getElementById('resetQuizBtn')?.addEventListener('click', () => {
                currentQuizIndex = 0;
                quizAnswers.fill(null);
                renderQuiz();
            });
            return;
        }
        
        const q = quizQuestions[currentQuizIndex];
        const savedAnswer = quizAnswers[currentQuizIndex];
        let html = `<div style="background: #f2f8fd; border-radius: 24px; padding: 20px; margin-bottom: 20px;">
            <div style="font-weight: bold; margin-bottom: 15px;">Câu ${currentQuizIndex + 1}/${quizQuestions.length}</div>
            <div style="font-size: 18px; margin-bottom: 20px;">${q.text}</div>
            <div class="quiz-options" id="quizOptions"></div>
            <div id="quizFeedback" class="quiz-feedback">${savedAnswer !== null ? (savedAnswer === q.correct ? '✅ Đúng rồi!' : '❌ Chưa đúng, hãy xem lại bài học nhé!') : '💡 Hãy chọn đáp án đúng!'}</div>
            <button class="btn-next" id="nextQuizBtn">${currentQuizIndex === quizQuestions.length - 1 ? '🏁 HOÀN THÀNH' : '➡️ CÂU TIẾP THEO'}</button>
        </div>`;
        container.innerHTML = html;
        
        const optionsDiv = document.getElementById('quizOptions');
        q.options.forEach((opt, idx) => {
            const optDiv = document.createElement('div');
            optDiv.className = 'quiz-option';
            if (savedAnswer !== null) {
                if (savedAnswer === idx && idx === q.correct) optDiv.style.borderColor = '#2ecc71';
                else if (savedAnswer === idx && idx !== q.correct) optDiv.style.borderColor = '#e74c3c';
            }
            optDiv.innerHTML = `<span>${idx === 0 ? '🅰️' : idx === 1 ? '🅱️' : idx === 2 ? '🅲️' : '🅳️'}</span><span>${opt}</span>`;
            optDiv.onclick = () => {
                if (quizAnswers[currentQuizIndex] !== null) return;
                playClickSound();
                quizAnswers[currentQuizIndex] = idx;
                const feedback = document.getElementById('quizFeedback');
                if (idx === q.correct) {
                    feedback.innerHTML = '✅ Đúng rồi!';
                    feedback.className = 'quiz-feedback correct';
                    playSuccessSound();
                } else {
                    feedback.innerHTML = `❌ Chưa đúng. Đáp án đúng là: ${q.options[q.correct]}`;
                    feedback.className = 'quiz-feedback wrong';
                    playErrorSound();
                }
                renderQuiz();
            };
            optionsDiv.appendChild(optDiv);
        });
        
        document.getElementById('nextQuizBtn').onclick = () => {
            if (quizAnswers[currentQuizIndex] === null) {
                document.getElementById('quizFeedback').innerHTML = '⚠️ Hãy chọn đáp án trước khi tiếp tục!';
                playErrorSound();
                return;
            }
            playClickSound();
            currentQuizIndex++;
            renderQuiz();
        };
    }
    
    // Hoàn thành bài học
    let completed = localStorage.getItem('sexed_chuong2_completed') === 'true';
    const completeBtn = document.getElementById('completeBtn');
    if (completed) {
        completeBtn.innerHTML = '✅ Bạn đã hoàn thành chương này';
        completeBtn.disabled = true;
        completeBtn.style.opacity = '0.7';
    }
    completeBtn.addEventListener('click', () => {
        if (!completed) {
            completed = true;
            localStorage.setItem('sexed_chuong2_completed', 'true');
            completeBtn.innerHTML = '✅ Bạn đã hoàn thành chương này';
            completeBtn.disabled = true;
            completeBtn.style.opacity = '0.7';
            playCompleteSound();
        }
    });
    
    renderFlashcards();
    renderParentGuide();
    renderQuiz();
    resizeCanvas();
</script>
</body>
</html>
