        .quiz-option { background: white; border: 2px solid #f0d0b0; border-radius: 60px; padding: 12px 18px; cursor: pointer; transition: 0.2s; color: #333; display: flex; align-items: center; gap: 12px; }

        @media (max-width: 768px) { .flashcard { width: 200px; height: 180px; } .flashcard-emoji { font-size: 36px; } .flashcard-title { font-size: 16px; } }

<canvas id="confetti-canvas"></canvas>

<script>
    // ==================== CONFETTI & ÂM THANH ====================
    let ctx = null, width = window.innerWidth, height = window.innerHeight, particles = [], animationId = null;
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; const canvas = document.getElementById('confetti-canvas'); if(canvas){ canvas.width = width; canvas.height = height; ctx = canvas.getContext('2d'); } }
    function createConfetti(duration = 1800) {
        if(!ctx) return;
        if(animationId) cancelAnimationFrame(animationId);
        particles = [];
        for(let i=0;i<140;i++) {
            particles.push({ x: Math.random() * width, y: Math.random() * height - height, size: Math.random() * 7 + 3, color: `hsl(${Math.random() * 360}, 80%, 60%)`, speedY: Math.random() * 5 + 3, speedX: (Math.random() - 0.5) * 2, rotation: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 6 });
        }
        drawConfetti();
        setTimeout(() => { if(animationId) cancelAnimationFrame(animationId); ctx?.clearRect(0,0,width,height); particles = []; }, duration);
    }
    function drawConfetti() {
        if(!ctx) return;
        ctx.clearRect(0, 0, width, height);
        let allFinished = true;
        for(let i=0;i<particles.length;i++) {
            const p = particles[i];
            if(p.y < height + 50) {
                allFinished = false;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
                ctx.restore();
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += p.rotSpeed;
            }
        }
        if(!allFinished) animationId = requestAnimationFrame(drawConfetti);
        else { if(animationId) cancelAnimationFrame(animationId); particles = []; ctx.clearRect(0,0,width,height); }
    }
    window.addEventListener('resize', () => { resizeCanvas(); if(particles.length) drawConfetti(); });
    
    function playClickSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.08;
            osc.type = 'sine';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.08);
            osc.stop(audioCtx.currentTime + 0.08);
        } catch(e) {}
    }
    
    function playSuccessSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const frequencies = [880, 1046.5, 1318.5];
            frequencies.forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = freq;
                    gain.gain.value = 0.2;
                    osc.type = 'sine';
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                    osc.stop(audioCtx.currentTime + 0.3);
                }, idx * 120);
            });
        } catch(e) {}
        createConfetti(800);
    }
    
    function playCompleteSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const gain = audioCtx.createGain();
            gain.connect(audioCtx.destination);
            gain.gain.value = 0.3;
            const bufferSize = 4096;
            const noise = audioCtx.createBufferSource();
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;
            noise.loop = true;
            noise.connect(gain);
            noise.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1.2);
            noise.stop(audioCtx.currentTime + 1.2);
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc.frequency.value = 1046.5;
                gain2.gain.value = 0.3;
                osc.type = 'sine';
                osc.start();
                gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                osc.stop(audioCtx.currentTime + 0.5);
            }, 1000);
        } catch(e) {}
        createConfetti(2500);
    }
    
    function playErrorSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 220;
            gain.gain.value = 0.25;
            osc.type = 'sawtooth';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
            osc.stop(audioCtx.currentTime + 0.4);
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 164.81;
                gain2.gain.value = 0.2;
                osc2.type = 'sawtooth';
                osc2.start();
                gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc2.stop(audioCtx.currentTime + 0.3);
            }, 150);
        } catch(e) {}
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 500);
    }

    // ========== FLASHCARDS ==========
    const flashcards = [
        { emoji: "🎉😊", title: "Bí mật tốt", desc: "Là bí mật khiến con vui vẻ, hạnh phúc, háo hức. Ví dụ: giữ bí mật về món quà sinh nhật tặng mẹ." },
        { emoji: "😰😨", title: "Bí mật xấu", desc: "Là bí mật khiến con lo lắng, sợ hãi, khó chịu. Con có quyền nói ra ngay lập tức!" },
        { emoji: "🔔🫀", title: "Chuông bảo động", desc: "Là cảm giác ruột cồn cào, tim đập nhanh, tay run, người cứng đơ – báo hiệu con đang gặp điều không ổn." },
        { emoji: "⏱️👂", title: "Quy tắc 3 giây", desc: "Khi cảm thấy không an toàn, con có 3 giây để hành động: Nói KHÔNG – Bỏ chạy – Kể lại." },
        { emoji: "🎁⚠️", title: "Món quà bí mật – Cái bẫy", desc: "Nếu ai đó tặng quà và bảo 'Đừng nói với ai nhé' – Đó có thể là chiếc bẫy. Hãy kể với bố mẹ ngay!" },
        { emoji: "🎁🎉", title: "Quà tặng hạnh phúc", desc: "Món quà thực sự là để mọi người cùng biết và cùng vui. Không có quà nào phải giấu bố mẹ cả!" },
        { emoji: "🗣️🔑", title: "Chìa khóa vạn năng", desc: "Là sức mạnh của lời nói thật. Kể lại sự việc với người tin cậy là cách bảo vệ bản thân tốt nhất." },
        { emoji: "🐿️🛡️🏆", title: "Sóc nhắn nhủ", desc: "Con là Tân Hiệp sĩ Bản lĩnh! Hãy lắng nghe chuông bảo động, nói ra bí mật xấu và luôn an toàn." }
    ];
    
    function renderFlashcards() {
        const grid = document.getElementById('flashcardGrid');
        grid.innerHTML = flashcards.map((card, idx) => `
            <div class="flashcard" data-idx="${idx}">
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <div class="flashcard-emoji">${card.emoji}</div>
                        <div class="flashcard-title">${card.title}</div>
                    </div>
                    <div class="flashcard-back">
                        <div class="flashcard-emoji">📖</div>
                        <div class="flashcard-desc">${card.desc}</div>
                    </div>
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.flashcard').forEach(card => {
            card.addEventListener('click', () => {
                playClickSound();
                card.classList.toggle('flipped');
            });
        });
    }
    
    // ========== PARENT GUIDE ACCORDION ==========
    const parentGuideData = [
        { title: "🎯 Mục tiêu của chương", content: "• Bé phân biệt được bí mật tốt (vui vẻ, có thời hạn) và bí mật xấu (gây lo âu, sợ hãi).<br>• Bé nhận biết chuông bảo động của cơ thể.<br>• Bé biết nói ra ngay bí mật xấu với người tin cậy.<br>• Bé hiểu quy tắc quà tặng: Không nhận quà kèm điều kiện giữ bí mật." },
        { title: "💬 Câu hỏi thảo luận cùng con", content: "1. Bí mật tốt là gì? Ví dụ? → Là bí mật vui vẻ. Ví dụ: giấu bí mật về món quà sinh nhật tặng mẹ.<br>2. Bí mật xấu là gì? Ví dụ? → Là bí mật khiến con sợ hãi, lo lắng.<br>3. Chuông bảo động là gì? → Cảm giác trong người báo hiệu có điều không ổn.<br>4. Nếu có bí mật xấu, con phải làm gì? → Nói ra ngay với bố, mẹ hoặc người tin cậy." },
        { title: "🎭 Kịch bản đóng vai (Role-play)", content: "Tình huống 1 – Bí mật xấu: Người lạ bảo 'Đừng nói với bố mẹ' → Bé nói KHÔNG và chạy kể lại.<br>Tình huống 2 – Chuông bảo động: Hỏi bé cảm thấy thế nào khi có bí mật xấu.<br>Tình huống 3 – Bí mật tốt: Giấu quà sinh nhật tặng mẹ là bí mật tốt." },
        { title: "✂️ Hoạt động tại nhà", content: "📌 Hoạt động 1: 'Vẽ 2 loại bí mật' – Chia giấy làm 2 nửa, vẽ bí mật tốt và xấu.<br>🎲 Hoạt động 2: 'Trò chơi nhận diện chuông bảo động' – Bé giơ tay khi cảm thấy chuông reo.<br>🎨 Hoạt động 3: 'Vẽ vòng tròn tin cậy' – Vẽ tên những người bé tin tưởng.<br>🎁 Hoạt động 4: 'Quy tắc quà tặng' – Dạy bé không nhận quà kèm điều kiện giữ bí mật." },
        { title: "📚 Bảng từ khóa (Glossary)", content: "🎉 Bí mật tốt: Bí mật khiến con vui, có thời hạn.<br>😰 Bí mật xấu: Bí mật khiến con sợ hãi, lo lắng. Con CÓ QUYỀN nói ra.<br>🔔 Chuông bảo động: Cảm giác trong người báo hiệu nguy hiểm.<br>⏱️ Quy tắc 3 giây: Nói KHÔNG → Bỏ chạy → Kể lại.<br>🎁 Quà tặng bí mật: Nếu ai đó tặng quà và bảo 'đừng nói' → đó là cái bẫy." },
        { title: "❤️ Lưu ý dành cho ba mẹ", content: "✔️ Dạy con về cảm xúc: Giúp con nhận diện 'chuông bảo động'.<br>✔️ Không ép con giữ bí mật xấu: Con cần tin rằng bố mẹ luôn lắng nghe.<br>✔️ Tạo môi trường an toàn để nói: Nói ra bí mật xấu sẽ KHÔNG bị phạt.<br>✔️ Lặp lại thường xuyên: Mỗi tuần nhắc lại quy tắc qua trò chơi." }
    ];
    
    function renderParentGuide() {
        const container = document.getElementById('parentGuideAccordion');
        container.innerHTML = parentGuideData.map((item, idx) => `
            <div class="accordion-item" data-idx="${idx}">
                <div class="accordion-header">
                    <span>${item.title}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="accordion-content">${item.content}</div>
            </div>
        `).join('');
        
        document.querySelectorAll('.accordion-header').forEach(header => {
            header.addEventListener('click', () => {
                playClickSound();
                const item = header.parentElement;
                item.classList.toggle('active');
            });
        });
    }
    
    // ========== QUIZ ==========
    const quizQuestions = [
        { text: "🤫 Bí mật tốt là bí mật như thế nào?", options: ["Khiến con sợ hãi", "Khiến con vui vẻ, háo hức", "Khiến con buồn bã", "Khiến con tức giận"], correct: 1 },
        { text: "🤫 Khi có bí mật xấu, con cần làm gì?", options: ["Giữ kín không nói ai", "Kể lại với bố mẹ hoặc người tin cậy", "Tự mình xử lý", "Quên đi"], correct: 1 },
        { text: "🤫 Chuông bảo động là gì?", options: ["Tiếng chuông đồng hồ", "Cảm giác trong người báo hiệu nguy hiểm", "Tiếng còi xe", "Tiếng nhạc vui"], correct: 1 },
        { text: "🤫 Nếu ai đó tặng quà và bảo 'Đừng nói với bố mẹ', con nên làm gì?", options: ["Nhận quà và giữ bí mật", "Từ chối và kể lại với bố mẹ", "Cất quà đi", "Chia quà cho bạn"], correct: 1 },
        { text: "🤫 Quy tắc 3 giây gồm những bước nào?", options: ["Hát, múa, nhảy", "Nói KHÔNG, Bỏ chạy, Kể lại", "Khóc, la hét, đánh nhau", "Chạy, trốn, nấp"], correct: 1 }
    ];
    
    let currentQuizIndex = 0;
    let quizAnswers = new Array(quizQuestions.length).fill(null);
    
    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        if (currentQuizIndex >= quizQuestions.length) {
            let correct = 0;
            for (let i = 0; i < quizQuestions.length; i++) if (quizAnswers[i] === quizQuestions[i].correct) correct++;
            let msg = correct === quizQuestions.length ? '🎉 XUẤT SẮC! Con đã trở thành TÂN HIỆP SĨ BẢN LĨNH! 🎉' : `👍 Con đã trả lời đúng ${correct}/${quizQuestions.length} câu. Hãy xem lại nhé!`;
            if (correct === quizQuestions.length) playCompleteSound();
            else playSuccessSound();
            container.innerHTML = `<div style="background: #f0f0f0; border-radius: 24px; padding: 30px; text-align: center;">
                <div style="font-size: 48px;">🏆</div>
                <div style="font-size: 24px; font-weight: bold; color: #d98f5a;">${correct}/${quizQuestions.length}</div>
                <div style="margin: 15px 0;">${msg}</div>
                <button class="btn-next" id="resetQuizBtn">🔄 Làm lại bài tập</button>
            </div>`;
            document.getElementById('resetQuizBtn')?.addEventListener('click', () => {
                currentQuizIndex = 0;
                quizAnswers.fill(null);
                renderQuiz();
            });
            return;
        }
        
        const q = quizQuestions[currentQuizIndex];
        const savedAnswer = quizAnswers[currentQuizIndex];
        let html = `<div style="background: #fff5ea; border-radius: 24px; padding: 20px; margin-bottom: 20px;">
            <div style="font-weight: bold; margin-bottom: 15px;">Câu ${currentQuizIndex + 1}/${quizQuestions.length}</div>
            <div style="font-size: 18px; margin-bottom: 20px;">${q.text}</div>
            <div class="quiz-options" id="quizOptions"></div>
            <div id="quizFeedback" class="quiz-feedback">${savedAnswer !== null ? (savedAnswer === q.correct ? '✅ Đúng rồi!' : '❌ Chưa đúng, hãy xem lại bài học nhé!') : '💡 Hãy chọn đáp án đúng!'}</div>
            <button class="btn-next" id="nextQuizBtn">${currentQuizIndex === quizQuestions.length - 1 ? '🏁 HOÀN THÀNH' : '➡️ CÂU TIẾP THEO'}</button>
        </div>`;
        container.innerHTML = html;
        
        const optionsDiv = document.getElementById('quizOptions');
        q.options.forEach((opt, idx) => {
            const optDiv = document.createElement('div');
            optDiv.className = 'quiz-option';
            if (savedAnswer !== null) {
                if (savedAnswer === idx && idx === q.correct) optDiv.style.borderColor = '#2ecc71';
                else if (savedAnswer === idx && idx !== q.correct) optDiv.style.borderColor = '#e74c3c';
            }
            optDiv.innerHTML = `<span>${idx === 0 ? '🅰️' : idx === 1 ? '🅱️' : idx === 2 ? '🅲️' : '🅳️'}</span><span>${opt}</span>`;
            optDiv.onclick = () => {
                if (quizAnswers[currentQuizIndex] !== null) return;
                playClickSound();
                quizAnswers[currentQuizIndex] = idx;
                const feedback = document.getElementById('quizFeedback');
                if (idx === q.correct) {
                    feedback.innerHTML = '✅ Đúng rồi!';
                    feedback.className = 'quiz-feedback correct';
                    playSuccessSound();
                } else {
                    feedback.innerHTML = `❌ Chưa đúng. Đáp án đúng là: ${q.options[q.correct]}`;
                    feedback.className = 'quiz-feedback wrong';
                    playErrorSound();
                }
                renderQuiz();
            };
            optionsDiv.appendChild(optDiv);
        });
        
        document.getElementById('nextQuizBtn').onclick = () => {
            if (quizAnswers[currentQuizIndex] === null) {
                document.getElementById('quizFeedback').innerHTML = '⚠️ Hãy chọn đáp án trước khi tiếp tục!';
                playErrorSound();
                return;
            }
            playClickSound();
            currentQuizIndex++;
            renderQuiz();
        };
    }
    
    // Hoàn thành bài học
    let completed = localStorage.getItem('sexed_chuong5_completed') === 'true';
    const completeBtn = document.getElementById('completeBtn');
    if (completed) {
        completeBtn.innerHTML = '✅ Bạn đã hoàn thành khóa 1';
        completeBtn.disabled = true;
        completeBtn.style.opacity = '0.7';
    }
    completeBtn.addEventListener('click', () => {
        if (!completed) {
            completed = true;
            localStorage.setItem('sexed_chuong5_completed', 'true');
            completeBtn.innerHTML = '✅ Bạn đã hoàn thành khóa 1';
            completeBtn.disabled = true;
            completeBtn.style.opacity = '0.7';
            playCompleteSound();
        }
    });
    
    renderFlashcards();
    renderParentGuide();
    renderQuiz();
    resizeCanvas();
</script>
</body>
</html>
