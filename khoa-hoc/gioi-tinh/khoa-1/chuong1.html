<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bài 1: Cơ thể tôi là của tôi | Giáo dục giới tính toàn diện | Sophia Nguyễn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy-dark: #0A1628;
            --navy-mid: #1E3A5F;
            --gold: #C9A84C;
            --gold-light: #D4B85C;
            --cream: #F5F0E8;
            --white: #FFFFFF;
            --gray: #4A5A6A;
            --light-gray: #E8E4DC;
        }
        body {
            background: linear-gradient(145deg, var(--cream) 0%, #EDE8E0 100%);
            font-family: 'Inter', 'Be Vietnam Pro', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .header { 
            background: var(--white); 
            border-radius: 32px; 
            padding: 20px; 
            margin-bottom: 20px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(10,22,40,0.08);
            border: 1px solid var(--light-gray);
        }
        .logo { height: 60px; margin-bottom: 10px; }
        .header h1 { 
            font-family: 'Playfair Display', serif;
            color: var(--navy-dark); 
            font-size: 1.8rem; 
        }
        .header h1 span { color: var(--gold); }
        
        .video-section { 
            background: var(--white); 
            border-radius: 32px; 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 10px 30px rgba(10,22,40,0.08);
            border: 1px solid var(--light-gray);
        }
        .video-wrapper { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            border-radius: 24px; 
            overflow: hidden; 
        }
        .video-wrapper iframe { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            border: none; 
        }
        
        .exercise { 
            background: var(--white); 
            border-radius: 32px; 
            padding: 24px; 
            margin-bottom: 20px; 
            box-shadow: 0 10px 30px rgba(10,22,40,0.08);
            border: 1px solid var(--light-gray);
        }
        .exercise-title { 
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem; 
            color: var(--navy-dark); 
            margin-bottom: 16px; 
            padding-bottom: 8px; 
            border-bottom: 3px solid var(--gold); 
            display: inline-block; 
        }
        
        /* ── FLASHCARD ── */
        .flashcard-grid { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
            margin: 20px 0; 
        }
        .flashcard { 
            width: 260px; 
            height: 200px; 
            perspective: 1000px; 
            cursor: pointer; 
        }
        .flashcard-inner { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            text-align: center; 
            transition: transform 0.6s; 
            transform-style: preserve-3d; 
            border-radius: 24px; 
        }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 24px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            box-shadow: 0 10px 20px rgba(10,22,40,0.1); 
        }
        .flashcard-front { 
            background: linear-gradient(135deg, #FFF5F0, #FFE8DC); 
            border: 2px solid var(--gold); 
        }
        .flashcard-back { 
            background: var(--navy-dark); 
            color: var(--white); 
            transform: rotateY(180deg); 
        }
        .flashcard-emoji { font-size: 48px; margin-bottom: 12px; }
        .flashcard-title { 
            font-family: 'Playfair Display', serif;
            font-size: 20px; 
            font-weight: bold; 
            margin-bottom: 8px; 
        }
        .flashcard-desc { font-size: 14px; line-height: 1.4; color: rgba(255,255,255,0.9); }
        
        /* ── ACCORDION ── */
        .accordion-item { 
            border: 1px solid var(--light-gray); 
            border-radius: 20px; 
            margin-bottom: 12px; 
            overflow: hidden; 
        }
        .accordion-header { 
            background: var(--cream); 
            padding: 15px 20px; 
            cursor: pointer; 
            font-weight: 600; 
            color: var(--navy-dark); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-family: 'Inter', sans-serif;
        }
        .accordion-header i { transition: transform 0.3s; color: var(--gold); }
        .accordion-item.active .accordion-header i { transform: rotate(180deg); }
        .accordion-content { 
            display: none; 
            padding: 20px; 
            background: var(--white); 
            border-top: 1px solid var(--light-gray); 
            line-height: 1.7; 
        }
        .accordion-item.active .accordion-content { display: block; }
        
        /* ── QUIZ ── */
        .quiz-question { 
            background: var(--cream); 
            border-radius: 20px; 
            padding: 20px; 
            margin-bottom: 20px; 
        }
        .quiz-question-text { 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 15px; 
            color: var(--navy-dark); 
        }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }
        .quiz-option { 
            background: var(--white); 
            border: 2px solid var(--light-gray); 
            border-radius: 60px; 
            padding: 12px 18px; 
            cursor: pointer; 
            transition: 0.2s; 
            color: var(--navy-dark); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        .quiz-option:hover { 
            border-color: var(--gold); 
            background: var(--cream); 
        }
        .quiz-option span:first-child { font-size: 28px; min-width: 45px; text-align: center; }
        .quiz-feedback { 
            margin-top: 12px; 
            padding: 12px; 
            border-radius: 16px; 
            font-size: 14px; 
        }
        .quiz-feedback.correct { 
            background: #E8F5E9; 
            color: #2E7D32; 
            border-left: 4px solid #2E7D32; 
        }
        .quiz-feedback.wrong { 
            background: #FFEBEE; 
            color: #C62828; 
            border-left: 4px solid #C62828; 
        }
        
        .btn-next { 
            background: var(--navy-dark); 
            color: var(--white); 
            border: none; 
            padding: 12px 24px; 
            border-radius: 40px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 15px; 
            transition: 0.2s; 
            font-family: 'Inter', sans-serif;
        }
        .btn-next:hover { 
            background: var(--gold); 
            color: var(--navy-dark); 
            transform: translateY(-2px); 
        }
        .complete-btn { 
            background: var(--gold); 
            color: var(--navy-dark); 
            border: none; 
            padding: 14px; 
            border-radius: 60px; 
            font-weight: bold; 
            width: 100%; 
            margin: 20px 0; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .complete-btn:hover { 
            background: var(--gold-light); 
            transform: translateY(-2px); 
        }
        .complete-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .back-link { 
            display: inline-block; 
            margin-top: 20px; 
            color: var(--gold); 
            text-decoration: none; 
            font-weight: 600;
            transition: 0.2s;
        }
        .back-link:hover { color: var(--navy-dark); }
        
        .shake { animation: shake 0.3s ease-in-out 0s 2; }
        @keyframes shake { 
            0% { transform: translateX(0); } 
            25% { transform: translateX(-5px); } 
            75% { transform: translateX(5px); } 
            100% { transform: translateX(0); } 
        }
        #confetti-canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            z-index: 1000; 
        }
        
        @media (max-width: 768px) { 
            .flashcard { width: 200px; height: 180px; } 
            .flashcard-emoji { font-size: 36px; } 
            .flashcard-title { font-size: 16px; } 
            .header h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://sophianguyen.com.vn/images/hinhremovenen.png" alt="Sophia Nguyễn" class="logo">
        <h1>🌸 Bài 1: <span>Cơ thể tôi là của tôi</span></h1>
    </div>

    <div class="video-section">
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/3_BbPQM7CF4" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <div class="exercise">
        <h2 class="exercise-title">📖 Bài tập 1: Flashcard - Học cùng bạn Sóc</h2>
        <p style="margin-bottom: 16px; color: var(--gray);">📌 Click vào thẻ để lật xem mặt sau nhé!</p>

    </div>

    <a href="index-gioi-thieu.html" class="back-link">← Quay lại danh sách khóa học</a>

<canvas id="confetti-canvas"></canvas>

<script>
    // ==================== CONFETTI & ÂM THANH ====================
    let ctx = null, width = window.innerWidth, height = window.innerHeight, particles = [], animationId = null;
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; const canvas = document.getElementById('confetti-canvas'); if(canvas){ canvas.width = width; canvas.height = height; ctx = canvas.getContext('2d'); } }
    function createConfetti(duration = 1800) {
        if(!ctx) return;
        if(animationId) cancelAnimationFrame(animationId);
        particles = [];
        for(let i=0;i<140;i++) {
            particles.push({ x: Math.random() * width, y: Math.random() * height - height, size: Math.random() * 7 + 3, color: `hsl(${Math.random() * 360}, 80%, 60%)`, speedY: Math.random() * 5 + 3, speedX: (Math.random() - 0.5) * 2, rotation: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 6 });
        }
        drawConfetti();
        setTimeout(() => { if(animationId) cancelAnimationFrame(animationId); ctx?.clearRect(0,0,width,height); particles = []; }, duration);
    }
    function drawConfetti() {
        if(!ctx) return;
        ctx.clearRect(0, 0, width, height);
        let allFinished = true;
        for(let i=0;i<particles.length;i++) {
            const p = particles[i];
            if(p.y < height + 50) {
                allFinished = false;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
                ctx.restore();
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += p.rotSpeed;
            }
        }
        if(!allFinished) animationId = requestAnimationFrame(drawConfetti);
        else { if(animationId) cancelAnimationFrame(animationId); particles = []; ctx.clearRect(0,0,width,height); }
    }
    window.addEventListener('resize', () => { resizeCanvas(); if(particles.length) drawConfetti(); });
    
    function playClickSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.08;
            osc.type = 'sine';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.08);
            osc.stop(audioCtx.currentTime + 0.08);
        } catch(e) {}
    }
    
    function playSuccessSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const frequencies = [880, 1046.5, 1318.5];
            frequencies.forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = freq;
                    gain.gain.value = 0.2;
                    osc.type = 'sine';
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                    osc.stop(audioCtx.currentTime + 0.3);
                }, idx * 120);
            });
        } catch(e) {}
        createConfetti(800);
    }
    
    function playCompleteSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const gain = audioCtx.createGain();
            gain.connect(audioCtx.destination);
            gain.gain.value = 0.3;
            const bufferSize = 4096;
            const noise = audioCtx.createBufferSource();
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;
            noise.loop = true;
            noise.connect(gain);
            noise.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1.2);
            noise.stop(audioCtx.currentTime + 1.2);
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc.frequency.value = 1046.5;
                gain2.gain.value = 0.3;
                osc.type = 'sine';
                osc.start();
                gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                osc.stop(audioCtx.currentTime + 0.5);
            }, 1000);
        } catch(e) {}
        createConfetti(2500);
    }
    
    function playErrorSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 220;
            gain.gain.value = 0.25;
            osc.type = 'sawtooth';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
            osc.stop(audioCtx.currentTime + 0.4);
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 164.81;
                gain2.gain.value = 0.2;
                osc2.type = 'sawtooth';
                osc2.start();
                gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc2.stop(audioCtx.currentTime + 0.3);
            }, 150);
        } catch(e) {}
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 500);
    }

    // ========== FLASHCARDS ==========
    const flashcards = [
        { emoji: "🐿️💬", title: "Bạn Sóc nói", desc: "Mỗi bộ phận trên cơ thể đều có tên riêng và đều quan trọng!" },
        { emoji: "👀👂🖐️", title: "Vùng lộ diện", desc: "Mắt, mũi, miệng, tai, tay, chân – ai cũng có thể nhìn thấy." },
        { emoji: "🩲🩱🚿", title: "Vùng đồ bơi", desc: "Ngực, mông, bộ phận sinh dục – chỉ mình con và bố mẹ/bác sĩ khi cần." },
        { emoji: "📚🧸💡", title: "Gọi đúng tên", desc: "Dương vật, âm hộ, ngực, mông – để được giúp đỡ chính xác." },
        { emoji: "❌🤫🔐", title: "Không xấu hổ", desc: "Gọi đúng tên vùng kín đáo không có gì sai – đó là cách con bảo vệ mình." },
        { emoji: "🗣️❤️👪", title: "Kể cho người lớn", desc: "Nếu ai đó chạm vào vùng đồ bơi, hãy nói tên chính xác để bố mẹ giúp." },
        { emoji: "🎨📖✨", title: "Luyện tập cùng bố mẹ", desc: "Bố mẹ chỉ vào hình vẽ, con gọi tên – vừa học vừa chơi!" },
        { emoji: "🐿️🌈💖", title: "Sóc nhắn nhủ", desc: "Cơ thể con là của riêng con. Hãy tự hào và bảo vệ nó!" }
    ];
    
    function renderFlashcards() {
        const grid = document.getElementById('flashcardGrid');
        grid.innerHTML = flashcards.map((card, idx) => `
            <div class="flashcard" data-idx="${idx}">
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <div class="flashcard-emoji">${card.emoji}</div>
                        <div class="flashcard-title">${card.title}</div>
                    </div>
                    <div class="flashcard-back">
                        <div class="flashcard-emoji">📖</div>
                        <div class="flashcard-desc">${card.desc}</div>
                    </div>
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.flashcard').forEach(card => {
            card.addEventListener('click', () => {
                playClickSound();
                card.classList.toggle('flipped');
            });
        });
    }
    
    // ========== PARENT GUIDE ACCORDION ==========
    const parentGuideData = [
        { title: "🎯 Mục tiêu của chương", content: "• Bé nhận biết và gọi đúng tên khoa học các bộ phận trên cơ thể.<br>• Bé hiểu gọi đúng tên là bình thường, không xấu hổ.<br>• Bé phân biệt được vùng lộ diện và vùng đồ bơi / vùng riêng tư." },
        { title: "💬 Câu hỏi thảo luận cùng con", content: "1. Cơ thể con có những vùng nào? → Vùng lộ diện và vùng kín đáo.<br>2. Vùng đồ bơi gồm những chỗ nào? → Ngực, mông, bộ phận sinh dục.<br>3. Tại sao con cần gọi đúng tên vùng kín đáo? → Để bố mẹ hiểu chính xác và giúp đỡ.<br>4. Ai được phép chạm vào vùng đồ bơi của con? → Bố mẹ khi tắm/vệ sinh, bác sĩ khi khám (có bố mẹ ở cạnh)." },
        { title: "🎭 Kịch bản đóng vai (Role-play)", content: "Tình huống: Người lớn đóng vai 'bạn của Sóc' muốn xem vùng đồ bơi của bé.<br>👉 Con cần nói 'KHÔNG!', bỏ chạy đến chỗ bố mẹ và kể lại.<br>Sau khi chơi, bố mẹ ôm và khen: 'Con giỏi lắm! Đúng rồi, không ai được phép làm vậy.'" },
        { title: "✂️ Hoạt động tại nhà", content: "📌 Hoạt động 1: 'Gọi tên cùng bạn Sóc' – Dùng flashcard, bố mẹ giơ thẻ, bé gọi tên.<br>🎨 Hoạt động 2: 'Vẽ bạn Sóc bảo vệ cơ thể' – Bé vẽ Sóc, tô màu và khoanh tròn vùng đồ bơi." },
        { title: "📚 Bảng từ khóa (Glossary)", content: "• Dương vật (bé trai) – vùng đồ bơi phía trước<br>• Âm hộ (bé gái) – vùng kín, vùng đồ bơi<br>• Ngực – vùng ngực, vùng trên bụng<br>• Mông – mông, vùng ngồi, phía sau đồ bơi" },
        { title: "❤️ Lưu ý dành cho ba mẹ", content: "✔️ Không la mắng nếu bé nói sai – hãy lặp lại nhẹ nhàng.<br>✔️ Tạo không gian thoải mái, ngồi gần nhau, đọc như kể chuyện.<br>✔️ Kiên nhẫn: trẻ 3-5 tuổi cần lặp lại nhiều lần mới nhớ.<br>✔️ Khen ngợi mỗi khi bé nói đúng, đặc biệt với tên vùng kín đáo." }
    ];
    
    function renderParentGuide() {
        const container = document.getElementById('parentGuideAccordion');
        container.innerHTML = parentGuideData.map((item, idx) => `
            <div class="accordion-item" data-idx="${idx}">
                <div class="accordion-header">
                    <span>${item.title}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="accordion-content">${item.content}</div>
            </div>
        `).join('');
        
        document.querySelectorAll('.accordion-header').forEach(header => {
            header.addEventListener('click', () => {
                playClickSound();
                const item = header.parentElement;
                item.classList.toggle('active');
            });
        });
    }
    
    // ========== QUIZ ==========
    const quizQuestions = [
        { 
            text: "🐿️ Vùng đồ bơi gồm những bộ phận nào?",
            options: [
                { icon: "👀👃👄", text: "Mắt, mũi, miệng", isCorrect: false },
                { icon: "🖐️🦶👂", text: "Tay, chân, tai", isCorrect: false },
                { icon: "🩲🩱❤️", text: "Ngực, mông, bộ phận sinh dục", isCorrect: true },
                { icon: "💇‍♀️👁️🦷", text: "Tóc, lông mày, răng", isCorrect: false }
            ]
        },
        { 
            text: "🐿️ Khi ai đó chạm vào vùng đồ bơi của con, con nên làm gì?",
            options: [
                { icon: "🤐😶", text: "Im lặng vì sợ", isCorrect: false },
                { icon: "🙅‍♀️🏃‍♀️📢", text: "Nói KHÔNG, chạy đến chỗ bố mẹ và kể lại", isCorrect: true },
                { icon: "😊🎮", text: "Cười và tiếp tục chơi", isCorrect: false },
                { icon: "🤔🫣", text: "Tự mình xử lý", isCorrect: false }
            ]
        },
        { 
            text: "🐿️ Ai được phép chạm vào vùng đồ bơi của con trong trường hợp cần thiết?",
            options: [
                { icon: "👤❓", text: "Bất kỳ người lớn nào", isCorrect: false },
                { icon: "👧👦", text: "Bạn bè cùng lớp", isCorrect: false },
                { icon: "👨‍👩‍👧🩺", text: "Bố mẹ khi tắm/vệ sinh, bác sĩ khi khám (có bố mẹ)", isCorrect: true },
                { icon: "👩‍🏫", text: "Cô giáo ở trường", isCorrect: false }
            ]
        },
        { 
            text: "🐿️ Tại sao con cần gọi đúng tên vùng kín đáo?",
            options: [
                { icon: "📢🎉", text: "Để khoe với bạn", isCorrect: false },
                { icon: "👨‍👩‍👧💬", text: "Để bố mẹ hiểu chính xác và giúp đỡ con", isCorrect: true },
                { icon: "📝✅", text: "Vì đó là bài tập bắt buộc", isCorrect: false },
                { icon: "🏆🌟", text: "Để được khen", isCorrect: false }
            ]
        },
        { 
            text: "🐿️ Câu nói nào sau đây đúng?",
            options: [
                { icon: "👨‍👩‍👧", text: "Cơ thể con là của bố mẹ", isCorrect: false },
                { icon: "🛡️💪", text: "Cơ thể con là của riêng con, con có quyền bảo vệ nó", isCorrect: true },
                { icon: "😴", text: "Con không cần quan tâm đến cơ thể mình", isCorrect: false },
                { icon: "👨‍👩‍👧‍👦", text: "Chỉ có người lớn mới có quyền quyết định về cơ thể con", isCorrect: false }
            ]
        }
    ];
    
    let currentQuizIndex = 0;
    let quizAnswers = new Array(quizQuestions.length).fill(null);
    
    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        if (currentQuizIndex >= quizQuestions.length) {
            let correct = 0;
            for (let i = 0; i < quizQuestions.length; i++) {
                if (quizAnswers[i] !== null && quizQuestions[i].options[quizAnswers[i]].isCorrect) correct++;
            }
            const msg = correct === quizQuestions.length ? '🎉 XUẤT SẮC! Con đã hiểu bài rồi!' : `👍 Con đã trả lời đúng ${correct}/${quizQuestions.length} câu. Hãy xem lại những câu sai nhé!`;
            if (correct === quizQuestions.length) playCompleteSound();
            else playSuccessSound();
            container.innerHTML = `<div style="background: var(--cream); border-radius: 24px; padding: 30px; text-align: center;">
                <div style="font-size: 48px;">🏆</div>
                <div style="font-size: 24px; font-weight: bold; color: var(--navy-dark);">${correct}/${quizQuestions.length}</div>
                <div style="margin: 15px 0; color: var(--gray);">${msg}</div>
                <button class="btn-next" id="resetQuizBtn">🔄 Làm lại bài tập</button>
            </div>`;
            document.getElementById('resetQuizBtn')?.addEventListener('click', () => {
                currentQuizIndex = 0;
                quizAnswers.fill(null);
                renderQuiz();
            });
            return;
        }
        
        const q = quizQuestions[currentQuizIndex];
        const savedAnswer = quizAnswers[currentQuizIndex];
        let html = `<div style="background: var(--cream); border-radius: 24px; padding: 20px; margin-bottom: 20px;">
            <div style="font-weight: bold; margin-bottom: 15px; color: var(--gray);">Câu ${currentQuizIndex + 1}/${quizQuestions.length}</div>
            <div style="font-size: 18px; margin-bottom: 20px; color: var(--navy-dark);">${q.text}</div>
            <div class="quiz-options" id="quizOptions"></div>
            <div id="quizFeedback" class="quiz-feedback">${savedAnswer !== null ? (q.options[savedAnswer].isCorrect ? '✅ Đúng rồi!' : '❌ Chưa đúng, hãy xem lại bài học nhé!') : '💡 Hãy chọn đáp án đúng!'}</div>
            <button class="btn-next" id="nextQuizBtn">${currentQuizIndex === quizQuestions.length - 1 ? '🏁 HOÀN THÀNH' : '➡️ CÂU TIẾP THEO'}</button>
        </div>`;
        container.innerHTML = html;
        
        const optionsDiv = document.getElementById('quizOptions');
        q.options.forEach((opt, idx) => {
            const optDiv = document.createElement('div');
            optDiv.className = 'quiz-option';
            if (savedAnswer !== null) {
                if (savedAnswer === idx && opt.isCorrect) optDiv.style.borderColor = '#2E7D32';
                else if (savedAnswer === idx && !opt.isCorrect) optDiv.style.borderColor = '#C62828';
            }
            optDiv.innerHTML = `<span>${opt.icon}</span><span>${opt.text}</span>`;
            optDiv.onclick = () => {
                if (quizAnswers[currentQuizIndex] !== null) return;
                playClickSound();
                quizAnswers[currentQuizIndex] = idx;
                const feedback = document.getElementById('quizFeedback');
                if (opt.isCorrect) {
                    feedback.innerHTML = '✅ Đúng rồi!';
                    feedback.className = 'quiz-feedback correct';
                    playSuccessSound();
                } else {
                    const correctIndex = q.options.findIndex(opt => opt.isCorrect);
                    feedback.innerHTML = `❌ Chưa đúng. Đáp án đúng là: ${q.options[correctIndex].icon} ${q.options[correctIndex].text}`;
                    feedback.className = 'quiz-feedback wrong';
                    playErrorSound();
                }
                renderQuiz();
            };
            optionsDiv.appendChild(optDiv);
        });
        
        document.getElementById('nextQuizBtn').onclick = () => {
            if (quizAnswers[currentQuizIndex] === null) {
                document.getElementById('quizFeedback').innerHTML = '⚠️ Hãy chọn đáp án trước khi tiếp tục!';
                playErrorSound();
                return;
            }
            playClickSound();
            currentQuizIndex++;
            renderQuiz();
        };
    }
    
    // Hoàn thành bài học
    let completed = localStorage.getItem('sexed_chuong1_completed') === 'true';
    const completeBtn = document.getElementById('completeBtn');
    if (completed) {
        completeBtn.innerHTML = '✅ Bạn đã hoàn thành bài học này';
        completeBtn.disabled = true;
    }
    completeBtn.addEventListener('click', () => {
        if (!completed) {
            completed = true;
            localStorage.setItem('sexed_chuong1_completed', 'true');
            completeBtn.innerHTML = '✅ Bạn đã hoàn thành bài học này';
            completeBtn.disabled = true;
            playCompleteSound();
        }
    });
    
    renderFlashcards();
    renderParentGuide();
    renderQuiz();
    resizeCanvas();
</script>
</body>
</html>
