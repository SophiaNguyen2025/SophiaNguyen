<canvas id="confetti-canvas"></canvas>

<script>
    // ==================== HIỆU ỨNG CONFETTI & ÂM THANH ====================
    let ctx = null, width = window.innerWidth, height = window.innerHeight, particles = [], animationId = null;
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; const canvas = document.getElementById('confetti-canvas'); if(canvas){ canvas.width = width; canvas.height = height; ctx = canvas.getContext('2d'); } }
    function createConfetti(duration = 1800) {
        if(!ctx) return;
        if(animationId) cancelAnimationFrame(animationId);
        particles = [];
        for(let i=0;i<140;i++) {
            particles.push({ x: Math.random() * width, y: Math.random() * height - height, size: Math.random() * 7 + 3, color: `hsl(${Math.random() * 360}, 80%, 60%)`, speedY: Math.random() * 5 + 3, speedX: (Math.random() - 0.5) * 2, rotation: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 6 });
        }
        drawConfetti();
        setTimeout(() => { if(animationId) cancelAnimationFrame(animationId); ctx?.clearRect(0,0,width,height); particles = []; }, duration);
    }
    function drawConfetti() {
        if(!ctx) return;
        ctx.clearRect(0, 0, width, height);
        let allFinished = true;
        for(let i=0;i<particles.length;i++) {
            const p = particles[i];
            if(p.y < height + 50) {
                allFinished = false;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
                ctx.restore();
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += p.rotSpeed;
            }
        }
        if(!allFinished) animationId = requestAnimationFrame(drawConfetti);
        else { if(animationId) cancelAnimationFrame(animationId); particles = []; ctx.clearRect(0,0,width,height); }
    }
    window.addEventListener('resize', () => { resizeCanvas(); if(particles.length) drawConfetti(); });
    
    function playClickSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.08;
            osc.type = 'sine';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.08);
            osc.stop(audioCtx.currentTime + 0.08);
        } catch(e) {}
    }
    
    function playSuccessSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const frequencies = [880, 1046.5, 1318.5];
            frequencies.forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = freq;
                    gain.gain.value = 0.2;
                    osc.type = 'sine';
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                    osc.stop(audioCtx.currentTime + 0.3);
                }, idx * 120);
            });
        } catch(e) {}
        createConfetti(800);
    }
    
    function playCompleteSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const gain = audioCtx.createGain();
            gain.connect(audioCtx.destination);
            gain.gain.value = 0.3;
            const bufferSize = 4096;
            const noise = audioCtx.createBufferSource();
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;
            noise.loop = true;
            noise.connect(gain);
            noise.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1.2);
            noise.stop(audioCtx.currentTime + 1.2);
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc.frequency.value = 1046.5;
                gain2.gain.value = 0.3;
                osc.type = 'sine';
                osc.start();
                gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                osc.stop(audioCtx.currentTime + 0.5);
            }, 1000);
        } catch(e) {}
        createConfetti(2500);
    }
    
    function playErrorSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 220;
            gain.gain.value = 0.25;
            osc.type = 'sawtooth';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
            osc.stop(audioCtx.currentTime + 0.4);
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 164.81;
                gain2.gain.value = 0.2;
                osc2.type = 'sawtooth';
                osc2.start();
                gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc2.stop(audioCtx.currentTime + 0.3);
            }, 150);
        } catch(e) {}
        document.body.classList.add('shake-screen');
        setTimeout(() => document.body.classList.remove('shake-screen'), 500);
    }

    // ==================== BÀI TẬP 1: 5 ĐIỀU KHÔNG (CÓ ÂM THANH) ====================
    (function() {
        const rules = [
            { emoji: "🏊‍♂️🚫", title: "KHÔNG tự ý đi bơi một mình", desc: "Không đi bơi khi không có người lớn đi cùng", detail: "✅ Luôn có bố mẹ hoặc thầy cô bên cạnh khi xuống nước!" },
            { emoji: "🛟🚫", title: "KHÔNG bơi khi không có phao", desc: "Không xuống nước nếu không có áo phao hoặc phao cứu hộ", detail: "✅ Phao giúp con nổi nếu bị chuột rút hoặc mất sức!" },
            { emoji: "🙅‍♀️🏊‍♂️", title: "KHÔNG cố cứu người khi không biết bơi", desc: "Không lao xuống nước cứu bạn nếu con chưa biết bơi", detail: "✅ Hãy kêu to 'CỨU VỚI!' và tìm người lớn đến giúp!" },
            { emoji: "⚠️💧", title: "KHÔNG đùa nghịch gần vùng nước nguy hiểm", desc: "Không chơi gần ao, hồ, sông, suối, giếng nước", detail: "✅ Rất dễ bị trượt chân ngã xuống nước!" },
            { emoji: "🌊🚫", title: "KHÔNG bơi ở dòng chảy xa bờ", desc: "Không bơi ở nơi có nước xoáy, dòng chảy xiết", detail: "✅ Dòng chảy xa bờ có thể kéo con ra xa, rất khó quay lại!" }
        ];
        let viewed = [false, false, false, false, false];

        function renderExercise1() {
            const container = document.getElementById('exercise1');
            const allViewed = viewed.every(v => v === true);
            let html = `<div style="background:#E1F5FE; border-radius:24px; padding:15px; text-align:center; margin-bottom:20px;">
                🖐️ MỖI THẺ LÀ MỘT ĐIỀU "KHÔNG" 🖐️<br>Click vào thẻ để xem lời khuyên!
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; margin-bottom:20px;" id="cardsGrid1"></div>
            <div style="text-align:center; margin-top:10px;"><span style="background:#4FC3F7; padding:8px 24px; border-radius:40px; color:white;">📚 Đã học: ${viewed.filter(v=>v===true).length}/5 quy tắc</span></div>`;
            
            if (allViewed) {
                html += `<div style="background:#E8F5E9; border-radius:48px; padding:25px; text-align:center; margin-top:20px; border:2px solid #4CAF50;">
                    <div style="font-size:48px;">🎉🖐️🎉</div>
                    <div style="font-size:24px; font-weight:bold; color:#2E7D32;">CHÚC MỪNG CON!</div>
                    <div style="font-size:18px; margin:15px 0;">Con đã học xong <strong>5 ĐIỀU KHÔNG</strong> để phòng chống đuối nước!</div>
                    <button id="resetBtn1" style="background:#FFB347; border:none; padding:12px 28px; border-radius:40px; font-weight:bold; cursor:pointer;">🔄 HỌC LẠI</button>
                </div>`;
            } else {
                html += `<button id="resetBtn1" style="background:#FFB347; border:none; padding:12px 28px; border-radius:40px; font-weight:bold; cursor:pointer; width:100%;">🔄 ĐÓNG TẤT CẢ THẺ</button>`;
            }
            container.innerHTML = html;
            
            const cardsGrid = document.getElementById('cardsGrid1');
            if (cardsGrid) {
                rules.forEach((rule, idx) => {
                    const card = document.createElement('div');
                    card.style.cssText = 'background:white; border-radius:36px; overflow:hidden; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,0.1); border:2px solid #FFD1A4;';
                    if (viewed[idx]) {
                        card.innerHTML = `<div style="padding:25px; text-align:center; background:linear-gradient(145deg,#E8F5E9,#C8E6D9);">
                            <div style="font-size:40px;">✅</div>
                            <div style="font-size:20px; font-weight:bold; color:#2E7D32;">LỜI KHUYÊN</div>
                            <div style="font-size:16px; color:#2E7D32; margin-top:10px;">${rule.detail}</div>
                            <div style="font-size:12px; margin-top:15px; color:#aaa;">👉 Click để đóng 👈</div>
                        </div>`;
                    } else {
                        card.innerHTML = `<div style="padding:25px; text-align:center; background:linear-gradient(145deg,#FFF5EA,#FFE8D4);">
                            <div style="font-size:48px; font-weight:bold; color:#FF8C42;">${idx+1}</div>
                            <div style="font-size:60px;">${rule.emoji}</div>
                            <div style="font-size:22px; font-weight:bold; color:#C27E55;">${rule.title}</div>
                            <div style="font-size:16px; color:#7C5A44;">${rule.desc}</div>
                            <div style="font-size:12px; margin-top:15px; color:#aaa;">👉 Click để xem lời khuyên 👈</div>
                        </div>`;
                    }
                    card.onclick = () => {
                        playClickSound();
                        viewed[idx] = !viewed[idx];
                        if(viewed[idx]) playSuccessSound();
                        renderExercise1();
                        if(viewed.every(v=>v===true)) playCompleteSound();
                    };
                    cardsGrid.appendChild(card);
                });
            }
            const resetBtn = document.getElementById('resetBtn1');
            if (resetBtn) resetBtn.onclick = () => { playClickSound(); viewed = [false,false,false,false,false]; renderExercise1(); };
        }
        renderExercise1();
    })();

    // ==================== BÀI TẬP 2: NƠI AN TOÀN - NƠI NGUY HIỂM (CÓ ÂM THANH) ====================
    (function() {
        const places = [
            { name: "Hồ bơi có nhân viên cứu hộ", emoji: "🏊‍♂️🛟", desc: "Có phao, có người lớn giám sát", correct: "safe" },
            { name: "Bãi biển có sóng lớn", emoji: "🌊🏖️", desc: "Không có rào chắn, sóng to, dòng chảy xa bờ", correct: "danger" },
            { name: "Ao, hồ, sông, suối", emoji: "🏞️💧", desc: "Nước sâu, dòng chảy xiết, không có người cứu hộ", correct: "danger" },
            { name: "Bồn tắm tại nhà", emoji: "🛁👶", desc: "Có bố mẹ giám sát, bé ngồi trong bồn nước nông", correct: "safe" },
            { name: "Vùng nước xoáy, dòng chảy xa bờ", emoji: "🌊😨", desc: "Nước xoáy, kéo người ra xa bờ", correct: "danger" },
            { name: "Bể bơi có người lớn đi cùng", emoji: "🏊‍♀️👨‍👩‍👧", desc: "Có ba mẹ hoặc thầy cô trông coi", correct: "safe" },
            { name: "Giếng nước, bể nước không có nắp đậy", emoji: "🕳️💧", desc: "Nắp bị hở, trẻ có thể ngã vào", correct: "danger" },
            { name: "Vũng nước mưa lớn", emoji: "🏘️💦", desc: "Nước ngập sâu sau mưa, trẻ không biết độ sâu", correct: "danger" },
            { name: "Bể cá cảnh trong nhà", emoji: "🐠🏠", desc: "Bể nhỏ, có lưới chắn", correct: "safe" },
            { name: "Đi thuyền có mặc áo phao", emoji: "🚣‍♂️✅", desc: "Có áo phao, có người lớn đi cùng", correct: "safe" }
        ];
        let answers = new Array(places.length).fill(null);
        let submitted2 = false;

        function renderExercise2() {
            const container = document.getElementById('exercise2');
            let html = `<div style="background:#E1F5FE; border-radius:24px; padding:15px; text-align:center; margin-bottom:20px;">
                📢 NHIỆM VỤ: Với mỗi địa điểm, hãy chọn AN TOÀN (🟢) hoặc DỄ BỊ ĐUỐI NƯỚC (🔴)
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:20px; margin-bottom:20px;" id="placesGrid2"></div>
            <button id="submitBtn2" style="background:#0288D1; border:none; color:white; font-size:18px; font-weight:bold; padding:14px; border-radius:60px; cursor:pointer; width:100%;">🔍 NỘP BÀI – KIỂM TRA</button>
            <div id="feedback2" style="background:#E1F5FE; border-radius:40px; padding:15px; margin-top:20px; text-align:center;">💡 Hãy chọn phân loại cho tất cả các địa điểm nhé!</div>`;
            container.innerHTML = html;
            
            const grid = document.getElementById('placesGrid2');
            places.forEach((place, idx) => {
                const answer = answers[idx];
                const card = document.createElement('div');
                card.style.cssText = `background:white; border-radius:36px; padding:20px; text-align:center; border:3px solid ${answer === 'safe' ? '#4CAF50' : answer === 'danger' ? '#FF6B6B' : '#B3E5FC'}; ${answer ? 'background:' + (answer === 'safe' ? '#E8F5E9' : '#FFEBEE') : ''}`;
                card.innerHTML = `
                    <div style="font-size:70px;">${place.emoji}</div>
                    <div style="font-size:18px; font-weight:bold; color:#7C5A44;">${place.name}</div>
                    <div style="font-size:13px; color:#A87A58;">${place.desc}</div>
                    <div style="display:flex; gap:15px; justify-content:center; margin-top:15px;">
                        <button class="btn-safe2" data-idx="${idx}" data-choice="safe" style="padding:8px 20px; border-radius:40px; border:none; font-weight:bold; cursor:pointer; background:#4CAF50; color:white;">🟢 AN TOÀN</button>
                        <button class="btn-danger2" data-idx="${idx}" data-choice="danger" style="padding:8px 20px; border-radius:40px; border:none; font-weight:bold; cursor:pointer; background:#FF6B6B; color:white;">🔴 DỄ BỊ ĐUỐI NƯỚC</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            document.querySelectorAll('.btn-safe2').forEach(btn => {
                btn.onclick = (e) => { 
                    e.stopPropagation(); 
                    if(!submitted2){ 
                        const idx = parseInt(btn.dataset.idx);
                        answers[idx] = 'safe';
                        if(places[idx].correct === 'safe') playSuccessSound();
                        else playErrorSound();
                        renderExercise2(); 
                    } 
                };
            });
            document.querySelectorAll('.btn-danger2').forEach(btn => {
                btn.onclick = (e) => { 
                    e.stopPropagation(); 
                    if(!submitted2){ 
                        const idx = parseInt(btn.dataset.idx);
                        answers[idx] = 'danger';
                        if(places[idx].correct === 'danger') playSuccessSound();
                        else playErrorSound();
                        renderExercise2(); 
                    } 
                };
            });
            
            document.getElementById('submitBtn2').onclick = () => {
                if(submitted2) return;
                let allAnswered = answers.every(a => a !== null);
                if(!allAnswered){ 
                    playErrorSound();
                    document.getElementById('feedback2').innerHTML = '⚠️ Hãy chọn phân loại cho TẤT CẢ các địa điểm!'; 
                    return; 
                }
                let correct = 0;
                for(let i=0; i<places.length; i++) if(answers[i] === places[i].correct) correct++;
                const percent = Math.round(correct/places.length*100);
                let msg = correct === places.length ? '🎉 TUYỆT VỜI! Con đã phân loại chính xác!' : `👍 Điểm: ${correct}/${places.length} (${percent}%). Hãy xem lại những nơi con chọn sai nhé!`;
                if(correct === places.length) playCompleteSound();
                else if(correct >= 7) playSuccessSound();
                else playErrorSound();
                document.getElementById('feedback2').innerHTML = `<div style="font-size:20px;">🏆 Điểm: ${correct}/${places.length} (${percent}%) 🏆</div><div>${msg}</div><button id="resetBtn2" style="background:#FFB347; border:none; padding:12px 28px; border-radius:40px; cursor:pointer; margin-top:15px;">🔄 LÀM LẠI</button>`;
                submitted2 = true;
                document.getElementById('resetBtn2')?.addEventListener('click', () => { playClickSound(); answers = new Array(places.length).fill(null); submitted2 = false; renderExercise2(); });
            };
        }
        renderExercise2();
    })();

    // ==================== BÀI TẬP 3: TÌM BIỂU HIỆN ĐUỐI NƯỚC (CÓ ÂM THANH) ====================
    (function() {
        const situations = [
            { title: "Bé trai đang bơi thoải mái", desc: "Mắt nhìn bình thường, tay quạt nước đều", isDrowning: false, emoji: "🏊‍♂️😊" },
            { title: "Người đang vùng vẫy", desc: "Tay vẫy loạn xạ, mắt hoảng hốt, đầu ngửa ra sau", isDrowning: true, emoji: "🙆‍♀️💦😨" },
            { title: "Bé gái mặc áo phao", desc: "Có áo phao, bơi gần bờ, có người lớn trông coi", isDrowning: false, emoji: "🧒😎🛟" },
            { title: "Người đứng thẳng dưới nước", desc: "Người thẳng đứng, không thể đạp nước", isDrowning: true, emoji: "👧📏💧" },
            { title: "Bé trai bơi cùng bố mẹ", desc: "Có người lớn đi cùng, bơi trong khu vực an toàn", isDrowning: false, emoji: "👦🛟👨‍👩‍👧" },
            { title: "Người cố gắng vươn tay nhưng không kêu được", desc: "Miệng ngập nước, không thể la hét", isDrowning: true, emoji: "😰🌊🙏" }
        ];
        let selected = [];
        let submitted3 = false;
        
        function renderExercise3() {
            const container = document.getElementById('exercise3');
            let html = `<div style="background:#E1F5FE; border-radius:24px; padding:15px; text-align:center; margin-bottom:20px;">
                📢 NHIỆM VỤ: Hãy click chọn NHỮNG hình ảnh có người ĐANG BỊ ĐUỐI NƯỚC! (Có 3 đáp án đúng)
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; margin-bottom:20px;" id="grid3"></div>
            <button id="submitBtn3" style="background:#0288D1; border:none; color:white; font-size:18px; font-weight:bold; padding:14px; border-radius:60px; cursor:pointer; width:100%;">🔍 NỘP BÀI – KIỂM TRA</button>
            <div id="feedback3" style="background:#E1F5FE; border-radius:40px; padding:15px; margin-top:20px; text-align:center;">💡 Có 3 hình ảnh đúng. Hãy chọn tất cả những người đang bị đuối nước!</div>`;
            container.innerHTML = html;
            
            const grid = document.getElementById('grid3');
            situations.forEach((sit, idx) => {
                const isSelected = selected.includes(idx);
                const card = document.createElement('div');
                card.style.cssText = `background:white; border-radius:36px; padding:20px; text-align:center; cursor:pointer; border:3px solid ${isSelected ? '#4CAF50' : '#B3E5FC'}; ${isSelected ? 'background:#E8F5E9' : ''}`;
                card.innerHTML = `<div style="position:relative;"><div style="position:absolute; top:0; right:10px; font-size:28px;">${isSelected ? '✅' : ''}</div>
                    <div style="font-size:80px;">${sit.emoji}</div>
                    <div style="font-size:18px; font-weight:bold; color:#7C5A44;">${sit.title}</div>
                    <div style="font-size:14px; color:#A87A58;">${sit.desc}</div>
                </div>`;
                card.onclick = () => { 
                    if(!submitted3){ 
                        playClickSound();
                        if(selected.includes(idx)) {
                            selected = selected.filter(i=>i!==idx);
                        } else {
                            selected.push(idx);
                            if(sit.isDrowning) playSuccessSound();
                            else playErrorSound();
                        }
                        renderExercise3(); 
                    } 
                };
                grid.appendChild(card);
            });
            
            document.getElementById('submitBtn3').onclick = () => {
                if(submitted3) return;
                const correctIds = [1,3,5];
                let correctCount = selected.filter(id => correctIds.includes(id)).length;
                let wrongCount = selected.filter(id => !correctIds.includes(id)).length;
                if(correctCount === 3 && wrongCount === 0) {
                    document.getElementById('feedback3').innerHTML = '🎉 TUYỆT VỜI! Con đã nhận biết đúng tất cả biểu hiện của người bị đuối nước! 🎉';
                    playCompleteSound();
                } else {
                    document.getElementById('feedback3').innerHTML = `❌ Chưa đúng. Con đã chọn ${correctCount}/3 hình đúng và chọn thêm ${wrongCount} hình sai. Hãy xem lại và thử nhé!`;
                    playErrorSound();
                }
                submitted3 = true;
                document.getElementById('feedback3').innerHTML += `<br><button id="resetBtn3" style="background:#FFB347; border:none; padding:12px 28px; border-radius:40px; cursor:pointer; margin-top:15px;">🔄 LÀM LẠI</button>`;
                document.getElementById('resetBtn3')?.addEventListener('click', () => { playClickSound(); selected = []; submitted3 = false; renderExercise3(); });
            };
        }
        renderExercise3();
    })();
    resizeCanvas();
</script>
</body>
</html>
