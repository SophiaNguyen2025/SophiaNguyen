<script>
    // ==================== BÀI TẬP 1: AI LÀ NGƯỜI LẠ? ====================
    (function() {
        const questions = [
            { emoji: "🍬👨", text: "Một chú lạ mặt đến gần em và cho em kẹo, bảo em đi cùng chú.", correct: "dung", choices: [{ id: "dung", emoji: "😊", label: "ĐÚNG (nguy hiểm)" }, { id: "sai", emoji: "😞", label: "SAI (an toàn)" }] },
            { emoji: "👮‍♂️", text: "Chú công an đang làm nhiệm vụ, mặc đồng phục, có phù hiệu.", correct: "sai", choices: [{ id: "dung", emoji: "😊", label: "ĐÚNG (nguy hiểm)" }, { id: "sai", emoji: "😞", label: "SAI (an toàn)" }] },
            { emoji: "👩‍🏫", text: "Cô giáo của em đang dạy học ở trường.", correct: "sai", choices: [{ id: "dung", emoji: "😊", label: "ĐÚNG (nguy hiểm)" }, { id: "sai", emoji: "😞", label: "SAI (an toàn)" }] },

        function renderExercise1() {
            const container = document.getElementById('exercise1');
            if (currentIdx >= questions.length) {
                let correct = 0;

                <div id="feedback1" style="background:#FFF0E8; border-radius:40px; padding:15px; text-align:center;">😊 Người này có an toàn không? Hãy chọn nhé!</div>

            </div>`;

                btn.onclick = () => {
                    const choice = btn.getAttribute('data-choice');
                    userAnswers[currentIdx] = choice;
                    const fb = document.getElementById('feedback1');
                    if (choice === q.correct) { fb.innerHTML = '✅ Đúng rồi! Bé giỏi quá! 🎉'; fb.style.background = '#E8F5E9'; fb.style.color = '#2E7D32'; }
                    else { fb.innerHTML = `❌ Chưa đúng. ${q.correct === 'dung' ? 'Người này CÓ THỂ GÂY NGUY HIỂM' : 'Người này AN TOÀN'}.`; fb.style.background = '#FFEBEE'; fb.style.color = '#C62828'; }

                };

            document.getElementById('nextBtn1').onclick = () => {

                currentIdx++; renderExercise1();
            };
        }
        renderExercise1();
    })();

                document.getElementById('resetQuiz2')?.addEventListener('click', () => { currentIdx2 = 0; userAnswers2.fill(null); renderExercise2(); });
                return;
            }
            const q = questions[currentIdx2];
            let html = `<div style="background:#FFF5EA; border-radius:48px; padding:25px; border:2px solid #FFD1A4;">

    // ==================== BÀI TẬP 3: CẤP CỨU 113 ====================

            { emoji: "📞👨‍👩‍👧", text: "Điều quan trọng nhất em cần làm để phòng tránh bắt cóc là gì?", correct: "nho_so", choices: [{ emoji: "🎮📱", text: "Chỉ nhớ chơi game", correct: false }, { emoji: "📞❤️", text: "Thuộc lòng số điện thoại của bố mẹ", correct: true }] },
            { emoji: "🏡🌃", text: "Buổi tối, em nên chơi ở đâu để an toàn?", correct: "trong_nha", choices: [{ emoji: "🌳🕳️", text: "Chơi ở khu đất trống vắng", correct: false }, { emoji: "🏡👨‍👩‍👧", text: "Ở trong nhà với bố mẹ hoặc nơi có người lớn trông coi", correct: true }] },
            { emoji: "🚸👤", text: "Khi đi học về, em nên làm gì để an toàn?", correct: "di_cung", choices: [{ emoji: "🚶‍♀️🕳️", text: "Đi một mình qua đường vắng", correct: false }, { emoji: "👭🏫", text: "Đi cùng bạn hoặc người lớn, đi đường đông người", correct: true }] }
        ];
        let currentIdx3 = 0, userAnswers3 = new Array(questions.length).fill(null);

        function renderExercise3() {
            const container = document.getElementById('exercise3');
            if (currentIdx3 >= questions.length) {
                let correct = 0;
                for (let i = 0; i < questions.length; i++) if (userAnswers3[i] === questions[i].correct) correct++;
                let msg = correct === questions.length ? '🎉 SIÊU AN TOÀN! Bé là cao thủ phòng chống bắt cóc!' : (correct >= 7 ? '👍 Rất tốt!' : '💪 Bé cần học thêm nhé!');
                container.innerHTML = `<div style="background:#FFF8F0; border-radius:48px; padding:30px; text-align:center;"><div style="font-size:40px; font-weight:bold;">🏆 ${correct}/${questions.length} 🏆</div><div style="margin:20px 0;">${msg}</div><button id="resetQuiz3" style="background:#E8D8C8; border:none; padding:12px 28px; border-radius:40px; cursor:pointer;">🔄 CHƠI LẠI</button></div>`;
                document.getElementById('resetQuiz3')?.addEventListener('click', () => { currentIdx3 = 0; userAnswers3.fill(null); renderExercise3(); });
                return;
            }
            const q = questions[currentIdx3];
            let choicesHtml = '';
            q.choices.forEach((ch, idx) => { choicesHtml += `<div class="choice-btn3" data-correct="${ch.correct}" style="background:white; border:3px solid #FFD1A4; border-radius:60px; padding:15px 20px; cursor:pointer; display:flex; align-items:center; gap:15px; margin-bottom:10px;"><div style="font-size:40px; min-width:60px; text-align:center;">${ch.emoji}</div><div style="font-size:18px; font-weight:500; flex:1;">${ch.text}</div></div>`; });
            let html = `<div style="background:#FFF5EA; border-radius:48px; padding:25px; border:2px solid #FFD1A4;">
                <div style="font-size:90px; text-align:center; background:white; padding:20px; border-radius:60px; margin-bottom:15px;">${q.emoji}</div>
                <div style="font-size:22px; font-weight:bold; text-align:center; background:white; padding:15px; border-radius:40px; margin:15px 0;">${q.text}</div>
                <div style="display:flex; flex-direction:column; gap:15px; margin:20px 0;" id="choices3">${choicesHtml}</div>
                <div id="feedback3" style="background:#FFF0E8; border-radius:40px; padding:15px; text-align:center;">📞 Hãy chọn hành động ĐÚNG để bảo vệ bản thân nhé!</div>
                <button id="nextBtn3" style="background:#FFB347; border:none; color:white; font-size:18px; font-weight:bold; padding:14px; border-radius:60px; cursor:pointer; width:100%; margin-top:15px;">${currentIdx3 === questions.length-1 ? '🏁 XEM KẾT QUẢ' : '➡️ CÂU TIẾP THEO'}</button>
                <div style="text-align:center; margin-top:15px;">Câu ${currentIdx3+1}/${questions.length}</div>
            </div>`;
            container.innerHTML = html;
            document.querySelectorAll('.choice-btn3').forEach(btn => {
                btn.onclick = () => {
                    const isCorrect = btn.getAttribute('data-correct') === 'true';
                    userAnswers3[currentIdx3] = isCorrect ? q.correct : 'wrong';
                    const fb = document.getElementById('feedback3');
                    if (isCorrect) { fb.innerHTML = '✅ Đúng rồi! Bé giỏi quá! 🎉'; fb.style.background = '#E8F5E9'; fb.style.color = '#2E7D32'; }
                    else { fb.innerHTML = `❌ Chưa đúng. Hãy nhớ: ${q.correct === 'tu_choi' ? 'KHÔNG đi với người lạ' : q.correct === 'chay' ? 'CHẠY đến nơi an toàn' : q.correct === 'khong_di' ? 'KHÔNG đi với người lạ' : q.correct === 'la_het' ? 'LA THẬT TO' : q.correct === 'tim_cong_an' ? 'TÌM CÔNG AN' : q.correct === 'nho_so' ? 'NHỚ số điện thoại bố mẹ' : q.correct === 'trong_nha' ? 'Ở TRONG NHÀ' : 'ĐI CÙNG bạn hoặc người lớn'}.`; fb.style.background = '#FFEBEE'; fb.style.color = '#C62828'; }
                    document.querySelectorAll('.choice-btn3').forEach(b => { b.style.opacity = '0.6'; b.style.pointerEvents = 'none'; });
                };
            });
            document.getElementById('nextBtn3').onclick = () => {
                if (userAnswers3[currentIdx3] === null) { document.getElementById('feedback3').innerHTML = '⚠️ Hãy chọn một hành động trước khi sang câu tiếp theo!'; return; }
                currentIdx3++; renderExercise3();
            };
        }
        renderExercise3();
    })();
</script>
</body>
</html>
