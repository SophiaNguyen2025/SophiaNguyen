        .option.selected-wrong { border-color: #e74c3c; background: #2a1a1a; color: #e74c3c; }

<canvas id="confetti-canvas"></canvas>

<script>
    // ==================== HIỆU ỨNG CONFETTI & ÂM THANH ====================
    let ctx = null, width = window.innerWidth, height = window.innerHeight, particles = [], animationId = null;
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; const canvas = document.getElementById('confetti-canvas'); if(canvas){ canvas.width = width; canvas.height = height; ctx = canvas.getContext('2d'); } }
    function createConfetti(duration = 1800) {
        if(!ctx) return;
        if(animationId) cancelAnimationFrame(animationId);
        particles = [];
        for(let i=0;i<140;i++) {
            particles.push({ x: Math.random() * width, y: Math.random() * height - height, size: Math.random() * 7 + 3, color: `hsl(${Math.random() * 360}, 80%, 60%)`, speedY: Math.random() * 5 + 3, speedX: (Math.random() - 0.5) * 2, rotation: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 6 });
        }
        drawConfetti();
        setTimeout(() => { if(animationId) cancelAnimationFrame(animationId); ctx?.clearRect(0,0,width,height); particles = []; }, duration);
    }
    function drawConfetti() {
        if(!ctx) return;
        ctx.clearRect(0, 0, width, height);
        let allFinished = true;
        for(let i=0;i<particles.length;i++) {
            const p = particles[i];
            if(p.y < height + 50) {
                allFinished = false;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
                ctx.restore();
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += p.rotSpeed;
            }
        }
        if(!allFinished) animationId = requestAnimationFrame(drawConfetti);
        else { if(animationId) cancelAnimationFrame(animationId); particles = []; ctx.clearRect(0,0,width,height); }
    }
    window.addEventListener('resize', () => { resizeCanvas(); if(particles.length) drawConfetti(); });
    
    function playClickSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.08;
            osc.type = 'sine';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.08);
            osc.stop(audioCtx.currentTime + 0.08);
        } catch(e) {}
    }
    
    function playSuccessSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const frequencies = [880, 1046.5, 1318.5];
            frequencies.forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = freq;
                    gain.gain.value = 0.2;
                    osc.type = 'sine';
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                    osc.stop(audioCtx.currentTime + 0.3);
                }, idx * 120);
            });
        } catch(e) {}
        createConfetti(800);
    }
    
    function playCompleteSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const gain = audioCtx.createGain();
            gain.connect(audioCtx.destination);
            gain.gain.value = 0.3;
            const bufferSize = 4096;
            const noise = audioCtx.createBufferSource();
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;
            noise.loop = true;
            noise.connect(gain);
            noise.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1.2);
            noise.stop(audioCtx.currentTime + 1.2);
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc.frequency.value = 1046.5;
                gain2.gain.value = 0.3;
                osc.type = 'sine';
                osc.start();
                gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                osc.stop(audioCtx.currentTime + 0.5);
            }, 1000);
        } catch(e) {}
        createConfetti(2500);
    }
    
    function playErrorSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 220;
            gain.gain.value = 0.25;
            osc.type = 'sawtooth';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
            osc.stop(audioCtx.currentTime + 0.4);
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 164.81;
                gain2.gain.value = 0.2;
                osc2.type = 'sawtooth';
                osc2.start();
                gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc2.stop(audioCtx.currentTime + 0.3);
            }, 150);
        } catch(e) {}
        document.body.classList.add('shake-screen');
        setTimeout(() => document.body.classList.remove('shake-screen'), 500);
    }

    // ========== BÀI TẬP 1: BẢO MẬT SỐ - 2FA ==========
    (function() {
        const questions = [
            { text: "🔐 Xác thực 2 yếu tố (2FA) là gì?", options: ["A. Nhập mật khẩu 2 lần", "B. Mật khẩu + mã OTP từ điện thoại/email", "C. Có 2 tài khoản dự phòng", "D. Đăng nhập trên 2 thiết bị"], correct: 1, explanation: "✅ 2FA là lớp bảo vệ thứ 2 sau mật khẩu, thường là mã OTP." },
            { text: "🔐 Bạn nhận email 'Tài khoản sắp bị khóa, click link xác minh'. Bạn nên?", options: ["A. Click link ngay", "B. Chuyển tiếp email", "C. Không click, kiểm tra trực tiếp trên app", "D. Trả lời cung cấp mật khẩu"], correct: 2, explanation: "✅ Đây là lừa đảo Phishing. Không bao giờ click link lạ." },
            { text: "🔐 Mật khẩu thế nào là an toàn nhất?", options: ["A. Dùng 1 mật khẩu cho mọi tài khoản", "B. Dùng ngày sinh", "C. Dài 8-12 ký tự, chữ hoa, thường, số, ký tự đặc biệt, khác nhau mỗi tài khoản", "D. Để trống"], correct: 2, explanation: "✅ Mật khẩu mạnh nên dài, có cả chữ hoa, thường, số và ký tự đặc biệt." },
            { text: "🔐 'Dấu chân số' là gì?", options: ["A. Dấu vân tay", "B. Toàn bộ thông tin bạn để lại trên Internet", "C. Số bước chân", "D. Ứng dụng đếm bước"], correct: 1, explanation: "✅ Mọi bài đăng, like, comment, tìm kiếm đều là dấu chân số." },
            { text: "🔐 Khi đăng nhập tài khoản quan trọng, bạn nên?", options: ["A. Đăng nhập qua link trong tin nhắn", "B. Dùng app chính thống, bật 2FA", "C. Dùng Wi-Fi công cộng không VPN", "D. Lưu mật khẩu trên trình duyệt"], correct: 1, explanation: "✅ Luôn đăng nhập qua kênh chính thống, bật 2FA." }
        ];
        let currentIdx = 0, userAnswers = new Array(questions.length).fill(null);
        function renderQuiz1() {
            const container = document.getElementById('exercise1');
            if (currentIdx >= questions.length) {
                let correct = 0;
                for (let i=0; i<questions.length; i++) if (userAnswers[i] === questions[i].correct) correct++;
                let msg = correct === questions.length ? '🎉 XUẤT SẮC! Bạn đã nắm vững kiến thức bảo mật số!' : (correct >= 3 ? '👍 Khá tốt!' : '📖 Hãy học lại về 2FA và mật khẩu mạnh.');
                if (correct === questions.length) playCompleteSound(); else playSuccessSound();
                container.innerHTML = `<div class="result-area"><div class="final-score">${correct}/${questions.length}</div><div style="color:#ccc;">${msg}</div><button class="reset-btn" id="reset1">🔄 LÀM LẠI</button></div>`;
                document.getElementById('reset1')?.addEventListener('click', () => { currentIdx = 0; userAnswers.fill(null); renderQuiz1(); });
                return;
            }
            const q = questions[currentIdx];
            let html = `<div class="progress-badge">🛡️ Đã bảo vệ: ${userAnswers.filter(a=>a!==null).length}/${questions.length} tài khoản</div>
                <div class="security-tip"><div class="tip-icon">🔐</div><div class="tip-text"><strong>MẸO:</strong> Bật xác thực 2 lớp (2FA) ngay hôm nay! Chỉ mất 2 phút nhưng an toàn gấp 10 lần.</div></div>
                <div class="question-card"><div class="question-text">❓ ${q.text}</div><div class="options" id="opts1"></div>
                <div class="feedback" id="fb1">💡 Hãy chọn đáp án đúng!</div><button class="btn-next" id="next1">${currentIdx === questions.length-1 ? '🏁 XEM KẾT QUẢ' : '➡️ TIẾP'}</button></div>`;
            container.innerHTML = html;
            const optsDiv = document.getElementById('opts1');
            q.options.forEach((opt, idx) => {
                const optDiv = document.createElement('div');
                optDiv.className = `option ${userAnswers[currentIdx] === idx ? (idx === q.correct ? 'selected-correct' : 'selected-wrong') : ''}`;
                optDiv.innerText = opt;
                optDiv.onclick = () => {
                    if (userAnswers[currentIdx] !== null) return;
                    userAnswers[currentIdx] = idx;
                    const fb = document.getElementById('fb1');
                    if (idx === q.correct) { fb.innerHTML = '✅ ' + q.explanation; fb.className = 'feedback correct'; playSuccessSound(); }
                    else { fb.innerHTML = '❌ ' + q.explanation; fb.className = 'feedback wrong'; playErrorSound(); }
                    renderQuiz1();
                };
                optsDiv.appendChild(optDiv);
            });
            document.getElementById('next1').onclick = () => {
                if (userAnswers[currentIdx] === null) { document.getElementById('fb1').innerHTML = '⚠️ Hãy chọn đáp án trước!'; playErrorSound(); return; }
                currentIdx++; renderQuiz1();
            };
        }
        renderQuiz1();
    })();

    // ========== BÀI TẬP 2: NHẬN DIỆN BẪY LỪA ĐẢO ==========
    (function() {
        const scenarios = [
            { title: "📞 CUỘC GỌI TỪ CÔNG AN", desc: "Người tự xưng công an nói bạn liên quan vụ án rửa tiền, yêu cầu chuyển tiền vào tài khoản tạm giữ.", options: ["A. Chuyển tiền ngay", "B. Cúp máy, không làm theo. Cơ quan chức năng không yêu cầu chuyển tiền qua điện thoại", "C. Cung cấp OTP", "D. Gửi ảnh CCCD"], correct: 1, explanation: "✅ Cảnh sát KHÔNG BAO GIỜ gọi yêu cầu chuyển tiền. Hãy cúp máy." },
            { title: "💼 VIỆC NHẸ LƯƠNG CAO", desc: "Tin nhắn rủ làm cộng tác viên chốt đơn, chỉ cần nạp 2 triệu kích hoạt.", options: ["A. Đăng ký ngay", "B. Rủ bạn bè cùng làm", "C. Từ chối, đây là bẫy lừa đảo yêu cầu nạp tiền trước", "D. Nạp 500k thử"], correct: 2, explanation: "✅ Không có công việc nào yêu cầu nạp tiền trước. Đây là lừa đảo." },
            { title: "😈 HACK FACEBOOK MƯỢN TIỀN", desc: "Bạn thân nhắn tin mượn 5 triệu, tài khoản lạ không phải tên bạn thân.", options: ["A. Chuyển ngay", "B. Gọi điện xác nhận trước khi chuyển", "C. Hỏi thêm rồi chuyển", "D. Chuyển nửa số tiền"], correct: 1, explanation: "✅ LUÔN GỌI ĐIỆN XÁC NHẬN trước khi chuyển khoản khi nhận tin nhắn mượn tiền." },
            { title: "💎 ĐẦU TƯ TIỀN ẢO LỜI TO", desc: "Sàn đầu tư mới cam kết lợi nhuận 30-50%/tháng.", options: ["A. Đầu tư hết tiền", "B. Vay thêm để đầu tư", "C. Tin vì thấy nhiều người rút được tiền", "D. Cảnh giác, lợi nhuận quá cao là lừa đảo"], correct: 3, explanation: "✅ Không có đầu tư nào an toàn mà lợi nhuận 30-50%/tháng. Đây là lừa đảo Ponzi." },
            { title: "📦 SHOPEE TRÚNG THƯỞNG", desc: "SMS: 'Shopee chúc mừng bạn trúng 10 triệu. Click link để nhận quà.'", options: ["A. Click ngay", "B. Không click, xóa tin. Shopee không gửi link lạ qua SMS", "C. Chia sẻ link", "D. Nhập thông tin thẻ"], correct: 1, explanation: "✅ Đây là lừa đảo Phishing qua SMS (Smishing). Không click link lạ." },
            { title: "🏦 NGÂN HÀNG GỌI BÁO NỢ", desc: "Tổng đài ngân hàng gọi yêu cầu cung cấp OTP để xác minh.", options: ["A. Cung cấp OTP", "B. Tắt máy, gọi lại số tổng đài chính thống", "C. Cung cấp nửa mã OTP", "D. Gửi ảnh OTP qua Zalo"], correct: 1, explanation: "✅ Ngân hàng KHÔNG BAO GIỜ hỏi OTP. Mã OTP là tài sản cá nhân, không chia sẻ." }
        ];
        let currentIdx = 0, userAnswers = new Array(scenarios.length).fill(null);
        function renderQuiz2() {
            const container = document.getElementById('exercise2');
            if (currentIdx >= scenarios.length) {
                let correct = 0;
                for (let i=0; i<scenarios.length; i++) if (userAnswers[i] === scenarios[i].correct) correct++;
                let msg = correct === scenarios.length ? '🎉 XUẤT SẮC! Bạn đã nắm vững các kịch bản lừa đảo!' : (correct >= 4 ? '👍 Khá tốt!' : '📖 Hãy học lại các hình thức lừa đảo.');
                if (correct === scenarios.length) playCompleteSound(); else playSuccessSound();
                container.innerHTML = `<div class="result-area"><div class="final-score">${correct}/${scenarios.length}</div><div style="color:#ccc;">${msg}</div><button class="reset-btn" id="reset2">🔄 LÀM LẠI</button></div>`;
                document.getElementById('reset2')?.addEventListener('click', () => { currentIdx = 0; userAnswers.fill(null); renderQuiz2(); });
                return;
            }
            const s = scenarios[currentIdx];
            let html = `<div class="progress-badge">🎣 Đã nhận diện: ${userAnswers.filter(a=>a!==null).length}/${scenarios.length} bẫy lừa</div>
                <div class="warning-box"><div class="warning-icon">⚠️</div><div class="warning-text"><strong>CẢNH BÁO:</strong> Tội phạm mạng ngày càng tinh vi. Đọc kỹ từng tình huống!</div></div>
                <div class="scenario-card"><div class="scenario-title">${s.title}</div><div class="scenario-desc">${s.desc}</div><div class="options" id="opts2"></div>
                <div class="feedback" id="fb2">💡 Hãy chọn cách xử lý thông minh!</div><button class="btn-next" id="next2">${currentIdx === scenarios.length-1 ? '🏁 XEM KẾT QUẢ' : '➡️ TIẾP'}</button></div>`;
            container.innerHTML = html;
            const optsDiv = document.getElementById('opts2');
            s.options.forEach((opt, idx) => {
                const optDiv = document.createElement('div');
                optDiv.className = `option ${userAnswers[currentIdx] === idx ? (idx === s.correct ? 'selected-correct' : 'selected-wrong') : ''}`;
                optDiv.innerText = opt;
                optDiv.onclick = () => {
                    if (userAnswers[currentIdx] !== null) return;
                    userAnswers[currentIdx] = idx;
                    const fb = document.getElementById('fb2');
                    if (idx === s.correct) { fb.innerHTML = '✅ ' + s.explanation; fb.className = 'feedback correct'; playSuccessSound(); }
                    else { fb.innerHTML = '❌ ' + s.explanation; fb.className = 'feedback wrong'; playErrorSound(); }
                    renderQuiz2();
                };
                optsDiv.appendChild(optDiv);
            });
            document.getElementById('next2').onclick = () => {
                if (userAnswers[currentIdx] === null) { document.getElementById('fb2').innerHTML = '⚠️ Hãy chọn đáp án trước!'; playErrorSound(); return; }
                currentIdx++; renderQuiz2();
            };
        }
        renderQuiz2();
    })();

    // ========== BÀI TẬP 3: TÚI TIỀN AN TOÀN & BẠO LỰC MẠNG ==========
    (function() {
        const questions = [
            { text: "💰 Wi-Fi công cộng khi chuyển tiền, bạn nên?", options: ["A. Dùng Wi-Fi công cộng bình thường", "B. Tắt Wi-Fi, dùng 4G/5G", "C. Không chuyển tiền", "D. Nhờ nhân viên chuyển hộ"], correct: 1, explanation: "✅ Wi-Fi công cộng dễ bị đánh cắp dữ liệu. Hãy dùng 4G/5G khi giao dịch nhạy cảm." },
            { text: "💰 Có người gọi yêu cầu cung cấp OTP, bạn nên?", options: ["A. Cung cấp OTP", "B. Cung cấp nửa mã", "C. Tuyệt đối không cung cấp. Ngân hàng không bao giờ hỏi OTP qua điện thoại", "D. Đọc mã cho họ"], correct: 2, explanation: "✅ Mã OTP là lớp bảo vệ cuối cùng. KHÔNG BAO GIỜ cung cấp cho bất kỳ ai." },
            { text: "💰 Người yêu cũ đe dọa phát tán ảnh nhạy cảm. Đây là hành vi gì?", options: ["A. Làm theo yêu cầu", "B. Sextortion - lưu bằng chứng, báo công an", "C. Im lặng", "D. Tự giải quyết"], correct: 1, explanation: "✅ Sextortion là hành vi phạm tội. Hãy chụp màn hình làm bằng chứng và báo công an." },
            { text: "💰 Bị nhóm người xúc phạm trên Facebook, cách xử lý đúng?", options: ["A. Cãi lại", "B. Chụp bằng chứng → chặn → báo cáo", "C. Bỏ qua", "D. Nhờ bạn bè cãi hộ"], correct: 1, explanation: "✅ Quy trình: CHỤP BẰNG CHỨNG → CHẶN → BÁO CÁO. Không tranh cãi trực tiếp." },
            { text: "💰 Mua hàng trên web lạ, có nên lưu thông tin thẻ?", options: ["A. Lưu để tiện", "B. Không lưu, chỉ thanh toán qua trung gian uy tín", "C. Lưu thẻ phụ ít tiền", "D. Nhập thẻ bất kỳ"], correct: 1, explanation: "✅ Chỉ lưu thông tin trên nền tảng uy tín. Với web lạ, hãy dùng ví điện tử hoặc cổng thanh toán trung gian." }
        ];
        const checklistItems = [
            { id: 0, text: "🔐 Bật xác thực 2 lớp (2FA) cho tài khoản ngân hàng và mạng xã hội", checked: false },
            { id: 1, text: "🔑 Không dùng chung mật khẩu cho nhiều tài khoản", checked: false },
            { id: 2, text: "📱 Không cung cấp mã OTP cho bất kỳ ai", checked: false },
            { id: 3, text: "💰 Không chuyển tiền khi chưa xác nhận trực tiếp bằng điện thoại", checked: false },
            { id: 4, text: "🌐 Không dùng Wi-Fi công cộng để giao dịch ngân hàng", checked: false },
            { id: 5, text: "📸 Không chia sẻ hình ảnh nhạy cảm dưới bất kỳ hình thức nào", checked: false },
            { id: 6, text: "🚫 Khi bị bạo lực mạng: Chụp bằng chứng → Chặn → Báo cáo", checked: false }
        ];
        let currentIdx = 0, userAnswers = new Array(questions.length).fill(null), checklistState = [...checklistItems], gameLocked = false;
        function renderQuiz3() {
            const container = document.getElementById('exercise3');
            if (currentIdx < questions.length) {
                const q = questions[currentIdx];
                let html = `<div class="progress-badge">💰 Đã bảo vệ: ${userAnswers.filter(a=>a!==null).length}/${questions.length} tình huống</div>
                    <div class="money-tip"><div class="tip-icon">💰</div><div class="tip-text"><strong>MẸO:</strong> Mã OTP là 'chìa khóa' cuối cùng của tài khoản. Không ai được quyền hỏi nó!</div></div>
                    <div class="question-card"><div class="question-text">❓ ${q.text}</div><div class="options" id="opts3"></div>
                    <div class="feedback" id="fb3">💡 Hãy chọn đáp án đúng!</div><button class="btn-next" id="next3">${currentIdx === questions.length-1 ? '🏁 XEM CHECKLIST' : '➡️ TIẾP'}</button></div>`;
                container.innerHTML = html;
                const optsDiv = document.getElementById('opts3');
                q.options.forEach((opt, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = `option ${userAnswers[currentIdx] === idx ? (idx === q.correct ? 'selected-correct' : 'selected-wrong') : ''}`;
                    optDiv.innerText = opt;
                    optDiv.onclick = () => {
                        if (userAnswers[currentIdx] !== null) return;
                        userAnswers[currentIdx] = idx;
                        const fb = document.getElementById('fb3');
                        if (idx === q.correct) { fb.innerHTML = '✅ ' + q.explanation; fb.className = 'feedback correct'; playSuccessSound(); }
                        else { fb.innerHTML = '❌ ' + q.explanation; fb.className = 'feedback wrong'; playErrorSound(); }
                        renderQuiz3();
                    };
                    optsDiv.appendChild(optDiv);
                });
                document.getElementById('next3').onclick = () => {
                    if (userAnswers[currentIdx] === null) { document.getElementById('fb3').innerHTML = '⚠️ Hãy chọn đáp án trước!'; playErrorSound(); return; }
                    currentIdx++; renderQuiz3();
                };
            } else {
                let correctCount = 0;
                for (let i=0; i<questions.length; i++) if (userAnswers[i] === questions[i].correct) correctCount++;
                const checkedCount = checklistState.filter(c => c.checked).length;
                let html = `<div class="progress-badge">💰 Đã bảo vệ: ${questions.length}/${questions.length} tình huống</div>
                    <div class="section-title">✅ CHECKLIST AN TOÀN SỐ</div>
                    <div class="checklist-area"><div class="checklist-title">Hãy tick vào những việc bạn SẼ LÀM:</div><div id="checklistContainer"></div></div>
                    <button class="btn-next" id="submitBtn3">🔍 HOÀN THÀNH & ĐÁNH GIÁ</button>
                    <div class="feedback" id="fb3">💡 Hãy tick vào checklist và hoàn thành!</div>`;
                container.innerHTML = html;
                const checklistContainer = document.getElementById('checklistContainer');
                checklistState.forEach((item, idx) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'checklist-item';
                    itemDiv.innerHTML = `<div class="checklist-checkbox ${item.checked ? 'checked' : ''}" data-idx="${idx}"></div><div class="checklist-text">${item.text}</div>`;
                    if (!gameLocked) itemDiv.addEventListener('click', () => { checklistState[idx].checked = !checklistState[idx].checked; renderQuiz3(); playSuccessSound(); });
                    checklistContainer.appendChild(itemDiv);
                });
                document.getElementById('submitBtn3').onclick = () => {
                    gameLocked = true;
                    const total = questions.length;
                    let msg = (correctCount === total && checkedCount === checklistItems.length) ? '🎉 XUẤT SẮC! Bạn đã nắm vững kỹ năng bảo vệ tài chính và an toàn mạng!' : (correctCount >= 3 && checkedCount >= 5 ? '👍 Khá tốt!' : '📖 Hãy học lại các quy tắc bảo vệ OTP và an toàn Wi-Fi!');
                    if (correctCount === total && checkedCount === checklistItems.length) playCompleteSound(); else playSuccessSound();
                    container.innerHTML = `<div class="result-area"><div class="final-score">📊 ${correctCount}/${total} | ✅ ${checkedCount}/${checklistItems.length}</div><div style="color:#ccc;">${msg}</div><button class="reset-btn" id="reset3">🔄 LÀM LẠI</button></div>`;
                    document.getElementById('reset3')?.addEventListener('click', () => { currentIdx = 0; userAnswers.fill(null); checklistState = checklistItems.map(i=>({...i,checked:false})); gameLocked=false; renderQuiz3(); });
                };
            }
        }
        renderQuiz3();
    })();
    resizeCanvas();
</script>
