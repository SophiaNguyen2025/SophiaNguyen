<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Khóa học Bản lĩnh Gen Z | Sophia Nguyễn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            color: #e0e0e0;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* Header khóa học */
        .course-header {
            background: #0f0f0f;
            border-radius: 24px;
            padding: 20px 28px;
            margin-bottom: 30px;
            border: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .logo { height: 50px; filter: brightness(0) invert(1); }
        .certificate-btn {
            background: #e63946;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        /* Màn hình nhập mã */
        .access-screen {
            background: #141414;
            border-radius: 32px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            margin: 100px auto;
            border: 1px solid #2a2a2a;
        }
        .access-screen input {
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            border: 1px solid #2a2a2a;
            background: #0a0a0a;
            color: white;
            font-size: 18px;
            text-align: center;
            margin: 20px 0;
        }
        .access-screen button {
            background: #e63946;
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .error-msg { color: #e63946; margin-top: 15px; }

        /* Nội dung khóa học (ẩn ban đầu) */
        .course-content {
            display: none;
        }
        .layout-2col {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .sidebar {
            flex: 1.2;
            min-width: 280px;
            background: #0f0f0f;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #2a2a2a;
            height: fit-content;
        }
        .lesson-list {
            list-style: none;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: #141414;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid #2a2a2a;
        }
        .lesson-item.active {
            border-left: 4px solid #e63946;
            background: #1a1a2e;
        }
        .main-content {
            flex: 3;
            background: #0f0f0f;
            border-radius: 24px;
            padding: 28px;
            border: 1px solid #2a2a2a;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 28px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .exercise-frame {
            margin: 30px 0;
            border-radius: 20px;
            overflow: hidden;
        }
        .exercise-frame iframe {
            width: 100%;
            min-height: 500px;
            border: none;
            background: white;
            border-radius: 20px;
        }
        .complete-btn {
            background: #e63946;
            border: none;
            padding: 14px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            width: 100%;
            margin: 20px 0;
            cursor: pointer;
        }
        .progress-bar {
            background: #2a2a2a;
            border-radius: 30px;
            height: 8px;
            margin: 15px 0;
        }
        .progress-fill {
            background: #e63946;
            width: 0%;
            height: 100%;
            border-radius: 30px;
        }

        /* Modal chứng nhận */
        .cert-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .cert-card {
            background: white;
            max-width: 650px;
            width: 90%;
            border-radius: 32px;
            padding: 30px;
            text-align: center;
            color: #333;
        }
        .cert-close {
            float: right;
            font-size: 28px;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .sidebar { flex: auto; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Màn hình nhập mã -->
    <div id="accessScreen" class="access-screen">
        <i class="fas fa-lock" style="font-size: 60px; color: #e63946;"></i>
        <h2 style="margin: 20px 0;">Nhập mã truy cập khóa học</h2>
        <input type="text" id="accessCode" placeholder="VD: GENZ-ABCD-1234">
        <button id="submitCodeBtn">Xác nhận</button>
        <div id="codeError" class="error-msg"></div>
    </div>

    <!-- Nội dung khóa học (ẩn) -->
    <div id="courseContent" class="course-content">
        <div class="course-header">
            <img src="https://sophianguyen.com.vn/images/hinhremovenen.png" class="logo">
            <button class="certificate-btn" id="showCertBtn">🏆 Nhận chứng nhận</button>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

        <div class="layout-2col">
            <div class="sidebar">
                <h3 style="margin-bottom: 20px;">📚 8 bài học</h3>
                <ul class="lesson-list" id="lessonList"></ul>
            </div>
            <div class="main-content" id="mainContent"></div>
        </div>
    </div>
</div>

<div id="certModal" class="cert-modal">
    <div class="cert-card">
        <span class="cert-close" id="closeCertModal">&times;</span>
        <div id="certificateContent">
            <img src="https://sophianguyen.com.vn/images/hinhremovenen.png" style="height: 60px;">
            <h2 style="color: #e63946;">CHỨNG NHẬN</h2>
            <h3>"BẢN LĨNH GEN Z"</h3>
            <p>Trao cho</p>
            <input type="text" id="learnerName" placeholder="Nhập tên của bạn" style="font-size: 20px; text-align: center; border: none; border-bottom: 2px solid #e63946; width: 80%; margin: 15px 0;">
            <p>Đã hoàn thành 8 bài học xuất sắc.</p>
            <p><i>Sophia Nguyễn</i></p>
        </div>
        <button id="downloadCertBtn" style="background: #e63946; color: white; border: none; padding: 12px 24px; border-radius: 60px; margin-top: 20px; cursor: pointer;">📥 Tải PDF</button>
    </div>
</div>

<script>
    // Danh sách bài học
    const lessons = [
        { id: 1, title: "An toàn Giao thông & Sự cố dọc đường", video: "https://www.youtube.com/embed/74C_PerSfmU", 
          exercises: ["bai-tap-diem-mu.html", "bai-tap-xu-ly-su-co.html", "bai-tap-va-cham.html"] },
        { id: 2, title: "Sơ cấp cứu chuyên sâu", video: "https://www.youtube.com/embed/VIDEO_ID_2", exercises: [] },
        { id: 3, title: "Tự vệ Xã hội & Thao túng tâm lý", video: "https://www.youtube.com/embed/VIDEO_ID_3", exercises: [] },
        { id: 4, title: "An toàn trong Hẹn hò", video: "https://www.youtube.com/embed/VIDEO_ID_4", exercises: [] },
        { id: 5, title: "Kỹ năng Sinh tồn & Dã ngoại", video: "https://www.youtube.com/embed/VIDEO_ID_5", exercises: [] },
        { id: 6, title: "An toàn Không gian mạng", video: "https://www.youtube.com/embed/VIDEO_ID_6", exercises: [] },
        { id: 7, title: "Sức khỏe tâm thần", video: "https://www.youtube.com/embed/VIDEO_ID_7", exercises: [] },
        { id: 8, title: "Hiểu biết Pháp luật", video: "https://www.youtube.com/embed/VIDEO_ID_8", exercises: [] }
    ];

    let completedLessons = JSON.parse(localStorage.getItem('genz_completed')) || [];
    let currentLesson = parseInt(localStorage.getItem('genz_current')) || 1;
    let accessGranted = false;

    // Giả lập API check mã (chị thay link API thật)
    function checkAccessCode(code) {
        // TODO: Thay bằng API thật của chị
        // Ví dụ: return fetch(`https://sophianguyen.com.vn/api/check-code?code=${code}&course=genz`)
        return new Promise((resolve) => {
            setTimeout(() => {
                if (code && code.length > 5) resolve(true);
                else resolve(false);
            }, 500);
        });
    }

    // Render danh sách bài học bên sidebar
    function renderSidebar() {
        const list = document.getElementById('lessonList');
        list.innerHTML = '';
        lessons.forEach(lesson => {
            const isCompleted = completedLessons.includes(lesson.id);
            const li = document.createElement('li');
            li.className = `lesson-item ${currentLesson === lesson.id ? 'active' : ''}`;
            li.innerHTML = `<span>${isCompleted ? '✅' : '📘'}</span><span>Bài ${lesson.id}: ${lesson.title}</span>`;
            li.onclick = () => {
                currentLesson = lesson.id;
                localStorage.setItem('genz_current', currentLesson);
                renderSidebar();
                renderMainContent();
                updateProgress();
            };
            list.appendChild(li);
        });
    }

    // Render nội dung bài học hiện tại
    function renderMainContent() {
        const lesson = lessons.find(l => l.id === currentLesson);
        if (!lesson) return;
        const isCompleted = completedLessons.includes(lesson.id);
        const main = document.getElementById('mainContent');
        
        let exercisesHtml = '';
        if (lesson.id === 1 && lesson.exercises.length > 0) {
            exercisesHtml = lesson.exercises.map(ex => `
                <div class="exercise-frame">
                    <iframe src="${ex}" title="Bài tập tương tác"></iframe>
                </div>
            `).join('');
        } else {
            exercisesHtml = `<p style="background:#141414; padding: 20px; border-radius: 20px;">📌 Bài tập đang được cập nhật...</p>`;
        }

        main.innerHTML = `
            <div class="video-wrapper">
                <iframe src="${lesson.video}" frameborder="0" allowfullscreen></iframe>
            </div>
            ${exercisesHtml}
            ${!isCompleted ? '<button class="complete-btn" id="markCompleteBtn">✅ Đánh dấu đã hoàn thành bài này</button>' : '<div style="background:#1a2a1a; padding: 12px; border-radius: 60px; text-align: center; color: #2ecc71;">✅ Bạn đã hoàn thành bài học này</div>'}
        `;

        const completeBtn = document.getElementById('markCompleteBtn');
        if (completeBtn) {
            completeBtn.onclick = () => {
                if (!completedLessons.includes(lesson.id)) {
                    completedLessons.push(lesson.id);
                    localStorage.setItem('genz_completed', JSON.stringify(completedLessons));
                    renderSidebar();
                    renderMainContent();
                    updateProgress();
                    playSound(true);
                }
            };
        }
    }

    function updateProgress() {
        const percent = Math.round((completedLessons.length / lessons.length) * 100);
        const fill = document.getElementById('progressFill');
        if (fill) fill.style.width = percent + '%';
    }

    function playSound(isCorrect) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = isCorrect ? 880 : 440;
            gain.gain.value = 0.1;
            osc.type = 'sine';
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } catch(e) {}
    }

    // Khởi tạo sau khi nhập mã đúng
    function initCourse() {
        accessGranted = true;
        document.getElementById('accessScreen').style.display = 'none';
        document.getElementById('courseContent').style.display = 'block';
        renderSidebar();
        renderMainContent();
        updateProgress();
    }

    // Xử lý nhập mã
    document.getElementById('submitCodeBtn').onclick = async () => {
        const code = document.getElementById('accessCode').value.trim();
        if (!code) {
            document.getElementById('codeError').innerText = 'Vui lòng nhập mã truy cập!';
            return;
        }
        const isValid = await checkAccessCode(code);
        if (isValid) {
            initCourse();
        } else {
            document.getElementById('codeError').innerText = 'Mã không hợp lệ hoặc đã hết hạn!';
        }
    };

    // Chứng nhận
    const certModal = document.getElementById('certModal');
    document.getElementById('showCertBtn').onclick = () => {
        if (completedLessons.length < lessons.length) {
            alert(`⚠️ Bạn mới hoàn thành ${completedLessons.length}/${lessons.length} bài. Hãy học hết để nhận chứng nhận!`);
            return;
        }
        certModal.style.display = 'flex';
    };
    document.getElementById('closeCertModal').onclick = () => certModal.style.display = 'none';
    window.onclick = (e) => { if (e.target === certModal) certModal.style.display = 'none'; };
    document.getElementById('downloadCertBtn').onclick = () => {
        const name = document.getElementById('learnerName').value.trim();
        if (!name) { alert('Vui lòng nhập tên!'); return; }
        const element = document.getElementById('certificateContent');
        html2pdf().set({ margin: 0.5, filename: `ChungNhan_GenZ_${name}.pdf`, image: { type: 'jpeg', quality: 0.98 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } }).from(element).save();
    };
</script>
</body>
</html>
