<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bản lĩnh Gen Z – Khóa học | Sophia Nguyễn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Copy toàn bộ style từ landing page (giữ nguyên phong cách tối) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif; color: #e0e0e0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .header { background: #0f0f0f; border-bottom: 1px solid #2a2a2a; padding: 20px 0; }
        .logo { height: 50px; }
        .navbar { background: #0f0f0f; padding: 12px 0; border-bottom: 1px solid #2a2a2a; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { text-decoration: none; color: #ccc; font-weight: 500; }
        .nav-links a:hover { color: #e63946; }
        .menu-toggle { display: none; font-size: 1.5rem; cursor: pointer; color: white; }
        @media (max-width: 768px) {
            .nav-links { display: none; width: 100%; flex-direction: column; gap: 1rem; margin-top: 1rem; }
            .nav-links.show { display: flex; }
            .menu-toggle { display: block; }
        }

        /* Access screen */
        .access-screen {
            background: #141414;
            border-radius: 32px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            margin: 100px auto;
            border: 1px solid #2a2a2a;
        }
        .access-screen input {
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            border: 1px solid #2a2a2a;
            background: #0a0a0a;
            color: white;
            font-size: 18px;
            text-align: center;
            margin: 20px 0;
        }
        .access-screen button {
            background: #e63946;
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .error-msg { color: #e63946; margin-top: 15px; }

        /* Course content */
        .course-content { display: none; }
        .lesson-list { list-style: none; }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: #141414;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid #2a2a2a;
        }
        .lesson-item.active { border-left: 4px solid #e63946; background: #1a1a2e; }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 28px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .complete-btn {
            background: #e63946;
            border: none;
            padding: 14px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            width: 100%;
            margin: 20px 0;
            cursor: pointer;
        }
        .progress-bar {
            background: #2a2a2a;
            border-radius: 30px;
            height: 8px;
            margin: 15px 0;
        }
        .progress-fill { background: #e63946; width: 0%; height: 100%; border-radius: 30px; }
        .certificate-btn {
            background: #e63946;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .footer { background: #0a0a0a; padding: 40px 0; text-align: center; color: #666; border-top: 1px solid #2a2a2a; margin-top: 60px; }
    </style>
</head>
<body>

<header class="header">
    <div class="container">
        <img src="https://i.ibb.co/fK21mfr/z6733594850225-2f3b990b665eef085ad3928349c48c7f.jpg" alt="Sophia Nguyễn" class="logo">
    </div>
</header>

<nav class="navbar">
    <div class="container nav-container">
        <div class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('show')">☰</div>
        <ul class="nav-links">
            <li><a href="https://sophianguyen.com.vn">Trang chủ</a></li>
            <li><a href="https://sophianguyen.com.vn/khoa-hoc/ky-nang-an-toan/gioi-thieu/">Khóa an toàn trẻ em</a></li>
            <li><a href="https://sophianguyen.com.vn/khoa-hoc/gioi-tinh/gioi-thieu/">Khóa giới tính</a></li>
            <li><a href="https://sophianguyen.com.vn/khoa-hoc/cha-me/gioi-thieu/">Khóa cha mẹ</a></li>
        </ul>
    </div>
</nav>

<div class="container" id="app">
    <div id="accessScreen" class="access-screen">
        <i class="fas fa-lock" style="font-size: 60px; color: #e63946;"></i>
        <h2 style="margin: 20px 0;">Nhập mã truy cập khóa học</h2>
        <input type="text" id="accessCode" placeholder="VD: GENZ-ABCD-1234">
        <button id="submitCodeBtn">Xác nhận</button>
        <div id="codeError" class="error-msg"></div>
    </div>

    <div id="courseContent" class="course-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>📚 Bản lĩnh Gen Z</h2>
            <button class="certificate-btn" id="showCertBtn">🏆 Nhận chứng nhận</button>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div style="display: flex; gap: 30px; flex-wrap: wrap;">
            <div style="flex: 1.2; min-width: 280px; background: #0f0f0f; border-radius: 24px; padding: 20px;">
                <h3>📖 8 bài học</h3>
                <ul class="lesson-list" id="lessonList"></ul>
            </div>
            <div style="flex: 3; background: #0f0f0f; border-radius: 24px; padding: 28px;" id="mainContent"></div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <p>🛡️ Bản lĩnh Gen Z – Khóa học an toàn dành cho giới trẻ | Sophia Nguyễn</p>
        <p>📧 sophianguyen2891@gmail.com | 📞 0977092182</p>
    </div>
</footer>

<script>
    // ==================== DỮ LIỆU BÀI HỌC ====================
    const lessons = [
        { id: 1, title: "An toàn Giao thông & Sự cố dọc đường", video: "https://www.youtube.com/embed/74C_PerSfmU", content: "📌 Nội dung bài học: Điểm mù xe tải, xử lý va chạm, hỏng xe giữa đường." },
        { id: 2, title: "Sơ cấp cứu chuyên sâu", video: "https://www.youtube.com/embed/VIDEO_ID_2", content: "📌 Cầm máu, gãy xương, CPR người lớn." },
        { id: 3, title: "Tự vệ Xã hội & Thao túng tâm lý", video: "https://www.youtube.com/embed/VIDEO_ID_3", content: "📌 Gaslighting, Peer Pressure, thoát bám đuôi." },
        { id: 4, title: "An toàn trong Hẹn hò", video: "https://www.youtube.com/embed/VIDEO_ID_4", content: "📌 Sự đồng thuận, Red Flags, ranh giới cá nhân." },
        { id: 5, title: "Kỹ năng Sinh tồn & Dã ngoại", video: "https://www.youtube.com/embed/VIDEO_ID_5", content: "📌 Quy tắc S.T.O.P, tìm nước, SOS." },
        { id: 6, title: "An toàn Không gian mạng & Tài chính số", video: "https://www.youtube.com/embed/VIDEO_ID_6", content: "📌 2FA, lừa đảo việc làm, bảo mật OTP." },
        { id: 7, title: "Sức khỏe tâm thần", video: "https://www.youtube.com/embed/VIDEO_ID_7", content: "📌 Sơ cứu cảm xúc, quản trị stress, trầm cảm." },
        { id: 8, title: "Hiểu biết Pháp luật & Trách nhiệm", video: "https://www.youtube.com/embed/VIDEO_ID_8", content: "📌 Độ tuổi hình sự, Luật An ninh mạng." }
    ];

    let completedLessons = JSON.parse(localStorage.getItem('genz_completed')) || [];
    let currentLesson = parseInt(localStorage.getItem('genz_current')) || 1;
    let accessGranted = false;

    // ==================== API KIỂM TRA MÃ (CHỊ THAY LINK THẬT) ====================
    async function checkAccessCode(code) {
        // TODO: Thay link API thật của chị vào đây
        // Ví dụ: const response = await fetch(`https://sophianguyen.com.vn/api/check-code?code=${code}&course=genz`);
        // const data = await response.json();
        // return data.valid === true;
        
        // Giả lập (chỉ để demo)
        return new Promise((resolve) => {
            setTimeout(() => {
                if (code && code.length > 5) resolve(true);
                else resolve(false);
            }, 500);
        });
    }

    // ==================== RENDER GIAO DIỆN ====================
    function renderSidebar() {
        const list = document.getElementById('lessonList');
        if (!list) return;
        list.innerHTML = '';
        lessons.forEach(lesson => {
            const isCompleted = completedLessons.includes(lesson.id);
            const li = document.createElement('li');
            li.className = `lesson-item ${currentLesson === lesson.id ? 'active' : ''}`;
            li.innerHTML = `<span>${isCompleted ? '✅' : '📘'}</span><span>Bài ${lesson.id}: ${lesson.title}</span>`;
            li.onclick = () => {
                currentLesson = lesson.id;
                localStorage.setItem('genz_current', currentLesson);
                renderSidebar();
                renderMainContent();
                updateProgress();
            };
            list.appendChild(li);
        });
    }

    function renderMainContent() {
        const lesson = lessons.find(l => l.id === currentLesson);
        if (!lesson) return;
        const isCompleted = completedLessons.includes(lesson.id);
        const main = document.getElementById('mainContent');
        main.innerHTML = `
            <div class="video-wrapper">
                <iframe src="${lesson.video}" frameborder="0" allowfullscreen></iframe>
            </div>
            <div style="margin: 20px 0; line-height: 1.6;">${lesson.content}</div>
            ${!isCompleted ? '<button class="complete-btn" id="markCompleteBtn">✅ Đánh dấu đã hoàn thành bài này</button>' : '<div style="background:#1a2a1a; padding: 12px; border-radius: 60px; text-align: center; color: #2ecc71;">✅ Bạn đã hoàn thành bài học này</div>'}
        `;
        const completeBtn = document.getElementById('markCompleteBtn');
        if (completeBtn) {
            completeBtn.onclick = () => {
                if (!completedLessons.includes(lesson.id)) {
                    completedLessons.push(lesson.id);
                    localStorage.setItem('genz_completed', JSON.stringify(completedLessons));
                    renderSidebar();
                    renderMainContent();
                    updateProgress();
                    playSound(true);
                }
            };
        }
    }

    function updateProgress() {
        const percent = Math.round((completedLessons.length / lessons.length) * 100);
        const fill = document.getElementById('progressFill');
        if (fill) fill.style.width = percent + '%';
    }

    function playSound(isCorrect) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = isCorrect ? 880 : 440;
            gain.gain.value = 0.1;
            osc.type = 'sine';
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } catch(e) {}
    }

    function initCourse() {
        accessGranted = true;
        document.getElementById('accessScreen').style.display = 'none';
        document.getElementById('courseContent').style.display = 'block';
        renderSidebar();
        renderMainContent();
        updateProgress();
    }

    // ==================== XỬ LÝ NHẬP MÃ ====================
    document.getElementById('submitCodeBtn').onclick = async () => {
        const code = document.getElementById('accessCode').value.trim();
        if (!code) {
            document.getElementById('codeError').innerText = 'Vui lòng nhập mã truy cập!';
            return;
        }
        const isValid = await checkAccessCode(code);
        if (isValid) {
            initCourse();
        } else {
            document.getElementById('codeError').innerText = 'Mã không hợp lệ hoặc đã hết hạn!';
        }
    };

    // Chứng nhận (tạm thời)
    document.getElementById('showCertBtn')?.addEventListener('click', () => {
        if (completedLessons.length < lessons.length) {
            alert(`⚠️ Bạn mới hoàn thành ${completedLessons.length}/${lessons.length} bài. Hãy học hết để nhận chứng nhận!`);
        } else {
            alert('🎉 Chúc mừng! Chức năng tải chứng nhận sẽ sớm hoàn thiện.');
        }
    });
</script>
</body>
</html>
