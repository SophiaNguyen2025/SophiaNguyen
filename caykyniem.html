<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Cây Kỷ Niệm An Toàn - Khóa học tích hợp</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #c8e8ff 0%, #b0d4ee 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            padding: 20px;
            margin: 0;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #fef7e0;
            border-radius: 70px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            padding: 20px 25px 30px 25px;
        }

        .game-title {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #2c5a2e;
            background: #fff1b5;
            display: inline-block;
            width: auto;
            margin: 0 auto 20px;
            padding: 8px 35px;
            border-radius: 60px;
            box-shadow: 0 5px 0 #c29b2e;
        }

        .tree-area {
            background: #e5d5b0;
            border-radius: 60px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 0 3px #f9efcf, 0 10px 15px rgba(0,0,0,0.1);
        }

        .tree-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .tree-canvas {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .tree-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 40px;
            pointer-events: none;
        }

        .leaves-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .leaf-item {
            position: absolute;
            width: 70px;
            cursor: pointer;
            transition: transform 0.1s;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .leaf-item:hover {
            transform: scale(1.05);
        }

        .leaf-img {
            width: 100%;
            display: block;
        }

        .leaf-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            color: #1f3b1a;
            font-size: 10px;
            font-weight: bold;
            background: rgba(255, 255, 210, 0.9);
            padding: 3px 4px;
            border-radius: 30px;
            text-align: center;
            line-height: 1.2;
            word-break: break-word;
            pointer-events: none;
        }

        .basket-area {
            background: #faf0cf;
            border-radius: 60px;
            margin-top: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: inset 0 0 0 3px #fff6e0, 0 5px 0 #b97f2e;
        }

        .basket-title {
            font-size: 1.6rem;
            color: #5a3a1a;
            margin-bottom: 10px;
        }

        .leaves-basket {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: #f8e5b0;
            border-radius: 50px;
            min-height: 160px;
        }

        .leaf-card {
            width: 80px;
            cursor: pointer;
            transition: 0.1s;
            filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.2));
        }

        .leaf-card:hover {
            transform: translateY(-5px);
        }

        .leaf-card:active {
            transform: scale(0.95);
        }

        .leaf-card img {
            width: 100%;
            display: block;
        }

        .empty-message {
            color: #8b6946;
            font-style: italic;
            padding: 20px;
            font-size: 1.1rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            background: #ffdb7e;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 40px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 0 #b4621a;
            transition: 0.05s linear;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .memory-panel {
            background: #fffae9;
            border-radius: 35px;
            margin-top: 20px;
            padding: 12px 20px;
            max-height: 150px;
            overflow-y: auto;
            border: 2px dashed #ffc107;
            display: none;
        }

        .memory-title {
            font-weight: bold;
            color: #2a6b2f;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 18px;
            color: #5f4c2b;
        }
.logo { height: 60px; margin-bottom: 10px; }
        @media (max-width: 700px) {
            .leaf-item { width: 55px; }
            .leaf-text { font-size: 8px; }
            .leaf-card { width: 65px; }
            .basket-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div style="text-align: center;">
         <img src="https://sophianguyen.com.vn/images/hinhremovenen.png" alt="Sophia Nguyễn" class="logo">
        <div class="game-title">🌳 CÂY KỶ NIỆM AN TOÀN 🌿</div>
    </div>

    <div class="tree-area">
        <div class="tree-wrapper">
            <div class="tree-canvas" id="treeCanvas">
                <img class="tree-img" src="https://i.ibb.co/xtXDsGM1/Chat-GPT-Image-13-24-40-5-thg-6-2026.png" alt="cây khô">
                <div class="leaves-container" id="leavesContainer"></div>
            </div>
        </div>
    </div>

    <div class="basket-area">
        <div class="basket-title">
            🍃 RỔ LÁ XANH 🍃
        </div>
        <div class="leaves-basket" id="leavesBasket">
            <!-- Lá xanh sẽ hiện ra ở đây -->
        </div>
        <div style="font-size: 0.8rem; margin-top: 8px;">👉 Bấm vào một chiếc lá, viết điều con đã học được, lá sẽ bay lên cây!</div>
    </div>

    <div class="buttons">
        <button class="btn" id="viewBtn">📜 Xem tất cả kỷ niệm</button>
        <button class="btn" id="resetBtn">🔄 Làm mới / Chơi lại</button>
    </div>

    <div id="memoryPanel" class="memory-panel">
        <div class="memory-title">🎓 Những điều đã học được:</div>
        <div id="memoryList"></div>
    </div>
    <footer>🌸 Mỗi chiếc lá là một kỷ niệm đẹp - Các con hãy cùng nhau làm xanh cây nhé!</footer>
</div>

<script>
    // ẢNH (dùng đúng link chị đã cho)
const TREE_URL = "https://i.ibb.co/hF1qhdLs/Chat-GPT-Image-13-24-40-5-thg-6-2026-removebg-preview.png";
    const LEAF_URL = "https://i.ibb.co/Gf53Y7BC/Chat-GPT-Image-13-30-36-5-thg-6-2026.png";

    // Dữ liệu game
    let leavesOnTree = [];      // các lá đã treo {id, text, left, top}
    let nextId = 1;
    let availableLeaves = 28;   // số lá còn lại trong rổ

    // Các vị trí cành cây đẹp (theo % chiều rộng và chiều cao)
    const positions = [
        { left: 12, top: 28 }, { left: 35, top: 22 }, { left: 58, top: 25 }, { left: 80, top: 32 },
        { left: 18, top: 42 }, { left: 40, top: 38 }, { left: 65, top: 36 }, { left: 85, top: 45 },
        { left: 22, top: 55 }, { left: 48, top: 50 }, { left: 72, top: 52 }, { left: 88, top: 58 },
        { left: 15, top: 65 }, { left: 38, top: 62 }, { left: 62, top: 64 }, { left: 82, top: 68 },
        { left: 28, top: 75 }, { left: 52, top: 72 }, { left: 75, top: 76 }, { left: 90, top: 80 },
        { left: 8, top: 50 }, { left: 45, top: 18 }, { left: 68, top: 20 }, { left: 30, top: 30 },
        { left: 55, top: 45 }, { left: 78, top: 55 }, { left: 20, top: 85 }, { left: 60, top: 82 },
        { left: 42, top: 88 }, { left: 70, top: 88 }, { left: 25, top: 18 }, { left: 50, top: 30 }
    ];

    // Lấy vị trí chưa được dùng
    function getFreePosition() {
        const usedKeys = new Set(leavesOnTree.map(l => `${Math.round(l.left)}-${Math.round(l.top)}`));
        const free = positions.filter(p => !usedKeys.has(`${Math.round(p.left)}-${Math.round(p.top)}`));
        if (free.length > 0) {
            return free[Math.floor(Math.random() * free.length)];
        }
        // Nếu hết chỗ, random nhẹ
        const base = positions[Math.floor(Math.random() * positions.length)];
        return {
            left: Math.min(92, Math.max(5, base.left + (Math.random() * 6 - 3))),
            top: Math.min(92, Math.max(15, base.top + (Math.random() * 6 - 3)))
        };
    }

    // Hiển thị lại toàn bộ lá trên cây
    function renderTree() {
        const container = document.getElementById('leavesContainer');
        container.innerHTML = '';
        for (let leaf of leavesOnTree) {
            const leafDiv = document.createElement('div');
            leafDiv.className = 'leaf-item';
            leafDiv.style.left = `calc(${leaf.left}% - 35px)`;
            leafDiv.style.top = `calc(${leaf.top}% - 30px)`;
            
            const img = document.createElement('img');
            img.src = LEAF_URL;
            img.className = 'leaf-img';
            
            const textSpan = document.createElement('div');
            textSpan.className = 'leaf-text';
            textSpan.innerText = leaf.text;
            
            leafDiv.appendChild(img);
            leafDiv.appendChild(textSpan);
            leafDiv.onclick = (e) => {
                e.stopPropagation();
                alert(`💚 Kỷ niệm: ${leaf.text}`);
            };
            container.appendChild(leafDiv);
        }
    }

    // Hiển thị rổ lá xanh (những lá chưa dùng)
    function renderBasket() {
        const basket = document.getElementById('leavesBasket');
        basket.innerHTML = '';
        
        if (availableLeaves <= 0) {
            const msg = document.createElement('div');
            msg.className = 'empty-message';
            msg.innerText = '🎉 CHÚC MỪNG! Cây đã đầy kỷ niệm 🎉\nCác bạn thật tuyệt vời!';
            basket.appendChild(msg);
            return;
        }
        
        const showCount = Math.min(availableLeaves, 24);
        for (let i = 0; i < showCount; i++) {
            const leafCard = document.createElement('div');
            leafCard.className = 'leaf-card';
            const img = document.createElement('img');
            img.src = LEAF_URL;
            leafCard.appendChild(img);
            leafCard.onclick = () => addNewLeaf();
            basket.appendChild(leafCard);
        }
        
        if (availableLeaves > showCount) {
            const more = document.createElement('div');
            more.className = 'empty-message';
            more.innerText = `+ thêm ${availableLeaves - showCount} lá đang chờ...`;
            basket.appendChild(more);
        }
    }

    // HÀNH ĐỘNG CHÍNH: thêm một lá mới (gõ chữ -> treo lên cây)
    function addNewLeaf() {
        if (availableLeaves <= 0) {
            alert("Cây đã đầy lá rồi! Cảm ơn các bạn ❤️");
            return;
        }
        
        let content = prompt("✏️ Hãy viết một điều con đã học được từ khóa học:\n(Ví dụ: 'Con có quyền nói không', '1800 1567', 'Không mở cửa cho người lạ'...)");
        if (!content || content.trim() === "") {
            alert("Chưa có kỷ niệm nào. Hãy thử lại nhé!");
            return;
        }
        content = content.trim().substring(0, 65);
        
        const pos = getFreePosition();
        const newLeaf = {
            id: nextId++,
            text: content,
            left: pos.left,
            top: pos.top
        };
        
        leavesOnTree.push(newLeaf);
        availableLeaves--;
        
        // Cập nhật giao diện
        renderTree();
        renderBasket();
        
        // Ẩn panel ký ức (nếu đang mở)
        document.getElementById('memoryPanel').style.display = 'none';
        
        // Thông báo nhỏ vui vẻ
        const notif = document.createElement('div');
        notif.innerText = '🌿 Đã treo một lá kỷ niệm lên cây! 🌿';
        notif.style.position = 'fixed';
        notif.style.bottom = '20px';
        notif.style.left = '50%';
        notif.style.transform = 'translateX(-50%)';
        notif.style.backgroundColor = '#2c5a2e';
        notif.style.color = 'white';
        notif.style.padding = '8px 20px';
        notif.style.borderRadius = '30px';
        notif.style.fontWeight = 'bold';
        notif.style.zIndex = '999';
        notif.style.fontSize = '0.9rem';
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 1500);
    }

    // Xem tất cả kỷ niệm
    function showMemories() {
        const panel = document.getElementById('memoryPanel');
        const listDiv = document.getElementById('memoryList');
        
        if (leavesOnTree.length === 0) {
            listDiv.innerHTML = '<i>🌱 Chưa có chiếc lá nào. Hãy cùng nhau viết lên những điều đã học được nhé!</i>';
        } else {
            let html = '';
            leavesOnTree.forEach((leaf, idx) => {
                html += `<div>🍃 ${idx+1}. ${leaf.text}</div>`;
            });
            listDiv.innerHTML = html;
        }
        panel.style.display = 'block';
    }

    // Reset toàn bộ
    function resetGame() {
        if (confirm("🔄 BẮT ĐẦU LẠI? Toàn bộ lá sẽ được gỡ xuống, cây trở về trạng thái ban đầu.")) {
            leavesOnTree = [];
            availableLeaves = 28;
            nextId = 1;
            renderTree();
            renderBasket();
            document.getElementById('memoryPanel').style.display = 'none';
        }
    }

    // Gán sự kiện nút
    document.getElementById('viewBtn').addEventListener('click', showMemories);
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    
    // Khởi tạo
    renderTree();
    renderBasket();
</script>
</body>
</html>
