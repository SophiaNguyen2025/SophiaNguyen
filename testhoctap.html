<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trắc nghiệm Phong cách Học Tập </title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #000000, #000000);
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo img {
      width: 120px;
    }
    h1 {
      text-align: center;
      color: #CC9900;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    .question {
      margin: 20px 0;
      padding: 15px;
      border-left: 5px solid  #00CC99;
      border-radius: 10px;
    }
    .question:nth-child(even) {
      background:#2c3e50;
    }
    .question:nth-child(odd) {
      background:#3366CC;
    }
    .question p {
      margin: 0 0 10px;
      font-weight: bold;
    }
    .question label {
      display: block;
      font-weight: normal;
      margin-bottom: 8px;
    }
    input[type="text"],
    input[type="email"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 30px;
      padding: 12px 24px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #45a049;
    }
    .result {
      display: none;
      background: #ede7f6;
      margin-top: 30px;
      padding: 20px;
      border-radius: 12px;
      color: #4a148c;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="images/hinhremovenen.png" alt="Logo Sophia">
    </div>
    <h1>Trắc nghiệm Phong Cách Học Tập </h1>
    <!-- Form cá nhân -->
   <form id="userForm" action="https://formspree.io/f/mgvzqrje" method="POST">
      <h2>Thông tin người làm test</h2>
      <label>Họ tên:</label>
      <input type="text" name="name" id="name" required>
      <label>Email:</label>
      <input type="email" name="email" id="email" required>
      <label>Tuổi:</label>
      <input type="number" name="age" id="age" required>
      <label>Số điện thoại:</label>
      <input type="text" name="phone" id="phone" required>
      <button type="submit">Gửi thông tin  & tiếp tục</button>
      </form>

<form id="quizForm" style="display: none;">
  </form>

<button id="submitBtn" type="button" style="display: none;">Tính kết quả</button>

<div id="result" class="result"></div>
<canvas id="chart" width="400" height="400" style="margin-top:20px;"></canvas>
<div id="description" style="margin-top:20px; font-size:16px;"></div>

<script>
const questions = [
  "Bạn học tốt nhất khi nào?",
  "Khi học một kỹ năng mới, bạn thường:",
  "Bạn nhớ thông tin tốt nhất khi:",
  "Khi tham gia một buổi học, bạn thích:",
  "Khi giải quyết vấn đề, bạn thường:",
  "Bạn cảm thấy dễ hiểu nhất khi giáo viên:",
  "Khi học từ mới, bạn thường:",
  "Bạn thích học qua:",
  "Khi ôn thi, bạn thường:",
  "Bạn cảm thấy thoải mái nhất khi:",
  "Khi học nhóm, bạn thường:",
  "Bạn cảm thấy hứng thú nhất khi:",
  "Khi học một môn mới, bạn thích:",
  "Bạn cảm thấy dễ nhớ nhất khi:",
  "Bạn thích học trong môi trường nào?",
  "Bạn tiếp thu nhanh nhất khi:",
  "Bạn thường ghi nhớ bằng cách:",
  "Bạn thấy hiệu quả nhất khi:",
  "Bạn thường phản ứng thế nào khi học điều mới?",
  "Bạn thích tài liệu học tập dạng nào?",
  "Bạn cảm thấy học hiệu quả nhất khi:"
];

const options = [
  "Nghe giảng hoặc thảo luận nhóm",       // Thính giác
  "Xem hình ảnh hoặc video minh họa",     // Thị giác
  "Thực hành hoặc làm thử",               // Vận động
];
const quizForm = document.getElementById("quizForm");
  questions.forEach((q, index) => {
    const div = document.createElement("div");
    div.className = "question";
    div.innerHTML = `<p>Câu ${index + 1}: ${q}</p>`;
    options.forEach((opt, i) => {
      div.innerHTML += `
        <label>
          <input type="radio" name="q${index}" value="${i}" required> ${opt}
        </label>
      `;
    });
    quizForm.appendChild(div);
  });

  // Sau khi gửi form thông tin, hiện phần câu hỏi
  document.getElementById("userForm").addEventListener("submit", function (e) {
    e.preventDefault();
    fetch(this.action, {
      method: "POST",
      body: new FormData(this),
      headers: { 'Accept': 'application/json' }
    })
    .then(response => {
      if (response.ok) {
        alert("🟢 Gửi thông tin thành công! Bây giờ bạn có thể làm bài test.");
        document.getElementById("userForm").style.display = "none";
        quizForm.style.display = "block";
        document.getElementById("submitBtn").style.display = "block";
      } else {
        alert("❌ Gửi thông tin thất bại. Vui lòng thử lại.");
      }
    })
    .catch(error => {
      alert("⚠️ Lỗi kết nối. Vui lòng thử lại sau.");
    });
  });
</script>
  <script>
const styles = ["Thính giác 🎧", "Thị giác 👁️", "Vận động 🖐️"];
const descriptions = [
  "Bạn có phong cách học thính giác: bạn tiếp thu tốt qua lời nói, giảng bài, thảo luận và âm thanh. Học nhóm, nghe podcast hoặc giảng trực tiếp sẽ giúp bạn ghi nhớ lâu hơn.",
  "Bạn có phong cách học thị giác: bạn tiếp thu tốt qua hình ảnh, sơ đồ, màu sắc và video. Bạn nên dùng bản đồ tư duy, slide, hoặc video minh họa để học hiệu quả.",
  "Bạn có phong cách học vận động: bạn học tốt nhất khi được thực hành, thao tác, trải nghiệm thực tế. Học qua dự án, mô phỏng, hoặc hoạt động sẽ giúp bạn hiểu sâu hơn."
];

// Render câu hỏi
const quizForm = document.getElementById("quizForm");
questions.forEach((q, index) => {
  const div = document.createElement("div");
  div.className = "question";
  div.innerHTML = `<h3>Câu ${index + 1}: ${q}</h3>`;
  options.forEach((opt, i) => {
    div.innerHTML += `
      <label>
        <input type="radio" name="q${index}" value="${i}" required> ${opt}
      </label>
    `;
  });
  quizForm.appendChild(div);
});

// Tính kết quả
function calculateResult() {
  const formData = new FormData(quizForm);
  let counts = [0, 0, 0]; // Thính giác, Thị giác, Vận động
  let answered = 0;

  for (let i = 0; i < questions.length; i++) {
    const val = formData.get(`q${i}`);
    if (val !== null) {
      counts[parseInt(val)]++;
      answered++;
    }
  }

  if (answered < questions.length) {
    alert("⚠️ Bạn cần hoàn thành tất cả câu hỏi trước khi xem kết quả.");
    return;
  }

  const total = counts.reduce((a, b) => a + b, 0);
  const percentages = counts.map(c => Math.round((c / total) * 100));
  const max = Math.max(...counts);
  const dominantIndex = counts.indexOf(max);

  document.getElementById("result").style.display = "block";
  document.getElementById("result").innerHTML =
    `<b>Kết quả:</b><br>` +
    styles.map((s, i) => `${s}: ${percentages[i]}%`).join("<br>");

  const ctx = document.getElementById("chart").getContext("2d");
  const colors = ["#2196f3", "#ff9800", "#4caf50"];
  let start = 0;

  ctx.clearRect(0, 0, 400, 400);
  percentages.forEach((p, i) => {
    const slice = (p / 100) * 2 * Math.PI;
    ctx.beginPath();
    ctx.moveTo(200, 200);
    ctx.arc(200, 200, 150, start, start + slice);
    ctx.fillStyle = colors[i];
    ctx.fill();
    start += slice;
  });

  document.getElementById("description").style.display = "block";
  document.getElementById("description").innerHTML =
    `<b>Phân tích:</b><br>${descriptions[dominantIndex]}`;
}
</script>
</body>
</html>
