<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Game 4: Kỹ năng sinh tồn - Sơ cứu, hỏa hoạn, khẩn cấp | Sophia Nguyen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #0a1a3a 0%, #06102a 100%); font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif; padding: 40px 20px; }
        .game-container { max-width: 950px; margin: 0 auto; background: #0f1a3a; border-radius: 56px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); overflow: hidden; border: 1px solid #4a6a9a; }
        .header { background: #1a3a6a; padding: 20px 30px; text-align: center; }
        .header h1 { color: #a8d0ff; font-size: 26px; margin-bottom: 5px; }
        .header p { color: #8aadcc; font-size: 15px; }
        .logo-area { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #0f1a3a; border-bottom: 1px solid #2a4a7a; }
        .logo-area img { height: 50px; }
        .badge { background: #2a6a9a; padding: 6px 16px; border-radius: 40px; font-size: 13px; font-weight: 600; color: white; }
        .progress { background: #0a1a3a; padding: 12px 30px; display: flex; justify-content: space-between; font-weight: 600; color: #7aadcc; border-bottom: 1px solid #1a3a5a; }
        .question-card { padding: 30px; }
        .question-text { background: #0a1a3a; border-radius: 28px; padding: 20px; font-size: 18px; color: #d4e6ff; margin-bottom: 25px; border-left: 5px solid #4a9eff; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .choice-btn { background: #0a1a3a; border: 2px solid #3a6a9a; border-radius: 60px; padding: 14px 20px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; color: #c4deff; text-align: left; }
        .choice-btn:hover { background: #2a5a8a; border-color: #6aaeff; color: white; transform: translateX(5px); }
        .choice-btn.selected-correct { background: #2ecc71; border-color: #2ecc71; color: white; }
        .choice-btn.selected-wrong { background: #e74c3c; border-color: #e74c3c; color: white; }
        .feedback { background: #0a1a3a; border-radius: 28px; padding: 18px; margin-top: 20px; font-size: 15px; border-left: 5px solid #4a9eff; color: #b4d0ff; }
        .feedback.correct { background: #1a3a2a; border-left-color: #2ecc71; color: #2ecc71; }
        .feedback.wrong { background: #3a1a2a; border-left-color: #e74c3c; color: #e74c3c; }
        .next-btn { background: #2a6a9a; border: none; padding: 14px 28px; border-radius: 60px; font-weight: 700; font-size: 18px; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.2s; color: white; }
        .next-btn:hover { background: #3a8aba; }
        .result-area { text-align: center; padding: 40px 30px; }
        .final-score { font-size: 48px; font-weight: 800; color: #4a9eff; margin: 20px 0; }
        .reset-btn { background: #2a6a9a; border: none; padding: 12px 28px; border-radius: 60px; font-weight: 700; cursor: pointer; margin-top: 20px; color: white; }
        .footer { text-align: center; padding: 18px; background: #0a1a3a; border-top: 1px solid #1a3a5a; font-size: 12px; color: #6a8aaa; }
        @media (max-width: 600px) { .question-text { font-size: 16px; } .choice-btn { font-size: 13px; } }
    </style>
</head>
<body>
<div class="game-container">
    <div class="logo-area">
        <img src="https://i.ibb.co/wFwDR7cY/hinhremovenen.png" alt="Sophia Nguyen">
        <div class="badge">🎮 BUỔI 4 - KỸ NĂNG SINH TỒN 🎮</div>
    </div>
    <div class="header">
        <h1>🔥 SINH TỒN & SƠ CỨU</h1>
        <p>Cầm máu, bỏng, hóc dị vật, CPR, cháy nổ, gas, điện giật, tìm kiếm giúp đỡ</p>
    </div>
    <div id="gameArea"></div>
    <div class="footer">💚Sophia Nguyen đồng hành cùng con</div>
</div>

<script>
    const questions = [
        { text: "🩸 Bạn bị đứt tay chảy máu. Hành động đúng đầu tiên là gì?", options: ["A. Rửa tay, dùng bông/gạc sạch ấn trực tiếp lên vết thương", "B. Bôi kem đánh răng lên vết thương", "C. Rửa bằng nước muối rồi băng lại", "D. Để máu tự đông"], correct: 0, explanation: "✅ Ấn trực tiếp là cách cầm máu nhanh nhất. Không bôi kem đánh răng hay dầu gì lên vết thương hở." },
        { text: "🧯 Thấy bạn bị hóc nghẹn, không thở được, không nói được. Bạn nên làm gì?", options: ["A. Vỗ lưng thật mạnh", "B. Gọi người lớn hoặc thực hiện Heimlich nếu biết", "C. Cho bạn uống nước", "D. Để bạn tự ho"], correct: 1, explanation: "✅ Heimlich khi nạn nhân không thở. Nếu không biết cách, gọi cấp cứu 115 ngay." },
        { text: "💧 Bạn bị bỏng nhẹ do chạm vào nồi nóng. Xử lý đúng là?", options: ["A. Bôi kem đánh răng lên vết bỏng", "B. Chườm đá trực tiếp", "C. Ngâm/rửa dưới vòi nước lạnh 10-15 phút", "D. Bôi dầu ăn"], correct: 2, explanation: "✅ Nước lạnh giúp giảm đau và sưng. Không bôi kem đánh răng, dầu, nước mắm hay chườm đá trực tiếp." },
        { text: "❤️ Khi thực hiện CPR (ép tim) cho người lớn, độ sâu ép và nhịp độ đúng là?", options: ["A. Ép sâu 2-3 cm, nhịp 60 lần/phút", "B. Ép sâu 5-6 cm, nhịp 100-120 lần/phút", "C. Ép sâu 8-10 cm, nhịp 140 lần/phút", "D. Chỉ cần ép nhanh nhất có thể"], correct: 1, explanation: "✅ Ép sâu 5-6 cm, tốc độ 100-120 lần/phút (theo nhịp bài 'Stayin Alive')." },
        { text: "🔥 Khi thoát hiểm khỏi đám cháy, tư thế nào là đúng nhất?", options: ["A. Chạy thẳng đứng thật nhanh", "B. Cúi thấp, bò sát đất, dùng khăn ướt bịt mũi miệng", "C. Đi thang máy xuống tầng 1", "D. Đứng im chờ cứu hộ"], correct: 1, explanation: "✅ Khói bốc lên cao, cúi thấp để tránh ngạt khói. Tuyệt đối không dùng thang máy khi cháy." },
        { text: "💨 Bạn ngửi thấy mùi gas nồng trong bếp. Việc KHÔNG ĐƯỢC LÀM là gì?", options: ["A. Mở cửa sổ thoát khí", "B. Bật quạt hoặc bật đèn", "C. Khóa van gas tổng nếu an toàn", "D. Đi ra ngoài rồi gọi 114"], correct: 1, explanation: "✅ Tia lửa điện từ công tắc có thể gây nổ. Tuyệt đối không bật/tắt bất kỳ thiết bị điện nào." },
        { text: "⚡ Thấy người bị điện giật, hành động ĐẦU TIÊN đúng là?", options: ["A. Dùng tay không kéo nạn nhân ra", "B. Ngắt cầu dao điện (nguồn điện) ngay lập tức", "C. Gọi 115 trước", "D. Dùng gậy sắt để hất dây điện"], correct: 1, explanation: "✅ Ngắt nguồn điện an toàn nhất. Sau đó dùng vật cách điện (gậy gỗ, chổi cán dài) để tách nạn nhân." },
        { text: "😟 Khi quần áo của bạn bị bốc cháy, bạn phải làm gì?", options: ["A. Chạy thật nhanh tìm nước", "B. Dừng lại, nằm xuống, lăn qua lăn lại", "C. Dùng tay phủi lửa", "D. Cởi quần áo ngay lập tức"], correct: 1, explanation: "✅ Stop – Drop – Roll: dừng, nằm, lăn. Chạy làm lửa cháy to hơn, cởi áo khi đang cháy có thể gây bỏng tay." },
        { text: "🔐 Phân biệt bí mật TỐT và bí mật XẤU, dấu hiệu nào là bí mật XẤU?", options: ["A. Sẽ được bật mí và mang lại niềm vui", "B. Khiến con sợ hãi, lo lắng, có người bảo 'đừng nói với bố mẹ'", "C. Có thời hạn ngắn (vài ngày)", "D. Liên quan đến quà sinh nhật"], correct: 1, explanation: "✅ Bí mật xấu là bí mật đáng sợ, cần phải kể lại với người lớn tin cậy ngay lập tức." },
        { text: "📞 Số điện thoại đường dây nóng bảo vệ trẻ em (tư vấn miễn phí, bảo mật 24/7) là số nào?", options: ["A. 113", "B. 114", "C. 115", "D. 1800 1567"], correct: 3, explanation: "✅ 1800 1567 – Tổng đài quốc gia bảo vệ trẻ em. Gọi khi cần giúp đỡ, không biết kể với ai." }
    ];

    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);
    const gameArea = document.getElementById('gameArea');

    function playSound(isCorrect) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.value = isCorrect ? 880 : 440;
            gainNode.gain.value = 0.1;
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        } catch(e) { console.log("Audio not supported"); }
    }

    function renderProgress() {
        const answered = userAnswers.filter(a => a !== null).length;
        return `<div class="progress"><span>🆘 Đã xử lý: ${answered}/${questions.length}</span><span>📊 Tiến độ: ${Math.round(answered/questions.length*100)}%</span></div>`;
    }

    function renderGame() {
        if (currentIndex >= questions.length) {
            let correctCount = 0;
            for (let i = 0; i < questions.length; i++) {
                if (userAnswers[i] === questions[i].correct) correctCount++;
            }
            const percent = Math.round(correctCount / questions.length * 100);
            let message = correctCount === questions.length ? "🎉 XUẤT SẮC! Bạn đã nắm vững kỹ năng sinh tồn và sơ cứu!" : (correctCount >= 7 ? "👍 Tốt lắm! Hãy xem lại những câu sai để cứu người khi cần nhé." : "📖 Hãy ôn lại bài học – kỹ năng này có thể cứu sống người khác đấy!");
            gameArea.innerHTML = `
                <div class="result-area">
                    <div class="final-score">🏆 ${correctCount}/${questions.length}</div>
                    <div style="color:#d4e6ff; margin-bottom:20px;">${message}</div>
                    <div style="text-align: left; background: #0a1a3a; border-radius: 28px; padding: 18px; color:#b4d0ff; margin-bottom:20px;">
                        <strong>📌 TÓM TẮT BUỔI 4:</strong><br>
                        • Cầm máu: ấn trực tiếp, không bôi kem/rượu.<br>
                        • Bỏng: nước lạnh 10-15 phút, không kem đánh răng.<br>
                        • Hóc dị vật: Heimlich (vòng tay qua bụng, ấn vào trong & lên trên).<br>
                        • CPR: ép tim 5-6cm, 100-120 nhịp/phút.<br>
                        • Cháy: cúi thấp, khăn ướt, Stop-Drop-Roll.<br>
                        • Gas: không bật điện, mở cửa, ra ngoài gọi 114.<br>
                        • Điện giật: ngắt cầu dao, dùng gậy gỗ tách nạn nhân.<br>
                        • Bí mật xấu: phải kể với người lớn.<br>
                        • Đường dây nóng: 1800 1567 (bảo vệ trẻ em).
                    </div>
                    <button class="reset-btn" id="resetGame">🔄 CHƠI LẠI</button>
                </div>
            `;
            document.getElementById('resetGame').addEventListener('click', () => {
                currentIndex = 0;
                userAnswers = new Array(questions.length).fill(null);
                renderGame();
            });
            return;
        }

        const q = questions[currentIndex];
        const saved = userAnswers[currentIndex];
        const progress = renderProgress();

        let html = progress;
        html += `<div class="question-card"><div class="question-text">❓ ${q.text}</div><div class="options" id="optionsGroup">`;
        q.options.forEach((opt, idx) => {
            let selectedClass = '';
            if (saved !== null) {
                if (saved === idx && idx === q.correct) selectedClass = 'selected-correct';
                else if (saved === idx && idx !== q.correct) selectedClass = 'selected-wrong';
            }
            html += `<button class="choice-btn ${selectedClass}" data-choice="${idx}">${opt}</button>`;
        });
        html += `</div><div class="feedback" id="feedbackMsg">`;
        if (saved !== null) {
            html += saved === q.correct ? '✅ ' + q.explanation : '❌ ' + q.explanation;
        } else {
            html += '💡 Hãy chọn đáp án đúng – kỹ năng này có thể cứu người đấy!';
        }
        html += `</div><button class="next-btn" id="nextBtn">${currentIndex === questions.length-1 ? '🏁 HOÀN THÀNH' : '➡️ CÂU TIẾP'}</button></div>`;
        gameArea.innerHTML = html;

        const btns = document.querySelectorAll('.choice-btn');
        const feedbackDiv = document.getElementById('feedbackMsg');
        const nextBtn = document.getElementById('nextBtn');

        if (saved === null) {
            btns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const choice = parseInt(btn.getAttribute('data-choice'));
                    userAnswers[currentIndex] = choice;
                    const isCorrect = (choice === q.correct);
                    playSound(isCorrect);
                    renderGame();
                });
            });
        } else {
            btns.forEach(btn => { btn.disabled = true; btn.style.opacity = '0.6'; });
        }

        nextBtn.addEventListener('click', () => {
            if (userAnswers[currentIndex] === null) {
                feedbackDiv.innerHTML = '⚠️ Vui lòng chọn đáp án trước khi sang câu tiếp theo!';
                feedbackDiv.classList.add('wrong');
                setTimeout(() => feedbackDiv.classList.remove('wrong'), 1500);
                return;
            }
            currentIndex++;
            renderGame();
        });
    }

    renderGame();
</script>
</body>
</html>
